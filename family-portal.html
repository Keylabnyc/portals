// Save a single slot's edits locally (no server call) — reads current DOM select values

// Single source of truth for "is the scheduling form valid enough to submit"
// -- used by rSchedForm()'s full render AND by _schRefreshSubmit() (the
// lightweight, non-full-render refresh fired from field oninput/onchange
// handlers). Computed purely from SC state (day/start/end are already
// written directly onto SC.slots by their onchange handlers), so no DOM
// reads are needed here.
function _schMissingState(){
  var instMissing=!SC.instrument;
  var durMissing=!SC.durations.length;
  var locMissing=!SC.locations.length;
  var durNoteMissing=SC.durations.length>1&&!SC.durationNote.trim();
  var locNoteMissing=SC.locations.length>1&&!SC.locationNote.trim();
  var inHomeAddrMissing=SC.locations.indexOf('in-home')>-1&&!SC.street.trim();
  var _availTchs2=_famAvailableTeachers(SC.instrument);
  var _noTeacherForInstrument2=!!SC.instrument&&SC.teachers.length>0&&_availTchs2.length===0;
  var waitlistMissing=_noTeacherForInstrument2&&SC.waitlist===null;
  var hasCompleteSlot=false,missingEndTime=false,missingStartTime=false;
  SC.slots.forEach(function(slot,i){
    if(SC.slotDeleted[i])return;
    if(slot.day&&slot.start&&slot.end)hasCompleteSlot=true;
    if(slot.day&&slot.start&&!slot.end)missingEndTime=true;
    if(slot.day&&!slot.start&&slot.end)missingStartTime=true;
  });
  var missingRequired=instMissing||durMissing||locMissing||durNoteMissing||locNoteMissing||inHomeAddrMissing||waitlistMissing||!hasCompleteSlot||missingEndTime||missingStartTime;
  return {instMissing:instMissing,durMissing:durMissing,locMissing:locMissing,
    durNoteMissing:durNoteMissing,locNoteMissing:locNoteMissing,inHomeAddrMissing:inHomeAddrMissing,
    noTeacherForInstrument:_noTeacherForInstrument2,waitlistMissing:waitlistMissing,
    hasCompleteSlot:hasCompleteSlot,missingEndTime:missingEndTime,missingStartTime:missingStartTime,
    missingRequired:missingRequired};
}
// Lightweight refresh fired from oninput/onchange on fields whose handlers
// deliberately don't call the full render() (to avoid losing cursor position
// mid-keystroke -- see architecture notes). Re-checks whether the form is now
// submittable and toggles just the Submit button + the handful of per-field
// warnings directly via the DOM, instead of re-rendering the whole form.
// Every outstanding requirement, in page order, as the same sentences the
// inline warnings use (BACKLOG 1.76). Deliberately reuses those exact strings
// rather than writing second, shorter versions: the summary at the button and
// the warning at the field then say the same thing, so a family matching one
// to the other isn't comparing two different wordings of the same problem.
//
// Returns every item, not the first — _validateChildInfo() stops at the first
// failure, which is right for a single-line error and wrong here: AC asked to
// see "all items they need to complete."
function _schMissingList(forReg){
  var out=[];
  if(forReg){
    var st=RF.students[RF.availIndex];
    if(st){
      var sn=(st.name||'').trim()||'this child';
      if(!st.name.trim()) out.push('Please enter a name for '+sn+'.');
      if(!st.dob.trim()) out.push('Please enter a date of birth for '+sn+'.');
      else if(!_parseDob(st.dob)) out.push('Please enter a valid date of birth for '+sn+'.');
      if(!st.school.trim()) out.push('Please enter a school for '+sn+'.');
      if(!st.grade.trim()) out.push('Please enter a grade for '+sn+'.');
      if(!st.skill) out.push('Please select an experience level for '+sn+'.');
      else if(st.skill==='Unsure'&&!(st.skillNote||'').trim()) out.push('Please let us know more about '+sn+'\u2019s skill level and musical experience.');
      if(!st.howHeard) out.push('Please let us know how you heard about Keylab.');
    }
  }
  var m=_schMissingState();
  if(m.instMissing) out.push('Please select an instrument.');
  if(m.durMissing) out.push('Please select a lesson duration to see pricing and continue.');
  if(m.durNoteMissing) out.push('You selected more than one duration. Tell us more about your duration preferences.');
  if(m.locMissing) out.push('Please select a lesson location.');
  if(m.locNoteMissing) out.push('You selected more than one location. Tell us more about your location preferences.');
  if(m.inHomeAddrMissing) out.push('Please enter your home address for in-home lessons.');
  if(m.waitlistMissing) out.push('Please let us know whether you’d like to join the waitlist.');
  if(!m.hasCompleteSlot) out.push('Please add at least one time window with a day, start time, end time, and priority.');
  else if(m.missingEndTime) out.push('Please select an end time for each time window.');
  else if(m.missingStartTime) out.push('Please select a start time for each time window.');
  return out;
}

// The submit buttons are no longer disabled (BACKLOG 1.76), so this no longer
// toggles a disabled attribute — it keeps the already-showing missing-items
// summary current as fields are filled in, for the handlers that deliberately
// skip a full render(). It does nothing until a real submit attempt has been
// made, so it can never put a warning in front of a family who hasn't tried
// to submit yet.
function _schRefreshSubmit(){
  var m=_schMissingState();
  if(SC.submitAttempted){
    var box=document.getElementById('sch-submit-missing');
    if(box){
      var items=_schMissingList(SC.forRegNow);
      if(items.length){
        box.style.display='block';
        box.innerHTML=_schMissingHtml(items);
      } else {
        box.style.display='none';
      }
    }
  }
  var durWarn=document.getElementById('sch-durnote-warn');
  if(durWarn)durWarn.style.display=m.durNoteMissing?'block':'none';
  var locWarn=document.getElementById('sch-locnote-warn');
  if(locWarn)locWarn.style.display=(m.locNoteMissing&&SC.locNoteTouched)?'block':'none';
}

// One submit attempt. Returns true if the form must not be submitted.
//
// _validateSchedForm() stays the authoritative gate and is deliberately NOT
// replaced by _schMissingList(): it enforces rules the list doesn't model
// (duplicate days, a missing slot priority, split-lesson fields, the
// "why did this change" reasons on a re-submission, the 6-window cap), and it
// syncs each slot's day/start/end out of the DOM into SC as a side effect.
// That sync has to happen BEFORE the missing list is computed, or the list is
// built from stale slot state.
//
// The list is the display; the single message is the fallback for a rule the
// list doesn't cover. They are never shown together — a family with a full
// list has enough to act on, and anything left surfaces on the next click.
function _schAttemptBlocked(forReg){
  var schedErr=_validateSchedForm();
  var infoErr=forReg?_validateChildInfo(RF.students[RF.availIndex]):'';
  var items=_schMissingList(forReg);
  if(!items.length&&!schedErr&&!infoErr) return false;
  SC.submitError=items.length?'':(infoErr||schedErr);
  render();
  return true;
}

      h+='<div class="av-slot" style="opacity:.75;font-size:13px;color:var(--text3);margin-bottom:.6rem">'+
        '<div style="margin-bottom:.35rem">'+esc(slot.day||'Time window '+(i+1))+' \u2014 removed. '+
        '<a href=\'#\' onclick=\'SC.slotDeleted['+i+']=false;render();return false\' style=\'color:var(--acc)\'>Undo</a>'+
        '</div>'+
        (isEdit?'<div class="field" style="margin:0">'+
          '<label style="font-size:11px;color:var(--text4)">Why removing this? (optional)</label>'+
          '<input type="text" placeholder="e.g. This time no longer works" value="'+esc(delNoteVal2)+'" oninput="SC.slotNotes['+i+']=this.value">'+
          '</div>':'')+'</div>';
    } else if(isEdit && !SC.slotEditing[i]){
      h+=rSlotLocked(slot,i);
    } else {
      h+=rSlot(slot,i,isEdit);
    }
  });

  if(SC.slots.length<6){
    h+='<button class="btn btn-p btn-sm" style="margin-bottom:.75rem" onclick="var ni=SC.slots.length;SC.slots.push(blankSlot());SC.slotEditing[ni]=true;render()">+ Add another time window</button>';
  }
  if(!hasCompleteSlot&&SC.submitAttempted){
    h+='<div class="aw" style="margin-top:0;margin-bottom:.5rem">Please add at least one time window with a day, start time, end time, and priority.</div>';
  } else if(missingEndTime){
    h+='<div class="aw" style="margin-top:0;margin-bottom:.5rem">Please select an end time for each time window.</div>';
  } else if(missingStartTime){
    h+='<div class="aw" style="margin-top:0;margin-bottom:.5rem">Please select a start time for each time window.</div>';
  }
  h+='<div class="field"><label>Anything else we should know? (optional)</label>'+
    '<textarea placeholder="Add anything that would help us understand your child and your scheduling needs, including your child\'s learning style, taste in music, their previous experience, or details about your scheduling preferences" oninput="SC.notes=this.value">'+esc(SC.notes)+'</textarea></div>';
  h+='</div>';

  // Step 4: Teacher preference — filtered to teachers who actually teach the
  // selected instrument AND are generally available on at least one of the
  // days just entered above. If nobody currently teaches the instrument at
  // all, this becomes a waitlist prompt instead of a dropdown (that check
  // stays instrument-only, see _famAvailableTeachers -- a day mismatch is a
  // softer, different situation and gets its own note below instead).
  var _availTchs=_famAvailableTeachers(SC.instrument);
  var _noTeacherForInstrument=!!SC.instrument&&SC.teachers.length>0&&_availTchs.length===0;
  var _availTchsForPref=_famAvailableTeachersForPref(SC.instrument);
  var _noTeacherForDays=!_noTeacherForInstrument&&_availTchs.length>0&&_famSelectedDays().length>0&&_availTchsForPref.length===0;
  h+='<div class="card">';
  if(SC.teachersError){
    h+='<div class="aw" style="margin-bottom:.5rem">'+esc(SC.teachersError)+' Teacher-preference options and waitlist prompts may not be accurate right now. <a href="#" onclick="event.preventDefault();loadSchedTeachers()" style="color:var(--bt)">Try again</a></div>';
  }
  if(_noTeacherForInstrument){
    h+='<h2 style="margin-bottom:.15rem">We don\u2019t currently have a teacher for '+esc(SC.instrument)+'</h2>';
    h+='<p style="font-size:13px;color:var(--text3);margin-bottom:.75rem">Would you like to be placed on a waitlist for '+esc(SC.instrument)+' lessons? We\u2019ll reach out as soon as a teacher becomes available.</p>';
    h+='<div class="dur-row">'+
      '<button class="db'+(SC.waitlist===true?' on':'')+'" onclick="SC.waitlist=true;render()">Yes, add me to the waitlist</button>'+
      '<button class="db'+(SC.waitlist===false?' on':'')+'" onclick="SC.waitlist=false;render()">No thanks</button>'+
      '</div>';
    if(SC.waitlist===null){
      h+='<div class="aw" style="margin-top:.5rem">Please let us know if you\u2019d like to be added to the waitlist.</div>';
    } else if(SC.waitlist===false){
      h+='<div class="note" style="margin-top:.65rem">No problem — we\u2019ll still process the rest of your submission, and we\u2019ll follow up with you directly about '+esc(SC.instrument)+' lessons.</div>';
    }
  } else {
    h+='<h2 style="margin-bottom:.15rem">Do you have a teacher preference?</h2>';
    h+='<p style="font-size:13px;color:var(--text3);margin-bottom:.5rem">If you have a teacher preference, let us know. Leave this blank if you do not have a preference. Teacher assignments are not guaranteed, but we\u2019ll do our best to place you with your requested teacher.</p>';
    h+='<a class="btn btn-p btn-sm" href="https://keylab.nyc/our-teachers" target="_blank" style="margin-bottom:.75rem">View our teachers</a>';
    if(_noTeacherForDays){
      h+='<div class="note" style="margin-bottom:.65rem">None of our current '+esc(SC.instrument)+' teachers generally work on the day(s) you selected, so we can\u2019t show a specific preference here \u2014 that\u2019s okay, go ahead and submit and we\u2019ll do our best to find a fit.</div>';
    }
    h+='<select onchange="SC.teacherPref=this.value;render()" style="margin-bottom:0">'+rViewTchOpts()+'</select>';
  }
  h+='</div>';

  // Split lesson section (below time windows)
  h+=rSplitLessonSection();

  // Submit. What's outstanding is computed by _schMissingList() now, off the
  // shared _schMissingState() — the block that used to duplicate those flags
  // here (and OR them into a `missingRequired` used only to disable the
  // buttons) is gone with the disabled state itself, per BACKLOG 1.76. One
  // copy of the rules, read by the renderer and both click handlers alike.
  var submitLbl=isEdit?'Save Changes':'Submit Availability';
  // Which form is on screen, for _schRefreshSubmit()'s partial updates --
  // it has no way to know otherwise, and the child-info half of the missing
  // list only applies to registration.
  SC.forRegNow=!!forReg;
  h+='<div style="margin-top:1rem">';
  if(SC.submitError){
    h+='<div class="aw" style="margin-top:0;margin-bottom:.75rem;font-size:13px;padding:.65rem .85rem">'+esc(SC.submitError)+'</div>';
  }
  // BACKLOG 1.75/1.76 \u2014 the buttons used to render `disabled` whenever
  // anything was missing. Because SC.submitAttempted is only ever set inside
  // the click handlers, and a disabled button fires no click, every warning
  // gated on it was unreachable on exactly the incomplete form that needed
  // them: the family saw a dead button, one line of grey hint text, and no
  // indication of what was wrong. The buttons are now always live; the
  // handlers validate and block, and list everything outstanding right here.
  var _missingNow=(SC.submitAttempted&&!SC.submitted)?_schMissingList(forReg):[];
  h+='<div id="sch-submit-missing" style="display:'+(_missingNow.length?'block':'none')+'">'+
    (_missingNow.length?_schMissingHtml(_missingNow):'')+'</div>';
  if(SC.busy){
    h+='<button class="btn btn-p btn-full" disabled><span class="spin">\u21bb</span> Saving...</button>';
    h+=_rRegSavingNote();
  } else if(forReg){
    // "+ Add Another Child" sits ABOVE "Complete Registration" and on its own
    // row (BACKLOG 1.79). AC, twice: this is a primary action for a family
    // registering more than one child, and a secondary-styled button sharing
    // a row with the finish button \u2014 after it in reading order \u2014 still read
    // as hidden. A family must meet the add path before the finish path.
    // Saving an edit returns to the review list, not into another child's
    // half-filled form (AC, 22 Aug: that "seems like a useless choice").
    // Label is AC's: "Save [first name]'s info" — which is honest about what
    // it does, since "Save" here means "kept in this form", and nothing
    // reaches Keylab until Complete Registration.
    var _regCur=RF.students[RF.availIndex];
    var _regFirst=((_regCur&&_regCur.name)||'').trim().split(' ')[0];
    if(RF.childComplete[RF.availIndex]&&_regFirst){
      h+='<button class="btn btn-p btn-full" style="margin-bottom:.75rem" onclick="doSaveChildEdits()">Save '+esc(_regFirst)+'\u2019s info</button>';
    }
    if(RF.students.length<5){
      h+='<button id="sch-add-child-btn" class="btn btn-p btn-full" style="margin-bottom:.75rem" onclick="doAddAnotherChild()">+ Add Another Child</button>';
    }
    h+='<button id="sch-submit-btn" class="btn btn-p btn-full" onclick="doCompleteRegistration()">Complete Registration</button>';
  } else {
    h+='<button id="sch-submit-btn" class="btn btn-p btn-full" onclick="doSubmitSched()">'+submitLbl+'</button>';
  }
  h+='</div>';
  return h;
}

function rSlotLocked(slot, i){
  var prefMap={preferred:'Preferred',next:'Next Best',possible:'Possible',least:'Least Preferred'};
  var prefStyles={
    preferred:'background:var(--gbg);color:var(--gt);border:1px solid var(--green)',
    next:'background:var(--bbg);color:var(--bt);border:1px solid var(--blue)',
    possible:'background:rgba(0,0,0,.08);color:var(--blue);border:1px solid var(--border2)',
    least:'background:var(--rbg);color:var(--rt);border:1px solid var(--red)'
  };
  var prefLabel=prefMap[slot.pref]||'';
  var prefChip=slot.pref&&prefStyles[slot.pref]
    ?'<span style="'+prefStyles[slot.pref]+';font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;font-family:monospace;letter-spacing:.03em;white-space:nowrap">'+prefLabel+'</span>'
    :'';
  var timeRange=(slot.start||'')+(slot.end?' \u2013 '+slot.end:'');
  var h='<div class="av-slot" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem">';
  h+='<div style="flex:1;min-width:160px">';
  h+='<div style="font-weight:600;font-size:14px">'+esc(slot.day||'')+'</div>';
  h+='<div style="font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">'+esc(timeRange)+(prefChip?' '+prefChip:'')+'</div>';
  if(SC.durations.length&&slot.day) h+=rSlotPricing(slot.day);
  h+='</div>';
  h+='<div style="display:flex;gap:.4rem;flex-shrink:0">';
  h+='<button class="btn btn-p btn-sm" onclick="SC.slotEditing['+i+']=true;render()">Edit</button>';
  h+='<button class="btn btn-d btn-sm" onclick="if(confirm(&apos;Delete this availability?&apos;)){SC.slotDeleted['+i+']=true;SC.slotEditing['+i+']=false;render();}">Delete</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function rSlot(slot, i, isEdit){
  var dayOpts='<option value="">Pick a day...</option>'+DAYS.map(function(d){
    return '<option value="'+esc(d)+'"'+(slot.day===d?' selected':'')+'>'+esc(d)+'</option>';
  }).join('');
  var tOpts=function(cur,day,ph){
    return '<option value="">'+esc(ph)+'</option>'+timesForDay(day).map(function(t){
      return '<option value="'+esc(t)+'"'+(cur===t?' selected':'')+'>'+esc(t)+'</option>';
    }).join('');
  };
  var prefBtns=PREFS.map(function(p){
    var on=slot.pref===p.v;
    return '<button class="pb'+(on?' '+p.cls:'')+'" onclick="SC.slots['+i+'].pref=&apos;'+p.v+'&apos;;render()">'+p.l+'</button>';
  }).join('');
  var h='<div class="av-slot" style="margin-bottom:.6rem"><div class="av-slot-hd">';
  h+='<div class="av-slot-num">'+(SC.slots.length>1||isEdit?'Time window '+(i+1):'When are you free?')+'</div>';
  if(!isEdit&&i>0) h+='<button class="btn btn-d btn-sm" style="font-size:10px;padding:2px 7px" onclick="SC.slots.splice('+i+',1);render()">Remove</button>';
  if(isEdit) h+='<button class="btn btn-d btn-sm" style="font-size:10px;padding:2px 7px" onclick="if(confirm(&apos;Delete this availability?&apos;)){SC.slotDeleted['+i+']=true;SC.slotEditing['+i+']=false;render();}">Delete</button>';
  h+='</div>';
  h+='<div class="g3" style="margin-bottom:.55rem">';
  h+='<div><label>Day</label><select onchange="SC.slots['+i+'].day=this.value;SC.slots['+i+'].start=&apos;&apos;;SC.slots['+i+'].end=&apos;&apos;;render()">'+dayOpts+'</select></div>';
  h+='<div><label>Earliest start time</label><select onchange="SC.slots['+i+'].start=this.value;render()">'+tOpts(slot.start,slot.day,'Earliest start...')+'</select></div>';
  h+='<div><label>Latest end time</label><select onchange="SC.slots['+i+'].end=this.value;render()">'+tOpts(slot.end,slot.day,'Latest end...')+'</select></div>';
  h+='</div>';
  h+='<div class="pref-row"><label style="margin-bottom:4px">How well does this work for you?</label>';
  h+='<div class="pref-btns">'+prefBtns+'</div>';
  if(!slot.pref&&slot.day){
    h+='<div style="font-size:11px;color:var(--text4);margin-top:3px">Select an option so we know how to prioritize this window.</div>';
  }
  h+='</div>';
  if(slot.day&&SC.durations.length) h+=rSlotPricing(slot.day);
  h+='</div>';
  return h;
}

function loadSchedSubmission(){
  if(SC.loaded||!SC.studentId) return;
  SC.loading=true; SC.loadError=''; render();
  fapi('getFamilyAvailability', {studentId:SC.studentId}, function(e,r){
    SC.loading=false;
    if(e||!r||!r.ok){
      // A real fetch failure -- SC.loaded deliberately stays false so no
      // downstream check (the locked-summary gate, the view-mode/blank-form
      // choice) can mistake "we couldn't load this" for "nothing was ever
      // submitted." Surfaced as a clear, retry-able message instead, naming
      // the specific child whose availability failed to load when known.
      var _lsFirst='';
      for(var _lsi=0;_lsi<students.length;_lsi++){
        if(students[_lsi].studentId===SC.studentId){ _lsFirst=(students[_lsi].studentName||'').split(' ')[0]; break; }
      }
      SC.loadError=(r&&r.error)||('We couldn\u2019t load '+(_lsFirst||'this child\u2019s')+' availability. This is usually temporary \u2014 try again in a moment, or email us at info@keylab.nyc if it keeps happening.');
      render();
      return;
    }
    SC.loaded=true;
    SC.instrument=''; // default: blank until the family's first-ever submission
    if(r.submission){
      // A submission already exists -- pre-fill from the student's current
      // instrument so a returning family doesn't have to re-pick every time
      // (per AC, July 2026: blank only applies until the FIRST submission).
      for(var _si=0;_si<students.length;_si++){
        if(students[_si].studentId===SC.studentId){SC.instrument=students[_si].instrument||'';break;}
      }
      var sub=r.submission;
      SC.durations=sub.duration?(sub.duration+'').split(',').filter(Boolean):[]; SC.locations=sub.location?(sub.location+'').split(',').filter(Boolean):[];
      // Snapshot of what was originally submitted -- used to detect whether
      // the family has changed instrument/duration/location on this edit, so
      // we can require a context note only when something actually changed
      // (AC-requested, this session; see _validateSchedForm()).
      SC.origInstrument=SC.instrument;
      SC.origDurations=SC.durations.slice();
      SC.origLocations=SC.locations.slice();
      SC.street=sub.street||''; SC.apt=sub.apt||'';
      SC.city=sub.city||''; SC.state=sub.state||'NY'; SC.zip=sub.zip||'';
      SC.instrumentNote=sub.instrumentNote||''; SC.notes=sub.notes||'';
      SC.teacherPref=sub.teacherPref||'';
      SC.submittedAt=sub.submittedAt||'';
      SC.waitlist=isTruthy(sub.instrumentUnavailable)?isTruthy(sub.instrumentWaitlist):null;
      SC.submitted=true;
      SC.isFirstSubmission=false;
      SC.editMode=false;
      SC.pendingChanges=false;
      SC.slotEditing={}; SC.slotDeleted={}; SC.slotNotes={}; SC.slotSaveAttempted={}; SC.lessonDetailsEditing=false;
      var slots=[];
      var slotSavedNotes=[];
      for(var k=1;k<=6;k++){
        var d=sub['day'+k],s=sub['start'+k],e=sub['end'+k],p=sub['rank'+k],so=sub['source'+k];
        if(d||s){ slots.push({day:d||'',start:s||'',end:e||'',pref:p||'',source:so||''}); slotSavedNotes.push(sub['note'+k]||''); }
      }
      // Merge in any admin-added slots not yet saved into this student's own
      // record (returned separately by doGetFamilyAvailability as
      // pendingAdminSlots) — shown as regular, editable slot rows tagged
      // "Added by admin" until the family saves, at which point they become
      // part of the saved record like any other slot.
      var pending=Array.isArray(sub.pendingAdminSlots)?sub.pendingAdminSlots:[];
      pending.forEach(function(p2){
        slots.push({day:p2.day||'',start:p2.start||'',end:p2.end||'',pref:p2.rank||'',source:'admin'});
        slotSavedNotes.push(p2.note||'');
      });
      SC.slots=slots.length?slots:[blankSlot(),blankSlot(),blankSlot()];
      SC.slotNotes={};
      for(var _n=0;_n<slots.length;_n++){var _nv=slotSavedNotes[_n];if(_nv) SC.slotNotes[_n]=_nv;}
      SC.durationNote=sub.durationNote||''; SC.locationNote=sub.locationNote||'';
      SC.splitLesson=sub.splitLesson==='TRUE'||sub.splitLesson===true;
      SC.splitChild={
        name:sub.splitChildName||'',
        age:sub.splitChildAge||'',
        instrument:sub.splitChildInstrument||'',
        instrumentOther:'',
        notes:sub.splitChildNotes||''
      };
    } else {
      SC.isFirstSubmission = true;
      SC.editMode = false;
      SC.lessonDetailsEditing = false;
      SC.submitted = false;
      SC.slots = [blankSlot(), blankSlot(), blankSlot()];
      SC.durations = []; SC.locations = [];
      SC.origInstrument = ''; SC.origDurations = []; SC.origLocations = [];
      SC.street = ''; SC.apt = ''; SC.city = ''; SC.state = 'NY'; SC.zip = '';
      SC.instrumentNote = ''; SC.notes = ''; SC.locationNote = ''; SC.durationNote = '';
      SC.teacherPref = ''; SC.pendingChanges = false; SC.submitError = ''; SC.justSubmitted = false;
      SC.splitLesson = false;
      SC.splitChild = {name:'', age:'', instrument:'', instrumentOther:'', notes:''};
    }
    render();
  });
}

// Save current SC state to backend — used by both doSubmitSched and _saveDetailsInline
// cb(true) on success, cb(false) on failure
// suppressEmails is passed explicitly rather than read off SC: _scRestore()
// resets SC for each child in the registration chain, so anything parked
// there would silently vanish partway through (BACKLOG 1.84).
function _saveSlotsAndDetails(cb,isNewRegistration,suppressEmails){
  var isEdit=!SC.isFirstSubmission;
  var activeSlots=SC.slots.filter(function(s,i){ return !SC.slotDeleted[i]; });
  var notesPayload={};
  var deletedNotes=[];
  var dismissedAdminSlotKeys=[];
  var submIdx=0;
  SC.slots.forEach(function(s,origIdx){
    if(SC.slotDeleted[origIdx]){
      deletedNotes.push({day:s.day||'',note:SC.slotNotes[origIdx]||''});
      if(s.source==='admin'&&s.day){
        dismissedAdminSlotKeys.push((s.day||'')+'|'+(s.start||'')+'|'+(s.end||''));
      }
    } else {
      if(SC.slotNotes[origIdx]) notesPayload[submIdx]=SC.slotNotes[origIdx];
      submIdx++;
    }
  });
  var _saveAvailTchs=_famAvailableTeachers(SC.instrument);
  var _saveNoTeacher=!!SC.instrument&&SC.teachers.length>0&&_saveAvailTchs.length===0;
  // If SC.teacherPref no longer matches any teacher who teaches the
  // currently-selected instrument AND is available on the currently-selected
  // days (e.g. the family picked a teacher, then changed instrument or
  // changed their days), the dropdown already visually shows "No
  // preference" since no <option> matches — but the raw SC.teacherPref
  // variable itself is untouched. Sanitize it here so what actually gets
  // saved matches what the family sees, instead of silently submitting a
  // mismatched pairing they never had a chance to notice or correct. Uses
  // the day-aware list, not _saveAvailTchs above -- that one stays
  // instrument-only on purpose, since it also drives the separate
  // no-teacher-for-instrument/waitlist flag below.
  var _saveAvailTchsForPref=_famAvailableTeachersForPref(SC.instrument);
  var _saveTeacherPref=(SC.teacherPref&&_saveAvailTchsForPref.some(function(t){return t.teacherName===SC.teacherPref;}))?SC.teacherPref:'';
  fapi('saveFamilyAvailability', {
    studentId:SC.studentId, duration:SC.durations.join(','), location:SC.locations.join(','),
    street:SC.street, apt:SC.apt, city:SC.city, state:SC.state, zip:SC.zip,
    slots:activeSlots, instrument:SC.instrument||'', instrumentNote:SC.instrumentNote, notes:SC.notes,
    locationNote:SC.locationNote, durationNote:SC.durationNote,
    teacherAcknowledged:false,
    teacherPref:_saveTeacherPref,
    instrumentUnavailable:_saveNoTeacher,
    instrumentWaitlist:_saveNoTeacher&&SC.waitlist===true,
    isNewRegistration:!!isNewRegistration,
    // Registration sends ONE combined email at the end instead of one per
    // child (BACKLOG 1.84). Set for every child in a registration, including
    // the first — the combined email covers them all.
    suppressEmails:!!suppressEmails,
    slotNotes:notesPayload,
    deletedNotes:deletedNotes,
    dismissedAdminSlotKeys:dismissedAdminSlotKeys,
    isEdit:isEdit,
    splitLesson:SC.splitLesson?'TRUE':'FALSE',
    splitChildName:SC.splitChild.name||'',
    splitChildAge:SC.splitChild.age||'',
    splitChildInstrument:SC.splitChild.instrument==='Other'?(SC.splitChild.instrumentOther||'Other'):SC.splitChild.instrument,
    splitChildNotes:SC.splitChild.notes||''
  }, function(e,r){
    if(e||!r||!r.ok){
      showMsg((r&&r.error)||'Something went wrong. Please try again.','e');
      if(cb) cb(false);
      return;
    }
    SC.submitted=true;
    SC.isFirstSubmission=false;
    SC.editMode=false;
    SC.pendingChanges=false;
    SC.slotEditing={}; SC.slotDeleted={}; SC.slotNotes={}; SC.slotSaveAttempted={}; SC.lessonDetailsEditing=false;
    SC.slots=activeSlots;
    var st=null;
    for(var i=0;i<students.length;i++){ if(students[i].studentId===SC.studentId){st=students[i];break;} }
    if(st){ st.availabilitySubmitted='TRUE'; if(SC.instrument) st.instrument=SC.instrument; }
    if(cb) cb(true);
  });
}

// Auto-commits any open slot DOM values, then validates the current SC
// state. Returns an error string (show it and stop) or '' if valid. Shared
// by doSubmitSched() (existing availability screen) and
// doCompleteRegistration() (new-family registration Step 2) so both paths
// enforce identical rules — deliberately does NOT check SC.studentId, since
// that doesn't exist yet during registration; callers that need it (only
// doSubmitSched) check it separately first.
function _validateSchedForm(){
  SC.slots.forEach(function(slot,i){
    if(SC.slotDeleted[i]) return;
    var dayEl=document.getElementById('slot-day-'+i);
    var startEl=document.getElementById('slot-start-'+i);
    var endEl=document.getElementById('slot-end-'+i);
    if(dayEl) slot.day=dayEl.value;
    if(startEl) slot.start=startEl.value;
    if(endEl) slot.end=endEl.value;
  });
  if(!SC.instrument) return 'Please select an instrument.';
  if(!SC.durations.length) return 'Please select at least one lesson duration.';
  if(!SC.locations.length) return 'Please select at least one lesson location.';
  if(SC.durations.length>1&&!SC.durationNote.trim()) return 'Please add context on your duration preference.';
  if(SC.locations.length>1&&!SC.locationNote.trim()) return 'Please add context on your location preference.';
  if(SC.locations.indexOf('in-home')>-1&&!SC.street.trim()) return 'Please enter your street address for in-home lessons.';
  // Changed-from-original-submission checks -- only meaningful once a prior
  // submission actually exists to compare against (AC-requested, this
  // session). A first-time submission has nothing to have "changed" from.
  if(!SC.isFirstSubmission){
    if(SC.instrument!==SC.origInstrument&&!SC.instrumentNote.trim()) return 'Please tell us why you\u2019re changing instruments.';
    if(!_arraysEqualAsSets(SC.durations,SC.origDurations)&&!SC.durationNote.trim()) return 'Please tell us why you\u2019re changing your duration preference.';
    if(!_arraysEqualAsSets(SC.locations,SC.origLocations)&&!SC.locationNote.trim()) return 'Please tell us why you\u2019re changing your location preference.';
  }
  var _noTeach=!!SC.instrument&&SC.teachers.length>0&&_famAvailableTeachers(SC.instrument).length===0;
  if(_noTeach&&SC.waitlist===null) return 'Please let us know if you\u2019d like to be added to the waitlist.';
  var activeSlots=SC.slots.filter(function(s,i){ return !SC.slotDeleted[i]; });
  var hasSlot=activeSlots.some(function(s){return s.day&&s.start&&s.end;});
  if(!hasSlot) return 'Please add at least one complete time window (day, start time, and end time).';
  var _filledSlotCount=activeSlots.filter(function(s){return s.day;}).length;
  if(_filledSlotCount>6) return 'You can have up to 6 time windows. Please remove one before saving.';
  var missingTime=activeSlots.some(function(s){return s.day&&(!s.start||!s.end);});
  if(SC.splitLesson){
    if(!SC.splitChild.name.trim()) return 'Please enter the second child\'s full name.';
    if(!SC.splitChild.age) return 'Please enter the second child\'s age.';
    if(!SC.splitChild.instrument) return 'Please select an instrument for the second child.';
    if(SC.splitChild.instrument==='Other'&&!SC.splitChild.instrumentOther.trim()) return 'Please describe the second child\'s instrument.';
    if(!SC.splitChild.notes.trim()) return 'Please tell us about your second child in the split lesson section.';
  }
  var daysSeen={};
  var dupDay=null;
  activeSlots.forEach(function(s){
    if(s.day){
      if(daysSeen[s.day]){dupDay=s.day;}
      daysSeen[s.day]=true;
    }
  });
  var missingPref=activeSlots.some(function(s){return s.day&&!s.pref;});
  var incompleteSlotDays=[];
  activeSlots.forEach(function(s){
    if(s.day&&(!s.start||!s.end||!s.pref)) incompleteSlotDays.push(s.day);
  });
  if(missingTime||missingPref){
    return 'Please select start time, end time, and priority for each day'+(incompleteSlotDays.length?' ('+incompleteSlotDays.join(', ')+')':'')+'.';
  }
  if(dupDay) return 'You\'ve already added a window for '+dupDay+'.';
  return '';
}

function doSubmitSched(){
  SC.submitError='';
  SC.submitAttempted=true;
  if(!SC.studentId){SC.submitError='Please select a child.';render();return;}
  if(_schAttemptBlocked(false)) return;
  SC.busy=true; render();
  _saveSlotsAndDetails(function(ok){
    SC.busy=false;
    if(ok){
      SC.editMode=false;
      SC.lessonDetailsEditing=false;
      SC.submitted=true;
      SC.submitError='';
      SC.justSubmitted=true;
      // Snapshot BEFORE flipping isFirstSubmission below, so the confirmation
      // banner (which reads this snapshot, not the live flag) correctly shows
      // "submitted!" for a genuine first-timer even though isFirstSubmission
      // is about to become false for any subsequent save this session.
      SC.justSubmittedWasFirst=SC.isFirstSubmission;
      SC.isFirstSubmission=false;
      // Check for unsubmitted siblings to nudge
      _siblingNudgeId='';
      var _avOpen=isTruthy(publicCfg.availabilityOpen);
      if(_avOpen){
        for(var _si=0;_si<students.length;_si++){
          var _ss=students[_si];
          if(_ss.studentId===SC.studentId) continue;
          var _sph=_ss.phase||'';
          var _submitted=isTruthy(_ss.availabilitySubmitted);
          var _skip=_submitted||_sph==='Proposal'||_sph==='Confirmed to Enroll'||
            _sph==='Enrolled'||_sph==='Enrollment Change'||
            _sph==='Trial Booked'||_sph==='Holding'||_sph==='Withdrawn';
          if(!_skip){ _siblingNudgeId=_ss.studentId; break; }
        }
      }
    }
    render();
  });
}

function rEnrollment(scopeStudentId){

var _srBusy={};

function doGrantSelfRelease(studentId){
  _srBusy[studentId]=true; render();
  // The exact wording that was on screen goes with the grant, so the server
  // can snapshot it and email it back (BACKLOG 1.107).
  fapi('saveSelfRelease',{studentId:studentId,agreedText:_selfReleaseText()},function(e,r){
    _srBusy[studentId]=false;
    if(e||!r||!r.ok){showMsg((r&&r.error)||'Something went wrong. Please try again.','e');render();return;}
    var clicked=students.filter(function(x){return x.studentId===studentId;})[0];
    var grantedAt=r.grantedAt||new Date().toISOString();
    if(clicked){
      // Patch every enrollment sharing this exact name, matching the
      // backend's sync -- self-release is a fact about the child, not just
      // the one enrollment whose button was clicked.
      students.forEach(function(s){
        if(s.studentName===clicked.studentName&&!s.selfReleaseGrantedAt){
          s.selfReleaseGrantedAt=grantedAt;
          // Patched locally too, so the "what you agreed to" block renders
          // immediately rather than only after the next full load.
          s.selfReleaseText=r.agreedText||_selfReleaseText();
        }
      });
    }
    showMsg('Permission submitted. Thank you!','s');
    render();
  });
}

    ['Day', stu.day],
    ['Time', stu.time],
    ['Duration', _effDur(stu.durationBase,stu.durationExtra) ? _effDur(stu.durationBase,stu.durationExtra) + ' minutes' : null],
    ['Location', locMap[stu.lessonLocation] || stu.lessonLocation || null]
  ];
  var detailsHtml = '';
  detailRows.forEach(function(row){
    if (!row[1]) return;
    detailsHtml += '<div class="pdf-detail-row"><span class="pdf-detail-lbl">' + esc(row[0]) + '</span><span class="pdf-detail-val">' + esc(row[1]) + '</span></div>';
  });

  if (_policyPdfEl && _policyPdfEl.parentNode) _policyPdfEl.parentNode.removeChild(_policyPdfEl);
  var wrap = document.createElement('div');
  wrap.id = 'policy-pdf-print-block';
  wrap.innerHTML =
    '<div class="pdf-header">' +
      '<img src="' + KEYLAB_LOGO_SRC + '" alt="Keylab" class="pdf-logo">' +
      '<div class="pdf-title">Keylab Children\u2019s Lesson Policies</div>' +
      '<div class="pdf-subtitle">Accepted policy record</div>' +
    '</div>' +
    '<div class="pdf-meta">' +
      '<div class="pdf-meta-row"><span class="pdf-meta-lbl">Accepted by</span><span class="pdf-meta-val">' + esc(stu.tcAcceptedName || '') + '</span></div>' +
      '<div class="pdf-meta-row"><span class="pdf-meta-lbl">Date &amp; time</span><span class="pdf-meta-val">' + esc(_fmtFamilyTs(stu.tcAcceptedAt || '')) + ' at ' + esc(_fmtFamilyTime(stu.tcAcceptedAt || '')) + '</span></div>' +
    '</div>' +
    '<div class="pdf-section-lbl">Enrollment Details</div>' +
    '<div class="pdf-details">' + detailsHtml + '</div>' +
    '<div class="pdf-section-lbl">Policies</div>' +
    '<div class="pdf-policy-text">' + stu.tcPolicySnapshot + '</div>';
  document.body.appendChild(wrap);
  _policyPdfEl = wrap;
  document.body.classList.add('printing-policy-pdf');

  var cleanup = function(){
    if (_policyPdfEl && _policyPdfEl.parentNode) _policyPdfEl.parentNode.removeChild(_policyPdfEl);
    _policyPdfEl = null;
    document.body.classList.remove('printing-policy-pdf');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  // Fallback cleanup in case the browser doesn't fire afterprint (some mobile browsers)
  setTimeout(cleanup, 60000);
  window.print();
}

function tcRefresh(studentId){
  var tc=_tcState(studentId);
  var box=document.getElementById('tc-agree-box-'+studentId);
  var btn=document.getElementById('tc-submit-btn-'+studentId);
  var nmEl=document.getElementById('tc-nm-'+studentId);
  var nm=nmEl?nmEl.value:'';
  tc.name=nm;
  var ready=tc.checked&&nm.trim().length>0;
  if(box){
    box.style.borderColor=tc.checked?'var(--green)':'';
    box.style.background=tc.checked?'rgba(255,255,255,.5)':'rgba(255,255,255,.3)';
  }
  if(btn){
    btn.disabled=!ready;
    btn.style.opacity=ready?'1':'0.4';
  }
}

function doSubmitTC(studentId){
  var tc=_tcState(studentId);
  var chk=document.getElementById('tc-chk-'+studentId);
  var nmEl=document.getElementById('tc-nm-'+studentId);
  var errEl=document.getElementById('tc-err-'+studentId);
  function showErr(msg){
    if(errEl){errEl.textContent=msg;errEl.style.display='block';}
    else{showMsg(msg,'e');}
  }
  var checked=chk?chk.checked:false;
  var name=(nmEl?nmEl.value:'').trim();
  if(!checked){showErr('Please check the box to confirm you\'ve read and agree to the policies.');return;}
  var parts=name.split(' ').filter(function(w){return w.length>0;});
  if(parts.length<2){showErr('Please enter your full name (first and last) to sign.');return;}
  if(errEl) errEl.style.display='none';
  tc.checked=checked;
  tc.name=name;
  tc.busy=true; render();
  // Snapshot the current policy HTML at acceptance time for immutable legal record
  var policyEl=document.createElement('div');
  policyEl.innerHTML=rPolicyText(false);
  var policySnapshot=policyEl.innerHTML||'';
  // The acknowledgment actually shown to this family goes with the
  // acceptance, so it can be snapshotted (BACKLOG 1.109). Which variant was
  // displayed depends on needsManualInvoice, so it's read off the student.
  var _ackStu=students.filter(function(x){return x.studentId===studentId;})[0]||{};
  var _ackText=_tcAckText(isTruthy(_ackStu.needsManualInvoice));
  fapi('submitTandC', {studentId:studentId, acceptedName:name, policySnapshot:policySnapshot, acknowledgment:_ackText}, function(e,r){
    tc.busy=false;
    if(e||!r||!r.ok){showMsg((r&&r.error)||'Something went wrong. Please try again.','e');render();return;}
    if(r.alreadyAccepted){
      // Not an error -- most likely a duplicate click or a second open tab.
      // Re-fetch the real, current state instead of trusting local patching
      // (which may already be stale/out of sync in this scenario) and show
      // a calm confirmation rather than the success toast used for a fresh
      // acceptance.
      TC[studentId]={checked:false,name:'',busy:false};
      showMsg('This has already been accepted \u2014 you\u2019re all set!','s');
      // Carries the student through so a one-page family stays on the child
      // they were looking at rather than being bounced Home (BACKLOG 1.90).
      gotoEnrollment(studentId);
      return;
    }
    var ts=r.acceptedAt||'';
    for(var i=0;i<students.length;i++){
      if(students[i].studentId===studentId){
        students[i].tcAcceptedAt=ts;
        students[i].tcAcceptedName=name;
        students[i].tcPolicySnapshot=policySnapshot;
        students[i].tcAcknowledgment=_ackText;
        // Phase advances server-side; patch locally for immediate UI update
        if(students[i].phase==='Proposal'||students[i].phase==='Enrollment Change'){
          students[i].phase='Confirmed to Enroll';
        }
        break;
      }
    }
    TC[studentId]={checked:false,name:'',busy:false};
    showMsg('Policies accepted. Thank you!','s');
    render();
  });
}

// ============================================================
// INIT
// ============================================================
function boot(){
  var resetTokenFromUrl = '';
  var loginTokenFromUrl = '';
  try {
    var params = new URLSearchParams(window.location.search);
    resetTokenFromUrl = params.get('resetToken') || '';
    loginTokenFromUrl = params.get('token') || '';
    // Deep-links a notification email's magic link straight into the
    // specific conversation, not just a signed-in Home screen (18 Aug,
    // BACKLOG 1.21/1.22 \u2014 "takes them directly to the message"). Consumed
    // once loadFamily() finishes, then cleared.
    _pendingOpenTeacherId = params.get('openTeacherId') || '';
  } catch(e) { /* URLSearchParams unsupported \u2014 treat as no token */ }

  // Public settings (availability status, closures, instrument list) don't
  // depend on login state, and nothing below needs them before the first
  // render — so this now fires independently instead of gating every other
  // branch behind it (previously even a brand-new visitor's login screen
  // waited on this). If it happens to resolve after the main content is
  // already showing, it re-renders so config-dependent UI (e.g. whether the
  // Scheduling tab appears) never gets stuck on default values.
  api({action:'getPublicConfig', data:{}}, function(e,r){
    if(!e&&r&&r.ok){
      publicCfg.availabilityOpen=r.availabilityOpen;
      // BACKLOG 1.136. Assigned unconditionally, not behind an `if` -- the
      // whole point is that flipping the lock OFF has to reach the page too,
      // and a truthiness guard would make 'FALSE' and '' unable to overwrite
      // a previous value.
      publicCfg.agreementPolicy=r.agreementPolicy||null;
      publicCfg.messagingLocked=r.messagingLocked;
      publicCfg.messagingLockedMsg=r.messagingLockedMsg;
      if(r.schedulingBillingUrl) publicCfg.schedulingBillingUrl=r.schedulingBillingUrl;
      // Everything doGetPublicConfig() returns has to land on publicCfg, not
      // just the two fields this handler started life with. Three of them
      // weren't being copied at all: `closures` went only into EST_CLOSURES
      // (the pricing estimator's own copy), and `upcomingDates` and
      // `schoolYearStart` went nowhere — so on the live page the one-page
      // Home's closure-skipping never skipped anything, Important Upcoming
      // Dates was permanently empty, and the school-year floor was inert.
      // None of it showed up in testing because the render harness stubs
      // publicCfg directly. scripts/check.js now guards this handler against
      // the server growing a field the client silently drops.
      if(r.closures){ EST_CLOSURES=r.closures; publicCfg.closures=r.closures; }
      if(r.upcomingDates) publicCfg.upcomingDates=r.upcomingDates;
      if(r.schoolYearStart) publicCfg.schoolYearStart=r.schoolYearStart;
      if(r.keylabCalendarUrl) publicCfg.keylabCalendarUrl=r.keylabCalendarUrl;
      if(r.instruments){
        var _fInstr=r.instruments.split(',').map(function(x){return x.trim();}).filter(Boolean);
        if(_fInstr.length) INSTRUMENTS=_fInstr;
      }
      render();
    }
  });

  if(loginTokenFromUrl){
    // A magic-login link from an emailed [portalLink] button. This token is
    // already a fully valid family session token -- issued server-side with
    // the exact same familyToken_ storage a normal login produces -- it was
    // just never consumed here before now, so clicking "Log in to the
    // Family Portal" from an email did nothing but open a normal login
    // screen with a dead parameter sitting in the URL. Strip it from the
    // address bar immediately, same reasoning as the resetToken case above,
    // then use it exactly like a successful login.
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal -- worst case the URL just isn't cleaned up */ }
    TOKEN = loginTokenFromUrl;
    // Which parent clicked isn't known from this token alone (it's issued
    // per-family, not per-parent) -- 'parent1' is the same fallback the
    // remembered-session path below already uses in the equivalent
    // unknown-parent case.
    MY_PARENT_SLOT = 'parent1';
    // Remembered so returning to the portal within this token's own real
    // expiry doesn't require clicking the emailed link again. familyId is
    // left blank here -- doGetProposal() never returns it to the client,
    // and nothing client-side actually depends on it beyond this bookkeeping.
    _klSaveSession(TOKEN, '', MY_PARENT_SLOT);
    // Deliberately no loadFamily() + return here. Falling through into the
    // remembered-session block below (which reads back the session just
    // saved above) instead of loading directly means this token gets the
    // exact same familyCheckSession() validation that a returning login
    // gets -- if the token turns out to be invalid for any reason, the
    // family is dropped back to the login screen with a clear message,
    // instead of landing on a populated-looking shell with nothing in it
    // and no way back in. Was a real gap: a family that ever hit an
    // invalid/expired link had no path forward except emailing us.
  }

  if(resetTokenFromUrl){
    // Strip the token out of the address bar immediately -- it's a
    // single-use, short-lived credential and should never be the URL a
    // family ends up bookmarking. replaceState leaves the current page
    // exactly as-is but rewrites what the browser considers "this page's
    // URL" to the plain portal address, so any bookmark saved from this
    // point forward (including mid-flow) is the correct, durable one --
    // not a link that's guaranteed to eventually stop working.
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal -- worst case the URL just isn't cleaned up */ }

    // A reset/setup link — check it's actually still valid before showing
    // the set-password form, so a bookmarked or already-used link fails
    // clearly right away instead of after the family fills out the form.
    RESET_TOKEN = resetTokenFromUrl;
    PAGE = 'setpw';
    SPW.checking = true;
    render();
    api({action:'familyValidateResetToken', data:{resetToken:resetTokenFromUrl}}, function(e2,r2){
      SPW.checking = false;
      if(e2||!r2||!r2.ok){
        SPW.invalid = true;
        SPW.email = (r2&&r2.email)||'';
      } else {
        SPW.email = r2.email||'';
      }
      render();
    });
    return;
  }

  // No reset link — check for a remembered session before showing the
  // login screen at all, so a returning family with "Remember me" on
  // skips straight into the portal.
  var saved = _klReadSession();
  if(saved && saved.token){
    // familyCheckSession() (confirms the login is still valid, and renews
    // it) and getProposal() (the actual portal data) now fire at the same
    // time instead of one after another. getProposal() independently
    // validates the same saved token server-side (requireFamily() in
    // enrollment_code.gs), so login safety isn't affected by not waiting
    // for the check to finish first — this just turns two sequential round
    // trips into one for a returning family. TOKEN/MY_PARENT_SLOT are set
    // immediately from the already-saved session (not from the server)
    // since we already have them locally.
    TOKEN = saved.token;
    MY_PARENT_SLOT = saved.parent || 'parent1';

    var _sessionOk = null;    // null = pending, true/false once resolved
    var _propArrived = false, _propErr = null, _propResp = null;

    var _bootSettle = function(){
      if(_sessionOk === false){
        // Saved login isn't valid — discard whatever the data fetch
        // returned (even if it already arrived) and show the login screen.
        _klClearSession();
        TOKEN=''; FAMILY_ID=''; MY_PARENT_SLOT='';
        PAGE = 'login';
        render();
        return;
      }
      if(_sessionOk === true && _propArrived){
        if(!_propErr && _propResp && _propResp.ok){
          _applyProposalResp(_propResp);
          _prefetchSchedulingData();
          PAGE='home'; TAB='home'; _familyLoading=false;
          render();
          loadHomeConversations();
          _startMessagePolling();
        } else {
          // Login's confirmed valid but this particular fetch hit a
          // hiccup — fall back to the normal single-call load path.
          loadFamily();
        }
      }
    };

    api({action:'familyCheckSession', data:{familyToken:saved.token}}, function(e3,r3){
      _sessionOk = (!e3 && r3 && r3.ok) ? true : false;
      if(_sessionOk) FAMILY_ID = r3.familyId;
      _bootSettle();
    });

    fapi('getProposal', {}, function(e4,r4){
      _propArrived = true; _propErr = e4; _propResp = r4;
      _bootSettle();
    });
    return;
  }

  PAGE = 'login';
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  boot();
});
</script>
