function _applyProposalResp(r){
  students=r.proposals||[];
  familyParents=_famParentsFromResp(r);
  familyAddress={street:r.street||'',apt:r.apt||'',city:r.city||'',state:r.state||'',zip:r.zip||''};
  _lastFamilyLoadAt=Date.now();
  _onFamilyDataReady();
}

// Anything that can only be decided once we know the family's students.
// Messaging is gated on their phases (1.37), so its first fetch has to
// happen here rather than at login — at login `students` is still empty and
// the gate would (correctly) refuse.
function _onFamilyDataReady(){
  if(_familyHasMessaging() && !HOME_CONVOS.list.length) loadHomeConversations();
}

// Prefetches Scheduling-tab data as soon as the family's own data is
// available, instead of waiting for the family to click into that tab.
// Skipped entirely while availability submission isn't open, since the
// Scheduling tab doesn't even appear in that case (see rApp()) — no point
// fetching data for a tab nobody can click into. If publicCfg hasn't
// resolved yet at this exact moment (its own fetch runs independently), this
// just falls back to the original load-on-click behavior for that one
// visit — never worse than before, just not sped up that one time.
// getFamilyTeachers has no per-student dependency, so it's always safe to
// prefetch. Availability (loadSchedSubmission) needs a specific studentId —
// for a single-student family we already know which one, so that's
// prefetched too. Multi-student families still see a "pick a child" screen
// with nothing to wait on until they choose, since we can't know in advance
// which child they'll pick without fetching every child's data speculatively.
function _prefetchSchedulingData(){
  if(!isTruthy(publicCfg.availabilityOpen)) return;
  if(!SC.teachers.length) loadSchedTeachers();
  if(students.length===1&&!SC.studentId){
    SC.studentId=students[0].studentId;
    loadSchedSubmission();
  }
}

function loadFamily(){
  PAGE='home'; TAB='home'; students=[]; _familyLoading=true; _familyLoadError=''; render();
  loadHomeConversations();
  _startMessagePolling();
  fapi('getProposal', {}, function(e,r){
    _familyLoading=false;
    if(e||!r||!r.ok){
      var _lfMsg=(r&&r.error)||'We couldn\u2019t load your family\u2019s information. This is usually temporary \u2014 try again in a moment, or email us at info@keylab.nyc if it keeps happening.';
      showMsg(_lfMsg,'e');
      _familyLoadError=_lfMsg;
      render(); return;
    }
    // The family's account no longer exists (deleted while this tab was
    // open, or a magic link for a removed family). Showing the ordinary
    // "we're still getting your information set up" screen here strands them
    // on a page that can never resolve -- BACKLOG 1.101. Drop to login.
    if(r.familyMissing){
      _klClearSession();
      TOKEN=''; FAMILY_ID=''; MY_PARENT_SLOT='';
      PAGE='login'; _familyLoading=false; students=[];
      render();
      return;
    }
    _applyProposalResp(r);
    _prefetchSchedulingData();
    render();
  });
}

function rApp(){
  var avOpen=isTruthy(publicCfg.availabilityOpen);
  // Sign Out lives in this persistent shell (not inside any individual tab's
  // content) so it's always reachable no matter what state that tab is in --
  // v223, fixes a real dead end: rHome()'s zero-students branch returned
  // before ever reaching its own Sign Out link, so anyone whose account
  // resolved to no students had no way back to the login screen at all.
  // Unread badge lives on the nav tab itself (not just inside Home's own
  // message list), per AC's direction this session — visible the moment the
  // app opens, before navigating to Home at all.
  var homeUnread=(HOME_CONVOS.list||[]).reduce(function(sum,c){ return sum+(c.unread||0); },0);

  // A settled, enrolled family gets no tab bar at all (BACKLOG 1.36, step 2).
  // Availability was previously shown to EVERYONE whenever availability season
  // was open, because avOpen is one global switch — so families who finished
  // enrolling months ago still saw a tab asking for availability they'd already
  // given. Enrollment likewise offered a page whose useful parts (policies,
  // tuition, self-release) now live on Home. Families still mid-enrollment keep
  // both tabs, because they genuinely need them.
  var onePage=!_familyLoading && !_familyLoadError && _familyUsesOnePage();
  if(onePage){
    var _signOut='<div style="display:flex;justify-content:flex-end;margin-bottom:1rem">'+
      '<a href="#" style="font-size:12px;color:var(--text4);white-space:nowrap" onclick="event.preventDefault();doSignOut()">Sign Out</a>'+
      '</div>';
    // A deliberate sub-page visit for one child (BACKLOG 1.90) — the family
    // clicked a real CTA on a sibling's action card. Honoured instead of being
    // snapped Home, and always carries its own way back, since there is no tab
    // bar here to navigate with.
    if(_onePageSub && _onePageSub.tab===TAB){
      var _backBar='<p style="font-size:13px;color:var(--text3);margin-bottom:1rem">'+
        '<a href="#" style="color:var(--acc)" onclick="event.preventDefault();_klGoHome()">← Back to home</a></p>';
      var _subContent=(TAB==='enrollment')?rEnrollment(_onePageSub.studentId):rScheduling();
      return _signOut+_backBar+_subContent;
    }
    // TAB can still be pointing at a tab that no longer exists — e.g. a family
    // who was mid-enrollment last visit, or a stale deep link. Send them Home
    // rather than rendering a page they can no longer navigate away from.
    if(TAB!=='home') TAB='home';
    return _signOut+rHome();
  }

  var tabs='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2rem">'+
    '<div class="tabs" style="margin-bottom:0">'+
    '<div class="tab'+(TAB==='home'?' on':'')+'" onclick="TAB=&apos;home&apos;;render()">Home'+
    (homeUnread?'<span class="chip c-info" style="margin-left:5px;font-size:10px;padding:1px 6px;vertical-align:middle">'+homeUnread+'</span>':'')+
    '</div>'+
    (avOpen?'<div class="tab'+(TAB==='scheduling'?' on':'')+'" onclick="gotoScheduling()">Availability</div>':'')+
    '<div class="tab'+(TAB==='enrollment'?' on':'')+'" onclick="gotoEnrollment()">Enrollment</div>'+
    '</div>'+
    '<a href="#" style="font-size:12px;color:var(--text4);white-space:nowrap" onclick="event.preventDefault();doSignOut()">Sign Out</a>'+
    '</div>';
  var content='';
  if(TAB==='home')         content=rHome();
  else if(TAB==='scheduling') content=rScheduling();
  else if(TAB==='enrollment') content=rEnrollment();
  return tabs+content;
}

// Initials for a contact's avatar. Two letters where we have two names, one
// otherwise — never empty, since a blank circle reads as a broken image.
function _klInitials(name){
  var parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length===1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0)+parts[parts.length-1].charAt(0)).toUpperCase();
}

// "Mia's piano teacher" — AC's wording, built from the child names and
// instruments doGetFamilyConversations() already returns (1.38). Admin gets
// no subline: "Keylab Admin" needs no explaining. Where one teacher covers
// two children the names join, which AC hasn't ruled on — flagged rather
// than assumed settled.
function _klContactSub(c){
  if(c.teacherId==='admin') return '';
  var names=(c.studentNames||[]).map(function(n){ return String(n).trim().split(' ')[0]; }).filter(Boolean);
  if(!names.length) return '';
  var who=names.length===1?names[0]:names.slice(0,-1).join(', ')+' & '+names[names.length-1];
  var inst=(c.instruments||[])[0];
  return who+'’s '+(inst?String(inst).toLowerCase()+' ':'')+'teacher';
}

// One row per person. The whole row opens the conversation — there is no
// second control competing with it. The right-hand end shows exactly one
// thing: an unread count, or the greyed "read but not answered" marker with

  var sub=_klContactSub(c);

    '<div class="kl-cav'+(c.teacherId==='admin'?' adm':'')+'">'+esc(c.teacherId==='admin'?'K':_klInitials(c.teacherName))+'</div>'+

      (c.hasMessages?'<span class="kl-ctime">'+esc(_klShortTime(c.lastMessageAt))+'</span>':'')+'</div>'+
      (sub?'<div class="kl-cprev">'+esc(sub)+'</div>':'')+

}

// Compact stamp for a list row: clock time for today, otherwise the date.
// The full day/date/time stays on the message bubbles inside the thread.
function _klShortTime(ms){
  var n=Number(ms);
  if(!n) return '';
  var d=new Date(n);
  if(isNaN(d.getTime())) return '';
  var now=new Date();
  if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()){
    var h=d.getHours(), mins=d.getMinutes(), ampm=h>=12?'PM':'AM', h12=h%12; if(h12===0) h12=12;
    return h12+':'+(mins<10?'0':'')+mins+' '+ampm;
  }
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()]+' '+d.getDate();
}

// BACKLOG 1.136. AC's switch, with AC's words. Replaces the entire Messages

// The thread, in place of the list. "Back" is AC's wording (19 Aug).
function rHomeThreadView(){
  var t=HOME_EXPANDED;

  var sub=_klContactSub(c);

      // Mark-unread lives here rather than on the list row: the row already

      // you've just read.
      '<a href="#" class="read-toggle" title="Mark unread" onclick="event.preventDefault();markHomeThreadRead(false,\''+esc(t.teacherId)+'\')">○</a>'+

  h+='<div class="kl-thead">'+
    '<div class="kl-cav'+(t.teacherId==='admin'?' adm':'')+'">'+esc(t.teacherId==='admin'?'K':_klInitials(t.teacherName))+'</div>'+
    '<div><div class="kl-tname">'+esc(t.teacherName)+'</div>'+
    (sub?'<div class="kl-tsub">'+esc(sub)+'</div>':'')+'</div></div>';

  if(t.loading){
    h+='<div style="text-align:center;padding:1.5rem;color:var(--text3)"><span class="spin" style="font-size:18px">↻</span></div>';
  } else if(!t.messages.length){
    h+='<p class="hint">No messages yet — send a message to get started.</p>';
  } else {
    h+='<div class="msg-list">'+t.messages.map(rMsgBubble).join('')+'</div>';
  }
  // BACKLOG 1.125 — the away notice, ABOVE the composer, so a parent knows
  // before they write rather than being told afterwards by an autoresponder.
  // There is deliberately no "available" state here: a green badge on a
  // parent's screen would read as a promise of an immediate reply
  // (AC, 1 Sept — families get no status banner).
  if(c.teacherAway && c.teacherAwayMessage){
    h+='<div class="kl-away">'+esc(c.teacherAwayMessage)+'</div>';
  }
  // BACKLOG 1.132 — and the after-hours line, shown while they are writing
  // outside this teacher's own hours, with the option to phone instead still
  // in front of them. Teacher's own words where they wrote any.
  if(c.teacherAfterHours && !c.teacherAway){
    h+='<div class="kl-afterhours">'+esc(c.teacherAfterHoursMessage||AFTER_HOURS_COPY)+'</div>';
  }
  // BACKLOG 1.161 #4 — which child is this about? Asked only when the answer
  // is not obvious: one child with this teacher and it is set automatically,
  // with nothing on screen. The thread stays one conversation per teacher
  // (SPEC §3) — this labels the message, it does not split the thread.
  var _kids=c.students||[];
  if(_kids.length>1){
    var _sel=_homeStudentId(t,_kids);
    h+='<div class="kl-about"><span>About</span>'+
      _kids.map(function(st){
        return '<span class="kl-about-pill'+(_sel===st.studentId?' on':'')+'" '+
          'onclick="HOME_EXPANDED.studentId=\''+esc(st.studentId)+'\';render()">'+esc(st.studentName)+'</span>';
      }).join('')+
      '<span class="kl-about-pill'+(_sel?'':' on')+'" onclick="HOME_EXPANDED.studentId=\'\';render()">Something else</span>'+
      '</div>';
  }
  // No sending/disabled state: the message is already in the history by the
  // time the request goes out, so a spinner would be reporting on work the
  // family has no reason to care about (1.43).
  var sendBtn='<button class="btn btn-p" onclick="sendHomeMessage()">Send</button>';
  h+='<div class="composer">'+
    '<textarea id="home-composer" placeholder="Type your message here..." oninput="HOME_EXPANDED.draft=this.value">'+esc(t.draft)+'</textarea>'+
    sendBtn+
    '</div>';
  return h;
}

// Which child the composer is currently set to. Defaults to whatever the
// conversation was last about, because a thread tends to stay on one child —
// asking again for every message would be friction with no new information.
function _homeStudentId(t,kids){
  if(t.studentId!==undefined) return t.studentId;
  var last='';
  (t.messages||[]).forEach(function(m){ if(m.studentId) last=m.studentId; });
  if(!last && kids.length===1) last=kids[0].studentId;
  t.studentId=last;
  return last;
}

function closeHomeThread(){
  HOME_EXPANDED=null;
  loadHomeConversations(true);
  render();
}


function markHomeThreadRead(read, teacherId){

function clearHomeThread(teacherId){

// One gate for the whole messaging feature on the family side: exactly the
// families on the one-page Home, i.e. every student in phase Enrolled
// (BACKLOG 1.37, settled with AC). Deliberately the same test as the page
// split rather than a second phase list that could drift out of sync with it.
function _familyHasMessaging(){
  // Just the phase test. Deliberately does NOT also check _familyLoading /
  // _familyLoadError the way rApp()'s page-split gate does: on the boot fast
  // path _applyProposalResp() runs before _familyLoading is cleared, so a
  // returning family would have been skipped on first load. Both states are
  // covered anyway — neither leaves `students` populated.
  return _familyUsesOnePage();
}

function loadHomeConversations(silent){
  // Called before the family's own record has loaded (from loadFamily) as
  // well as after, and on every poll tick — so the gate lives here rather
  // than at each call site. _onFamilyDataReady() re-runs it once students
  // are known, which is the call that actually fetches for an enrolled
  // family.
  if(!_familyHasMessaging()){ HOME_CONVOS={loading:false, list:[]}; return; }
  if(!silent){ HOME_CONVOS.loading=true; render(); }
  fapi('getFamilyConversations', {}, function(e,r){
    HOME_CONVOS.loading=false;
    if(e||!r||!r.ok) return; // silent — this runs on a poll timer, don't spam errors
    var next=r.conversations||[];
    if(_pendingOpenTeacherId){
      var target=_pendingOpenTeacherId;
      _pendingOpenTeacherId='';
      HOME_CONVOS.list=next;
      var match=next.filter(function(c){ return c.teacherId===target; })[0];
      toggleHomeThread(target, match?match.teacherName:(target==='admin'?'Admin':''));
      return; // toggleHomeThread() already renders
    }
    // Skip the render entirely when nothing actually changed — this poll
    // fires every 5s regardless of whether anything's new, and a full
    // render() rebuilds the whole subtree even though render() itself now
    // preserves scroll/focus across it (items 11 & 13). Not rendering at
    // all when there's nothing to show is simpler and cheaper than relying
    // on that preservation alone.
    var changed=JSON.stringify(next)!==JSON.stringify(HOME_CONVOS.list);
    HOME_CONVOS.list=next;
    if(!silent||changed) render();
  });
}

function toggleHomeThread(teacherId, teacherName){
  if(HOME_EXPANDED && HOME_EXPANDED.teacherId===teacherId){ HOME_EXPANDED=null; render(); return; }
  HOME_EXPANDED={teacherId:teacherId, teacherName:teacherName, messages:[], draft:'', loading:true, refreshing:false, lastSentAt:0, _sendInFlight:false};
  // The thread replaces the contact list in a block that may be halfway down
  // a long page, so opening it has to move the page too — otherwise a family
  // clicks a contact and nothing appears to happen (1.40).
  _shouldScrollToThread=true;
  render();
  fapi('getConversation', {conversationType:'family_teacher', familyId:FAMILY_ID, teacherId:teacherId}, function(e,r){
    if(!HOME_EXPANDED||HOME_EXPANDED.teacherId!==teacherId) return;
    HOME_EXPANDED.loading=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not load conversation.','e'); render(); return; }
    HOME_EXPANDED.messages=r.messages||[];
    HOME_EXPANDED.lastSentAt=_maxSentAt(HOME_EXPANDED.messages);
    _shouldScrollMsgList=true; render();
  });
}

// Manual "Refresh" — same fetch as opening the thread, without the polling
// wait. Uses the full getConversation() (marks read too), not the lock-free
// poll endpoint, since this is a deliberate user action, not a background
// tick — same reasoning as any other explicit reload.
function refreshHomeThread(){
  var t=HOME_EXPANDED;
  if(!t||t.refreshing) return;
  t.refreshing=true; render();
  fapi('getConversation', {conversationType:'family_teacher', familyId:FAMILY_ID, teacherId:t.teacherId}, function(e,r){
    if(!HOME_EXPANDED||HOME_EXPANDED.teacherId!==t.teacherId) return;
    HOME_EXPANDED.refreshing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not refresh.','e'); render(); return; }
    HOME_EXPANDED.messages=r.messages||[];
    HOME_EXPANDED.lastSentAt=_maxSentAt(HOME_EXPANDED.messages);
    _shouldScrollMsgList=true; render();
  });
}

function _maxSentAt(msgs){
  var max=0;
  (msgs||[]).forEach(function(m){ var n=Number(m.sentAt)||0; if(n>max) max=n; });
  return max;
}

// Formats an epoch-ms timestamp as "Tue, 8/18/26 5:30 PM" — see BACKLOG.md
// 1.18. Falls back to the raw value for anything that doesn't parse (e.g.
// a message sent before this fix, still holding the old date-only string).
function fmtMsgTime(ms){
  var n=Number(ms);
  if(!n) return String(ms||'');
  var d=new Date(n);
  if(isNaN(d.getTime())) return String(ms||'');
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var h=d.getHours(), mins=d.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0) h12=12;
  var mm=mins<10?'0'+mins:String(mins);
  return days[d.getDay()]+', '+(d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(-2)+' '+h12+':'+mm+' '+ampm;
}

// Optimistic send (BACKLOG 1.43). Click Send, the message is in the history —
// that's the whole interaction. It used to disable the button, wait for the
// round trip, then blank the entire thread to a spinner and re-fetch the whole
// conversation, which is what made messages appear seconds later and shove the
// page around as they landed.
//
// The send still happens; it just stops being something the family has to
// watch. The one case that isn't silent is failure: a message that never sent
// must not sit in the history looking sent, so it's taken back out and the
// text is returned to the composer with the existing error toast.
function sendHomeMessage(){
  var t=HOME_EXPANDED;
  var text=(document.getElementById('home-composer')||{}).value||t.draft;
  text=(text||'').trim();
  if(!text) return;

  var clientMsgId=_klNewClientMsgId();
  var pending={
    messageId:'', senderId:FAMILY_ID, senderName:'',
    messageText:text, sentAt:Date.now(), _pending:true
  };
  t.messages=t.messages.concat([pending]);
  t.draft='';
  // Blocks the 5s poll from touching this thread until the server has
  // confirmed. Without it a tick landing mid-flight would fetch the very
  // message sitting here unconfirmed and append it a second time.
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  render();

  // studentId: which child this is about (1.161 #4). senderParentSlot: which
  // PARENT is writing (1.24) — together they are AC's "it always needs to
  // connect to the parent, including specific parent in 2 parent accounts."
  var _kidsNow=((HOME_CONVOS.list||[]).filter(function(x){return x.teacherId===t.teacherId;})[0]||{}).students||[];
  var _stuId=_homeStudentId(t,_kidsNow);
  pending.studentId=_stuId;
  fapiTracked('sendMessage', {conversationType:'family_teacher', familyId:FAMILY_ID, teacherId:t.teacherId, messageText:text, studentId:_stuId, senderParentSlot:MY_PARENT_SLOT, clientMsgId:clientMsgId}, function(e,r){
    // The send itself is unaffected by the thread being closed — the request
    // is already on its way and the server writes it regardless. Only the
    // local reconciliation is skipped, since there's no longer a thread on
    // screen holding the optimistic copy.
    if(!HOME_EXPANDED||HOME_EXPANDED!==t) return;
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=text;
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    // Reconcile in place, from the server's own copy of the row. Deliberately
    // no render() on success: the message is already on screen exactly as it
    // will stay, and re-rendering it is the flicker this item exists to remove.
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
    }
    // Keeps the poll's "anything newer than this" from re-delivering our own
    // message under its real timestamp.
    t.lastSentAt=_maxSentAt(t.messages);
  });
}

// Polls every 5s for: (1) new conversation previews on Home, (2) new
// messages in whichever thread is currently expanded inline — via the
// lock-free doGetMessagesSince(), not a full getConversation() reload, so
// this never marks anything read just because a poll tick happened. Paused
// while the tab isn't visible, so a backgrounded/closed tab doesn't keep
// burning script executions.
function _startMessagePolling(){
  if(_pollTimer) return;
  _pollTimer=setInterval(_pollTick,5000);
  // Coming back to the tab refreshes at once instead of waiting out the rest
  // of the interval. Polling pauses while hidden, so without this the worst
  // case is a full 5 seconds of stale screen at exactly the moment someone is
  // looking at it. Cheap now that a poll with nothing to report never touches
  // the messages sheet (1.159).
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') _pollTick();
  });
  window.addEventListener('focus',_pollTick);
}
function _pollTick(){
  if(document.hidden) return;
  if(!TOKEN) return;
  if(TAB==='home') loadHomeConversations(true);
  // _sendInFlight: see sendHomeMessage(). A tick between the optimistic
  // append and the server's confirmation would otherwise deliver the same
  // message back and show it twice.
  if(HOME_EXPANDED && !HOME_EXPANDED.loading && !HOME_EXPANDED._sendInFlight){
    (function(teacherId){
      fapi('getMessagesSince', {conversationType:'family_teacher', familyId:FAMILY_ID, teacherId:teacherId, sinceSentAt:String(HOME_EXPANDED.lastSentAt||0)}, function(e,r){
        if(!HOME_EXPANDED||HOME_EXPANDED.teacherId!==teacherId) return;
        if(e||!r||!r.ok||!r.messages||!r.messages.length) return;
        // Second guard, independent of _sendInFlight: drop anything already
        // in the thread by id. Duplicated messages are the failure mode this
        // whole path has to avoid, and one cheap filter covers every route
        // to it, including a retry or a reconnect.
        var have={};
        HOME_EXPANDED.messages.forEach(function(m){ if(m.messageId) have[m.messageId]=true; });
        var fresh=r.messages.filter(function(m){ return !m.messageId || !have[m.messageId]; });
        if(!fresh.length) return;
        HOME_EXPANDED.messages=HOME_EXPANDED.messages.concat(fresh);
        HOME_EXPANDED.lastSentAt=_maxSentAt(HOME_EXPANDED.messages);
        _shouldScrollMsgList=true; render();
      });
    })(HOME_EXPANDED.teacherId);
  }
}

function rMsgBubble(m){
  var mine = m.senderId===FAMILY_ID;
  // messageHtml is set only when a teacher used the formatting toolbar
  // (BACKLOG 1.33), and has already been through _sanitizeMessageHtml_()
  // server-side — the family reply box stays plain text and never sets it.
  // Plain messages, and everything sent before 1.33, keep the escaped path.
  var body = m.messageHtml
    ? m.messageHtml
    : esc(m.messageText||'').replace(/\n/g,'<br>');
  return '<div class="bubble-row'+(mine?' mine':'')+'">'+
    '<div class="bubble'+(mine?' mine':'')+'">'+
    (!mine?'<div class="bubble-sender">'+esc(m.senderName||'')+'</div>':'')+
    _klBubbleAbout(m)+
    '<div class="bubble-text">'+body+'</div>'+
    '<div class="bubble-time">'+esc(fmtMsgTime(m.sentAt))+'</div>'+
    '</div></div>';
}

// Which child a message is about (BACKLOG 1.161 #4). Shown only where it says
// something: a family with one child on this teacher has one possible answer.
function _klBubbleAbout(m){
  if(!m.studentId||!HOME_EXPANDED) return '';
  var c=(HOME_CONVOS.list||[]).filter(function(x){return x.teacherId===HOME_EXPANDED.teacherId;})[0]||{};
  var kids=c.students||[];
  if(kids.length<2) return '';
  var st=kids.filter(function(x){return x.studentId===m.studentId;})[0];
  if(!st) return '';
  return '<span class="kl-about-tag">'+esc(st.studentName)+'</span>';
}

// Returns a one-page family from a sub-page (BACKLOG 1.90) to their Home.
// Clearing _onePageSub is what makes rApp()'s stale-TAB guard apply again.
function _klGoHome(){
  _onePageSub=null;
  TAB='home';
  render();
}

// studentId is optional and only matters for a one-page family: it records
// WHICH child's proposal they're going to look at, so rApp() can render just
// that child rather than every student's enrollment card (BACKLOG 1.90).
// Tabbed families ignore it entirely and keep the full Enrollment tab.
function gotoEnrollment(studentId){
  TAB='enrollment';
  if(studentId && _familyUsesOnePage()){
    _onePageSub={tab:'enrollment', studentId:studentId};
  }
  // If data is fresh (<60s) render instantly, then silently refresh in background
  if(students.length&&(Date.now()-_lastFamilyLoadAt)<60000){
    render();
    fapi('getProposal', {}, function(e, r){
      if(!e&&r&&r.ok){ students=r.proposals||[]; familyParents=_famParentsFromResp(r); familyAddress={street:r.street||'',apt:r.apt||''}; _lastFamilyLoadAt=Date.now(); render(); }
    });
    return;
  }
  _familyLoading=true;
  _familyLoadError='';
  render();
  fapi('getProposal', {}, function(e, r){
    _familyLoading=false;
    if(!e && r && r.ok){
      students = r.proposals || []; familyParents=_famParentsFromResp(r); familyAddress={street:r.street||'',apt:r.apt||''}; _lastFamilyLoadAt=Date.now();
    } else if(!students.length){
      // A genuine fetch failure with nothing already cached to fall back on
      // -- deliberately NOT the same as "confirmed empty." Surfaced as a
      // clear, retry-able message instead of silently showing "Nothing here
      // yet," which would otherwise look identical to a real empty account.
      _familyLoadError=(r&&r.error)||'We couldn\u2019t load your enrollment details. This is usually temporary \u2014 try again in a moment, or email us at info@keylab.nyc if it keeps happening.';
    }
    render();
  });
}
function gotoScheduling(){
  TAB='scheduling';
  if(students.length===1&&!SC.studentId){
    SC.studentId=students[0].studentId;
  }
  if(!SC.loaded) loadSchedSubmission();
  if(!SC.teachers.length) loadSchedTeachers();
  render();
}

function loadSchedTeachers(){
  SC.teachersError='';
  fapi('getFamilyTeachers', {}, function(e,r){
    if(!e&&r&&r.ok&&Array.isArray(r.teachers)){
      SC.teachers=r.teachers;
      render();
    } else {
      // Previously silent -- SC.teachers stayed empty with no indication
      // anything went wrong, which quietly disabled the teacher-preference
      // dropdown AND the "no teacher for this instrument, join the
      // waitlist?" prompt (both are gated on SC.teachers being non-empty).
      // A family could submit for an instrument nobody teaches and never
      // be asked about the waitlist, simply because this background load
      // failed. Surfaced now so it's visible and retry-able.
      SC.teachersError='We couldn\u2019t load teacher information.';
      render();
    }
  });
}

// Ported from EnrollmentAdmin.html's studentAge() (BACKLOG 1.55). `age` is
// only ever a snapshot, written once from date of birth and never recomputed,
// so a child who joined at 9 still reads as 9 years later — and the family
// portal was gating self-release on exactly that stale number, refusing a
// child who had since turned 10. `birthdate` is the source of truth where it
// exists; the stored age remains the fallback for older records without one.
// Deliberately the same logic as admin's, so the two can't disagree about the
// same child.
function _klStudentAge(s){
  if(s&&s.birthdate){
    var bd=new Date(s.birthdate);
    if(!isNaN(bd.getTime())){
      var now=new Date();
      var a=now.getFullYear()-bd.getFullYear();
      var mo=now.getMonth()-bd.getMonth();
      if(mo<0||(mo===0&&now.getDate()<bd.getDate())) a--;
      if(a>=0&&a<120) return String(a);
    }
  }
  return (s&&s.age)||'';
}

// The self-release authorization wording, in ONE place (BACKLOG 1.107). It
// used to be inline in the checkbox label only, which is why it vanished the
// moment permission was granted -- the granted branch replaced the whole
// block. Now it's a constant so the same text can be shown before granting,
// after granting, and sent to the family by email. AC's approved copy,
// unchanged from what shipped inline.
// The proposal-acceptance acknowledgment, in ONE place (BACKLOG 1.109) —
// same reasoning as SELF_RELEASE_TEXT. It was inline in the checkbox label
// only, so the wording a family agreed to vanished the moment they agreed:
// the accepted state shows who accepted and when, but never WHAT. Two
// variants, chosen by whether the family owes a manual invoice. AC's copy,
// unchanged from what shipped inline.
var TC_ACK_INVOICE='I acknowledge that I have read and accept Keylab\u2019s enrollment policies, and agree to submit payment for the first month of lessons which will also schedule automatic flat-rate monthly payments for the duration of the enrollment. I acknowledge that if payment is not submitted within two business days from when this proposal was accepted, that the time slot may be given to another family';
var TC_ACK_ONFILE='I acknowledge that I have read and accept Keylab\u2019s enrollment policies, and I am authorizing Keylab to schedule my child\u2019s lessons for the school year, bill the payment method on file for the first payment, and schedule recurring automatic flat-rate monthly payments based on the proposal details.';
// BACKLOG 1.156. Everything a family agrees to now prefers the agreement
// version in effect today, so AC edits it in Settings rather than asking for a
// deploy. The constants above stay as the fallback for the same reason
// rPolicyText()'s does: an acceptance screen must never render an empty
// sentence beside a checkbox because a version was mis-dated.
// typeof-guarded because scripts/check.js extracts and runs the functions that
// call this one in isolation, without the portal's globals. In the portal
// publicCfg always exists; in a harness it may not, and the right answer there
// is the same as "no version set" -- fall through to the built-in text.
function _agrText(key){
  var ap=(typeof publicCfg!=='undefined'&&publicCfg)?publicCfg.agreementPolicy:null;
  return (ap && ap[key]) ? String(ap[key]) : '';
}
function _tcAckText(needsInvoice){
  return _agrText(needsInvoice?'ackInvoice':'ackOnFile')
      || (needsInvoice?TC_ACK_INVOICE:TC_ACK_ONFILE);
}
// A function, not a constant, because the version is fetched after load.
function _selfReleaseText(){ return _agrText('selfRelease') || SELF_RELEASE_TEXT; }

var SELF_RELEASE_TEXT='I authorize my child to arrive at and depart from Keylab without adult accompaniment. I accept full responsibility for their transportation to and from Keylab; for their safety prior to and following their scheduled lesson; and for their conduct at all times before, during, and after their lesson.';

// What this child has on file, shown on Home without the family clicking
// anything (BACKLOG 1.104). AC: "they can see the dates, amounts, and status
// clearly on home page without having to click anywhere."
//
// Reads s.availability from the payload rather than SC, which only ever holds
// one child at a time — that limitation is exactly why this used to require
// clicking Review, one child at a time.
//
// Renders for BOTH Home variants: a mixed family (one enrolled, one still
// enrolling) gets the one-page Home, a family with nobody enrolled gets the
// tabbed one, and both need this.
// The "Enrollment" facts (status/processed date/lesson/tuition/start
// date) that used to render here for a phase==='Enrolled' student were
// removed 26 Aug (AC: "remove the enrollment details below the line...
// free up space... make the cards smaller") -- they're the same rows
// _rHomeEnrDetailsToggle()'s one-click details already shows (BACKLOG
// 1.111), so this was pure duplication once that shipped. This function
// now only ever renders the "You submitted" availability section.
function _rHomeChildDetail(s){
  var a=s.availability;
  if(!a) return '';

  function row(lbl,val){
    if(!val) return '';
    return '<div style="display:flex;gap:.6rem;font-size:12px;margin-top:3px">'+
      '<span style="color:var(--text4);min-width:104px;flex-shrink:0">'+esc(lbl)+'</span>'+
      '<span style="color:var(--text2)">'+esc(val)+'</span></div>';
  }
  var h='<div style="margin-top:.6rem;padding-top:.6rem;border-top:.5px solid var(--border)">';

  h+='<div style="font-size:12px;font-weight:600;color:var(--text3);margin:0 0 .2rem">You submitted</div>';
  h+=row('Instrument',a.instrument);
  h+=row('Instrument notes',a.instrumentNote);
  h+=row('Lesson length',_klDurLabel(a.duration));
  h+=row('Duration notes',a.durationNote);
  h+=row('Location',_klLocLabel(a.location));
  h+=row('Location notes',a.locationNote);
  h+=row('Address',[a.street,a.apt,a.city,a.state,a.zip].filter(Boolean).join(' '));
  h+=row('Teacher preference',a.teacherPref);
  var slotStr=(a.slots||[]).map(function(x){
    return x.day+(x.start?' '+x.start:'')+(x.end?'\u2013'+x.end:'')+(x.pref?' ('+x.pref+')':'');
  }).join(' \u00b7 ');
  h+=row('Availability',slotStr);
  h+=row('Notes',a.notes);
  h+='</div>';
  return h;
}

// Shared label helpers, mirroring the server's (BACKLOG 1.78/1.100 wording).
function _klDurLabel(raw){
  var p=String(raw||'').split(',').map(function(v){return v.trim();}).filter(Boolean);
  if(!p.length) return '';
  return (p.length>1?p.slice(0,-1).join(', ')+' or '+p[p.length-1]:p[0])+' minutes';
}
var KL_LOC_LABELS={studio:'At Keylab','in-home':'In-home',virtual:'Virtual'};
function _klLocLabel(raw){
  return String(raw||'').split(',').map(function(v){
    var k=v.trim(); return k?(KL_LOC_LABELS[k]||k):'';
  }).filter(Boolean).join(', ');
}

// Compact per-child status summary -- header (name + instrument), phase
// chips, key schedule/price details once a real slot exists, and a short
// phase-appropriate status line. Shared across Home, Enrollment, and
// Availability tabs so the same facts and the same wording show wherever a
// family looks, rather than three separately-hand-written copies drifting
// apart over time. Returns inner content only -- callers wrap this in their
// own card container. Note: this is the first place Home (and Availability)
// show an explicit Withdrawn message -- previously only Enrollment did, a
// deliberate AC-approved divergence from an earlier session, now
// superseded by AC's explicit "same details on all three pages" instruction.
// opts.inDetailBlock (BACKLOG 1.109) — set when this renders INSIDE a block
// that already lists the lesson details, tuition and acceptance line as its
// own rows. Without it the Enrollment tab showed a family the same day/time/
// teacher, the same start date, the same price boxes and the same "proposal
// and policies accepted" line twice, a few hundred pixels apart. Only the
// header (name, instrument, status) is wanted in that context.
function _rChildStatusSummary(s, opts){
  var _inDetail = !!(opts && opts.inDetailBlock);
  var avOpen=isTruthy(publicCfg.availabilityOpen);
  var locMap={studio:'at Keylab','in-home':'In-home',virtual:'Virtual'};
  var lbl=phaseLabel(s.phase, s.availabilitySubmitted, avOpen, s.tcAcceptedAt, s.needsManualInvoice);
  var ph=s.phase||'';
  var firstName=s.studentName?(s.studentName.trim().split(' ')[0]):'';
  var avSubmitted=isTruthy(s.availabilitySubmitted);
  var avLocked=isTruthy(s.availabilityLocked);
  var hasProp=ph==='Proposal'||ph==='Confirmed to Enroll'||ph==='Enrolled'||ph==='Enrollment Change';
  var hasTrial=ph==='Trial Booked';
  var isHolding=ph==='Holding';
  var isWithdrawn=ph==='Withdrawn';
  var isEnrolled=(ph==='Enrolled');
  var isAccepted=!!s.tcAcceptedAt;
  var showDashboard=(isEnrolled||ph==='Enrollment Change'||(hasProp&&isAccepted));

  var h='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:.6rem">';
  h+='<div><span class="stu-name" style="font-size:18px">'+esc(s.studentName)+'</span>';
  if(s.instrument) h+='<div style="font-size:12px;color:var(--text4);margin-top:5px">'+esc(s.instrument)+'</div>';
  h+='</div>'+_renderChips(lbl)+'</div>';

  if(showDashboard){
    var details=[];
    if(s.day) details.push(s.day);
    if(s.time) details.push(s.time);
    if(s.teacher) details.push(s.teacher);
    if(s.lessonLocation) details.push(locMap[s.lessonLocation]||s.lessonLocation);
    if(details.length&&!_inDetail) h+='<div style="font-size:13px;color:var(--text3);margin-bottom:.3rem">'+esc(details.join(' \u00b7 '))+'</div>';
    if(s.startDate&&!_inDetail) h+='<div style="font-size:12px;color:var(--text3);margin-bottom:.3rem">Starts '+esc(_fmtFamilyDate(s.startDate))+'</div>';
    if(s.monthlyPrice&&!_inDetail) h+=_fmtPriceBox(s,false);
    if(ph==='Enrollment Change'){
      h+='<div class="msg mi" style="margin-top:.5rem">'+esc(firstName)+'\u2019s current enrollment will remain active until you accept the new proposal. Once accepted, we\u2019ll process the new enrollment and get '+esc(firstName)+'\u2019s new lesson schedule on the books, and the current enrollment will be archived.</div>';
    } else if(isEnrolled){
      h+='<div class="msg ms">\u2713 '+esc(firstName)+' is enrolled! See below for details on how to manage their enrollment.</div>';
    } else if((s.tcAcceptedAt||s.tcAcceptedName)&&!_inDetail){
      h+='<div class="msg ms">\u2713 Proposal and policies accepted'+(s.tcAcceptedName?' by '+esc(s.tcAcceptedName):'')+
        (s.tcAcceptedAt?' on '+esc(_fmtFamilyTs(s.tcAcceptedAt))+' at '+esc(_fmtFamilyTime(s.tcAcceptedAt)):'')+'.</div>';
    }
  } else if(hasTrial){
    var trialDateFmt=_fmtFamilyDate(s.trialDate);
    var trialTeacherName=s.trialTeacher||'';
    var trialDur=s.trialDuration||'';
    var trialInstr=s.instrument||'';
    if(s.lessonLocation==='in-home'){
      var trialAddrParts=[];
      if(familyAddress.street) trialAddrParts.push(familyAddress.street);
      if(familyAddress.apt) trialAddrParts.push('Apt '+familyAddress.apt);
      var trialAddr=trialAddrParts.join(', ');
      h+='<div style="font-size:12px;color:var(--text4)">A trial in-home '+esc(trialDur)+' minute '+esc(trialInstr)+' lesson has been scheduled for '+esc(firstName)+' with '+esc(trialTeacherName)+' on '+esc(trialDateFmt)+' at '+esc(s.trialTime)+' at '+esc(trialAddr)+'. '+esc(trialTeacherName)+' will look forward to meeting you then!</div>';
    } else if(s.lessonLocation==='virtual'){
      h+='<div style="font-size:12px;color:var(--text4)">A trial virtual '+esc(trialDur)+' minute '+esc(trialInstr)+' lesson has been scheduled for '+esc(firstName)+' with '+esc(trialTeacherName)+' on '+esc(trialDateFmt)+' at '+esc(s.trialTime)+'. Please use the family portal to access '+esc(trialTeacherName)+'\u2019s zoom link. '+esc(trialTeacherName)+' is looking forward to meeting '+esc(firstName)+' then!</div>';
    } else {
      h+='<div style="font-size:12px;color:var(--text4)">A trial '+esc(trialDur)+' minute '+esc(trialInstr)+' lesson has been scheduled for '+esc(firstName)+' with '+esc(trialTeacherName)+' on '+esc(trialDateFmt)+' at '+esc(s.trialTime)+' '+esc(locMap.studio)+'. We\'ll look forward to seeing you then!</div>';
    }
  } else if(isHolding){
    var holdDur=_effDur(s.durationBase,s.durationExtra)||s.durationBase||'';
    var holdInstr=s.instrument||'';
    if(s.lessonLocation==='in-home'){
      h+='<div style="font-size:12px;color:var(--text4)">'+esc(firstName)+' has a hold placed for '+esc(holdDur)+' minute in-home '+esc(holdInstr)+' lessons with our teacher '+esc(s.teacher)+' for '+esc(s.day)+'s at '+esc(s.time)+'. Holds are not guaranteed and can change, but we are currently targeting this time slot for '+esc(firstName)+'’s '+esc(holdInstr)+' lessons.</div>';
    } else if(s.lessonLocation==='virtual'){
      h+='<div style="font-size:12px;color:var(--text4)">'+esc(firstName)+' has a hold placed for '+esc(holdDur)+' minute virtual '+esc(holdInstr)+' lessons with our teacher '+esc(s.teacher)+' for '+esc(s.day)+'s at '+esc(s.time)+'. Holds are not guaranteed and can change, but we are currently targeting this time slot for '+esc(firstName)+'’s '+esc(holdInstr)+' lessons.</div>';
    } else {
      h+='<div style="font-size:12px;color:var(--text4)">'+esc(firstName)+' has a hold placed for '+esc(holdDur)+' minute '+esc(holdInstr)+' lessons with our teacher '+esc(s.teacher)+' for '+esc(s.day)+'s at '+esc(s.time)+' at Keylab. Holds are not guaranteed and can change, but we are currently targeting this time slot for '+esc(firstName)+'’s '+esc(holdInstr)+' lessons.</div>';
    }
  } else if(hasProp&&!isAccepted){
    var propDur=_effDur(s.durationBase,s.durationExtra)||s.durationBase||'';
    var propInstr=s.instrument||'';
    var propStart=s.startDate?_fmtFamilyDate(s.startDate):'';
    if(s.day&&s.time&&s.teacher&&propDur&&propInstr){
      var propSentence='Please review and accept '+esc(firstName)+'\u2019s proposal for '+esc(propDur)+' minute ';
      if(s.lessonLocation==='in-home') propSentence+='in-home ';
      else if(s.lessonLocation==='virtual') propSentence+='virtual ';
      propSentence+=esc(propInstr)+' lessons with '+esc(s.teacher)+' on '+esc(s.day)+'s at '+esc(s.time);
      if(s.lessonLocation!=='in-home'&&s.lessonLocation!=='virtual') propSentence+=' at Keylab';
      propSentence+=propStart?', to begin on '+esc(propStart)+'.':'.';
      h+='<div style="font-size:13px;color:var(--text3);margin-bottom:.35rem">'+propSentence+'</div>';
    }
    if(s.monthlyPrice&&!_inDetail) h+=_fmtPriceBox(s,false);
  } else if(isWithdrawn){
    h+='<div style="font-size:12px;color:var(--text4)">'+esc(firstName)+' is not currently enrolled. Please contact us at <a href="mailto:info@keylab.nyc">info@keylab.nyc</a> if you have questions.</div>';
  } else if(avLocked){
    h+='<div style="font-size:12px;color:var(--text4)">We are working on a time slot for '+esc(firstName)+' and their availability is temporarily locked. Please contact <a href="mailto:info@keylab.nyc">info@keylab.nyc</a> for assistance.</div>';
  } else if(avSubmitted){
    h+='<div style="font-size:12px;color:var(--text4)">We\'ve received your availability. We\'ll be in touch as soon as possible with an update.</div>';
  } else if(ph==='Leads'||ph==='Pending'){
    if(avOpen){
      h+='<div style="font-size:12px;color:var(--text4)">Please let us know when '+esc(firstName)+' is available for lessons.</div>';
    } else {
      h+='<div style="font-size:12px;color:var(--text4)">We\'re not accepting availability submissions right now. We\'ll be in touch soon.</div>';
    }
  }
  return h;
}

// ============================================================
// ONE-PAGE FAMILY HOME (BACKLOG 1.36) — enrolled families only
// ============================================================
// Everything a settled family needs on one screen: next lesson, messages,
// tuition, upcoming dates, support. Any student with a proposal to review,
// availability to submit, or an enrollment change in flight gets their own
// action card at the top of this same page (_rHomeChildActionCard) rather
// than being scoped out — Step 2 of this rebuild (BACKLOG 1.63), so a family
// with one enrolled child and a newly-added sibling in the pipeline (e.g. via
// the Support "Book a Trial Lesson" flow) keeps the enrolled child's Home
// instead of losing it back to the tabbed page. A family with NO enrolled
// student yet still falls through to the original tabbed Home below, which
// is the only place a solo mid-enrollment-change family gets their "Review
// New Proposal" button.
var KL_ACTIONABLE_PHASES={'Leads':1,'Pending':1,'Holding':1,'Trial Booked':1,'Proposal':1,'Confirmed to Enroll':1,'Enrollment Change':1};

function _familyUsesOnePage(){
  if(!students.length) return false;
  for(var i=0;i<students.length;i++){
    if(students[i].phase==='Enrolled') return true;
  }
  return false;
}

function _p2(n){ return (n<10?'0':'')+n; }
function _parseYMD(s){ var p=String(s).split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }

var KL_DAYIDX={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};

// Next real occurrence of a weekly lesson, skipping studio closures — so a
// family whose Tuesday falls on Thanksgiving sees the following Tuesday, not a
// date their child won't have a lesson on. Returns null when there's nothing
// dependable to show (no day on file, or nothing open in the look-ahead).
//
// The search floor is the LATEST of three dates (BACKLOG 1.42): today, the
// student's own start date, and the first day of the school year. Without the
// last two, a family looking at this page in August was shown a lesson this
// week — the code happily found the next Wednesday, because nothing told it
// the school year hadn't started. The school-year date is not duplicated
// here: it comes from publicCfg, which Code.js fills from the same
// SCHOOL_YEAR_START_YMD its pricing maths floors on.
function _klFloorDate(iso){
  if(!iso) return null;
  var d=new Date(String(iso)+'T12:00:00');
  if(isNaN(d.getTime())) d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  d.setHours(0,0,0,0);
  return d;
}

function _nextLessonDate(dayName, startDate){
  var idx=KL_DAYIDX[String(dayName||'').trim().toLowerCase()];
  if(idx===undefined) return null;
  var closures=publicCfg.closures||{};
  var start=new Date(); start.setHours(0,0,0,0);
  [_klFloorDate(publicCfg.schoolYearStart), _klFloorDate(startDate)].forEach(function(f){
    if(f && f>start) start=f;
  });
  for(var i=0;i<120;i++){
    var c=new Date(start.getTime()+i*86400000);
    if(c.getDay()!==idx) continue;
    if(closures[c.getFullYear()+'-'+_p2(c.getMonth()+1)+'-'+_p2(c.getDate())]) continue;
    return c;
  }
  return null;
}

function _fmtLessonDate(d){
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function _fmtDateRange(a,b){
  var d1=_parseYMD(a);
  if(a===b) return d1.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  var o={month:'short',day:'numeric'};
  return d1.toLocaleDateString('en-US',o)+' – '+_parseYMD(b).toLocaleDateString('en-US',o);
}


// The family's enrolled students, in record order. Used in enough places on
// this page that the phase test is worth stating once.
function _klEnrolled(){
  return students.filter(function(s){ return s.phase==='Enrolled'||s.phase==='Enrollment Change'; });
}

// ── Schedule block (BACKLOG 1.50 + 1.47) ────────────────────────────────
// Copy in this block was written by Claude under AC's 19 Aug delegation
// ("You can write the copy"), not by AC. Flagged so a later session doesn't
// mistake it for his voice; it's his to change.

// The weekdays this family actually has lessons on, and which child each
// belongs to. Used to answer "which closures cost us a lesson" — the filter
// AC asked for. Returns e.g. {1:['Mia'], 3:['Leo']}.
// BACKLOG 1.85 — the button used to read "All Holidays & Studio Closure
// Dates" while the list behind it is filtered to the family's own lesson
// days. AC: that misleads a parent into thinking the dates shown are the only
// closures there are. Naming the day(s) makes the filter visible in the
// control itself. Falls back to the unqualified label when no lesson day is
// known, so it can never render "All  Holidays".
var KL_DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function _klLessonDayNames(){
  var byDay=_klLessonDays();
  return Object.keys(byDay)
    .map(function(k){ return Number(k); })
    .sort(function(a,b){ return a-b; })
    .map(function(idx){ return KL_DAYNAMES[idx]; })
    .filter(Boolean);
}
function _klAllDatesLabel(){
  var names=_klLessonDayNames();
  if(!names.length) return 'All Holidays &amp; Studio Closure Dates';
  var joined=names.length===1?names[0]
    :names.slice(0,-1).join(', ')+' &amp; '+names[names.length-1];
  return 'All '+joined+' Holidays &amp; Studio Closure Dates';
}
function _klLessonDays(){
  var byDay={};
  var enrolled=_klEnrolled();
  // Label carries only what distinguishes the enrollment it's attached to
  // (BACKLOG 1.60, settled 19 Aug): nothing at all with a single enrollment
  // in the whole family (a date needs no label when there's only one lesson
  // it could mean); the instrument alone for a single child with more than
  // one enrollment (the name adds nothing when it's the same child every
  // time); the child's name, plus the instrument too for any child with more
  // than one enrollment, once the family has more than one child. Branches
  // on enrollment/child COUNTS, not on whether one particular day happens to
  // have only one lesson on it \u2014 the label is a family-level fact.
  var byChildCount={};
  enrolled.forEach(function(s){ byChildCount[s.studentName||'']=(byChildCount[s.studentName||'']||0)+1; });
  var multiChild=Object.keys(byChildCount).length>1;
  var multiEnrollment=enrolled.length>1;
  enrolled.forEach(function(s){
    var idx=KL_DAYIDX[String(s.day||'').trim().toLowerCase()];
    if(idx===undefined) return;
    var first=s.studentName?s.studentName.trim().split(' ')[0]:'';
    if(!first) return;
    var label='';
    if(multiEnrollment){
      if(multiChild){
        var childHasMulti=byChildCount[s.studentName||'']>1;
        label=first+(childHasMulti&&s.instrument?' \u00b7 '+s.instrument:'');
      } else {
        label=s.instrument||first;
      }
    }
    if(!byDay[idx]) byDay[idx]=[];
    if(byDay[idx].indexOf(label)===-1) byDay[idx].push(label);
  });
  return byDay;
}

// Every date inside an event's range, inclusive. A multi-day event like Winter
// Recess spans several weekdays, so asking "does this fall on a Monday" means
// checking every day in it, not just the day it starts (1.47).
function _klEventDates(ev){
  var out=[];
  var d=_parseYMD(ev.startDate), end=_parseYMD(ev.endDate||ev.startDate);
  if(isNaN(d.getTime())||isNaN(end.getTime())) return out;
  var guard=0;
  while(d<=end && guard++<400){
    out.push(new Date(d.getTime()));
    d.setDate(d.getDate()+1);
  }
  return out;
}

// Calendar events plus each child's first lesson, in date order. The start
// date is an ordinary entry competing for the three summary slots and dropping
// off once passed (AC, 19 Aug) — the same today-filter as everything else, so
// the two can't drift apart.
function _klScheduleEvents(){
  var today=new Date(); today.setHours(0,0,0,0);
  var out=(publicCfg.upcomingDates||[]).map(function(d){
    return {event:d.event||'', startDate:d.startDate, endDate:d.endDate||d.startDate, closed:!!d.closed, kind:'calendar'};
  });

  // One entry per ENROLLMENT, not one per date (AC, 19 Aug). A family with two
  // children gets two rows even when both start the same day, and a single
  // child with two enrollments — two instruments, say — gets one row each,
  // because those are two different first lessons with two different teachers.
  // The instrument is only added where the family has more than one enrollment,
  // since otherwise it's noise.
  var enrolled=_klEnrolled();
  var multi=enrolled.length>1;
  enrolled.forEach(function(s){
    if(!s.startDate) return;
    var d=_klFloorDate(s.startDate);
    if(!d||d<today) return;   // lessons have already begun for this enrollment
    var first=s.studentName?s.studentName.trim().split(' ')[0]:'';
    // The date shown is the first ACTUAL lesson, not the raw start date. Admin
    // typically sets every student's startDate to the first day of the school
    // year, which is one weekday — so a Wednesday student would otherwise be
    // told their first lesson is that Monday, while the Next lesson section
    // directly above said Wednesday. Same calculation as that section, so the
    // two halves of this card can't contradict each other.
    var actual=_nextLessonDate(s.day, s.startDate);
    var ymd=actual
      ? actual.getFullYear()+'-'+_p2(actual.getMonth()+1)+'-'+_p2(actual.getDate())
      : s.startDate;
    // Possessive on the child, not on the instrument: "Mia's first piano
    // lesson", never "Mia · Piano's first lesson".
    var label=multi&&s.instrument
      ? first+'’s first '+String(s.instrument).toLowerCase()+' lesson'
      : first+'’s first lesson';
    out.push({ event:label, startDate:ymd, endDate:ymd, closed:false, kind:'start' });
  });

  return out.filter(function(e){
    var end=_parseYMD(e.endDate||e.startDate);
    return !isNaN(end.getTime()) && end>=today;
  }).sort(function(a,b){
    return String(a.startDate).localeCompare(String(b.startDate));
  });
}

function _klDateRow(e, whenText, whoText){
  var tag = e.kind==='start'
    ? '<span class="kl-tag op">First lesson</span>'
    : '<span class="kl-tag '+(e.closed?'cl':'op')+'">'+(e.closed?'Closed':'Keylab is open')+'</span>';
  return '<div class="kl-date"><div>'+
    '<div class="kl-who">'+esc(e.event)+'</div>'+
    '<div class="kl-sub">'+esc(whenText)+(whoText?' · '+esc(whoText):'')+'</div></div>'+
    tag+'</div>';
}

// Every event that lands on a day this family has a lesson, with the specific
// date that lands — not the range's start, which for Winter Recess would name
// a day that may not be their lesson day at all.
function rHomeDayFilteredDates(){
  var byDay=_klLessonDays();
  if(!Object.keys(byDay).length) return '<p class="hint">We don’t have a lesson day on file yet.</p>';
  var hits=[];
  _klScheduleEvents().forEach(function(e){
    if(e.kind==='start'){ hits.push({e:e, when:_fmtDateRange(e.startDate,e.endDate), who:''}); return; }
    _klEventDates(e).forEach(function(d){
      var who=byDay[d.getDay()];
      if(!who) return;
      hits.push({e:e, when:_fmtLessonDate(d), who:who.join(' & '), sort:d.getTime()});
    });
  });
  if(!hits.length) return '<p class="hint">No closures fall on your lesson days.</p>';
  return hits.map(function(hit){ return _klDateRow(hit.e, hit.when, hit.who); }).join('');
}

function toggleAllDates(){ _klAllDatesOpen=!_klAllDatesOpen; render(); }

function rHomeSchedule(){
  var h='<div class="card"><h2>Schedule</h2>';
  var sb=esc(publicCfg.schedulingBillingUrl||'');

  // ── Next lesson, soonest first — the child who has one tomorrow belongs
  // above the one who has one next week.
  var lessons=[];
  students.forEach(function(s){
    if(s.phase!=='Enrolled'&&s.phase!=='Enrollment Change') return;
    if(!s.day) return;
    lessons.push({ s:s, d:_nextLessonDate(s.day, s.startDate) });
  });
  lessons.sort(function(a,b){
    if(!a.d && !b.d) return 0;
    if(!a.d) return 1;   // rows we couldn't date sink to the bottom
    if(!b.d) return -1;
    return a.d - b.d;
  });
  if(lessons.length){
    h+='<div class="kl-subhd">Next lesson</div>';
    lessons.forEach(function(L){
      var s=L.s;
      var first=s.studentName?s.studentName.trim().split(' ')[0]:'';
      // Room is never shown to families (standing rule 6) — teacher, day, time only.
      var when=L.d
        ? esc(_fmtLessonDate(L.d))+(s.time?'<br>'+esc(s.time):'')
        : esc(s.day+(s.time?' · '+s.time:''));
      h+='<div class="kl-row"><div>'+
        '<div class="kl-who">'+esc(first)+'</div>'+
        '<div class="kl-sub">'+esc([s.instrument,s.teacher].filter(Boolean).join(' · '))+'</div>'+
        '</div><div class="kl-when">'+when+'</div></div>';
    });
  }

  // ── Important dates: always the next three, however far out.
  var events=_klScheduleEvents();
  if(events.length){
    // Expanded REPLACES the summary rather than appending under it — otherwise
    // the same three dates appear twice, one set directly beneath the other.
    if(_klAllDatesOpen){
      h+='<div class="kl-subhd">All dates on your lesson days</div>';
      h+=rHomeDayFilteredDates();
    } else {
      h+='<div class="kl-subhd">Upcoming dates</div>';
      events.slice(0,3).forEach(function(e){
        h+=_klDateRow(e, _fmtDateRange(e.startDate,e.endDate), '');
      });
    }
    h+='<div style="margin-top:.5rem"><button class="btn btn-s btn-sm" onclick="toggleAllDates()">'+
      (_klAllDatesOpen?'Hide dates':_klAllDatesLabel())+'</button></div>';
  }

  // "See your child's full lesson schedule" (BACKLOG 1.62) — same destination
  // as Support's "Check your schedule or cancel a lesson"; deliberate per AC,
  // since it's the natural place to look from here too.
  h+='<div style="margin-top:.6rem"><a class="btn btn-s btn-sm" href="'+sb+'" target="_blank">See your child’s full lesson schedule</a></div>';

  // Hidden entirely until the URL is set in admin Settings, so this can never
  // ship as a dead control (agreed with AC, 19 Aug).
  if(publicCfg.keylabCalendarUrl){
    h+='<div style="margin-top:.6rem"><a class="btn btn-s btn-sm" href="'+esc(publicCfg.keylabCalendarUrl)+'" target="_blank">Keylab Google Calendar</a></div>';
  }
  return h+'</div>';
}

function rHomeOnePage(){
  // No page header here. render() already draws the Keylab logo and "Keylab
  // Family Portal" above everything, so the block that used to sit here was a
  // second logo and a second portal title, one under the other (AC, 19 Aug:
  // "we don't need the 2nd keylab family portal or logo, omit entirely").
  var h='';

  // ── Action needed: any student not yet Enrolled, e.g. a sibling added
  // mid-year via Support's "Book a Trial Lesson" — top of the page (AC, 20
  // Aug), since their enrollment is the most important thing the family
  // needs to act on. Same per-child card content as the old tabbed Home
  // (_rChildStatusSummary + the same CTAs), just relocated here so it isn't
  // duplicated (BACKLOG 1.63 Step 2). ──
  // BACKLOG 1.104 follow-up (22 Aug) — AC caught this live: an enrolled
  // sibling in a mixed family never got a card here at all, because this
  // loop excluded 'Enrolled' outright. _rHomeChildActionCard() already had a
  // correct branch for isEnrolled (the showDashboard path); it just never
  // ran, since nothing called the function for an enrolled student. Now
  // every student renders a card here — the actionable-phase ones for what
  // to do next, the enrolled ones for status/processed date/amount, per
  // AC's original ask: "dates, amounts, and status clearly on home page
  // without having to click anywhere."
  students.forEach(function(s){
    if(s.phase==='Enrolled' || KL_ACTIONABLE_PHASES[s.phase||'']) h+=_rHomeChildActionCard(s);
  });

  // ── Schedule: next lessons + important dates, one block, first on the page ──
  // Merged on AC's call (BACKLOG 1.50): they answer the same question — when
  // are the lessons, and when aren't there any — and used to sit apart with
  // Messages between them.
  h+=rHomeSchedule();

  // ── Messages ──
  h+='<div class="card">'+rHomeMessages()+'</div>';

  // Monthly Tuition was removed entirely here (BACKLOG 1.51, AC's call). The
  // Billing & invoices button it carried is not lost — Keylab Support's
  // "Billing info & payment history" goes to the same place.

  // ── Self-release ──

  // rebuild — dropping it would quietly remove a family's ability to authorize
  // their child to arrive and leave unaccompanied. Sits down here with the
  // other occasional actions rather than up among the everyday information:

  if(srRows) h+='<div class="card"><h2>Self-Release</h2>'+srRows+'</div>';

  // families cannot reschedule (AC, 19 Aug).

    '<p style="font-size:12px;margin-bottom:.5rem">See Keylab\u2019s full studio policies for helpful info on managing your child\u2019s enrollment</p>'+
    _klAcc('trial','Book A Trial Lesson For Another Child',
      '<p>If you want to enroll another child, you can book a trial lesson directly here. The trial lesson will hold the time slot as the intended spot for the school year. You\u2019ll have two days after the trial to decide if you want to enroll or not.</p>'+
      '<a class="btn btn-p btn-sm" href="https://keylab.opus1.io/w/kids-trial-lesson" target="_blank">Book a Trial Lesson</a>')+
    _klAcc('schedule','Check your schedule or cancel a lesson',
      '<p>View upcoming lessons or cancel a lesson. See cancellation policies for details.</p>'+
      '<a class="btn btn-p btn-sm" href="'+sb+'" target="_blank">Scheduling &amp; Billing</a>')+
    _klAcc('billing','Billing info &amp; payment history',
      '<p>View all payments, download invoices, and update your payment details.</p>'+
      '<a class="btn btn-p btn-sm" href="'+sb+'" target="_blank">Scheduling &amp; Billing</a>')+
    // "Your child's details" (editable name/DOB/school, BACKLOG 1.56),
    // "Read the studio policies" and "Contact admin" all removed 26 Aug
    // (AC's call \u2014 "not necessary"; admin is already reachable from the
    // Messages block's contact list above, so nothing there was lost).
    // "Your contact details" relabeled to "Update your contact info" per
    // AC's exact wording, same session.
    _klAcc('contactDetails','Update your contact info', rHomeContactDetails())+
    // "Your enrollment details" removed 26 Aug -- Enrollment Change
    // students now get the same record (and, unlike this old item, the
    // accepted policy text too) from _rHomeEnrDetailsToggle() on their own
    // Home card, same as Enrolled and accepted-Confirmed-to-Enroll
    // students. This item was also quietly showing the wrong data by this
    // point: doGetProposal() overlays a pending change's not-yet-accepted

function rHome(){
  if(!_familyLoading && !_familyLoadError && _familyUsesOnePage()) return rHomeOnePage();
  var h='<h1>Hi there!</h1>'+
    '<p>Please use this page to submit your children\'s availability for the school year, or to check your child\'s enrollment status if you have already submitted your availability. We\'ll be in touch as soon as possible with an update.</p>';
  // The one registration email didn't send (BACKLOG 1.98). Persistent, not a
  // toast — a family who misses a 7-second toast has no way to find out.
  if(_regEmailFailed){
    h+='<div class="msg ma">'+esc(REG_EMAIL_FAILED_MSG)+'</div>';
  }
  // No messaging block here (BACKLOG 1.37). This is the page a family sees
  // while they're still enrolling, and messaging belongs to families who are
  // enrolled — they get it from rHomeOnePage(). It used to be rendered
  // unconditionally, which meant Leads, Pending, Holding, Trial Booked and
  // Proposal families were all offered Contact Teacher, and so was a family
  // whose record hadn't finished loading. loadHomeConversations() applies the
  // same gate on the data side, so nothing is fetched for them either.
  if(_familyLoading){
    return h+'<div style="text-align:center;padding:3rem"><span class="spin" style="font-size:20px">\u21bb</span></div>';
  }
  if(_familyLoadError){
    h+='<div class="card"><p style="color:var(--text3)">'+esc(_familyLoadError)+'</p>'+
      '<button class="btn btn-s btn-sm" style="margin-top:.5rem" onclick="loadFamily()">Try Again</button></div>';
    return h;
  }
  if(!students.length){
    h+='<div class="card"><p style="color:var(--text3)">We\'re still getting your information set up. We\'ll reach out soon. In the meantime, feel free to email us at <a href="mailto:info@keylab.nyc">info@keylab.nyc</a>.</p></div>';
    return h;
  }
  var avOpen=isTruthy(publicCfg.availabilityOpen);
  var hadDashboard=false;
  // Self-release is a fact about the child, not about one enrollment -- a
  // student with more than one enrollment (e.g. two instruments) should
  // only see the self-release control once, not once per enrollment card.
  var _srShownFor={};
  var anyEnrolled=false;
  students.forEach(function(s){
    var ph=s.phase||'';
    var firstName=s.studentName?(s.studentName.trim().split(' ')[0]):'';
    var avSubmitted=isTruthy(s.availabilitySubmitted);
    var avLocked=isTruthy(s.availabilityLocked);
    var hasProp=ph==='Proposal'||ph==='Confirmed to Enroll'||ph==='Enrolled'||ph==='Enrollment Change';
    var hasTrial=ph==='Trial Booked';
    var isHolding=ph==='Holding';
    var isWithdrawn=ph==='Withdrawn';
    var isEnrolled=(ph==='Enrolled');
    var isAccepted=!!s.tcAcceptedAt;
    var showDashboard=(isEnrolled||ph==='Enrollment Change'||(hasProp&&isAccepted));

    if(showDashboard){
      // ── Dashboard: accepted or enrolled ──
      h+='<div class="card">';
      h+=_rChildStatusSummary(s);
      if(ph==='Enrollment Change'){
        h+=_rHomeActionButtons('Review New Proposal', s.studentId);
      } else if(isEnrolled){
        h+=_rHomeActionButtons('Review Enrollment Details', s.studentId);
      } else if(s.tcAcceptedAt||s.tcAcceptedName){
        // What Happens Next — elevated card, shown on Home for accepted-but-not-enrolled students.
        var _needsInvoice=isTruthy(s.needsManualInvoice);
        var _isReturningTenure=_familyIsReturning();
        h+='<div style="margin-bottom:.75rem;background:var(--bbg);border:1px solid var(--blue);border-radius:var(--rl);padding:1rem">'+
          '<div style="font-size:15px;font-weight:700;color:var(--bt);margin-bottom:.4rem">'+(_isReturningTenure?'Welcome Back! What Happens Next':'What Happens Next')+'</div>'+
          (_needsInvoice
            ?('<p style="font-size:14px;color:var(--bt);margin:0">Only one more step to finish '+esc(firstName)+'&rsquo;s enrollment \u2014 click below to pay the invoice. You\u2019ll sign in with the login info from your proposal acceptance confirmation email.</p>'+
              '<div style="margin-top:.75rem"><a href="'+publicCfg.schedulingBillingUrl+'" target="_blank" class="btn btn-p btn-sm">Pay Invoice</a></div>')
            :('<p style="font-size:14px;color:var(--bt);margin:0">I\u2019ll schedule '+esc(firstName)+'&rsquo;s lessons for the school year and process their enrollment on the admin side using the payment method on file. Your card will be charged for the first payment once enrollment is processed, and automatic flat rate monthly payments will be processed on the 1st of each month from the 2nd month of '+esc(firstName)+'&rsquo;s enrollment. Check your email for confirmation and details and let us know if you need any help!</p>'))+
          '</div>';
        h+=_rHomeActionButtons('Review Proposal and Policies', s.studentId);
      } else {
        h+=_rHomeActionButtons('Review Proposal and Policies', s.studentId);
      }
      if(!_srShownFor[s.studentName]){
        h+=_rHomeSelfRelease(s);
        _srShownFor[s.studentName]=true;
      }
      h+='</div>';
      hadDashboard=true;
      if(isEnrolled) anyEnrolled=true;
    } else {
      // ── Non-dashboard states ──
      h+='<div class="card-stu">';
      h+=_rChildStatusSummary(s);
      var ctas=[];
      if((ph==='Proposal'||ph==='Confirmed to Enroll')&&!isAccepted){
        ctas.push('<button class="btn btn-p btn-sm" onclick="gotoEnrollment(&apos;'+esc(s.studentId)+'&apos;)">Review and Accept Proposal</button>');
      }
      if(!avLocked&&avOpen&&!avSubmitted&&(ph==='Leads'||ph==='Pending')&&!hasProp&&!hasTrial&&!isWithdrawn&&!isEnrolled){
        ctas.push('<button class="btn btn-p btn-sm" onclick="_gotoSchedulingForStudent(&apos;'+esc(s.studentId)+'&apos;)">Submit availability</button>');
      }
      if(!avLocked&&avOpen&&!avSubmitted&&ph==='Holding'){
        ctas.push('<button class="btn btn-p btn-sm" onclick="_gotoSchedulingForStudent(&apos;'+esc(s.studentId)+'&apos;)">Submit availability</button>');
      }
      if(!avLocked&&avSubmitted&&(ph==='Leads'||ph==='Pending'||ph==='Holding')){
        ctas.push('<button class="btn btn-p btn-sm" onclick="_gotoSchedulingForStudent(&apos;'+esc(s.studentId)+'&apos;)">Review / Update Availability</button>');
      }
      if(ctas.length) h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:.5rem">'+ctas.join('')+'</div>';
      h+=_rHomeChildDetail(s);
      h+='</div>';
    }
  });
  if(hadDashboard&&anyEnrolled) h+=_rHomeQuickActions();
  h+='<hr class="divider">';
  h+=_rHomeParent2();
  h+='<p style="font-size:12px;color:var(--text4)">Questions? Email us at <a href="mailto:info@keylab.nyc">info@keylab.nyc</a>.</p>';
  return h;
}

function doInviteCoParent(){
  var name=(document.getElementById('inv-n')||{}).value||INV.name;
  var email=(document.getElementById('inv-e')||{}).value||INV.email;
  INV.name=name.trim(); INV.email=email.trim(); INV.error='';
  if(!INV.name){ INV.error='Please enter the 2nd parent\u2019s name.'; render(); return; }
  if(!INV.email||INV.email.indexOf('@')===-1){ INV.error='Please enter a valid email address for the 2nd parent.'; render(); return; }
  INV.busy=true; render();
  fapi('familyInviteCoParent', {parent2Name:INV.name, parent2Email:INV.email}, function(e,r){
    INV.busy=false;
    if(e||!r||!r.ok){
      INV.error=(r&&r.error)||'Something went wrong. Please try again or email us at info@keylab.nyc.';
      render(); return;
    }
    INV.sent=true;
    familyParents.p2=INV.name; familyParents.p2Email=INV.email; familyParents.p2HasPassword=false;
    render();
  });
}

// Re-sends the setup email to an already-added parent2 who hasn't set a
// password yet — reuses the same familyInviteCoParent action (name/email
// unchanged, so it's effectively a resend) rather than a separate endpoint.
function resendP2Setup(){
  INV.busy=true; render();
  fapi('familyInviteCoParent', {parent2Name:familyParents.p2, parent2Email:familyParents.p2Email}, function(e,r){
    INV.busy=false;
    if(e||!r||!r.ok){
      showMsg((r&&r.error)||'Something went wrong. Please try again.','e');
      render(); return;
    }
    INV.sent=true;
    render();
  });
}

function rScheduling(){
  if(!isTruthy(publicCfg.availabilityOpen)){
    return '<p style="color:var(--text3)">Availability submission is not currently open. We\'ll let you know as soon as it is!</p>';
  }
  if(_familyLoading){
    return '<div style="text-align:center;padding:3rem"><span class="spin" style="font-size:20px">\u21bb</span></div>';
  }

  // Determine enrollmentType for the selected student
  var _scStu=null;
  for(var _i=0;_i<students.length;_i++){ if(students[_i].studentId===SC.studentId){_scStu=students[_i];break;} }
  var _enType=(_scStu&&_scStu.enrollmentType)||'';
  var _isReturning=_enType.toLowerCase().indexOf('returning')===0;

  // Same data load the rest of this function relies on below — checked here,
  // ahead of both the locked and unlocked branches, so a load failure can
  // never be mistaken for "nothing submitted" (which would otherwise hide a
  // locked student's real summary, or show an unlocked student a blank form
  // that risks overwriting a real submission on save).
  if(_scStu){
    if(SC.loading){
      return '<div style="text-align:center;padding:3rem"><span class="spin" style="font-size:20px">\u21bb</span></div>';
    }
    if(SC.loadError){
      return '<div class="card"><p style="color:var(--text3)">'+esc(SC.loadError)+'</p>'+
        '<button class="btn btn-s btn-sm" style="margin-top:.5rem" onclick="SC.loadError=&apos;&apos;;loadSchedSubmission()">Try Again</button></div>';
    }
  }

  // Compact status summary — same content/wording as Home and Enrollment —
  // shown above everything else on this tab so a family never has to leave
  // Availability to remember a child's overall status.
  var _scStatusCard=_scStu?('<div class="card" style="margin-bottom:1rem">'+_rChildStatusSummary(_scStu)+'</div>'):'';

  if(_scStu&&(_scStu.availabilityLocked==='TRUE'||_scStu.availabilityLocked===true)){
    var _lockFirstName=(_scStu.studentName||'This student').split(' ')[0];
    var _lockMsg='<p style="color:var(--text3)">We are working on a time slot for '+esc(_lockFirstName)+' and their availability is temporarily locked. Please contact <a href="mailto:info@keylab.nyc">info@keylab.nyc</a> for assistance.</p>';
    if(SC.loaded&&!SC.isFirstSubmission){
      return _scStatusCard+rLockedAvSummary()+_lockMsg;
    }
    return _scStatusCard+_lockMsg;
  }

  var h='';
  h+=_scStatusCard;
  h+='<h1>Your Availability</h1>';
  h+='<p>Tell us when your family is available for lessons this school year. The more you share, the better we can find a time that works well for everyone.</p>';

  if(_isReturning){
    h+='<div class="card" style="margin-bottom:1rem">';
    h+='<h2>Returning Families</h2>';
    h+='<ul style="padding-left:1.2rem;color:var(--text2);font-size:13px;line-height:1.75">';
    h+='<li>If you\'re a returning family, we\'ll do our best to pair your child with their regular teacher.</li>';
    h+='<li>Because teacher availability can change year to year, we can\'t guarantee a spot with the same teacher -- but it\'s our top priority.</li>';
    h+='<li>If we\'re unable to find an opening with your regular teacher during your requested availability, we\'ll reach out to offer you a time with your regular teacher that is open but not within your requested availability, or time slots with a new teacher that we feel will be a good fit for your child.</li>';
    h+='</ul></div>';
  } else {
    h+=_rNewFamilyAvailIntro();
  }

  if(students.length>1&&SC.studentId){
    var _scName='';
    var _scInstr='';
    for(var _ni=0;_ni<students.length;_ni++){ if(students[_ni].studentId===SC.studentId){_scName=students[_ni].studentName;_scInstr=students[_ni].instrument||'';break;} }
    if(_scName) h+='<div style="font-size:13px;color:var(--text3);margin-bottom:1rem">Submitting for: <strong style="color:var(--text)">'+esc(_scName)+(_scInstr?' \u2014 '+esc(_scInstr):'')+'</strong> \u00b7 <a href="#" onclick="_klGoHome();return false" style="color:var(--acc)">Back to home</a></div>';
  }

  if(!SC.studentId){
    var _btnHtml='<div style="margin-top:.5rem">';
    if(students.length>1){
      _btnHtml+='<p style="font-size:13px;color:var(--text3);margin-bottom:.75rem">Select a child to submit availability for:</p>';
      students.forEach(function(stu){
        var _pkLbl=stu.studentName+(stu.instrument?' \u2014 '+stu.instrument:'');
        _btnHtml+='<button class="btn btn-p" style="margin-bottom:.5rem;margin-right:.5rem" onclick="_gotoSchedulingForStudent(&apos;'+esc(stu.studentId)+'&apos;)">'+esc(_pkLbl)+'</button>';
      });
    } else if(students.length===1){
      _btnHtml+='<button class="btn btn-p" onclick="_gotoSchedulingForStudent(&apos;'+esc(students[0].studentId)+'&apos;)">Submit availability for '+esc(students[0].studentName)+'</button>';
    } else {
      _btnHtml+='<button class="btn btn-p" onclick="_klGoHome()">Back to home</button>';
    }
    _btnHtml+='</div>';
    return h+_btnHtml;
  }

  // Loading submission from server — show spinner, never flash form
  if(SC.loading){
    return h+'<div style="text-align:center;padding:3rem"><span class="spin" style="font-size:20px">\u21bb</span></div>';
  }

  // VIEW MODE — returning family, not editing
  if(!SC.isFirstSubmission && !SC.editMode){
    return h+rSchedViewMode()+_rSiblingNudge();
  }

  // EDIT or FIRST SUBMISSION — full form
  return h+rSchedForm()+_rSiblingNudge();
}

function _rSiblingNudge(){
  if(!_siblingNudgeId) return '';
  var sib=null;
  for(var i=0;i<students.length;i++){ if(students[i].studentId===_siblingNudgeId){sib=students[i];break;} }
  if(!sib) return '';
  var sibFirst=sib.studentName?(sib.studentName.trim().split(' ')[0]):'your other child';
  var sibLabel=sib.studentName+(sib.instrument?' \u2014 '+sib.instrument:'');
  return '<div class="card" style="margin-top:1.25rem;border:1.5px solid var(--green)">'+
    '<div style="font-weight:600;font-size:14px;margin-bottom:.4rem">\u2713 Done! Submit for '+esc(sibLabel)+'?</div>'+
    '<p style="font-size:13px;color:var(--text3);margin-bottom:.75rem">You can also submit availability for '+esc(sibLabel)+' now, or come back any time.</p>'+
    '<button class="btn btn-p btn-sm" onclick="_siblingNudgeId=&apos;&apos;;_gotoSchedulingForStudent(&apos;'+esc(sib.studentId)+'&apos;)">Submit for '+esc(sibFirst)+(sib.instrument?' ('+esc(sib.instrument)+')':'')+'</button>'+
    '</div>';
}

  h+='<div style="padding:.35rem 0;border-bottom:.5px solid var(--border)">';

    least:'background:var(--rbg);color:var(--rt);border:1px solid var(--red)'
  };

      ?'<span style="'+prefStyles2[slot.pref]+';font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;font-family:monospace;letter-spacing:.03em;white-space:nowrap">'+prefLabel+'</span>'

// Small "Added by admin" pill, shown per-slot (not per-submission) — a slot
// keeps this tag permanently once tagged, through edits and saves, since the
// origin is tracked on the slot itself (source1-6 on AVAILABILITY_REQUESTS)
// rather than as a one-time submission-level flag.
function _adminSlotPill(){
  return ' <span style="display:inline-block;background:var(--bbg);color:var(--bt);border:1px solid var(--blue);font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px;vertical-align:middle;white-space:nowrap">Added by admin</span>';
}
// Order-independent array comparison -- used to detect whether the family's
// duration/location selections have actually changed from what they
// originally submitted (re-ordering the same set of pills shouldn't count
// as a change).
function _arraysEqualAsSets(a,b){
  if(!a||!b||a.length!==b.length) return false;
  var as=a.slice().sort(),bs=b.slice().sort();
  for(var i=0;i<as.length;i++){ if(as[i]!==bs[i]) return false; }
  return true;
}
