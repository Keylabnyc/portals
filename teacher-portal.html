// ── [1.127] — templates, in the composer where they are used and made ───
// AC, 6 September, replacing his own design of an hour earlier: "easier for
// the TEACHER to simply open a studio template and then edit in the composer.
// If edited, prompt to save as new custom template, then have teacher name the
// template. This functions like the admin comms email composer."
//
// So the picker offers EVERYTHING a teacher may use — AC's studio templates
// and their own together — and there is no filing step before using one.
// Change what you inserted and the composer offers to keep it; name it and it
// is yours. That is the only way a custom template is created, which is why
// the settings panel has no Add button any more.
var SAVED_TPLS=[], STUDIO_TPLS=[], _savedTplsLoaded=false, _savedTplsInFlight=false;
var TPL_OPEN=false;
// What was last inserted, and from where. TPL_USED.html is the yardstick: the
// offer to save appears only once the composer differs from it, so a teacher
// who inserts a template and sends it unchanged is never asked anything.
var TPL_USED=null;
// The naming step, inline. AC's comms composer uses window.prompt for this and
// this portal deliberately does not — [1.34]: a native dialog cannot be
// styled, cannot be corrected, and drops the sender out of the page they are
// writing on.
var TPL_NAMING=false, TPL_NEWNAME='';

function loadSavedTpls(){
  if(_savedTplsLoaded || _savedTplsInFlight) return;
  _savedTplsInFlight=true;
  var done=0;
  function fin(){ if(++done===2){ _savedTplsInFlight=false; _savedTplsLoaded=true; render(); } }
  api({action:'getTeacherTemplates', data:{teacherToken:TOKEN}}, function(e,r){
    SAVED_TPLS=(!e&&r&&r.ok&&r.templates)||[]; fin();
  });
  api({action:'getStudioTemplates', data:{teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    // Only the ones AC marked for teachers ever reach here — the filter is on
    // the server, so an admin-only template is not in this payload at all.
    STUDIO_TPLS=(!e&&r&&r.ok&&r.templates)||[]; fin();
  });
}
function tplToggle(){ TPL_OPEN=!TPL_OPEN; render(); }
function rTemplateRow(id){
  var mine=SAVED_TPLS||[], studio=STUDIO_TPLS||[];
  var any=mine.length+studio.length;
  var h='';
  if(any){
    h+='<button type="button" class="btn btn-s btn-tpl" onmousedown="event.preventDefault()"'+
       ' onclick="tplToggle()">'+esc(TTPL_COPY.composer)+'</button>';
  }
  if(TPL_OPEN && any){
    // Studio first, then their own. Not labelled as two lists: by the time a
    // teacher is writing a message, where a template came from is not the
    // question they are asking.
    h+='<div class="cmp-saved">'+studio.concat(mine).map(function(t){
      return '<button type="button" class="cmp-mini" onmousedown="event.preventDefault()" '+
        'title="'+esc(_ttplPreview(t.body))+'" onclick="tplUse(\''+esc(id)+'\',\''+esc(t.templateId)+'\')">'+
        esc(t.label)+'</button>';
    }).join('')+'</div>';
  }
  // The offer lives in a container that is ALWAYS drawn, empty or not, so that
  // typing can fill it without a re-render — see _tplOfferSync.
  h+=_tplUnfilledNote(id);
  h+='<div id="tpl-offer">'+_tplOfferHtml(id)+'</div>';
  return h;
}
// AC, 6 September: "The teacher needs to be able to build and save from
// scratch."
//
// So the offer is no longer tied to having inserted something. It appears on
// ANY message with words in it, which is the case that matters: the message a
// teacher writes most often is the one they never had a template for.
function _tplOfferHtml(id){
  var h='';
  if(!TPL_NAMING && _tplWorthSaving(id)){
    h+='<div class="tpl-saveas">'+
       '<button type="button" class="lnk-a" onmousedown="event.preventDefault()"'+
       ' onclick="tplSaveAsAsk()">'+esc(TTPL_COPY.saveAs)+'</button></div>';
  }
  if(TPL_NAMING){
    h+='<div class="tpl-saveas">'+
       '<span class="lnk-ask">'+esc(TTPL_COPY.namePrompt)+'</span>'+
       '<input id="tpl-newname" type="text" value="'+esc(TPL_NEWNAME)+'"'+
         ' placeholder="'+esc(TTPL_COPY.namePromptPh)+'"'+
         ' aria-label="'+esc(TTPL_COPY.namePrompt)+'"'+
         ' oninput="TPL_NEWNAME=this.value" onkeydown="tplNameKey(event,\''+esc(id)+'\')">'+
       '<button type="button" class="btn btn-p" style="font-size:12px" onclick="tplSaveAsDo(\''+esc(id)+'\')">'+
         esc(TTPL_COPY.saveAsGo)+'</button>'+
       '<button type="button" class="btn btn-s" style="font-size:12px" onclick="tplSaveAsCancel()">'+
         esc(TTPL_COPY.saveAsCancel)+'</button>'+
       '</div>';
  }
  return h;
}
// Called from _composerSync on every keystroke. A full render() cannot be used
// here — the composer is contenteditable and rebuilding it mid-word throws the
// caret to the start, which is [1.193]'s rule. So the one node that changes is
// the one that is rewritten.
//
// Without this the offer waited for the next poll: up to five seconds of
// having typed a message and been offered nothing.
function _tplOfferSync(id){
  if(TPL_NAMING) return;   // the name box is focused; do not rebuild under it
  var box=document.getElementById('tpl-offer'); if(!box) return;
  var next=_tplOfferHtml(id);
  if(box.innerHTML!==next) box.innerHTML=next;
}
// Something to keep, and not merely something already kept. Two tests, and
// both are needed:
//   • there are words in the box — an empty composer is not a template, and
//     nor is one holding only the blank line a browser leaves behind;
//   • it is not a template inserted and left exactly as it was — offering to
//     save an unchanged copy of a template they already have is noise.
function _tplWorthSaving(id){
  var el=document.getElementById(id); if(!el) return false;
  var now=_composerClean(el);
  if(!_ttplDecode(now).replace(/[\s\u00a0]/g,'')) return false;
  return !TPL_USED || now!==TPL_USED.html;
}
// ── [1.127] — merge tags ────────────────────────────────────────────────
// The SAME tag names admin's email templates have used since the beginning.
// Reused rather than invented: AC already writes these, and two vocabularies
// for one idea is how somebody types [firstName] into a template and sends a
// parent a message with a bracket in it.
//
// Resolved AT INSERT, not at send. The teacher sees the real names in the
// composer and can edit them, which is the difference between a template and a
// mail merge — [1.332] made that box worth writing in, and this fills it
// rather than bypassing it.
//
// **AN UNRESOLVED TAG IS LEFT VISIBLE.** Replacing it with a blank produces
// "Hi ," in a message to a parent, which nobody notices until it has been
// sent. A tag left as [studentFirst] is noticed immediately, in the composer,
// by the person who can fix it.
//
// The allowlist is not tidiness either: without it the lookup reaches
// Object.prototype, so a template containing [toString] would paste the source
// of a JavaScript function into somebody's message.
// The full set the SUBSTITUTION understands. It stays complete even though a
// teacher is offered only two below: a template written by admin can carry any
// of these, and a teacher using one must have it filled in rather than sent to
// a family with [instrument] still in it.
var TPL_TAGS = ['studentFirst','parentFirst','instrument','day','time','teacher'];
// ── [1.434] — the two a TEACHER is offered ───────────────────────────────
//
// AC, asked directly on 8 September 2026: student first name and parent first
// name. Not instrument, day, time or teacher — those are facts a teacher
// already knows and would be writing ABOUT, while the two names are what make
// a message read as written for that family. Admin keeps all six.
var TPL_TAGS_OFFERED = ['studentFirst','parentFirst'];
// What a person sees on the pill. "[studentFirst]" is what goes IN the text,
// and it is what the substitution matches, so it is shown as well — a teacher
// who has seen the pill can then type it.
var TPL_TAG_LABELS = {studentFirst:'Student first name', parentFirst:'Parent first name'};
function _tplFirstName(n){ return String(n||'').trim().split(/\s+/)[0]||''; }
// What this conversation actually knows. A staff thread knows almost nothing,
// and says so by resolving almost nothing.
function _tplValues(){
  var t=(HOME_TAB==='family') ? ACTIVE_THREAD : null;
  var v={ teacher:_tplFirstName(TEACHER_NAME) };
  if(!t) return v;
  v.parentFirst=_tplFirstName(t.parent1Name);
  var id=_threadStudentId(t), st=null;
  (t.students||[]).forEach(function(x){ if(x.studentId===id) st=x; });
  // No child chosen and more than one on the family: nothing is filled in
  // rather than the first being guessed at. Guessing writes another child's
  // name into a message about this one.
  if(!st && (t.students||[]).length===1) st=t.students[0];
  if(st){
    v.studentFirst=_tplFirstName(st.studentName);
    v.instrument=String(st.instrument||'').trim();
    v.day=String(st.day||'').trim();
    v.time=String(st.time||'').trim();
  }
  return v;
}
function _tplMerge(html){
  var v=_tplValues();
  return String(html||'').replace(/\[([A-Za-z]+)\]/g, function(whole, tag){
    if(TPL_TAGS.indexOf(tag)===-1) return whole;
    var val=v[tag];
    return (val===undefined || val==='') ? whole : esc(val);
  });
}
// ── [1.454] — the gate, and it is the half that matters ──────────────────
//
// **Merging is not enough on its own.** _tplMerge deliberately LEAVES a tag it
// cannot fill ([1.351]: "Hi ," is not noticed until it has been sent, and
// "[parentFirst]" is noticed at once) — and that rule is right for a composer
// and catastrophic for a send. Left alone, an unfillable tag now goes to a
// family instead of an empty space.
//
// So a send REFUSES while a known tag survives the merge, and says which. The
// only case in practice is a family with more than one child this teacher
// teaches and no child picked — which is fixable in one press, on the row
// directly above the composer.
function _tplUnfilledTags(html){
  var out=[], seen={};
  String(html||'').replace(/\[([A-Za-z]+)\]/g, function(whole, tag){
    if(TPL_TAGS.indexOf(tag)>-1 && !seen[tag]){ seen[tag]=1; out.push(tag); }
    return whole;
  });
  return out;
}
// ── [1.351] — when a placeholder cannot fill itself, say why ─────────────
//
// A tag is deliberately left VISIBLE when there is nothing to put in it: "Hi
// ," in a message to a parent is not noticed until it has been sent, and
// "[parentFirst]" is noticed at once. What was missing is the next sentence.
//
// It happens for one reason in practice — a family with more than one child
// this teacher teaches, and no child picked yet. The fix for it is already on
// screen: the About row directly above the composer. A teacher who has not
// connected the two sees a template that "did not work".
//
// Only while the composer actually holds an unfilled child tag, and only where
// picking a child is possible. It goes the moment they pick one.
function _tplUnfilledNote(id){
  var el=document.getElementById(id); if(!el) return '';
  var kids=(ACTIVE_THREAD&&ACTIVE_THREAD.students)||[];
  if(kids.length<2) return '';
  if(_threadStudentId(ACTIVE_THREAD)) return '';
  var html=el.innerHTML||'';
  var open=['studentFirst','instrument','day','time'].some(function(tag){
    return html.indexOf('['+tag+']')!==-1;
  });
  if(!open) return '';
  return '<div class="tpl-unfilled">'+esc(TTPL_COPY.unfilled)+'</div>';
}

function tplUse(id, templateId){
  var t=null;
  (STUDIO_TPLS||[]).concat(SAVED_TPLS||[]).forEach(function(x){ if(x.templateId===templateId) t=x; });
  if(!t) return;
  var el=document.getElementById(id); if(!el) return;
  var body=_tplMerge(t.body);   // names filled in from this conversation
  el.focus();
  try{ document.execCommand('insertHTML', false, body); }
  catch(e){ el.innerHTML = el.innerHTML + body; }
  TPL_OPEN=false;
  _composerSync(id);
  // The yardstick is what the box holds NOW, after the insert — so a teacher's
  // own words written before it do not count as an edit of the template.
  // The SOURCE body is kept alongside what was inserted, and it is what makes
  // saving an edited template worth anything — see _tplUnmerge.
  TPL_USED={templateId:templateId, html:_composerClean(el), source:t.body};
  TPL_NAMING=false; TPL_NEWNAME='';
  render();
}
// PUTS THE TAGS BACK before a template is stored, and without it this whole
// feature quietly does the wrong thing.
//
// Found by running the flow rather than reading it: a teacher opens "Hi
// [parentFirst], running late for [studentFirst]", the composer shows "Hi Amy,
// running late for Mia", they add a line and save it — and the template they
// have just kept greets every family for the rest of the year as Amy, about a
// child called Mia. It looked right at every step.
//
// So the substitution is reversed on the way out. Only the tags the ORIGINAL
// template used are reversed: a teacher who happens to type their own name in
// a message they are saving should not find it turned into [teacher].
// sourceBody is the template this message was started from, and it narrows the
// job: only the tags THAT template used are put back, so a teacher who types
// their own name into a message does not find it turned into [teacher].
//
// **A from-scratch save has no source, and then every tag is eligible.** That
// is not a fallback, it is the only thing that can work: a teacher writing
// "Hi Amy, Mia played beautifully" and keeping it has told us nothing about
// which words were the names, and storing it as typed would greet every family
// for the rest of the year as Amy. The cost of the wider sweep is a word that
// happens to match — "piano", or a Tuesday that was not the lesson day —
// becoming a placeholder, which resolves back to the same word for that family
// and is visible in the composer before anything is sent. Wrong-but-visible
// against wrong-and-silent is not a close call.
function _tplUnmerge(html, sourceBody){
  var v=_tplValues(), out=String(html||'');
  var all=(sourceBody===null || sourceBody===undefined || sourceBody==='');
  TPL_TAGS.forEach(function(tag){
    // Only if the template it came from actually used this tag.
    if(!all && String(sourceBody).indexOf('['+tag+']')===-1) return;
    var val=v[tag];
    if(val===undefined || val==='') return;
    // Escaped the same way it was inserted, so what is matched is what is
    // really in the box.
    var needle=esc(val);
    if(!needle) return;
    out=out.split(needle).join('['+tag+']');
  });
  return out;
}
function tplSaveAsAsk(){
  TPL_NAMING=true;
  // Offer the name it came from as a starting point — most saves are "this
  // one, but how I actually say it".
  var src=null;
  (STUDIO_TPLS||[]).concat(SAVED_TPLS||[]).forEach(function(x){ if(TPL_USED && x.templateId===TPL_USED.templateId) src=x; });
  TPL_NEWNAME=src?String(src.label||''):'';
  render();
  var box=document.getElementById('tpl-newname');
  if(box){ box.focus(); try{ box.select(); }catch(e){} }
}
function tplSaveAsCancel(){ TPL_NAMING=false; TPL_NEWNAME=''; render(); }
function tplNameKey(e,id){
  if(e.key==='Enter'){ e.preventDefault(); tplSaveAsDo(id); }
  else if(e.key==='Escape'){ e.preventDefault(); tplSaveAsCancel(); }
}
function tplSaveAsDo(id){
  var name=String(TPL_NEWNAME||'').trim();
  if(!name){ var b=document.getElementById('tpl-newname'); if(b) b.focus(); return; }
  var el=document.getElementById(id); if(!el) return;
  // The tags go back in, or the template would greet every family by this
  // one's name — see _tplUnmerge.
  // null when they wrote this themselves — every tag is eligible then.
  var live=_composerClean(el);
  var body=_tplUnmerge(live, TPL_USED ? TPL_USED.source : null);
  // Appended to what they already have and saved whole — the same endpoint the
  // settings panel uses, so there is one way a teacher's library is written.
  var next=(SAVED_TPLS||[]).map(function(t){ return {templateId:t.templateId, label:t.label, body:t.body}; })
    .concat([{templateId:'', label:name, body:body}]);
  api({action:'saveTeacherTemplates', data:{teacherToken:TOKEN, templates:next}}, function(e,r){
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not save that template.','e'); return; }
    TPL_NAMING=false; TPL_NEWNAME='';
    // What is in the box is now a template they HAVE, so it becomes the new
    // yardstick and the offer goes.
    //
    // Set to null first, and running it showed the fault at once: the offer
    // came straight back on a message that had just been saved, inviting a
    // second copy of it. There is no templateId yet — the sheet has not
    // answered — and none is needed: it is only used to prefill the name box,
    // which a save that has just happened does not need.
    TPL_USED={templateId:'', html:live, source:body};
    SAVED_TPLS=[]; _savedTplsLoaded=false; _savedTplsInFlight=false; loadSavedTpls();
    TSET.tpls=null;   // the settings panel's copy, stale the moment this saves
    showMsg(TTPL_COPY.savedToast,'s');
    render();
  });
}


// [1.338] — the teacher's own library, NOT AC's. This line is the reversal:
// [1.324] pointed it at getMessageLinks two days ago, and AC settled it on

// Teachers keep teacher links." getMessageLinks is admin-only now and would

function _linkApi(cb){ api({action:'getTeacherLinks', data:{teacherToken:TOKEN}}, function(e,r){ cb(e||!r||!r.ok?[]:(r.links||[])); }); }
// [1.328] — the same one back control the family portal builds, for the same
// reason. AC, 5 September: "Back link on every portal should be a button, not
// text link." This file's two thread Backs were already buttons and its "Back
// to Sign In" was a .lnk-btn pill; they are one thing now, so the next one

function rBackBtn(label, onclick){
  return '<button type="button" class="btn btn-s kl-backbtn" onclick="'+onclick+'">'+
    '\u2190 '+esc(label)+'</button>';
}

function _cmpLinkState(id){
  if(!_cmpLink[id]) _cmpLink[id]={open:false,url:'',text:'',bad:false};
  return _cmpLink[id];
}

function _composerLinkOpen(id){
  var row=document.getElementById(id+'-linkrow'); if(!row) return;
  loadSavedLinks();   // [1.333] — already warm; this is the fallback, not the fetch
  var sel=window.getSelection();
  var el=document.getElementById(id);
  // [1.332] — TEXT OFFSETS, not a Range. A Range points at nodes, and the 5s
  // poll rebuilds the box, so the highlight was silently lost whenever a tick
  // landed between pressing Link and pressing Add link: the link then landed
  // at the end of the message instead of over the highlighted words. Sixth
  // instance of [1.32]'s trap, and the last one that stores a live node.
  var _here=el?_cmpOffsets(el):null; if(_here) _cmpLinkSel[id]=_here;   // keep the remembered spot if the box is not focused
  var st=_cmpLinkState(id);
  st.open=true; st.url=''; st.bad=false;
  // Pre-fill the link text with whatever is selected, so highlighting a phrase
  // and pressing Link does the obvious thing.
  st.text=(sel && !sel.isCollapsed && el && el.contains(sel.anchorNode)) ? String(sel).trim() : '';
  var t=document.getElementById(id+'-linktext');
  var u=document.getElementById(id+'-linkurl');
  if(t) t.value=st.text;
  if(u){ u.value=''; u.classList.remove('bad'); u.placeholder=CMP_COPY.linkUrlPlaceholder; }
  row.classList.add('open');
  if(u) u.focus();
}

function _composerLinkKey(ev,id){
  if(ev.key==='Enter'){ ev.preventDefault(); _composerLinkInsert(id); }
  if(ev.key==='Escape'){ ev.preventDefault(); pickClose(id); }   // [1.494] — Escape is Edit Message
}

// AC, 28 Aug: site.com, www.site.com, https://www.site.com and https://site.com
// must all work. So https:// is PREPENDED when absent rather than demanded.
// Being lenient here is safe -- this file is not the security boundary.
// _sanitizeMessageHtml_() in Code.js re-checks every href server-side and
// assumes this file was bypassed, because it can be. Strictness here buys
// nothing and costs teachers working links.
function _composerNormalizeUrl(raw){
  var u=String(raw||'').trim();
  if(!u) return '';
  if(/[\s"'<>\\]/.test(u)) return '';          // spaces or quotes: not an address
  if(/^mailto:/i.test(u)) return u;
  if(!/^https?:\/\//i.test(u)){
    // Any other scheme (javascript:, data:, file:) is refused outright rather
    // than having https:// glued in front of it.
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    u='https://'+u;
  }
  // Must have a dot somewhere in the host, or "https://notes" would pass.
  var host=u.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0];
  if(host.indexOf('.')===-1) return '';
  return u;
}

function _composerLinkInsert(id){
  var el=document.getElementById(id); if(!el) return;
  var uIn=document.getElementById(id+'-linkurl');
  var tIn=document.getElementById(id+'-linktext');
  var url=_composerNormalizeUrl(uIn?uIn.value:'');
  if(!url){
    // Corrected in place instead of thrown as a page-level toast -- the error
    // belongs next to the field that caused it.
    var stBad=_cmpLinkState(id); stBad.bad=true; stBad.url='';
    if(uIn){ uIn.classList.add('bad'); uIn.value=''; uIn.placeholder=CMP_COPY.linkRejected; uIn.focus(); }
    return;
  }
  var label=(tIn && tIn.value.trim()) || url.replace(/^https?:\/\//i,'');
  _composerInsertLink(id, url, label);
  // [1.494] — the picker stays open for the next link; the fields clear.
  var st=_cmpLinkState(id); st.url=''; st.text=''; st.bad=false;
  if(LINK_SELECTED){ LINK_ADDED[LINK_SELECTED]=true; LINK_SELECTED=''; }   // the saved link that filled the fields is now in the message
  render();
}
// [1.471] — ONE insertion, used by the Link box and by a link picked from the
// library. Two copies of an execCommand that writes an anchor into a message is
// how the two end up producing different markup for the same act — and the
// server's allowlist judges the markup, not the button that made it.
function _composerInsertLink(id, url, label){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  var saved=_cmpLinkSel[id];
  _cmpRestore(el,saved);   // no memory at all means the END of the message, never the start
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(label)+'</a>&nbsp;');
  _composerSync(id);
  _cmpRemember(id);   // the next link goes after this one, like typing
}

// ── Toolbar active state ───────────────────────────────────────────────────
// Nothing reflected back before this, so a teacher had to type a letter to
// find out whether bold was on. queryCommandState covers the inline and list
// commands; blockquote has no state to query, so it is resolved from the DOM.
var _CMP_STATE_CMDS=['bold','italic','underline','insertUnorderedList','insertOrderedList'];

// AC, 11 September 2026: "The link needs to be added directly where the
// cursor currently is in the message, just like gmail." The caret was saved
// once, when Add link was pressed, used once and forgotten — so a second link
// landed at the START of the message. Now every keyup, mouseup and blur in
// the box remembers where the caret is, an insert re-remembers the spot just
// after what it inserted, and nothing ever forgets it.
function _cmpRemember(id){
  var el=document.getElementById(id); if(!el) return;
  var o=_cmpOffsets(el);   // null when the selection is not in the box — then the last known spot stands
  if(o) _cmpLinkSel[id]=o;
}
function _composerState(id){
  var el=document.getElementById(id); if(!el) return;
  _cmpRemember(id);
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  _CMP_STATE_CMDS.forEach(function(c){
    var b=wrap.querySelector('[data-cmd="'+c+'"]'); if(!b) return;
    var on=false;
    try{ on=document.queryCommandState(c); }catch(e){}
    // queryCommandState('underline') is TRUE for ANY selection inside a link,
    // because a link RENDERS underlined -- verified in the browser, not
    // guessed. Left alone, the Underline button lights up on its own the
    // moment a teacher clicks into a link they just added, claiming
    // formatting they never applied. Inside a link, ask the DOM instead.
    //
    // Resolved from the selection's anchor, which covers every selection a
    // person can actually make -- a click, a drag, or Ctrl+A all anchor on a
    // text node. It does NOT cover a programmatic selectNodeContents() of the
    // whole box, where the anchor is the composer div itself and there is no
    // link ancestor to find; nothing in the UI produces that.
    if(c==='underline' && on && _composerSelIn(id,'a')) on=_composerSelIn(id,'u');
    b.classList.toggle('on',!!on);
  });
}

function _composerStateClear(id){
  var el=document.getElementById(id); if(!el) return;
  _cmpRemember(id);   // blur: the caret as it was when the teacher reached for a picker
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  var btns=wrap.querySelectorAll('.cmp-tb-btn.on');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
}

// Button labels reuse the wording already live in admin's Comms toolbar so the
// two tools read the same. The link strings were rewritten 28 Aug on AC's
// steer: the old prompt demanded a full https:// address, which is not how
// anyone types one.
//
// linkSharing is AC's substance, drafted here and still awaiting his pass:
// teachers set a file to "anyone with the link", or keep it private and ask
// admin for the parent's email. (AC, 28 Aug -- a central Keylab hub for

function _tbBtn(id,cmd,label,title){
  // onmousedown/preventDefault keeps the text selection alive when the button
  // takes the click — without it, execCommand has nothing to act on.
  // data-cmd is what _composerState() reads to light the button up.
  return '<button type="button" class="cmp-tb-btn" data-cmd="'+cmd+'" title="'+esc(title)+'" onmousedown="event.preventDefault()"'+
    ' onclick="_composerCmd(\''+id+'\',\''+cmd+'\')">'+label+'</button>';
}

// The toolbar now carries everything _sanitizeMessageHtml_() accepts and
// nothing it doesn't (AC, 28 Aug: "as much formatting control and function as
// possible"). Italic, underline, quote and clear-formatting were added then.
// The first three were already reachable by PASTING -- _composerClean()
// promotes pasted <i>/<u> and styled spans -- so a teacher could receive that
// formatting into a message but had no button to produce it.
//
// Adding a control the server would strip is the mistake to avoid here, so
// this list and MSG_ALLOWED_TAGS in Code.js have to stay in step. That is why
// admin's colour, font-size, alignment, image and divider buttons are absent
// and must stay absent: every one of them is dropped server-side.
//
// Grouped with dividers -- emphasis, structure, link, reset -- so the row reads
// as four decisions rather than ten buttons.
//
// [1.332], AC 5 September 2026: "there are some functions like a ❝ button that
// doesn't seem to do anything but indent. The teacher doesn't need that."
// **He was describing three buttons, not one.** Driven in a real browser, ❝
// Quote and ⇥ Indent turn out to be the SAME action on a plain line -- both
// emit a blockquote -- and Chromium draws that block as a bare 40px margin with
// no bar, while the family receives a real quote bar once the inline style is
// stripped on the way out. So the sender could not see what the family read.
// ❝, ⇥ and ⇤ all came off. Indenting is now Tab and Shift+Tab, inside a
// list, which is the only indenting this tool has ever needed and is what every
// mail client does. blockquote stays on the allowlist: a pasted quote still
// keeps its bar, and the server still accepts one.
function rComposerToolbar(id){
  return '<div class="cmp-tb">'+
    _tbBtn(id,'bold','<b>B</b>',CMP_COPY.bold)+
    _tbBtn(id,'italic','<i>I</i>',CMP_COPY.italic)+
    _tbBtn(id,'underline','<u>U</u>',CMP_COPY.underline)+
    '<span class="cmp-div"></span>'+
    _tbBtn(id,'insertUnorderedList','• List',CMP_COPY.bullet)+
    _tbBtn(id,'insertOrderedList','1. List',CMP_COPY.number)+
    '<span class="cmp-div"></span>'+
    // [1.494] — the Link button moved off this row to Add link beside Send,
    // so the toolbar is formatting only: one control per job.
    '<button type="button" class="cmp-tb-btn" title="'+esc(CMP_COPY.clear)+'" onmousedown="event.preventDefault()"'+
      ' onclick="_composerClearFmt(\''+id+'\')">✕</button>'+
    // ── [1.434] — the merge tags, on the toolbar where a message is WRITTEN ──
    //
    // AC, 8 September 2026: "merge tags need to be typed in and can't be
    // selected. Merge tags pills are already in the code and should be
    // available for teachers too."
    //
    // They were in the template editor and nowhere else, so writing an
    // ordinary message meant typing [studentFirst] from memory — which is not
    // a thing to ask of anybody, and is the same reasoning the template
    // editor's own pills were added for.
    //
    // Only in a FAMILY thread: there is no student and no parent in a staff
    // conversation, so the tags would insert something that can never fill in.
    (HOME_TAB==='family' && id==='family-composer'
      ? '<span class="cmp-div"></span>'+TPL_TAGS_OFFERED.map(function(tag){
          return '<button type="button" class="cmp-tb-btn cmp-tag" onmousedown="event.preventDefault()"'+
            ' title="'+esc(TPL_TAG_LABELS[tag]||tag)+'"'+
            ' onclick="_composerInsertTag(\''+id+'\',\''+tag+'\')">['+esc(tag)+']</button>';
        }).join('')
      : '')+
  '</div>';
}

  var el=document.getElementById(id); if(!el) return;
  el.focus();
  var txt='['+tag+']';
  var placed=false;
  try{ placed=document.execCommand('insertText', false, txt); }catch(e){ placed=false; }
  if(!placed) el.appendChild(document.createTextNode(txt));
  _composerSync(id);
}

// ── [1.277] — attachments, teacher side ─────────────────────────────────
// Staff attach; families receive and open (AC, 5 September). Nothing here ever
// sees a Drive link: a tile asks the server for an attachment id and the
// server decides, from the conversation the file was sent to, whether to
// answer. That is the whole point of the design and it is why there is a fetch
// where a plain <img src> would have been simpler.
//
// A thread draws THUMBNAILS — a few kilobytes each, cached by id for the life
// of the page — and the file itself is fetched only when somebody taps it. The
// 5-second poll rebuilds this page constantly ([1.193]), so anything fetched
// per render would be fetched every five seconds; the cache is what makes the
// tiles free after the first time.
var ATT_THUMBS = {};        // attachmentId -> data: URI, '' while in flight, false if there is none
var ATT_PENDING = [];       // uploaded but not yet sent — the chips under the composer
var ATT_BUSY = 0;           // uploads in flight, so Send can wait for them
var ATT_MAX_BYTES = 10*1024*1024;
// Ten files to a message (AC, 6 September). The server drops anything past
// this when the send claims them; refusing here as well is the courtesy —
// a teacher finds out when they pick the eleventh, not when it vanishes.
var ATT_MAX_FILES = 10;

// The label on a non-image tile, taken from the FILE'S OWN NAME.
//
// It was the literal string 'PDF' until AC asked for text formats on
// 6 September, at which point every Word document in the tool would have been
// drawn as a PDF — a tile that lies about what it is holding, on the one
// screen where a parent decides whether to bother opening it. Derived, it
// cannot be wrong: the server has already forced the extension to agree with
// the bytes it verified (_attachSafeName_), so the name is trustworthy here in
// a way a client-supplied name normally would not be.
function _attKind(name){
  var ext=String(name||'').split('.').pop().toUpperCase();
  return (ext && ext.length<=4) ? ext : 'FILE';
}
function _attSize(n){
  n=Number(n)||0;
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return Math.round(n/1024)+' KB';
  return (Math.round(n/104857.6)/10)+' MB';
}
// Fetched once per attachment per page. A miss schedules the request and
// returns nothing to draw; when it lands, render() puts it on screen.
function _attThumb(id){
  if(ATT_THUMBS.hasOwnProperty(id)) return ATT_THUMBS[id];
  ATT_THUMBS[id]='';
  api({action:'getAttachment', data:{attachmentId:id, thumb:true, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(!e && r && r.ok && r.dataBase64){
      ATT_THUMBS[id]='data:'+(r.mimeType||'image/png')+';base64,'+r.dataBase64;
      render(); return;
    }
    // [1.384] — tell "there is no thumbnail for this file" apart from "that
    // request failed". Drive genuinely makes none for some types and says so
    // with none:true; caching a FAILURE as though it were that answer left a
    // plain tile for the life of the page, with a reload the only way back. A
    // failure forgets, so the next render asks again.
    if(!e && r && r.ok){ ATT_THUMBS[id]=false; render(); return; }
    delete ATT_THUMBS[id];
  });
  return '';
}
function rAttachments(m){
  var list=m.attachments||[];
  if(!list.length) return '';
  return '<div class="att-strip">'+list.map(function(a){
    var thumb=_attThumb(a.attachmentId);
    var art = thumb
      ? '<img class="att-thumb" src="'+esc(thumb)+'" alt="">'
      : (ATT_THUMBS.hasOwnProperty(a.attachmentId) && ATT_THUMBS[a.attachmentId]===''
          // [1.401] — in flight, not "there isn't one".
          ? '<span class="att-glyph loading"><span class="spin">&#8635;</span></span>'
          : '<span class="att-glyph">'+esc(_attKind(a.fileName))+'</span>');
    // [1.417] — the state of THIS tile, on THIS tile. The size line is the
    // right place for it: it is already the tile's second line, so nothing
    // moves and nothing is added to a thread that may hold several files.
    var _st=ACT['att:'+a.attachmentId];
    var _cls=_st?(_st.state==='failed'?' att-bad':(_st.state==='working'?' att-busy':'')):'';
    var _foot=_st&&_st.state==='working'
        ? '<span class="spin">\u21bb</span> '+esc(_st.text||'')
        : (_st&&_st.state==='failed' ? esc(_st.text||'') : esc(_attSize(a.sizeBytes)));
    // [1.417] — the tile does the LIKELY thing for this type in one tap, and
    // Download sits beside it only when the tile views. A file a browser
    // cannot render has no pair: its tile downloads, and offering View on it
    // would be offering a choice that is not one.
    var _canView=_attCanView(a.mimeType, a.fileName);
    var _tile='<button type="button" class="att-tile'+_cls+'" title="'+esc(a.fileName)+'"'+
      (_st&&_st.state==='working'?' disabled':'')+
      ' onclick="event.stopPropagation();openAttachment(\''+esc(a.attachmentId)+'\',\''+
        (_canView?'view':'download')+'\')">'+
      art+
      '<span class="att-meta"><span class="att-name">'+esc(a.fileName)+'</span>'+
      '<span class="att-size">'+_foot+'</span></span></button>';
    // [1.417] — a tab the browser blocked leaves the file in hand, so the
    // offer to save it is instant and costs no second request. It replaces
    // the Download control while it is there: two buttons doing the same
    // thing, one of them slower, is a choice nobody should have to make.
    if(ATT_HELD[a.attachmentId]){
      return '<span class="att-wrap">'+_tile+
        '<button type="button" class="att-dl" onclick="event.stopPropagation();'+
          '_attSaveHeld(\''+esc(a.attachmentId)+'\')">'+esc(TCH_COPY.attachDownloadHeld)+'</button></span>';
    }
    // [1.465] — and Save to Library, on any file in a thread. **A teacher may
    // keep what a family sent them**: AC overturned my rule against it and was
    // right — they can already download it, so refusing only pushed the file
    // out of the tool where the studio cannot see it at all.
    var _keep=rLibSave(a.attachmentId)+rAct('lib:'+a.attachmentId);
    if(!_canView) return '<span class="att-wrap">'+_tile+_keep+'</span>';
    return '<span class="att-wrap">'+_tile+
      '<button type="button" class="att-dl" title="'+esc(TCH_COPY.attachDownload)+'"'+
        (_st&&_st.state==='working'?' disabled':'')+
        ' onclick="event.stopPropagation();openAttachment(\''+esc(a.attachmentId)+'\',\'download\')">'+
        esc(TCH_COPY.attachDownload)+'</button>'+_keep+'</span>';
  }).join('')+'</div>';
}
// The slow path, and a deliberate act: the whole file, base64, through the
// same authenticated request everything else uses. A blob URL rather than a
// data: URI so a 10MB PDF is not put through the address bar.
function openAttachment(id, mode){
  // [1.417] — keyed by the file, so two tiles pressed in a row cannot show
  // each other's state, and drawn by the tile itself rather than by a toast
  // in the corner. [1.404]'s mechanism, on the action it was never applied to.
  if(actBusy('att:'+id)) return;
  actStart('att:'+id, TCH_COPY.attachOpening);
  // [1.504] — a save needs the BYTES; a cross-origin link cannot download.
  api({action:'getAttachment', data:{attachmentId:id, wantBytes:(mode==='download'), teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    // [1.463] — a LINK is the fast answer and the bytes are the fallback, so
    // the client has to accept either. The link is opened by exactly the same
    // two lines a blob is ([1.417]'s view/download), so a phone behaves as it
    // already does and the held-file offer still applies.
    if(!e && r && r.ok && r.url){
      actClear('att:'+id);
      _attOpenUrl_(r.url, r.fileName, id, mode);
      return;
    }
    if(e||!r||!r.ok||!r.dataBase64){
      actFail('att:'+id,(r&&r.error)||TCH_COPY.attachOpenFailed); render(); return;
    }
    // Cleared, not marked done: the file opening IS the confirmation, and a
    // tick on the tile underneath a newly opened tab is talking to nobody.
    actClear('att:'+id);
    _attOpenBlob(r.dataBase64, r.mimeType, r.fileName, id, mode);
  });
}
// Shared by all three portals, and the base64 is decoded in chunks: a single
// atob over ten megabytes builds a ten-million-character string and then a
// ten-million-element array, which is what makes a phone drop the tab.

// ── [1.417] — what a browser can actually SHOW ───────────────────────────
//
// AC, 9 September 2026: *"agreed for files that can't be previewed download
// only."* So the tool has to know which is which, and be honest about it: a
// View that downloads is the invisible decision this item exists to remove,
// wearing a label.
//
// **Previewable:** images, PDF, plain text, and audio — a browser tab plays
// any audio type with its own controls, which for a music school is a real
// preview and not a technicality.
//
// **Not:** RTF, DOC and DOCX. A browser cannot render any of them; offering
// View would be offering a choice that is not one.
//
// **HEIC is the honest edge case and it is deliberate.** Safari renders it,
// Chrome and Firefox do not — and it is what every iPhone produces without
// being asked, so it is the format a parent is most likely to send AND to
// receive. Treated as previewable: on the iPhones this mostly concerns it
// opens, and where it does not the browser offers to save it, which is a
// degraded view rather than the wrong action. Excluding it would penalise the
// common case here to be tidy about the rare one.

// ── [1.417] — a blocked tab keeps the file in hand ───────────────────────
//
// AC, 9 September 2026, on being told the message would say "try Download":
// *"If the file downloaded already, why 'try download'?"*
//
// **He was right and the wording was covering for the design.** When a tab is
// blocked, the file's BYTES have already come down — the whole slow part is
// done — but nothing opened and nothing was saved. Sending the reader to the
// Download button would fetch the identical file a second time and make them
// wait again for something already sitting in memory.
//
// So the blob is KEPT, and the failed tile offers to save it from what is
// already there. Instant, and no second request.
//
// **Not saved automatically**, which was the other option and is the bug AC
// reported in the first place: the tool deciding between looking and saving on
// his behalf, invisibly. The reader asked to view it; if that cannot happen
// they are told, and the save is theirs to press.
var ATT_HELD = {};   // attachmentId -> {url, fileName}
function _attHoldBlob(id, url, fileName){
  if(!id) return;
  ATT_HELD[id]={url:url, fileName:fileName||'attachment'};
}
function _attSaveHeld(id){
  var held=ATT_HELD[id]; if(!held) return;
  var a=document.createElement('a');
  a.href=held.url; a.download=held.fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  // The offer is spent: the file is on their device and the red tile has
  // nothing left to say. Its state goes with it.
  delete ATT_HELD[id];
  // The blob outlived its 60-second sweep because it was held; now that the
  // file is on their device, the memory goes back.
  setTimeout(function(){ try{ URL.revokeObjectURL(held.url); }catch(e){} }, 5000);
  actClear('att:'+id);
  render();
}


// ── [1.463] — opening an ADDRESS, which is the fast path ─────────────────
//
// A link and a blob are opened the same two ways ([1.417]): View is a new tab,
// Download is an anchor. The difference is that there is nothing to wait for
// and nothing to hold — the browser fetches it from Drive itself.
//
// **A blocked tab is handled the same way too**, and it is simpler here: the
// address does not expire the way a blob does, so there is nothing to keep
// alive and nothing to sweep. The reader is told, and the Download control
// beside the tile does the other thing.
function _attOpenUrl_(url, fileName, id, mode){
  if(mode==='download'){
    var dl=document.createElement('a');
    dl.href=url; dl.download=fileName||'attachment';
    // [1.504] — a cross-origin `download` attribute is IGNORED, which made
    // Download identical to opening. A save now asks for the BYTES
    // (`wantBytes`) and writes a blob; this is only the last resort for a
    // server that hands back a link anyway.
    dl.target='_blank'; dl.rel='noopener';
    document.body.appendChild(dl); dl.click(); document.body.removeChild(dl);
    return;
  }
  var w=window.open(url,'_blank');
  if(!w && id){ actFail('att:'+id, TCH_COPY.attachPopupBlocked); render(); }
}

function _attCanView(mimeType, fileName){
  var m=String(mimeType||'').toLowerCase();
  if(m.indexOf('image/')===0) return true;
  if(m.indexOf('audio/')===0) return true;
  if(m==='application/pdf') return true;
  if(m==='text/plain') return true;
  // A row written before mimeType was stored, or a browser that sent nothing:
  // fall back to the extension rather than calling everything undownloadable.
  if(!m){
    var ext=String(fileName||'').toLowerCase().split('.').pop();
    return ['jpg','jpeg','png','gif','webp','heic','heif','pdf','txt',
            'mp3','m4a','wav','aac','ogg'].indexOf(ext)>-1;
  }
  return false;
}

function _attOpenBlob(b64, mimeType, fileName, id, mode){
  try{
    var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
    for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([bytes],{type:mimeType||'application/octet-stream'}));
    // ── [1.417] — the reader chose, so do what they chose ─────────────────
    //
    // This used to try window.open and, when the pop-up was blocked — the
    // COMMON case on a phone — fall back to an anchor with `download` set. So
    // the tool decided between viewing and saving on the reader's behalf, and
    // the decision was invisible: AC saw "the file is downloading" and had
    // asked for neither. **That fallback is what this replaces.**
    //
    // Download is an anchor with `download`; View is a new tab. A blocked
    // pop-up on the VIEW path is still possible, and it now says so on the
    // tile rather than quietly saving a file instead — the reader asked to
    // look at it, and silently doing something else is the fault itself.
    if(mode==='download'){
      var dl=document.createElement('a');
      dl.href=url; dl.download=fileName||'attachment';
      document.body.appendChild(dl); dl.click(); document.body.removeChild(dl);
    } else {
      var w2=window.open(url,'_blank');
      if(!w2 && id){ _attHoldBlob(id, url, fileName); actFail('att:'+id, TCH_COPY.attachPopupBlocked); render(); }
    }
    // Long enough for the new tab to have taken the bytes, then the memory
    // goes back. Without this every file opened stays in the page until it is
    // reloaded.
    // [1.417] — NOT while the file is being held for a blocked tab. The blob
    // is the whole point of that offer: revoked underneath it, "Download file"
    // would click an anchor pointing at nothing and fail silently, which is
    // worse than never offering it. Held blobs are revoked when the save is
    // taken, in _attSaveHeld.
    setTimeout(function(){
      if(id && ATT_HELD[id]) return;
      try{ URL.revokeObjectURL(url); }catch(e){}
    }, 60000);
  }catch(e){ if(id){ actFail('att:'+id, TCH_COPY.attachOpenFailed); render(); } }
}

// ── Attaching ───────────────────────────────────────────────────────────
// The file goes up WHILE the teacher is still typing, and Send then carries an
// id rather than ten megabytes. That is what keeps [1.43]'s "click send, see
// the message" true with a file attached — a 10MB upload riding along with the
// send would have made every message with a photo take ten seconds.
function attachPick(){
  var el=document.getElementById('att-file');
  if(el) el.click();
}
function attachChosen(input){
  var files=input && input.files ? Array.prototype.slice.call(input.files) : [];
  input.value='';   // so choosing the same file twice in a row still fires
  files.forEach(attachUpload);
}
function attachUpload(file){
  if(ATT_PENDING.length >= ATT_MAX_FILES){ showMsg(TCH_COPY.attachTooMany,'e'); return; }
  // Refused on the client too, so a teacher who picks a 40MB video is told at
  // once instead of after a minute of uploading. The server refuses it as well
  // — that is the rule; this is the courtesy.
  if(file.size > ATT_MAX_BYTES){ showMsg(TCH_COPY.attachTooBig,'e'); return; }
  var rec={tempId:'t'+Date.now()+Math.random(), fileName:file.name, mimeType:file.type,
           sizeBytes:file.size, uploading:true, attachmentId:''};
  ATT_PENDING.push(rec); ATT_BUSY++; render();
  var reader=new FileReader();
  reader.onerror=function(){ _attFail(rec,'That file could not be read.'); };
  reader.onload=function(){
    var b64=String(reader.result||'');
    b64=b64.slice(b64.indexOf(',')+1);   // strip the data: prefix
    api({action:'uploadAttachment', data:{fileName:file.name, mimeType:file.type,
         dataBase64:b64, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
      if(e||!r||!r.ok||!r.attachment){ _attFail(rec,(r&&r.error)||'That file could not be attached.'); return; }
      rec.uploading=false;
      rec.attachmentId=r.attachment.attachmentId;
      rec.fileName=r.attachment.fileName;   // the server cleans the name; show what it stored
      ATT_BUSY--; render();
    });
  };
  reader.readAsDataURL(file);
}
// [1.402] — a failed file STAYS, marked. AC's blocked-send copy says "remove
// file and reattach", which needs something to remove; and a teacher with
// several files needs to see WHICH one failed. See the family portal's twin.
function _attFail(rec, msg){
  rec.uploading=false;
  rec.failed=true;
  rec.error=msg||TCH_COPY.attachFailed;

// ── [1.276] — one merge for every poll in this file ─────────────────────
// Three things can come back from a poll now, not one: messages that arrived,
// messages that were EDITED (same id, same sentAt, different words) and
// messages that were UNSENT (an id and nothing else). The old shape handled
// only the first, and its duplication guard — drop anything whose id we
// already hold, which is [1.43]'s and is still exactly right for a resend —
// is precisely what would swallow an edit.
//
// So the guard moves inside one function that knows the difference, and both
// poll sites call it. Two copies of this, in two branches of _pollTick, is how
// an edit lands in the family tab and not the staff one.
// [1.371] — the scheduled half of a poll, and it is a REPLACEMENT rather than
// a merge. The server sends the whole list for this thread every time it does
// a real read, because the four things that change it — scheduling, editing,
// cancelling, releasing — are four different shapes and a release is both an
// add and a remove of the same row. Replacing says all of that in one line.
//
// A poll with no news omits the key entirely, which is why this tests for
// undefined rather than for length: an absent key means "nothing changed", and
// treating it as an empty list would make every quiet tick wipe the bubbles
// off a teacher's open thread.
function _applySchedPoll(t, r){
  if(!r || typeof r.scheduled === 'undefined') return false;
  var before=(t.scheduled||[]).map(function(m){ return m.messageId+':'+m.sendAt+':'+(m.messageText||''); }).join('|');
  var after=(r.scheduled||[]).map(function(m){ return m.messageId+':'+m.sendAt+':'+(m.messageText||''); }).join('|');
  if(before===after) return false;
  t.scheduled=r.scheduled||[];
  return true;
}
function _applyPoll(list, r){
  var gone={};
  ((r&&r.retracted)||[]).forEach(function(id){ if(id) gone[id]=true; });
  var out=[], at={}, added=0, changed=false;
  (list||[]).forEach(function(m){
    if(m.messageId && gone[m.messageId]){ changed=true; return; }
    if(m.messageId) at[m.messageId]=out.length;
    out.push(m);
  });
  ((r&&r.messages)||[]).forEach(function(m){
    if(m.messageId && gone[m.messageId]) return;
    if(m.messageId && at.hasOwnProperty(m.messageId)){
      var cur=out[at[m.messageId]];
      // [1.383] — readAt counts as a change. Comparing only the words meant a
      // message that came back solely because the family had READ it was
      // recognised as "already have it" and dropped, and the "Read by …" mark
      // AC asked for never appeared until the thread was reopened.
      if(String(cur.messageText||'')!==String(m.messageText||'') ||
         String(cur.messageHtml||'')!==String(m.messageHtml||'') ||
         String(cur.readAt||'')!==String(m.readAt||'')){
        out[at[m.messageId]]=m; changed=true;
      }
      return;
    }
    if(m.messageId) at[m.messageId]=out.length;
    out.push(m); added++; changed=true;
  });
  return {list:out, added:added, changed:changed};
}

// ── [1.276] — unsend and edit, teacher side ─────────────────────────────
// The window is two minutes (AC, 6 September) and the server is the gate:
// _canAmendMessage_ in Code.js checks that you sent it, that it is inside the
// window and that the family has not read it. This is only what decides
// whether the two words are DRAWN. A clock a few seconds out shows a control
// the server then refuses, which is a toast — not a message pulled back from
// somebody who was reading it.
var MSG_UNSEND_WINDOW_MS=10*1000;
// Opening an edit buys two minutes, server-side — nobody retypes a sentence in
// ten seconds. The client never computes this; it reads amendUntil off the
// message, which is the server's own answer.
var MSG_AMEND_GRACE_MS=2*60*1000;
// The one timer this needs. A ten-second window redrawn only by a 5-second
// poll would leave Unsend on screen for up to five seconds after it had
// stopped working — a button that fails is worse than no button ([1.309]'s
// rule). So the render schedules a single wake-up at the exact moment the last
// live window closes. One timer for the whole thread, not one per message.
var _amendTimer=null;
function _amendTick(atMs){
  var wait=atMs-Date.now();
  if(wait<0) wait=0;
  if(_amendTimer){ clearTimeout(_amendTimer.id); _amendTimer=null; }
  _amendTimer={at:atMs, id:setTimeout(function(){ _amendTimer=null; render(); }, wait+250)};
}
// One open amendment at a time: {messageId, kind:'confirm'|'edit', stash}.
// stash is the draft that was in the composer when Edit was pressed — editing
// borrows the composer, and a teacher's half-written next message must not be
// the price of fixing a typo in the last one.
var AMEND={messageId:'', kind:'', stash:''};
function _canAmendMsg(m){
  if(!m || !m.messageId || m._pending) return false;
  if(m.senderId!==TEACHER_ID) return false;
  if(m.readAt) return false;
  if(_tIsTruthy(m.isAuto)) return false;
  // [1.380] — a message released from a schedule gets no window. Its email
  // went at the moment of release rather than being held, so an Unsend here
  // would empty the family's portal and leave the email standing. AC, 7
  // September: "If the teacher hasn't cancelled or edited by the time the
  // message goes out, that's on them." The server refuses it either way; this
  // is what stops the control being drawn.
  if(m.releasedAt) return false;

  // The deadline comes off the ROW, because opening an edit moves it and a
  // window recomputed from sentAt would close under somebody mid-word. The
  // fallback covers a message sent before the column existed.
  var until=Number(m.amendUntil)||((Number(m.sentAt)||0)+MSG_UNSEND_WINDOW_MS);
  if(Date.now()>=until) return false;
  // Whichever live window closes first is when this thread needs redrawing.
  if(!_amendTimer || until<_amendTimer.at) _amendTick(until);
  return true;
}
// ═══════════════════════════════════════════════════════════════════════
// [1.371] — scheduled send
// ═══════════════════════════════════════════════════════════════════════
// AC, 7 September: "schedule send a message so they can prepare replies and
// queue them to send during the hours that are most convenient to them."
//
// One open scheduling action at a time, exactly like AMEND above and for the
// same reason: two confirms on screen at once is how the wrong twin gets
// pressed ([1.276] found that by pressing them).
//
//   picking   — the composer's picker is open, no message involved yet
//   confirm   — 'send-now' or 'cancel' on a scheduled message
var SCHED={mode:'', messageId:'', at:''};
// The Scheduled list, loaded on demand and kept for the count.
var SCHED_LIST={loading:false, loaded:false, rows:[], open:false};

// TIME IS THE DEVICE'S LOCAL TIME, and that is a correction to the plan.
//
// BACKLOG said the picked time would be studio time (America/New_York) and
// converted on the way in and out. Then this file was actually read:
// fmtMsgTime() and every other timestamp in all three portals are rendered
// with plain getHours()/getDate(), which is the DEVICE's timezone, not the
// studio's. A picker that alone spoke studio time would be the only control on
// the screen that did — a teacher in another timezone would see every message
// stamped in their local time and one control silently in another.
//
// So the picker matches the rest of the screen, and what travels is epoch
// milliseconds, which is unambiguous whoever reads it. For everybody actually
// in the studio the two are the same thing.
//
// The wider question — that these portals show studio times in device time at
// all — is real and is bigger than this feature. Logged as its own item rather
// than half-fixed inside this one.
function _schedMsToLocalInput(ms){
  var d=new Date(Number(ms)||Date.now());
  function p2(n){ return n<10?'0'+n:String(n); }
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+
         'T'+p2(d.getHours())+':'+p2(d.getMinutes());
}
function _schedLocalInputToMs(v){
  if(!v) return 0;

  return isNaN(t)?0:t;
}
// The picker opens on a sensible time rather than blank: an hour from now,
// rounded to the next five minutes. A blank datetime-local on a phone is three
// taps before it is even a date.
function _schedDefault(){
  var t=Date.now()+60*60*1000;
  var d=new Date(t); d.setSeconds(0,0);
  d.setMinutes(Math.ceil(d.getMinutes()/5)*5);
  return _schedMsToLocalInput(d.getTime());
}
function _schedMin(){ return _schedMsToLocalInput(Date.now()+60*1000); }
// "Sending Monday, 9/14/26 9:00 AM" — fmtMsgTime is what every other time in
// this portal is drawn with, so a scheduled time reads the same as a sent one.
// [1.415] — AC's confirmation wording replaces "Scheduled for". It is the
// second of his two strings: this one is what a waiting message says about
// itself, after the fact.
function _schedWhen(ms){ return TCH_COPY.scheduledConfirm+' '+fmtMsgTime(ms); }

// ── [1.446] — changing the time of a message already waiting ─────────────
//
// Seeded with the time it ALREADY has, not with a default an hour out. The
// whole act is "not then, this instead", and a picker that throws away the
// current answer makes the person reconstruct it before they can change it.
function askReschedule(id){
  var m=_amendFind(id); if(!m) return;
  SCHED={mode:'rescheduling', messageId:id, at:_schedMsToLocalInput(Number(m.sendAt)||Date.now())};
  render();
}
function confirmReschedule(){
  var c=_amendCtx(); if(!c) return;

  var el=document.getElementById('sched-at');
  var at=_schedLocalInputToMs(el?el.value:SCHED.at);
  if(!at || at < Date.now()+60*1000){ showMsg(TCH_COPY.schedulePast,'e'); return; }
  if(at > Date.now()+14*24*60*60*1000 && !confirm(TCH_COPY.scheduleFar)) return;
  SCHED={mode:'', messageId:'', at:''};
  actStart('send', TCH_COPY.schedulingMsg);
  render();
  api({action:'rescheduleMessage', data:Object.assign({}, c.req, {messageId:id, sendAt:String(at)})},
      function(e,r){
    if(e||!r||!r.ok){ actFail('send',(r&&r.error)||'Could not change that time.'); render(); return; }

    // server's answer rather than off the input keeps this the same shape as
    // every other amend: the row is what happened, the input was only a request.
