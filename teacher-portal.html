// Four sections, in the order a teacher has to do something about them:
//
//   New Messages          everything owed — unread OR read-but-unanswered.
//   Marked for review     read, nothing new on it, saved by this teacher.
//   Closed Conversations  everything else, split Families / Admin & staff.
//
// THE TOP SECTION IS NOT SPLIT BY WHO WROTE, and that is deliberate — flagged
// to AC rather than slipped in. It is the one place a teacher answers "what do
// I owe?", and splitting it into family and admin means an overdue parent
// message and an overdue admin message sit in two places with neither visible
// at a glance. AC's teacher/admin split lives in the two browsing areas below,
// where you are looking for a person rather than reacting to something.
//
// The section names are AC's own words. "New Messages" holds read-but-
// unanswered conversations too, which makes it slightly wider than its name —
// recorded here because it is his call and should not be "fixed" by someone
// later reading the name literally.
var CLOSED_OPEN = false;   // AC's browsing areas start collapsed — see below.

// [1.231], AC: "Save optimistically and process on the back end... like with
// all other buttons and saving functions in the tool."
//
// The tick already flipped instantly; the white circle on the ROW did not,
// because its number came from the roster payload and the roster is only
// re-read after the write comes back. So the visible half of the action
// lagged by a round trip, which is what makes a control feel broken.
//
// The fix is not a pending-delta ledger reconciled against the server — that
// is the race [1.46] and [1.124 #2] each had to solve for sending, and it is
// only necessary when the client cannot know the answer. Here it can: an open
// conversation holds ALL of its messages, and this client has already applied
// the tick to them. So the open conversation's count is counted from the
// messages on screen, and every other row keeps the server's number, which is
// the only one it has. Nothing to reconcile and nothing a landing poll can
// undo, because the number is derived rather than stored.
function _reviewCountFor(kind, id, serverN){
  var t = (kind==='family') ? ACTIVE_THREAD : ACTIVE_STAFF_THREAD;
  var open = t && !t.loading &&
    (kind==='family' ? t.familyId===id
                     : (kind==='admin' ? t.contactType==='admin' : t.otherId===id));
  if(!open) return Number(serverN)||0;
  var n=0;
  (t.messages||[]).forEach(function(m){ if(m.reviewAt) n++; });
  return n;
}

// One shape for both kinds of conversation, so a section can hold either.
function _msgRows(){
  var out=[];
  (FAMILY_THREADS.list||[]).forEach(function(t){
    out.push({kind:'family', id:t.familyId, row:t,
      unread:Number(t.unread)||0, review:_reviewCountFor('family',t.familyId,t.reviewCount),
      waitingSince:Number(t.waitingSince)||0, replyDueBy:Number(t.replyDueBy)||0,
      closed:!!t.closed, at:Number(t.lastMessageAt)||0,
      preview:t.hasMessages?(t.lastMessageText||''):'',
      hasMessages:!!t.hasMessages});
  });
  var st=STAFF_THREADS.list||[];
  var admin=(st.filter(function(x){return x.contactType==='admin';})[0])||{};
  out.push({kind:'admin', id:'admin', row:admin,
    unread:Number(admin.unread)||0, review:_reviewCountFor('admin','admin',admin.reviewCount),
    waitingSince:Number(admin.waitingSince)||0, replyDueBy:Number(admin.replyDueBy)||0,
    closed:false, at:Number(admin.lastMessageAt)||0,
    preview:admin.lastMessageText||'', hasMessages:!!admin.lastMessageAt});
  st.forEach(function(x){
    if(x.contactType==='admin') return;
    out.push({kind:'staff', id:x.teacherId, row:x, name:x.teacherName,
      unread:Number(x.unread)||0, review:_reviewCountFor('staff',x.teacherId,x.reviewCount),
      waitingSince:Number(x.waitingSince)||0, replyDueBy:Number(x.replyDueBy)||0,
      closed:false, at:Number(x.lastMessageAt)||0,
      preview:x.lastMessageText||'', hasMessages:!!x.lastMessageAt});
  });
  return out;
}

// Which section a conversation belongs to. A conversation is in exactly one.
//
// AC, 3 Sept: "when a new message arrives, the thread should bump up back to
// the new messages area and not be stuck in a stale area", and "marked for
// review is strictly for read messages that don't have new messages". Both
// fall out of the order of these tests rather than needing a rule of their
// own: anything owed is caught first, so a review-marked thread that receives
// a new message leaves the review area by itself and carries both circles at
// the top.
function _sectionOf(r){
  // AC, 3 September, settling what a reply does and does not do: a
  // conversation you have answered but not closed "sits in the new messages
  // area". Replying is not closing — you decide when something is finished —
  // so an answered conversation stays where you can see it, with the Close
  // conversation button in the slot the circle has vacated.
  //
  // This is the correction to a real mistake: when the two browsing areas were
  // put under a "Closed Conversations" separator, replying still closed a
  // conversation automatically, so everything down there genuinely was closed.
  // AC then reversed auto-close and the section rule was not carried over, so
  // answered-but-open conversations were filed under a heading that said they
  // were closed. Now only closed ones are, and the heading is true again.
  if(r.closed) return 'closed';
  // A family on the roster you have never written to is not a conversation at
  // all — it belongs in the browsing list, not in the day's work ([1.172]).
  if(!r.hasMessages) return 'closed';
  if(r.review>0 && !r.unread && !r.waitingSince) return 'review';
  return 'new';
}

// Unread first, then whoever has been waiting longest. Within the browsing
// areas, most recent first — there is no urgency there to sort by.
function _sortNew(a,b){
  if((a.unread>0)!==(b.unread>0)) return a.unread>0?-1:1;
  if(a.waitingSince&&b.waitingSince) return a.waitingSince-b.waitingSince;
  if(a.waitingSince) return -1;
  if(b.waitingSince) return 1;
  return b.at-a.at;
}

function rMessagesPage(){
  if(MSG_LOCK.locked) return rMessagingLocked();
  if(FAMILY_VIEW==='picker') return rFamilyPicker();
  var showThread = FAMILY_VIEW==='thread' || STAFF_VIEW==='thread';
  var thread = STAFF_VIEW==='thread' ? rStaffThread()
             : FAMILY_VIEW==='thread' ? rFamilyThread()
             : '<div class="pane-empty">Choose a conversation to open it.</div>';
  return '<div class="panes">'+
    '<div class="pane'+(showThread?' only-lg':'')+'">'+rSectionedRoster()+'</div>'+
    '<div class="pane'+(showThread?'':' only-lg')+'">'+thread+'</div>'+
  '</div>';
}

function rSectionedRoster(){
  var h='<button class="btn btn-p" style="margin-bottom:.75rem" onclick="openFamilyPicker()">+ New Conversation</button>';
  h+=rMsgSearch();
  if(FAMILY_THREADS.loading && !FAMILY_THREADS.list.length){
    return h+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:20px">↻</span></div>';
  }
  var all=_msgRows();
  // A search narrows the whole page rather than one section of it, so a
  // parent is found without knowing which section they ended up in.
  if(MSG_SEARCH.query){
    var hits=_searchHits();
    all=all.filter(function(r){ return hits.indexOf(r.kind+':'+r.id)!==-1; });
  }
  var news=all.filter(function(r){return _sectionOf(r)==='new';}).sort(_sortNew);
  var revs=all.filter(function(r){return _sectionOf(r)==='review';}).sort(function(a,b){return b.at-a.at;});
  var rest=all.filter(function(r){return _sectionOf(r)==='closed';}).sort(function(a,b){return b.at-a.at;});
  var fams=rest.filter(function(r){return r.kind==='family';});
  var staff=rest.filter(function(r){return r.kind!=='family';});

  h+=rZone(TCH_COPY.sectionNew, news.length)+
     (news.length?'<div class="thread-list">'+news.map(rConvRow).join('')+'</div>'
                 :'<div class="zone-empty">Nothing waiting on you.</div>');
  if(revs.length){
    h+=rZone(TCH_COPY.sectionReview, revs.length)+
       '<div class="thread-list">'+revs.map(function(r){ return rConvRow(r,true); }).join('')+'</div>';
  }
  // AC's two browsing areas, kept exactly as they were and put under one
  // separator. Collapsed to start: a teacher with twenty-four families should
  // not scroll past all of them to reach the four things that need doing.
  // Collapsed it still carries its counts, so it says what it holds rather
  // than looking empty.
  h+='<div class="sep" onclick="CLOSED_OPEN=!CLOSED_OPEN;render()">'+
     '<span class="caret">'+(CLOSED_OPEN?'▾':'▸')+'</span>'+esc(TCH_COPY.sectionClosed)+
     '<span class="sepc">Families '+fams.length+' · Admin &amp; staff '+staff.length+'</span></div>';
  if(CLOSED_OPEN){
    h+=rZone(TCH_COPY.sectionFamilies, fams.length)+
       (fams.length?'<div class="thread-list">'+fams.map(rConvRow).join('')+'</div>':'<div class="zone-empty">Nothing here.</div>');
    h+=rZone(TCH_COPY.sectionStaff, staff.length)+
       (staff.length?'<div class="thread-list">'+staff.map(rConvRow).join('')+'</div>':'<div class="zone-empty">Nothing here.</div>');
  }
  return h;
}

// The search itself. One input and a list under it — every family and every
// student this teacher has, matched on either, so typing "Charlie" and typing
// "Ragsdale" land in the same conversation. It reaches every section,
// including the closed ones, so finding a parent never depends on knowing
// where they ended up.
//
// ON NOT GOING JUMPY, which AC asked for specifically: this page repaints on
// every poll that finds something new, and a field inside a repaint loses
// whatever is half-typed in it — the same root as [1.193]'s "why does the
// cursor time out?" and [1.221]'s snapping composer. render() already restores
// the caret for any text input BY TYPE rather than by name ([1.193]), which is
// what makes this safe; there is a check that the rule still covers it.
function rMsgSearch(){
  var q=MSG_SEARCH.query||'';
  var h='<div class="msg-search">'+
    '<input id="msg-search" type="text" autocomplete="off" placeholder="'+esc(TCH_COPY.searchPlaceholder)+'" '+
      'value="'+esc(q)+'" oninput="onMsgSearch(this.value)" onfocus="MSG_SEARCH.open=true;render()">';
  if(q){
    h+='<button type="button" class="lnk-btn msg-search-x" onclick="clearMsgSearch()" '+
       'aria-label="Clear search">✕</button>';
  }
  if(MSG_SEARCH.open && q){
    var hits=_searchNames(q);
    h+='<div class="msg-search-menu">'+
      (hits.length?hits.map(function(o){
        return '<div class="msg-search-item" onclick="'+o.open+'">'+esc(o.label)+
          (o.sub?'<span class="msg-search-sub">'+esc(o.sub)+'</span>':'')+'</div>';
      }).join(''):'<div class="msg-search-item q">Nothing matches that.</div>')+
      '</div>';
  }
  return h+'</div>';
}

function onMsgSearch(v){ MSG_SEARCH.query=v; MSG_SEARCH.open=true; render(); }
function clearMsgSearch(){ MSG_SEARCH.query=''; MSG_SEARCH.open=false; render(); }

// Every name the dropdown can offer: each family by its parents, each student
// by their own name, and every staff conversation. A student and their parent
// open the same thread, because there is one conversation per family.
function _searchNames(q){
  var needle=String(q||'').toLowerCase().trim();
  if(!needle) return [];
  var out=[];
  (FAMILY_THREADS.list||[]).forEach(function(t){
    var parents=_rosterParentLine(t)||'Family';
    var open='openFamilyRow(\''+esc(t.familyId)+'\');clearMsgSearch()';
    if(parents.toLowerCase().indexOf(needle)!==-1){
      out.push({label:parents, sub:_rosterStudentLine(t), open:open});
    }
    (t.students||[]).forEach(function(st){
      if(String(st.studentName||'').toLowerCase().indexOf(needle)===-1) return;
      out.push({label:st.studentName, sub:parents, open:open});
    });
  });
  (STAFF_THREADS.list||[]).forEach(function(x){
    var nm=x.contactType==='admin'?'Admin':(x.teacherName||'');
    if(nm.toLowerCase().indexOf(needle)===-1) return;
    out.push({label:nm, sub:'Admin & staff',
      open:(x.contactType==='admin'
        ? 'openStaffThread(\'admin\',\'admin\',\'Admin\')'
        : 'openStaffThread(\'staff\',\''+esc(x.teacherId)+'\',\''+esc(nm)+'\')')+';clearMsgSearch()'});
  });
  return out.slice(0,12);
}

// Which conversations survive a search, for the sections themselves — the same
// matching as the dropdown, expressed as keys.
function _searchHits(){
  var needle=String(MSG_SEARCH.query||'').toLowerCase().trim();
  var keys=[];
  (FAMILY_THREADS.list||[]).forEach(function(t){
    var hay=[_rosterParentLine(t), _rosterStudentLine(t)].join(' ').toLowerCase();
    if(hay.indexOf(needle)!==-1) keys.push('family:'+t.familyId);
  });
  (STAFF_THREADS.list||[]).forEach(function(x){
    var nm=(x.contactType==='admin'?'Admin':(x.teacherName||'')).toLowerCase();
    if(nm.indexOf(needle)!==-1) keys.push((x.contactType==='admin'?'admin:admin':'staff:'+x.teacherId));
  });
  return keys;
}

function rZone(label, n){
  return '<div class="zone">'+esc(label)+
    (n?'<span class="zcount">'+n+'</span>':'')+'</div>';
}

// One row, both kinds. AC, 3 September:
//   • the parent is who the teacher is speaking with, so the parent's name is
//     the largest thing on the row and the student sits under it, labelled;
//   • the arrow ALWAYS points right and the sender is always on the left —
//     the first draft flipped it to keep the parent's name in one column, and
//     that put the recipient first, which is [1.205] backwards;
//   • "we don't need the word parent actually. Just student:" — the two names
//     on the top line are the people talking and need no explaining; only the
//     student is labelled, being the one name on the row belonging to someone
//     who is not in the conversation;
//   • staff conversations carry no parent and no student at all.
// [1.235] — focusReview is set only for the rows in the Marked for review
// section, so opening a conversation from anywhere else still lands at the
// newest message. It is the section that carries the intent, not the row.
function rConvRow(r, focusReview){
  var _f = focusReview ? ',true' : '';
  var open = r.kind==='family'
    ? 'openFamilyRow(\'' + esc(r.id) + '\''+_f+')'
    : (r.kind==='admin' ? 'openStaffThread(\'admin\',\'admin\',\'Admin\''+_f+')'
                        : 'openStaffThread(\'staff\',\'' + esc(r.id) + '\',\'' + esc(r.name||'') + '\''+_f+')');
  var head, kids='';
  if(r.kind==='family'){
    var parent=_rosterParentLine(r.row)||'Family';
    var mine=_lastWasMine(r.row);
    head = mine
      ? '<span class="dir">You →</span> '+esc(parent)
      : esc(parent)+' <span class="dir">→ you</span>';
    kids=_rosterStudentLine(r.row);
  } else {
    var who = r.kind==='admin' ? '<span class="apill">Admin</span>' : esc(r.name||'');
    head = _lastWasMine(r.row) ? '<span class="dir">You →</span> '+who : who+' <span class="dir">→ you</span>';
  }
  var when = r.at ? ' <span class="dir">· '+esc(fmtMsgTime(r.at))+'</span>' : '';
  // The deadline, on the row, so nobody has to work it out from a colour.
  var due = (!r.closed && r.replyDueBy)
    ? ' <span class="due">'+esc(fmtDueShort(r.replyDueBy))+'</span>' : '';
  return '<div class="thread-row" onclick="'+open+'">'+
    '<div class="thread-row-main">'+
    '<div class="r-parent">'+head+when+due+
      (r.row.sharedWithAdmin?'<span class="handoff-tag">Admin asked</span>':'')+'</div>'+
    (kids?'<div class="r-student"><span class="lbl">Student:</span> '+esc(kids)+'</div>':'')+
    '<div class="thread-row-preview">'+(r.hasMessages
      ? esc((r.preview||'').slice(0,60))
      : '<span style="opacity:.7">No messages yet</span>')+'</div>'+
    '</div>'+
    '<div class="row-marks">'+rRowMarks(r)+'</div></div>';
}

// What sits on the right of a row. AC, 3 September: "If the message has been
// responded to and there is no bubble, maybe put the 'close conversation'
// button in place of that?"
//
// So the empty slot gets the one action that conversation still has. It is not
// the repetition [1.198] set out to strip, because it appears ONLY where there
// is nothing else to show — a row that is waiting on you shows why, and a row
// that is not offers the thing you might want to do with it. The confirm still
// guards it, so a stray click cannot close anything.
function rRowMarks(r){
  if(r.closed) return '<span class="closed-tag">Closed</span>';
  var marks=rReadMark(r.unread, r.waitingSince, r.closed, r.replyDueBy)+rReviewMark(r.review);
  if(marks) return marks;
  return '<button type="button" class="btn btn-s row-close" '+
    'onclick="event.stopPropagation();closeRow('+_rowArgs(r)+')">'+
    esc(TCH_COPY.closeConversation)+'</button>';
}

// Closing from the roster, without opening the conversation first. Same
// confirm and the same endpoint as the button in the thread.
function _rowArgs(r){
  return "'"+esc(r.kind)+"','"+esc(r.id)+"'";
}
function closeRow(kind, id){
  // [1.233] — the same rule from the roster. This path has no thread open, so
  // it goes on the row's own review count, which is the number the white
  // circle beside the button is already showing. The dialog is the browser's
  // here rather than the inline panel: there is no thread on screen to put a
  // panel inside, and the alternative — opening the conversation just to
  // refuse — is a worse answer to "close this row".
  var _r=_msgRows().filter(function(x){ return x.kind===kind && x.id===id; })[0];
  var _marks=_r?Number(_r.review)||0:0;
  if(_marks){
    if(!confirm(TCH_COPY.closeNeedsReview)) return;
  } else if(!confirm(TCH_COPY.closeConfirm)) return;
  var d={teacherToken:TOKEN, teacherId:TEACHER_ID, closed:true};
  if(kind==='family'){ d.conversationType='family_teacher'; d.familyId=id; }
  else if(kind==='admin'){ d.conversationType='teacher_admin'; }
  else { d.conversationType='staff_staff'; d.staffId2=id; }
  var _go=function(){
    api({action:'setConversationClosed', data:d}, function(e,r){
      if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not close that.','e'); return; }
      _refreshRosters();
    });
  };
  if(!_marks) return _go();
  // Clear first, close second — a close that half-clears is the state this
  // item exists to prevent.
  var _c={teacherToken:TOKEN, teacherId:TEACHER_ID};
  ['conversationType','familyId','staffId2'].forEach(function(k){ if(d[k]!==undefined) _c[k]=d[k]; });
  api({action:'clearConversationReviews', data:_c}, function(e,r){
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not clear those.','e'); return; }
    _go();
  });
}

// Who spoke last, for the direction on the row. The roster carries the last
// sender for family threads; for a staff thread "waiting on you" is the same
// question and is already answered by waitingSince.
function _lastWasMine(t){
  if(!t) return false;
  // The server answers this, because the portal cannot: a thread with nothing
  // unread and nobody waiting could have ended with either side. The fallback
  // is for a staff row, whose payload does not carry the flag.
  if(t.lastSenderIsTeacher!==undefined) return !!t.lastSenderIsTeacher;
  return !t.waitingSince && !Number(t.unread||0) && !!t.lastMessageAt;
}

function _rosterStudentLine(t){
  var kids=t.students||[];
  if(!kids.length) return [t.parent1Name,t.parent2Name].filter(Boolean).join(' & ')||'Family';
  return kids.map(function(st){
    var bits=[st.day,st.time].filter(Boolean).join(' ');
    return [st.studentName, [bits,st.instrument].filter(Boolean).join(' ')]
      .filter(Boolean).join(' - ');
  }).join(' · ');
}
function _rosterParentLine(t){
  return [t.parent1Name,t.parent2Name].filter(Boolean).join(' & ')||'';
}

var RESP_OPEN_HOUR=9, RESP_CLOSE_HOUR=17;   // studio hours — kept for the notify window, no longer the clock

function _respHoursBetween(fromMs, toMs){
  var from=Number(fromMs)||0, to=Number(toMs)||0;
  if(!from || to<=from) return 0;
  var open=0;
  var d=new Date(from);
  // Hour by hour, capped: anything older than a month is far past OVERDUE
  // already, so the loop stops rather than being made clever.
  for(var i=0;i<24*31 && d.getTime()<to;i++){
    var day=d.getDay(), hr=d.getHours();
    var next=new Date(d.getTime()); next.setMinutes(0,0,0); next.setHours(hr+1);
    if(day>=1 && day<=5){
      open+=(Math.min(to,next.getTime())-d.getTime())/3600000;
    }
    d=next;
  }
  return open;
}

// [1.178] — the resting stage is drawn too, in neutral grey. This used to
// return null under two hours and the row fell back to a bare ○, which is why
// AC reported "no status on a conversation at all". null now means only one
// thing: nobody is waiting. Kept character-identical to the admin copy — a
// teacher and admin looking at the same conversation must never see different
// colours (there is a check for exactly this).
function _agingMark(waitingSince, dueBy){
  if(!waitingSince) return null;
  var now=Date.now();
  var h=_respHoursBetween(waitingSince, now);
  // [1.197] — OVERDUE is the server's deadline, not a count. The deadline is
  // per teacher (their own evening boundary), which the portal cannot derive,
  // so it arrives on the row as replyDueBy. The 24-hour fallback is only for a
  // row from an older payload.
  if(dueBy ? (now>=Number(dueBy)) : (h>=24)) return {cls:'p-od', overdue:true, label:'Overdue'};
  var n=Math.round(h);
  if(h>=12) return {cls:'p-12h', t:n+'h', label:'Waiting '+n+'h'};
  if(h>=4) return {cls:'p-4h', t:n+'h', label:'Waiting '+n+'h'};
  if(h>=2) return {cls:'p-2h', t:n+'h', label:'Waiting '+n+'h'};
  return {cls:'p-rest', t:(n>=1?n+'h':'new'), label:(n>=1?'Waiting '+n+'h':'Waiting — less than an hour')};
}

// ── The ageing circle (BACKLOG 1.128, rebuilt 3 September 2026) ─────────
// AC, 3 Sept: "it seems unnecessary to have an unread button. If the message
// has been read, it's read... Read becomes automatic for everyone."
//
// So this is no longer a control. Mark-unread is gone from all three portals:
// it marked a whole thread, it asserted something untrue about a message that
// had been read, and it was most of why [1.216] says the counts are messy.
// Saving an individual message for review replaces it. Read has always been
// stamped automatically on open by doGetConversation(), so nothing had to be
// built for "read is automatic" — the manual buttons were overrides on top of
// behaviour that was already right, and they simply go.
//
// AC, 3 Sept, on what the mark now means: "agreed on the color not showing the
// hours." THE NUMBER IS ALWAYS A COUNT. THE COLOUR IS ALWAYS THE AGE. The
// circle used to hold the unread count for two hours and then silently switch
// to holding a duration ("6h"), so its content changed meaning as time passed
// — which is [1.216]'s complaint present in the design. Now the count stays at
// every stage and the colour alone says how long.
//
// He asked what happens with two unread messages sent at different times, and
// whether each needs its own circle: no. One circle, the count says how many,
// and the colour comes from the OLDEST unanswered one — see [1.228], which is
// the defect that question uncovered.
function rReadMark(unread, waitingSince, closed, dueBy){
  var n = Number(unread) || 0;
  var m = closed ? null : _agingMark(waitingSince, dueBy);
  // Nothing outstanding: no mark at all. AC's resting-state rule — the little
  // ○ that used to sit here was the mark-unread control, and with that gone an
  // empty column is the honest version of "nothing needs you".
  if (!n && !m) return '';
  // Overdue keeps its word BESIDE the circle rather than replacing it, so the
  // count survives to the last stage instead of disappearing exactly when the
  // conversation matters most.
  if (m && m.overdue){
    return (n?'<div class="msg-circle p-od" aria-label="'+n+' unread">'+n+'</div>':'')+
           '<div class="msg-overdue" aria-label="Overdue">OVERDUE</div>';
  }
  var cls = m ? m.cls : 'p-new';
  var label = m ? m.label : (n+' unread');
  return '<div class="msg-circle '+cls+'" aria-label="'+esc(label)+'">'+(n||'')+'</div>';
}

// The white circle: how many messages in this thread this teacher has saved
// for review ([1.215]). A separate meaning from the one above and never mixed
// with it — the blue/aged circle says someone is waiting on you, this one says
// you parked something for yourself. Private: nobody else is sent it.
function rReviewMark(count){
  var n = Number(count) || 0;
  if (!n) return '';
  return '<div class="msg-circle p-review" title="Saved for review" aria-label="'+n+' saved for review">'+n+'</div>';
}

function loadFamilyThreads(silent){
  if(!silent){ FAMILY_THREADS.loading=true; render(); }
  api({action:'getTeacherFamilyThreads', data:{teacherToken:TOKEN}}, function(e,r){
    FAMILY_THREADS.loading=false;
    if(e||!r||!r.ok){ if(!silent) showMsg((r&&r.error)||'Could not load conversations.','e'); render(); return; }
    // [1.176], AC: "The browser reloads when navigating away to another tab and
    // back." It was not a reload — every focus event re-rendered the whole
    // page whether or not anything had changed, which looks identical. The
    // roster is only reapplied when it actually differs, so a silent poll on
    // an unchanged list now costs nothing on screen. Same rule admin's poll
    // has had since 1.159.
    var _sig=_famSig(r.threads||[]);
    var _changed=(_sig!==FAMILY_THREADS._sig);
    FAMILY_THREADS._sig=_sig;
    FAMILY_THREADS.list=r.threads||[];
    MSG_LOCK.locked = _tIsTruthy(r.messagingLocked);
    MSG_LOCK.msg = r.messagingLockedMsg||'';
    // The deep link from a notification email, spent the moment the roster
    // arrives — and only once, so a later refresh doesn't drag the teacher
    // back out of whatever they moved on to.
    if(_pendingOpenFamilyId){
      var _want=_pendingOpenFamilyId;
      _pendingOpenFamilyId='';
      var _row=FAMILY_THREADS.list.filter(function(t){return t.familyId===_want;})[0];
      if(_row){ HOME_TAB='family'; openFamilyThread(_row.familyId, _row.parent1Name, _row.parent2Name); return; }
    }
    // A silent poll that found nothing new does not touch the screen (1.176).
    // A visible load always renders, because the caller is waiting on it.
    if(!silent || _changed) render();
  });
}

// What a roster row actually shows. If none of it moved, neither does the
// screen — see the note in loadFamilyThreads().
function _famSig(list){
  return (list||[]).map(function(t){
    return [t.familyId,t.lastMessageAt,t.lastMessageText,t.unread,t.waitingSince,
            t.closed,t.sharedWithAdmin,t.hasMessages].join('~');
  }).join('|');
}

function openFamilyPicker(){

function loadFamiliesDirectory(){

function rFamilyPicker(){

// Resolves the row, then opens it — so no name is ever interpolated into an
// inline handler. Two entry points, two lists: the roster and the picker.
function openPickedFamily(familyId){
  var f=FAMILY_PICKER.all.filter(function(x){return x.familyId===familyId;})[0];
  if(!f) return;
  openFamilyThread(f.familyId, f.parent1Name, f.parent2Name);
}
function openFamilyRow(familyId, focusReview){

  if(!t) return;

}
// Defaults to whatever the conversation was last about — a thread tends to
// stay on one child, and asking again every time would be friction with no new
// information.
function _threadStudentId(t){
  if(t.studentId!==undefined) return t.studentId;
  var last='';
  (t.messages||[]).forEach(function(m){ if(m.studentId) last=m.studentId; });
  if(!last && (t.students||[]).length===1) last=t.students[0].studentId;
  t.studentId=last;
  return last;
}

function openFamilyThread(familyId, p1, p2, focusReview){
  _focusReview=!!focusReview;   // [1.235]
  var _row=(FAMILY_THREADS.list||[]).filter(function(x){return x.familyId===familyId;})[0]||{};
  ACTIVE_THREAD = {familyId:familyId, parent1Name:p1, parent2Name:p2, messages:[], draft:'', sending:false, loading:true, refreshing:false, notifyP1:true, notifyP2:true,
                   students:_row.students||[]};
  FAMILY_VIEW='thread';
  render();
  api({action:'getConversation', data:{conversationType:'family_teacher', familyId:familyId, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(!ACTIVE_THREAD || ACTIVE_THREAD.familyId!==familyId) return; // navigated away before this resolved
    ACTIVE_THREAD.loading=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not load conversation.','e'); render(); return; }
    ACTIVE_THREAD.messages=r.messages||[];
    _applyPendingReviews(ACTIVE_THREAD);   // [1.231]
    _shouldScrollMsgList=true; render();
  });
}

// Manual "Refresh" — same fetch as opening the thread, without waiting for
// the next poll tick. Uses getConversation() (marks read too), a deliberate
// user action rather than a background poll.
function refreshFamilyThread(){
  var t=ACTIVE_THREAD;
  if(!t||t.refreshing) return;
  t.refreshing=true; render();
  api({action:'getConversation', data:{conversationType:'family_teacher', familyId:t.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(!ACTIVE_THREAD||ACTIVE_THREAD.familyId!==t.familyId) return;
    ACTIVE_THREAD.refreshing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not refresh.','e'); render(); return; }
    ACTIVE_THREAD.messages=r.messages||[];
    _applyPendingReviews(ACTIVE_THREAD);   // [1.231]
    _shouldScrollMsgList=true; render();
  });
}

function rFamilyThread(){
  var t=ACTIVE_THREAD;
  var names=[t.parent1Name,t.parent2Name].filter(Boolean).join(' & ')||'Family';
  // Back is hidden on desktop -- both panes are visible there, so there is
  // nothing to go back from.
  // [1.164], AC: "No way to close a conversation and get back to the roster on
  // desktop." The Back button was phone-only, because on desktop the roster is
  // already beside the thread — but the thread still had no way to be put
  // down, so the pane kept whatever was last opened.
  var h='<div class="only-sm"><button class="btn btn-s" style="margin-bottom:1rem" onclick="FAMILY_VIEW=\'list\';ACTIVE_THREAD=null;loadFamilyThreads()">← Back</button></div>'+
    '<div class="only-lg" style="display:flex;justify-content:flex-end;margin-bottom:.4rem">'+
    '<button class="btn btn-s" title="Close this conversation" '+
    'onclick="FAMILY_VIEW=\'list\';ACTIVE_THREAD=null;render()">\u2715</button></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div class="thread-hd" style="margin-bottom:0">'+esc(names)+'</div>'+
    '<button type="button" class="lnk-btn"  onclick="refreshFamilyThread()">'+(t.refreshing?'<span class="spin">↻</span>':'↻ Refresh')+'</button></div>';
  if(t.loading){
    return h+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:20px">↻</span></div>';
  }
  if(!t.messages.length){
    h+='<div class="empty-state">No messages yet — send a message to get started.</div>';
  } else {
    var _r=_convRow(t.familyId);
    h+='<div class="msg-list">'+t.messages.map(rMessageBubble).join('')+
       (_r?rClosedLine(_r.closedAt,_r.closedByName):'')+'</div>';
  }
  // Recipient choice only matters when there are two distinct parents on
  // file — mirrors admin Comms' recipient picker (confirmed 18 Aug, SPEC §7
  // item 3).
  if(t.parent1Name && t.parent2Name){
    h+='<div class="recipient-row">'+
      '<label><input type="checkbox" '+(t.notifyP1?'checked':'')+' onchange="ACTIVE_THREAD.notifyP1=this.checked"> '+esc(t.parent1Name)+'</label>'+
      '<label><input type="checkbox" '+(t.notifyP2?'checked':'')+' onchange="ACTIVE_THREAD.notifyP2=this.checked"> '+esc(t.parent2Name)+'</label>'+
      '</div>';
  }
  // AC, 3 September: Send and "Ask admin about this" sit together on the left
  // — both send something — and Close conversation sits alone hard right,
  // because it ends something. Close lives here, in the open conversation, and
  // deliberately not on the roster rows: closing needs the conversation in
  // front of you, which is why AC asked for a confirm step, and a button
  // repeated down every row is the repetition [1.198] set out to strip.
  var _cRow=_convRow(t.familyId);
  // AC, 3 September, settling where this lives: on the thread, in the main
  // message view, not on an individual message.
  //
  // It belongs to the CONVERSATION — one deadline, however many messages are
  // waiting — and hanging it off a message made that untrue. It was also the
  // wrong message in practice: the clock runs from the OLDEST unanswered one
  // ([1.228]), which in a burst of three is the furthest up the thread and the
  // most likely to be scrolled past. Here it is in view whenever the
  // conversation is open.
  if(_cRow && !_cRow.closed && _cRow.replyDueBy){
    h+='<div class="due-line">'+esc(fmtDueFull(_cRow.replyDueBy))+'</div>';
  }
  var sendBtn=(t.sending
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
    :'<button class="btn btn-p" onclick="sendFamilyMessage()">Send</button>')+
    (t.forwardOpen?'':'<button type="button" class="btn btn-ask" onclick="ACTIVE_THREAD.forwardOpen=true;render()">'+
      esc(CMP_COPY.askAdmin)+'</button>')+
    '<span style="flex:1"></span>'+
    (_cRow&&_cRow.closed
      ? '<span class="closed-tag">Closed</span>'
      : '<button type="button" class="btn btn-s" onclick="closeConversation()">'+esc(TCH_COPY.closeConversation)+'</button>');
  // BACKLOG 1.161 #4 — which child, asked only when a teacher has more than
  // one child in this family. One child and it is set automatically with
  // nothing on screen.
  var _kids=t.students||[];
  if(_kids.length>1){
    var _sel=_threadStudentId(t);
    h+='<div class="about-row"><span>About</span>'+
      _kids.map(function(st){
        return '<span class="about-pill'+(_sel===st.studentId?' on':'')+'" '+
          'onclick="ACTIVE_THREAD.studentId=\''+esc(st.studentId)+'\';render()">'+esc(st.studentName)+'</span>';
      }).join('')+
      '<span class="about-pill'+(_sel?'':' on')+'" onclick="ACTIVE_THREAD.studentId=\'\';render()">Something else</span>'+
      '</div>';
  }
  h+=rComposer('family-composer',t.draft,'ACTIVE_THREAD.draft=_composerInput(this)',sendBtn);
  // BACKLOG 1.135 — ask the office for help with a family question. Sharing,
  // not handing over: the conversation still ages against this teacher until
  // one of them answers, and a note saying what is needed is required, so a
  // forward is a question rather than a task passed along.
  // [1.233] — AC's dialog, in the same inline shape the Ask Admin panel uses,
  // so a decision is made where the button is rather than in a browser popup
  // that says nothing about this thread.
  if(t.closeReviewOpen){
    h+='<div class="fwd-box">'+
       '<div style="margin-bottom:.55rem">'+esc(TCH_COPY.closeNeedsReview)+'</div>'+
       '<div style="display:flex;gap:8px;justify-content:flex-end">'+
         '<button class="btn btn-s" onclick="cancelCloseReview()">'+esc(TCH_COPY.cancel)+'</button>'+
         (t.closing
           ? '<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
           : '<button class="btn btn-p" onclick="clearAndClose()">'+esc(TCH_COPY.clearAndClose)+'</button>')+
       '</div></div>';
  }
  if(t.forwardOpen){
    h+='<div class="fwd-box">'+
       '<div style="font-weight:600;margin-bottom:.35rem">What do you need from admin?</div>'+
       '<textarea id="fwd-note" rows="2" placeholder="e.g. Can we move her to Thursdays? I don\'t know what\'s free." '+
         'oninput="ACTIVE_THREAD.forwardNote=this.value" style="width:100%">'+esc(t.forwardNote||'')+'</textarea>'+
       '<div style="font-size:11px;color:var(--text4);margin:.35rem 0 .5rem">'+
         'Admin gets this with the family\'s message and their lesson details. You both still see the '+
         'conversation, and either of you replying answers it for the family.</div>'+
       (t.forwardNoteError
         ? '<div style="color:var(--rt);font-size:12px;font-weight:600;margin-bottom:.4rem;text-align:right">'+
           esc(CMP_COPY.forwardNeedsNote)+'</div>'
         : '')+
       '<div style="display:flex;gap:8px;justify-content:flex-end">'+
         '<button class="btn btn-s" onclick="ACTIVE_THREAD.forwardOpen=false;ACTIVE_THREAD.forwardNoteError=false;render()">Cancel</button>'+
         (t.forwarding
           ? '<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
           : '<button class="btn btn-p" onclick="forwardToAdmin()">Send to admin</button>')+
       '</div></div>';
  }
  return h;
}

// The conversation's roster row, for the facts the thread payload does not
// carry — whether it is closed, and who closed it.
function _convRow(familyId){
  return (FAMILY_THREADS.list||[]).filter(function(x){ return x.familyId===familyId; })[0]||null;
}

// ── The three things a teacher does to a conversation (3 September 2026) ──

// Save a message for review ([1.215]). Private, per message, and the only
// hand-made mark left anywhere: it replaced mark-unread, which marked a whole
// thread and claimed something untrue about a message that had been read.
// Optimistic — the tick is instant and the roster catches up behind it, since
// a checkbox that waits on a round trip feels broken.
function toggleReview(messageId, on){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  var was=null;
  (t.messages||[]).forEach(function(m){
    if(m.messageId!==messageId) return;
    was=m.reviewAt||'';
    m.reviewAt=on?Date.now():'';
  });
  // [1.231] — held until the write lands, so a wholesale re-read of the
  // thread (a manual Refresh, or the re-read after Mark seen) cannot put a
  // tick back the way it was before the server has been told. The poll itself
  // only ever APPENDS, so it was never the risk; these two are.
  t._reviewPending=t._reviewPending||{};
  t._reviewPending[messageId]=on?Date.now():'';
  render();   // the tick, the marked bubble and the roster circle, all now
  api({action:'setMessageReview', data:_threadKey(t,{messageId:messageId, review:!!on})}, function(e,r){
    delete t._reviewPending[messageId];
    if(e||!r||!r.ok){
      // Put it back rather than leaving a tick that did not stick.
      (t.messages||[]).forEach(function(m){ if(m.messageId===messageId) m.reviewAt=was; });
      showMsg((r&&r.error)||'Could not save that for review.','e'); render(); return;
    }
    _refreshRosters();
  });
}

// Re-applies whatever this client has ticked and the server has not yet
// confirmed, after a fetch that replaced the thread wholesale.
function _applyPendingReviews(t){
  if(!t||!t._reviewPending) return;
  (t.messages||[]).forEach(function(m){
    if(m.messageId && t._reviewPending.hasOwnProperty(m.messageId)) m.reviewAt=t._reviewPending[m.messageId];
  });
}

// [1.233] — clearing every review mark in this conversation, which is the
// first half of Clear & close. One server call, not a loop: a close that
// half-clears is worse than one that refuses.
function clearAllReviews(t, done){
  if(!t) return;
  (t.messages||[]).forEach(function(m){ if(m.reviewAt) m.reviewAt=''; });
  t._reviewPending={};
  render();
  api({action:'clearConversationReviews', data:_threadKey(t,{})}, function(e,r){
    if(e||!r||!r.ok){
      // Nothing was cleared and nothing is closed — put the thread back the
      // way it was and say so, rather than leaving a half-done action.
      t.closing=false; t.closeReviewOpen=false;
      showMsg((r&&r.error)||'Could not clear those.','e');
      _refreshOpenThread(); render(); return;
    }
    _refreshRosters();
    if(done) done();
  });
}

// "Mark seen" ([1.220]) — the two-line note, sent on purpose. It does NOT stop
// the clock: the conversation goes on ageing, keeps its place, and stays on
// admin's list until someone actually answers. Being seen is not being
// answered, and the tool must never let the two look the same — that is the
// whole of the item.
function markSeen(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.seenSending) return;
  t.seenSending=true; render();
  api({action:'markMessageSeen', data:_threadKey(t,{})}, function(e,r){
    t.seenSending=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send that.','e'); render(); return; }
    _refreshOpenThread();
  });
}

// Closing, which is deliberate and confirmed (AC, 3 Sept: "make teachers
// formally close conversations using a checkbox or button to close, with a
// confirm step"). Replying closes nothing — a teacher who answers "I'll check
// and come back to you" has replied without finishing, and no rule can tell
// that from a real answer.
// [1.233], AC: "Don't allow user to close conversation unless all reviewed
// messages are cleared."
//
// He then replaced the greyed-out button with a dialog, and it is the better
// of the two: the button stays live and EXPLAINS ITSELF at the moment it is
// pressed, rather than being disabled with the reason somewhere else on the
// page. A conversation with no marks still gets the plain confirm — two
// dialogs, each saying the one thing that matters at that moment.
function _openReviewMarks(t){
  var n=0;
  (t&&t.messages||[]).forEach(function(m){ if(m.reviewAt) n++; });
  return n;
}
function closeConversation(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.closing) return;
  if(_openReviewMarks(t)){ t.closeReviewOpen=true; render(); return; }
  if(!confirm(TCH_COPY.closeConfirm)) return;
  _doCloseConversation(t);
}
// Clear & close: one action, in that order. Closing first and clearing after
// would leave a thread closed with marks still on it if the second call
// failed, which is the state the whole item exists to prevent.
function clearAndClose(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.closing) return;
  t.closing=true; render();
  clearAllReviews(t, function(){ _doCloseConversation(t); });
}
function cancelCloseReview(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  t.closeReviewOpen=false; t.closing=false; render();
}
function _doCloseConversation(t){
  t.closing=true; t.closeReviewOpen=false; render();
  api({action:'setConversationClosed', data:_threadKey(t,{closed:true})}, function(e,r){
    t.closing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not close that.','e'); render(); return; }
    _refreshRosters();
    _refreshOpenThread();
  });
}

// The four fields every one of these endpoints identifies a conversation by,
// in one place — three copies of this is how two of them would end up
// disagreeing about which thread they were talking to.
function _threadKey(t, extra){
  var d={teacherToken:TOKEN, teacherId:TEACHER_ID};
  if(t===ACTIVE_STAFF_THREAD){
    // A staff thread names itself by who it is with, not by a family.
    if(t.contactType==='admin'){ d.conversationType='teacher_admin'; }
    else { d.conversationType='staff_staff'; d.staffId2=t.otherId; }
  } else {
    d.conversationType='family_teacher';
    d.familyId=t.familyId;
  }
  Object.keys(extra||{}).forEach(function(k){ d[k]=extra[k]; });
  return d;
}
function _refreshRosters(){ loadFamilyThreads(true); loadStaffThreads(true); }
function _refreshOpenThread(){
  if(ACTIVE_STAFF_THREAD) refreshStaffThread(); else if(ACTIVE_THREAD) refreshFamilyThread();
}

// Sends the family's latest message to the office with the teacher's own note,
// and tells the family it has happened (AC's copy, server-side).
function forwardToAdmin(){
  var t=ACTIVE_THREAD;
  if(!t||t.forwarding) return;
  var note=((document.getElementById('fwd-note')||{}).value||t.forwardNote||'').trim();
  // [1.176], AC: the validation banner belongs next to the button, not at the
  // top of the page where the eye is not.
  if(!note){ t.forwardNoteError=true; render(); return; }
  t.forwardNoteError=false;
  t.forwardNote=note;
  t.forwarding=true; render();
  api({action:'forwardToAdmin', data:{teacherToken:TOKEN, familyId:t.familyId, note:note}}, function(e,r){
    t.forwarding=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send.','e'); render(); return; }
    t.forwardOpen=false; t.forwardNote='';
    if(r.message) t.messages=t.messages.concat([r.message]);
    _shouldScrollMsgList=true;
    showMsg('Sent to admin.','s');
    render();
    loadFamilyThreads(true);
  });
}

function sendFamilyMessage(){
  var t=ACTIVE_THREAD;
  var _el=document.getElementById('family-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  var text=_composerPlain(html);
  if(!text) return;
  var notifyParents=[];
  if(!t.parent1Name || !t.parent2Name){
    // Only one parent on file — nothing to choose, notify whichever exists.
    notifyParents=undefined;
  } else {
    if(t.notifyP1) notifyParents.push('parent1');
    if(t.notifyP2) notifyParents.push('parent2');
  }
  // BACKLOG 1.124 #2. This used to cost the teacher TWO sequential Apps Script
  // round trips before their own words left the box: a sendMessage, then a full
  // refreshFamilyThread() to fetch back the message just sent. The family
  // portal has done it properly since 1.46 and this is that pattern ported --
  // append locally, post in the background, reconcile in place.
  var clientMsgId=_ktNewClientMsgId();
  var _stuId=_threadStudentId(t);   // which child (1.161 #4)
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(), studentId:_stuId, _pending:true
  };
  t.messages=t.messages.concat([pending]);
  t.draft='';
  // Stops the 5s poll delivering this same message back before the server has
  // confirmed it, which would show it twice.
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  render();

// ============================================================
// FORMATTING COMPOSER (BACKLOG 1.33)
// ============================================================
// Button-driven only — no typed syntax, no keyboard shortcuts to learn
// (settled with AC: teachers won't know them). Same execCommand approach
// already proven in admin's Comms toolbar, minus its colour/font/image extras.
//
// IMPORTANT: nothing in this section is a security control. _composerClean()
// below is a tidiness pass, because contenteditable emits browser-specific
// soup (div line wrappers, span style attributes, &nbsp;) and pasted content
// drags in whatever the source page had. The real boundary is _sanitizeMessageHtml_()
// in Code.js, which re-checks everything server-side and assumes this file
// could be bypassed entirely — because it can: anything can POST to sendMessage.

// Tags kept, normalized to a single spelling each so the server sees a small,
// predictable vocabulary. Everything else is unwrapped, keeping its text.
var CMP_KEEP={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote'};

// Elements whose CONTENT has to go as well, not just their tag. Everything
// else is unwrapped (tag dropped, words kept), which is right for a pasted
// span but wrong for a script element — unwrapping that would drop the tag
// and leave 'alert(1)' sitting in the message as visible text.
var CMP_DROP={SCRIPT:1,STYLE:1,NOSCRIPT:1,TEMPLATE:1,IFRAME:1,OBJECT:1,EMBED:1,HEAD:1,TITLE:1};

// Reads bold/italic/underline out of an inline style attribute. Pasted content
// carries formatting this way rather than as tags — Docs and Word both put
// bold on a <span style="font-weight:700"> — so without this, pasting loses
// every bit of emphasis. Returns null when there is no style attribute at all.
function _styleFlags(n){
  var st=(n.getAttribute&&n.getAttribute('style'))||'';
  if(!st) return null;
  st=st.toLowerCase();
  var f={};
  var fw=/font-weight\s*:\s*([a-z0-9]+)/.exec(st);
  if(fw){
    f.boldSet=true;
    f.bold=(fw[1]==='bold'||fw[1]==='bolder'||parseInt(fw[1],10)>=600);
  }
  if(/font-style\s*:\s*italic/.test(st)) f.italic=true;
  if(/text-decoration[^;]*underline/.test(st)) f.underline=true;
  return f;
}

function _composerClean(node){
  var out='';
  for(var i=0;i<node.childNodes.length;i++){
    var n=node.childNodes[i];
    if(n.nodeType===3){ out+=esc(n.nodeValue); continue; }
    if(n.nodeType!==1) continue;
    var tag=n.nodeName;
    if(CMP_DROP[tag]) continue;
    if(tag==='BR'){ out+='<br>'; continue; }
    var inner=_composerClean(n);
    if(tag==='A'){
      var href=n.getAttribute('href')||'';
      // Mirrors the server's rule so the toolbar can't silently produce a link
      // the server will then drop. The server still re-checks it.
      if(/^(https?:\/\/|mailto:)/i.test(href) && !/[\s"'<>\\]/.test(href)) out+='<a href="'+esc(href)+'">'+inner+'</a>';
      else out+=inner;
      continue;
    }
    var flags=_styleFlags(n);
    var keep=CMP_KEEP[tag];
    // An explicit font-weight:normal cancels a bold tag. Google Docs wraps its
    // ENTIRE clipboard payload in <b style="font-weight:normal">, so honouring
    // the tag over the style would make every message pasted from Docs bold.
    if(keep==='b' && flags && flags.boldSet && !flags.bold) keep=null;
    if(keep){ if(inner) out+='<'+keep+'>'+inner+'</'+keep+'>'; continue; }
    // Formatting carried as an inline style instead of a tag gets promoted to
    // the real tag, so pasted bold/italic survives.
    if(inner && flags){
      if(flags.underline) inner='<u>'+inner+'</u>';
      if(flags.italic) inner='<i>'+inner+'</i>';
      if(flags.bold) inner='<b>'+inner+'</b>';
    }
    // DIV/P are how contenteditable wraps each new line — become line breaks.
    if(tag==='DIV'||tag==='P'){ out+=(out&&!/<br>$/.test(out)?'<br>':'')+inner; continue; }
    out+=inner; // SPAN, FONT, and anything pasted in: unwrap, keep the words
  }
  return out;
}

// Only used to decide "is this message empty" before sending. The real
// plain-text copy stored on the record is derived server-side from the
// sanitized HTML, never from here — see the note on doSendMessage().
function _composerPlain(html){
  return String(html||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ')
    .replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
}

function _composerInput(el){
  // Browsers leave a stray line-break wrapper behind when the box is emptied,
  // which defeats the :empty placeholder rule. Clear it only when there is
  // genuinely nothing left — the list check keeps an empty bullet the teacher
  // just created from being wiped out from under them.
  if(!el.textContent.trim() && !el.querySelector('ul,ol,a')) el.innerHTML='';
  return _composerClean(el);
}

function _composerSync(id){
  var el=document.getElementById(id); if(!el) return;
  var v=_composerClean(el);
  if(id==='family-composer' && ACTIVE_THREAD) ACTIVE_THREAD.draft=v;
  if(id==='staff-composer' && ACTIVE_STAFF_THREAD) ACTIVE_STAFF_THREAD.draft=v;
}

function _composerCmd(id,cmd){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  // styleWithCSS(false) makes the browser emit <b> rather than
  // <span style="font-weight:bold">, which the allowlist would otherwise drop.
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand(cmd,false,null);
  _composerSync(id);
  _composerState(id);
}

// Paste keeps its formatting (AC's call, 19 Aug) — a teacher pasting a
// bulleted practice list out of Docs keeps the bullets. What survives is
// whatever _composerClean() allows, so pasted content lands in exactly the
// same shape as content typed with the toolbar.
//
// The clipboard HTML is parsed with DOMParser, never by assigning innerHTML:
// a DOMParser document is inert, so a pasted image with an onerror handler or
// a pasted script element can't run while we walk it. The server sanitizer
// still re-checks the result regardless.
function _composerPaste(ev){
  var cd=ev.clipboardData||window.clipboardData;
  if(!cd) return;
  var html='';
  try{ html=cd.getData('text/html')||''; }catch(e){}
  // No HTML flavour on the clipboard (plain-text copy, most mobile keyboards):
  // let the browser's own plain-text paste happen untouched.
  if(!html) return;
  ev.preventDefault();
  var clean='';
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    clean=_composerClean(doc.body);
  }catch(e){
    clean=esc(cd.getData('text/plain')||'');
  }
  if(clean) document.execCommand('insertHTML',false,clean);
}

// Quote toggles rather than only applying, so a teacher can get back out of a
// blockquote with the same button they used to enter one. formatBlock('div')
// is the standard way to undo it.
function _composerQuote(id){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  // Angle-bracket form: Chrome and Safari accept either, Firefox only this one.
  // Built from a variable rather than written as a bracketed literal, so the
  // tag-balance check in scripts/check.js doesn't read it as a real open tag.
  var _blk=_composerInQuote(id)?'div':'blockquote';
  document.execCommand('formatBlock',false,'<'+_blk+'>');
  _composerSync(id);
  _composerState(id);
}
// Is the caret inside <sel> and still within this composer? Used for the two
// states document.queryCommandState() cannot answer honestly.
function _composerSelIn(id,selector){
  var el=document.getElementById(id); if(!el) return false;
  var s=window.getSelection();
  if(!s || !s.anchorNode) return false;
  var n=s.anchorNode;
  var e=(n.nodeType===1)?n:n.parentElement;
  return !!(e && el.contains(e) && e.closest && e.closest(selector));
}
function _composerInQuote(id){ return _composerSelIn(id,'blockquote'); }

// ── Link row ───────────────────────────────────────────────────────────────
// The selection is saved on open because clicking into the URL input collapses
// it; without this, inserting the link would drop it wherever the caret
// happened to land rather than over the words the teacher had highlighted.
var _cmpLinkSel={};

// Open state and half-typed values live HERE, not in the DOM, because render()
// replaces #app wholesale every poll tick (5s). Left in the DOM, a teacher
// typing a URL would watch it vanish a few seconds later -- the same failure
// as 1.32 in the family portal and 1.28 here, one control further in.
// rComposerLinkRow() renders from this object, so a re-render redraws the row
// exactly as it was.
var _cmpLink={};
function _cmpLinkState(id){
  if(!_cmpLink[id]) _cmpLink[id]={open:false,url:'',text:'',bad:false};
  return _cmpLink[id];
}

function _composerLinkOpen(id){
  var row=document.getElementById(id+'-linkrow'); if(!row) return;
  var sel=window.getSelection();
  var el=document.getElementById(id);
  _cmpLinkSel[id]=(sel && sel.rangeCount && el && el.contains(sel.anchorNode))
    ? sel.getRangeAt(0).cloneRange() : null;
  var st=_cmpLinkState(id);
  st.open=true; st.url=''; st.bad=false;
  // Pre-fill the link text with whatever is selected, so highlighting a phrase
  // and pressing Link does the obvious thing.
  st.text=(sel && !sel.isCollapsed && el && el.contains(sel.anchorNode)) ? String(sel).trim() : '';
  var t=document.getElementById(id+'-linktext');
  var u=document.getElementById(id+'-linkurl');
  if(t) t.value=st.text;
  if(u){ u.value=''; u.classList.remove('bad'); u.placeholder=CMP_COPY.linkUrlPlaceholder; }
  row.classList.add('open');
  if(u) u.focus();
}

function _composerLinkClose(id){
  var row=document.getElementById(id+'-linkrow'); if(row) row.classList.remove('open');
  var st=_cmpLinkState(id);
  st.open=false; st.url=''; st.text=''; st.bad=false;
  _cmpLinkSel[id]=null;
  var el=document.getElementById(id); if(el) el.focus();
}

function _composerLinkKey(ev,id){
  if(ev.key==='Enter'){ ev.preventDefault(); _composerLinkInsert(id); }
  if(ev.key==='Escape'){ ev.preventDefault(); _composerLinkClose(id); }
}

// AC, 28 Aug: site.com, www.site.com, https://www.site.com and https://site.com
// must all work. So https:// is PREPENDED when absent rather than demanded.
// Being lenient here is safe -- this file is not the security boundary.
// _sanitizeMessageHtml_() in Code.js re-checks every href server-side and
// assumes this file was bypassed, because it can be. Strictness here buys
// nothing and costs teachers working links.
function _composerNormalizeUrl(raw){
  var u=String(raw||'').trim();
  if(!u) return '';
  if(/[\s"'<>\\]/.test(u)) return '';          // spaces or quotes: not an address
  if(/^mailto:/i.test(u)) return u;
  if(!/^https?:\/\//i.test(u)){
    // Any other scheme (javascript:, data:, file:) is refused outright rather
    // than having https:// glued in front of it.
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    u='https://'+u;
  }
  // Must have a dot somewhere in the host, or "https://notes" would pass.
  var host=u.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0];
  if(host.indexOf('.')===-1) return '';
  return u;
}

function _composerLinkInsert(id){
  var el=document.getElementById(id); if(!el) return;
  var uIn=document.getElementById(id+'-linkurl');
  var tIn=document.getElementById(id+'-linktext');
  var url=_composerNormalizeUrl(uIn?uIn.value:'');
  if(!url){
    // Corrected in place instead of thrown as a page-level toast -- the error
    // belongs next to the field that caused it.
    var stBad=_cmpLinkState(id); stBad.bad=true; stBad.url='';
    if(uIn){ uIn.classList.add('bad'); uIn.value=''; uIn.placeholder=CMP_COPY.linkRejected; uIn.focus(); }
    return;
  }
  var label=(tIn && tIn.value.trim()) || url.replace(/^https?:\/\//i,'');
  el.focus();
  var saved=_cmpLinkSel[id];
  if(saved){
    try{
      var sel=window.getSelection();
      sel.removeAllRanges(); sel.addRange(saved);
    }catch(e){}
  }
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(label)+'</a>&nbsp;');
  _composerLinkClose(id);
  _composerSync(id);
}

// ── Toolbar active state ───────────────────────────────────────────────────
// Nothing reflected back before this, so a teacher had to type a letter to
// find out whether bold was on. queryCommandState covers the inline and list
// commands; blockquote has no state to query, so it is resolved from the DOM.
var _CMP_STATE_CMDS=['bold','italic','underline','insertUnorderedList','insertOrderedList'];

function _composerState(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  _CMP_STATE_CMDS.forEach(function(c){
    var b=wrap.querySelector('[data-cmd="'+c+'"]'); if(!b) return;
    var on=false;
    try{ on=document.queryCommandState(c); }catch(e){}
    // queryCommandState('underline') is TRUE for ANY selection inside a link,
    // because a link RENDERS underlined -- verified in the browser, not
    // guessed. Left alone, the Underline button lights up on its own the
    // moment a teacher clicks into a link they just added, claiming
    // formatting they never applied. Inside a link, ask the DOM instead.
    //
    // Resolved from the selection's anchor, which covers every selection a
    // person can actually make -- a click, a drag, or Ctrl+A all anchor on a
    // text node. It does NOT cover a programmatic selectNodeContents() of the
    // whole box, where the anchor is the composer div itself and there is no
    // link ancestor to find; nothing in the UI produces that.
    if(c==='underline' && on && _composerSelIn(id,'a')) on=_composerSelIn(id,'u');
    b.classList.toggle('on',!!on);
  });
  var q=wrap.querySelector('[data-quote]');
  if(q) q.classList.toggle('on',_composerInQuote(id));
}

function _composerStateClear(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  var btns=wrap.querySelectorAll('.cmp-tb-btn.on');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
}

// Button labels reuse the wording already live in admin's Comms toolbar so the

  guide:[

    ]},

    ]},
    {h:'No circle, “Close conversation” button visible', items:[

    ]},
    {h:'Message sections', items:[

function rMessageBubble(m){
  var mine = m.senderId===TEACHER_ID;
  // messageHtml is set only when the sender used the formatting toolbar, and
  // has already been through _sanitizeMessageHtml_() server-side. Plain
  // messages (and everything sent before 1.33) keep the escaped path.
  var body = m.messageHtml
    ? m.messageHtml
    : esc(m.messageText||'').replace(/\n/g,'<br>');
  // AC, 1 Sept: an auto-response collapses to one line and opens on click.
  // Away replies repeat the same words to the same family every time; left
  // expanded they bury the actual conversation.
  // [1.189] — the office's side of this conversation, in the thread it is
  // about. AC: teachers see these inline too. Never mistakable for something
  // the family can read.
  if(m.staffOnly) return rInternalBubble(m);
  // The "seen" note (1.220) — two lines, no bubble, no button, sent by hand.
  // Checked BEFORE the auto branch: it carries isAuto so that nothing counts
  // it as a reply, but it must not collapse like an away message.
  if(m.noteKind==='seen') return rNoteLine(m);
  if(_tIsTruthy(m.isAuto)) return rAutoBubble(m,mine);
  // [1.232], AC: "Otherwise, the person doesn't know which message they
  // marked, and this will easily get lost." The white circle on the roster
  // counts them; inside the thread the only difference was a ticked checkbox,
  // which is invisible while scrolling past. The bubble itself now says so,
  // and the id is on the element so [1.235] can scroll to it.
  var saved = !!m.reviewAt;
  return '<div class="bubble-row'+(mine?' mine':'')+'" id="msg-'+esc(m.messageId||'')+'">'+
    '<div class="bubble'+(mine?' mine':'')+(saved?' saved':'')+'">'+
    (saved?'<div class="saved-tag">'+esc(TCH_COPY.savedForReview)+'</div>':'')+
    (!mine?'<div class="bubble-sender">'+esc(m.senderName||'')+'</div>':'')+
    _bubbleAbout(m)+
    '<div class="bubble-text">'+body+'</div>'+
    '<div class="bubble-time">'+esc(fmtMsgTime(m.sentAt))+'</div>'+
    rNotifyWarn(m)+
    rMsgTools(m,mine)+
    '</div></div>';
}

// [1.237] — "a test parent received no email when a teacher sent them a
// message", and nothing on any screen said so. The server records what the
// notification actually did on the message row (notifyState/notifyDetail, see
// _notifyNewMessage) and this is where staff find out.
//
// AC, 4 September, on both halves of this:
//
//   THE WORDING is his — "message did not send", as a red warning banner. The
//   server's own reason sits under it in smaller text, because the whole point
//   of the item is that the cause stops being invisible; the banner is what
//   you notice and the second line is what you tell somebody.
//
//   WHO SEES IT: everyone on staff in the thread, not only the sender. It was
//   scoped to your own message on the first pass; AC widened it. A teacher can
//   see that a message admin sent their family never arrived, and admin — who
//   is the only one who can actually fix "no email address on file" — sees it
//   on a teacher's message too.
//
// Still only on a STAFF-sent message: this answers "did what we sent reach
// the family". And still only when something did NOT go out — 'sent' and
// 'queued' draw nothing, and a message with no state at all predates the
// record and says nothing rather than claiming a failure it cannot evidence.
function rNotifyWarn(m){
  if(m.senderType!=='teacher' && m.senderType!=='admin') return '';
  var st=m.notifyState||'';
  if(st!=='none' && st!=='error') return '';
  return '<div class="msg-notify-warn"><b>'+esc(TCH_COPY.notSent)+'</b>'+
    (m.notifyDetail?'<span>'+esc(m.notifyDetail)+'</span>':'')+'</div>';
}

// ── Two lines in the thread, not a message (AC, 3 September 2026) ────────
// The shape both system lines use. AC on the "seen" note: "It should be two
// lines only. The header line with sender and timestamp, and 2nd line text
// message." No bubble, no border, no button — a note saying the studio has it,
// which cannot be replied to and is not something to read past.
// AC, 4 September: the note is "auto-response: [first name] has seen your
// message..." with a timestamp. The sender's name moved INTO the sentence when
// he rewrote it, so the header keeps the timestamp and drops the name — it was
// printing the same person twice, once above the line and once inside it.
function rNoteLine(m){
  return '<div class="note-line">'+
    '<div class="note-head">'+esc(fmtMsgTime(m.sentAt))+'</div>'+
    '<div class="note-body">'+esc(m.messageText||'')+'</div>'+
    '</div>';
}

// The record of who closed a conversation, in the same shape. AC: "The admin
// should have a record of who closed the conversation on the message when
// closed in the message thread: one line like read receipt." Drawn from the
// row's own closedAt/closedByName rather than written as a message, so closing
// never adds anything to what a family is sent — this line is staff-only.
function rClosedLine(closedAt, closedByName){
  if(!closedAt) return '';
  return '<div class="note-line">'+
    '<div class="note-body">'+esc(closedByName||'Someone')+' closed this conversation'+
      ' <span class="note-when">· '+esc(fmtMsgTime(closedAt))+'</span></div>'+
    '</div>';
}

// ── Per-message controls (AC, 3 September 2026) ──────────────────────────
// The only things anyone marks by hand, and both are private to this teacher.
// "Save for review" replaces mark-unread: it points at the message rather than
// the thread, it survives being read, and it is what puts the white circle on
// the roster row. "Mark seen" sends the two-line note above — a deliberate act,
// never automatic, and it does NOT stop the clock: the conversation goes on
// ageing and stays where it is until a real reply is sent. Being seen is not
// being answered.
function rMsgTools(m, mine){
  var saved = !!m.reviewAt;
  var h = '<div class="msg-tools">'+
    '<label class="rev-check'+(saved?' on':'')+'"><input type="checkbox"'+(saved?' checked':'')+
      ' onclick="event.stopPropagation();toggleReview(\''+esc(m.messageId)+'\',this.checked)"> '+
      // AC, 3 Sept (second pass): the label follows its state.
      esc(saved?TCH_COPY.savedForReview:TCH_COPY.saveForReview)+'</label>';
  // Only on a message someone else sent: marking your own message "seen" says
  // nothing to anybody.
  if(!mine){
    h += '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="event.stopPropagation();markSeen()">'+
      esc(TCH_COPY.markSeen)+'</button>';
  }
  return h+'</div>';
}

// [1.189]. The teacher asked the office a question about this family; the
// answer belongs beside the question, not in another screen. Replying here
// writes the same teacher_admin row the staff thread is built from, so the
// history stays in one place — AC: "logged in the separate teacher to admin
// pathway".
var INTERNAL={replyTo:'', draft:'', sending:false};
function rInternalBubble(m){
  var open=INTERNAL.replyTo===m.messageId;
  var body=m.messageHtml?m.messageHtml:esc(m.messageText||'').replace(/\n/g,'<br>');
  var h='<div class="bubble-row"><div class="bubble internal">'+
    '<div class="internal-tag">'+esc(CMP_COPY.internal)+'</div>'+
    (m.senderName?'<div class="bubble-sender">'+esc(m.senderName)+'</div>':'')+
    '<div class="bubble-text">'+body+'</div>'+
    '<div class="bubble-time">'+esc(fmtMsgTime(m.sentAt))+'</div>'+
    '<button type="button" class="btn btn-s" style="margin-top:.45rem" '+
      'onclick="internalReply(\''+esc(m.messageId)+'\')">'+esc(CMP_COPY.internalReply)+'</button>';
  if(open){
    h+='<div style="margin-top:.5rem;display:flex;flex-direction:column;gap:6px">'+
      '<textarea id="tch-internal" rows="3" placeholder="'+esc(CMP_COPY.internalPh)+'" '+
        'oninput="INTERNAL.draft=this.value">'+esc(INTERNAL.draft||'')+'</textarea>'+
      '<div style="display:flex;gap:6px">'+
        (INTERNAL.sending
          ?'<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
          :'<button class="btn btn-p" onclick="sendInternal()">Send</button>')+
        '<button class="btn btn-s" onclick="internalReply(\'\')">Cancel</button>'+
      '</div></div>';
  }
  return h+'</div></div>';
}
function internalReply(messageId){
  INTERNAL.replyTo=messageId||'';
  if(!messageId) INTERNAL.draft='';
  render();
}
function sendInternal(){
  var t=ACTIVE_THREAD; if(!t) return;
  var el=document.getElementById('tch-internal');
  var text=((el?el.value:INTERNAL.draft)||'').trim();
  if(!text) return;
  INTERNAL.sending=true;render();
  api({action:'sendMessage', data:{conversationType:'teacher_admin', teacherId:TEACHER_ID,
       teacherToken:TOKEN, aboutFamilyId:t.familyId, messageText:text}}, function(e,r){
    INTERNAL.sending=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send','e'); render(); return; }
    INTERNAL.draft='';INTERNAL.replyTo='';
    refreshFamilyThread();
    render();
  });
}

// One line, clearly not a person, click to read it in full.

function toggleAuto(id){ _autoOpen[id]=!_autoOpen[id]; render(); }

  return '<div class="bubble-row'+(mine?' mine':'')+'">'+
