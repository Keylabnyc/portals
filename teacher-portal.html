      if(m.messageId===id){ m.sendAt=r.sendAt||at; m.schedMissedAt=''; }
    });
    // [1.462] — NO DUPLICATE BANNER. AC, 9 September 2026, one line: *"no
    // duplicate banner."*
    //
    // The scheduled bubble already reads "Message scheduled. It will be sent on
    // …" — his own wording from [1.415] — so a banner saying it again is two
    // things saying one thing, which is [1.455] in a different place. He timed the
    // gap between them at 5-8 seconds and it was confusing at any gap.
    //
    // **The WORKING state stays**: it explains the wait, and nothing else does.
    // **The FAILED state stays**: it is the one a person must act on. Only the
    // second confirmation goes.
    actClear('send');
    _schedInvalidate();
    render();
  });
}

// ── The scheduled bubble ───────────────────────────────────────────────
// Drawn after the thread's real messages, because that is where it will
// appear when it is sent. Its own class rather than a variant of .bubble: it
// is not a message yet, and making it look like one is the mistake the second
// line of copy exists to correct.
function rScheduledBubble(m){
  var id=esc(m.messageId||'');
  // [1.371] — the bubble is drawn the instant Schedule Send is pressed, before
  // the server has answered with an id. For that moment none of the four
  // controls can work: each addresses the message by an id that is still ''.
  // The sent bubble has the same guard inside _canAmendMsg (m._pending); this
  // one needs its own, because it does not go through that gate.
  var settled = !m._pending && !!m.messageId;
  // Exactly rMessageBubble's line: messageHtml has already been through the
  // server's sanitizer, and a plain message keeps the escaped path.
  var body=m.messageHtml?m.messageHtml:esc(m.messageText||'').replace(/\n/g,'<br>');
  var acts;
  if(SCHED.mode==='send-now' && SCHED.messageId===m.messageId){
    // AC's confirm, in AC's words. Cancel here backs out of the ACTION — the
    // message stays scheduled, untouched. That is deliberately not the same
    // Cancel as the one two buttons along, which destroys it.
    acts='<div class="sched-confirm"><span>'+esc(TCH_COPY.sendNowAsk)+'</span>'+
      '<button type="button" class="btn btn-p" onclick="doSendNow(\''+id+'\')">'+esc(TCH_COPY.sendNowGo)+'</button>'+
      '<button type="button" class="btn btn-s" onclick="closeSchedule()">'+esc(TCH_COPY.sendNowBack)+'</button></div>';
  } else if(SCHED.mode==='delete' && SCHED.messageId===m.messageId){
    acts='<div class="sched-confirm"><span>'+esc(TCH_COPY.cancelScheduledAsk)+'</span>'+
      '<button type="button" class="btn btn-p" onclick="deleteScheduled(\''+id+'\')">'+esc(TCH_COPY.cancelScheduledGo)+'</button>'+
      '<button type="button" class="btn btn-s" onclick="closeSchedule()">'+esc(TCH_COPY.cancelScheduledKeep)+'</button></div>';
  } else if(SCHED.mode==='' && !AMEND.messageId && settled){
    // AC, 7 September — FOUR controls, and the distinction between them is his:
    //
    //   Edit         changes the words and KEEPS the time
    //   Send now     sends it there and then, and asks first
    //   Cancel Send  drops the time and KEEPS the words, as a draft
    //   Delete       drops both, and asks first
    //
    // Only the two that cannot be undone ask. Cancel Send destroys nothing —
    // the words come back to the box they were written in and the files come
    // with them — so a confirm on it would be the safety net that makes you
    // likelier to miss the one that matters ([1.276]'s finding).
    //
    // The same gate the sent bubble uses: while ANY amendment or confirm is
    // open, no message offers a control.
    acts='<div class="msg-tools">'+
      '<button type="button" class="lnk-btn" onclick="startEditMessage(\''+id+'\')">'+esc(TCH_COPY.editMsg)+'</button>'+
      '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="askSendNow(\''+id+'\')">'+esc(TCH_COPY.sendNow)+'</button>'+
      '<span class="msg-tools-sep">·</span>'+
      // [1.446] — the control AC found missing. Between Send now and Cancel
      // Send because it is what sits between them in consequence: it changes
      // when, not whether.
      '<button type="button" class="lnk-btn" onclick="askReschedule(\''+id+'\')">'+esc(TCH_COPY.reschedule)+'</button>'+
      '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="cancelSend(\''+id+'\')">'+esc(TCH_COPY.cancelScheduled)+'</button>'+
      '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="askDeleteScheduled(\''+id+'\')">'+esc(TCH_COPY.deleteScheduled)+'</button>'+
      '</div>';
  } else { acts=''; }
  var editing = AMEND.kind==='edit' && AMEND.messageId===m.messageId;
  return '<div class="bubble-row mine" id="msg-'+id+'">'+
    '<div class="bubble mine sched'+(editing?' editing':'')+'">'+
    '<div class="sched-tag">'+esc(_schedWhen(m.sendAt))+'</div>'+
    '<div class="bubble-text">'+body+'</div>'+
    rAttachments(m)+
    acts+
    '</div></div>';
}
function askSendNow(id){ SCHED={mode:'send-now', messageId:id, at:''}; render(); }
function askDeleteScheduled(id){ SCHED={mode:'delete', messageId:id, at:''}; render(); }

// Send now. The server calls the same release the trigger does, so there is
// nothing here that decides how a message is sent — only when.
function doSendNow(id){
  var c=_amendCtx(); if(!c) return;
  SCHED={mode:'', messageId:'', at:''};
  var keep=(c.t.scheduled||[]).slice();
  var row=null;
  (c.t.scheduled||[]).forEach(function(m){ if(m.messageId===id) row=m; });
  // Off the scheduled list and into the thread in one move, before the round
  // trip — [1.43]'s rule: a teacher who presses Send watches it send.
  c.t.scheduled=keep.filter(function(m){ return m.messageId!==id; });
  if(row){
    var now=Date.now();
    c.t.messages=(c.t.messages||[]).concat([Object.assign({}, row, {sendAt:'', sentAt:now, amendUntil:now+MSG_UNSEND_WINDOW_MS})]);
    _threadCacheWrite(c);
  }
  _shouldScrollMsgList=true;
  render();
  api({action:'sendScheduledNow', data:Object.assign({}, c.req, {messageId:id})}, function(e,r){
    if(e||!r||!r.ok){
      c.t.scheduled=keep;
      c.t.messages=(c.t.messages||[]).filter(function(m){ return m.messageId!==id; });
      _threadCacheWrite(c);
      showMsg((r&&r.error)||'Could not send that message.','e');
      render();
      return;
    }
    (c.t.messages||[]).forEach(function(m){
      if(m.messageId===id){ m.sentAt=r.sentAt||m.sentAt; m.amendUntil=r.amendUntil||0; }
    });
    _threadCacheWrite(c);
    _schedInvalidate();
    render();
  });
}
// ── Cancel Send (AC, 7 September) ──────────────────────────────────────
// "keeps the message as a draft but cancels the scheduled send time."
//
// The exact inverse of scheduling: what was written and never sent goes back
// into the box it was written in, with its files. Nothing is destroyed, which
// is why it does not ask.
//
// The composer may already hold something — a teacher who wrote their next
// message while one was waiting. Neither text is thrown away: what is already
// in the box stays first, and the returned message follows it. Merging two
// messages into one is a nuisance a teacher can see and fix; silently losing
// either is [1.43]'s rule broken, on words they watched themselves type.
function cancelSend(id){
  var c=_amendCtx(); if(!c) return;
  SCHED={mode:'', messageId:'', at:''};
  var keep=(c.t.scheduled||[]).slice();
  var row=null; keep.forEach(function(m){ if(m.messageId===id) row=m; });
  if(!row) return;
  c.t.scheduled=keep.filter(function(m){ return m.messageId!==id; });
  render();
  api({action:'unscheduleMessage', data:Object.assign({}, c.req, {messageId:id})}, function(e,r){
    if(e||!r||!r.ok){
      c.t.scheduled=keep;
      showMsg((r&&r.error)||'Could not cancel that send.','e');
      render();
      return;
    }
    // The server's copy of the words, not the client's — it is the sanitized
    // one, and it is what would have been sent.
    var back=r.messageHtml||_plainToComposerHtml(r.messageText||'');
    var cur=String(c.t.draft||'').trim();
    c.t.draft = cur ? (cur+'<br><br>'+back) : back;
    _draftKeep(c.t, c.t.draft);
    // [1.277] — the files come back as chips, already uploaded and unbound, so
    // the ids are good and the next send claims them.
    (r.attachments||[]).forEach(function(a){
      ATT_PENDING.push({tempId:'t'+a.attachmentId, fileName:a.fileName,
        mimeType:a.mimeType, sizeBytes:a.sizeBytes, uploading:false, attachmentId:a.attachmentId});
    });
    _schedInvalidate();
    render();
    var box=document.getElementById(c.composerId);
    if(box) box.focus();
  });
}

// Delete. It is retractMessage — the same unsend the sent bubble uses, on a
// message that was never sent — so it leaves exactly what an unsent one does:
// nothing anybody can see, and no email.
function deleteScheduled(id){
  var c=_amendCtx(); if(!c) return;
  SCHED={mode:'', messageId:'', at:''};
  var keep=(c.t.scheduled||[]).slice();
  c.t.scheduled=keep.filter(function(m){ return m.messageId!==id; });
  render();
  api({action:'retractMessage', data:Object.assign({}, c.req, {messageId:id})}, function(e,r){
    if(e||!r||!r.ok){
      c.t.scheduled=keep;
      showMsg((r&&r.error)||'Could not cancel that message.','e');
      render();
      return;
    }
    _schedInvalidate();
  });
}

// ── [1.373] — the Scheduled list ───────────────────────────────────────
// A scheduled message lives in one thread and is visible only with that thread
// open. Three prepared on a Sunday evening are three things that cannot be
// found again on Monday morning without opening every conversation. This is
// the one place they are all visible; pressing one opens its conversation,
// where the three controls already are.
function _schedInvalidate(){ SCHED_LIST.loaded=false; loadScheduled(); }
// ── [1.410] — a message that has GONE leaves the Scheduled list ──────────
//
// AC, 8 September 2026: "Schedule send messages are being saved in a scheduled
// message area after the message has been sent, which is not correct … Only
// messages that have scheduled but not yet been sent out via schedule send
// show here."
//
// The cause is that this list only ever hears from ITSELF. _schedInvalidate()
// is called when this client schedules, edits, sends now or cancels — every
// one of them an action taken here. **The every-minute trigger releasing a
// message is a server-side event no client is told about**, so the row sat in
// the list, past its own time, until the page was reloaded.
//
// The cure is not another timer. A row whose time has passed is the only
// evidence needed that the server may have released it, and that evidence is
// already on this client — so the list re-reads itself only when it is holding
// something due. A list with nothing due makes no request, which is what keeps
// this off [1.293]'s five-second budget.
var _schedDueCheckedAt=0;
var SCHED_DUE_RECHECK_MS=30000;
function _schedAnyDue(){
  var now=Date.now();
  for(var i=0;i<SCHED_LIST.rows.length;i++){
    var at=Number(SCHED_LIST.rows[i] && SCHED_LIST.rows[i].sendAt)||0;
    if(at && at<=now) return true;
  }
  return false;
}
// Called from the poll tick. Deliberately rate-limited rather than fired on
// every tick: the trigger runs once a minute, so a message can legitimately be
// up to a minute past its time and still be waiting. Asking every five seconds
// would be five requests to learn something that cannot have changed.
function _schedSweepDue(){
  if(!_schedAnyDue()) return;
  var now=Date.now();
  if(now-_schedDueCheckedAt < SCHED_DUE_RECHECK_MS) return;
  _schedDueCheckedAt=now;
  _schedInvalidate();
}
function loadScheduled(){
  if(SCHED_LIST.loading) return;
  SCHED_LIST.loading=true;
  api({action:'getScheduledMessages', data:{teacherToken:TOKEN}}, function(e,r){
    SCHED_LIST.loading=false;
    if(e||!r||!r.ok) return;   // a list that will not load is not worth a toast
    SCHED_LIST.loaded=true;
    SCHED_LIST.rows=r.scheduled||[];
    render();
  });
}
// Hidden entirely at zero. Nothing is wrong when there is nothing scheduled,
// and a control that only ever appears when something IS wrong reads as broken
// — so this one appears when there is something to see and is simply absent
// otherwise.
function rScheduledLine(){
  if(!SCHED_LIST.rows.length) return '';
  return '<button type="button" class="sched-line" onclick="SCHED_LIST.open=!SCHED_LIST.open;render()">'+
    esc(TCH_COPY.scheduledSection)+' ('+SCHED_LIST.rows.length+')'+
    '<span class="sched-caret">'+(SCHED_LIST.open?'▾':'▸')+'</span></button>'+
    (SCHED_LIST.open?rScheduledList():'');
}
function rScheduledList(){
  return '<div class="sched-list">'+SCHED_LIST.rows.map(function(x){
    return '<button type="button" class="sched-item" onclick="openScheduled(\''+esc(x.messageId)+'\')">'+
      '<div class="sched-item-hd">'+esc(x.to)+' <span class="sched-item-at">'+esc(_schedWhen(x.sendAt))+'</span></div>'+
      '<div class="sched-item-txt">'+esc(x.preview||'')+'</div></button>';
  }).join('')+'</div>';
}
// Opens the conversation the message is in. No second set of controls: Edit,
// Send now and Cancel live on the bubble, in one place.
function openScheduled(id){
  var row=null;
  SCHED_LIST.rows.forEach(function(x){ if(x.messageId===id) row=x; });
  if(!row) return;
  SCHED_LIST.open=false;
  if(row.conversationType==='family_teacher'){
    // [1.384] — with the parent names. Called bare, the thread header read
    // "Family" and the two-parent recipient checkboxes disappeared until the
    // thread was reopened from the roster. The row is right here.
    var _fr=(FAMILY_THREADS.list||[]).filter(function(x){ return x.familyId===row.familyId; })[0]||{};
    openFamilyThread(row.familyId, _fr.parent1Name, _fr.parent2Name); return;
  }
  if(row.conversationType==='teacher_admin'){ openStaffThread('admin','admin','Admin'); return; }
  var otherId=String(row.teacherId)===String(TEACHER_ID) ? row.staffId2 : row.teacherId;
  openStaffThread('staff', otherId, row.to||'');
}

// Which thread the controls are acting on, and how to address it on the wire.
// Both tabs use the same four functions below; without this they would be
// eight.
function _amendCtx(){
  if(HOME_TAB==='family'){
    var t=ACTIVE_THREAD; if(!t) return null;
    return {t:t, composerId:'family-composer',
            req:{conversationType:'family_teacher', familyId:t.familyId,
                 teacherId:TEACHER_ID, teacherToken:TOKEN}};
  }
  var st=ACTIVE_STAFF_THREAD; if(!st) return null;
  return {t:st, composerId:'staff-composer',
          req: st.contactType==='admin'
            ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
            : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:st.otherId, teacherToken:TOKEN}};
}
function _amendFind(id){
  var c=_amendCtx(); if(!c) return null;
  var found=null;
  (c.t.messages||[]).forEach(function(m){ if(m.messageId===id) found=m; });
  // [1.371] — a scheduled message is edited by the same Edit, so it has to be
  // findable by the same lookup. Without this, pressing Edit on a scheduled
  // bubble opens an empty composer and saving writes nothing.
  if(!found) (c.t.scheduled||[]).forEach(function(m){ if(m.messageId===id) found=m; });
  return found;
}
function cancelAmend(){
  var c=_amendCtx();
  // [1.424] — a scheduled message held open by this edit is released now
  // rather than waiting out the expiry. A teacher who opened Edit and thought
  // better of it changed nothing, and their message should go at the time they
  // picked. Fired and forgotten: if it never lands, the expiry catches it.
  if(c && AMEND.kind==='edit' && AMEND.messageId){
    api({action:'cancelMessageEdit', data:Object.assign({}, c.req, {messageId:AMEND.messageId})}, function(){});
  }
  // Editing borrowed the composer; give the teacher back whatever was in it.
  if(c && AMEND.kind==='edit'){ c.t.draft=AMEND.stash||''; _draftKeep(c.t, c.t.draft); }
  AMEND={messageId:'', kind:'', stash:''};
  SCHED={mode:'', messageId:'', at:''};   // [1.371] — a picker or a confirm belongs to the thread it was opened in
  render();
}
function unsendMessage(id){
  var c=_amendCtx(); if(!c) return;
  var data=Object.assign({}, c.req, {messageId:id});
  AMEND={messageId:'', kind:'', stash:''};
  SCHED={mode:'', messageId:'', at:''};   // [1.371] — a picker or a confirm belongs to the thread it was opened in
  // Removed from the screen before the request goes out, for [1.43]'s reason:
  // this is an undo, and an undo that takes two seconds to happen does not
  // feel like one. It goes back if the server refuses.
  var keep=c.t.messages;
  c.t.messages=keep.filter(function(m){ return m.messageId!==id; });
  _threadCacheWrite(c);
  render();
  api({action:'retractMessage', data:data}, function(e,r){
    if(e||!r||!r.ok){
      c.t.messages=keep; _threadCacheWrite(c);
      showMsg((r&&r.error)||'Could not unsend that message.','e');
      render();
    }
  });
}
// Edit BORROWS THE COMPOSER rather than growing a second editor inside the
// bubble. The composer already has the toolbar, the paste cleaner, the link
// box, the saved links and the caret handling from [1.332] — a second rich
// editor would be a second copy of all of it, and the one that is used less
// is the one that rots.
function startEditMessage(id){
  var c=_amendCtx(); if(!c) return;
  var m=_amendFind(id); if(!m) return;
  var el=document.getElementById(c.composerId);
  var cur=el?_composerClean(el):(c.t.draft||'');
  AMEND={messageId:id, kind:'edit', stash:cur};
  // [1.276] — told to the server, not decided here: opening an edit buys two
  // minutes and holds the family's email with it. Fired in the BACKGROUND and
  // the composer opens immediately — a round trip before the box opens would
  // spend a second of a ten-second window on waiting. If it fails, the save
  // fails and the words go back where they came from.
  api({action:'beginMessageEdit', data:Object.assign({}, c.req, {messageId:id})}, function(e,r){
    if(!e && r && r.ok && r.amendUntil){
      var live=_amendFind(id);
      if(live) live.amendUntil=r.amendUntil;
    }
  });
  c.t.draft=m.messageHtml||_plainToComposerHtml(m.messageText||'');
  _draftKeep(c.t, c.t.draft);
  render();
  var box=document.getElementById(c.composerId);
  if(box) box.focus();
}
// A message sent without the toolbar has no messageHtml, so its text has to
// become composer markup the same way the bubble renders it — escaped, with
// line breaks kept. Anything else silently eats a teacher's paragraphs the
// first time they edit a plain message.
function _plainToComposerHtml(text){
  return esc(text).replace(/\n/g,'<br>');
}
function saveEditMessage(){
  var c=_amendCtx(); if(!c || AMEND.kind!=='edit') return;
  var id=AMEND.messageId;
  var el=document.getElementById(c.composerId);
  var html=el?_composerClean(el):(c.t.draft||'');
  var text=_composerPlain(html);
  if(!text) return;
  var m=_amendFind(id);
  var before=m?{messageText:m.messageText, messageHtml:m.messageHtml}:null;
  if(m){ m.messageText=text; m.messageHtml=html; }
  var stash=AMEND.stash||'';
  AMEND={messageId:'', kind:'', stash:''};
  SCHED={mode:'', messageId:'', at:''};   // [1.371] — a picker or a confirm belongs to the thread it was opened in
  c.t.draft=stash; _draftKeep(c.t, stash);
  _threadCacheWrite(c);
  render();
  api({action:'editMessage', data:Object.assign({}, c.req, {messageId:id, messageText:text, messageHtml:html})}, function(e,r){
    if(e||!r||!r.ok){
      if(m&&before){ m.messageText=before.messageText; m.messageHtml=before.messageHtml; }
      _threadCacheWrite(c);
      // [1.43]'s rule, which this path was breaking: words a teacher watched
      // themselves type must never just vanish. A refused edit is the likely
      // case now that the window is ten seconds — the family opened the thread
      // while they were typing — and the honest recourse is to send the
      // correction as a new message, so the corrected wording goes back into
      // the composer rather than being thrown away with the error.
      c.t.draft=html;
      _draftKeep(c.t, html);
      showMsg((r&&r.error)||'Could not save that change.','e');
      render();
      return;
    }
    // The server re-sanitizes, so what it returns is authoritative — the
    // composer's own cleaning is a convenience, never the boundary.
    if(m&&r.message){ m.messageText=r.message.messageText; m.messageHtml=r.message.messageHtml; _threadCacheWrite(c); render(); }
  });
}
function _threadCacheWrite(c){
  try{ THREAD_CACHE[_threadCacheKey(c.req)]=c.t.messages; }catch(e){}
}

// [1.413] — the same runs as the other two portals; see the long note in
// EnrollmentAdmin.html. Grouping was approved by AC on 8 September and is
// applied in all three at once, because one conversation reading three
// different ways is the fault this is meant to remove.
// [1.413] — senderName is part of the identity, not decoration.
//
// Found in review the day this was written. A family's messages all carry
// senderId = familyId — the ROW does not know which parent typed it; [1.24]
// records that in senderName, and [1.249] put the name on every bubble
// precisely because "a family thread can carry two parents and admin".
//
// So a run keyed on senderId alone merges two DIFFERENT PEOPLE into one turn,
// and because only the last message of a run carries the meta line, the whole
// run is then labelled with whichever parent happened to speak last. The
// other parent disappears from the conversation.
function _tchRunSame(a,b){
  return !!a && !!b && String(a.senderId||'')===String(b.senderId||'') &&
         String(a.senderName||'')===String(b.senderName||'') &&
         !_tIsTruthy(a.isAuto) && !_tIsTruthy(b.isAuto) &&
         a.noteKind!=='seen' && b.noteKind!=='seen';
}
function rMessageBubble(m, prev, next){
  var mine = m.senderId===TEACHER_ID;
  var _runStart=!_tchRunSame(prev,m);
  var _runEnd=!_tchRunSame(m,next);
  // messageHtml is set only when the sender used the formatting toolbar, and
  // has already been through _sanitizeMessageHtml_() server-side. Plain
  // messages (and everything sent before 1.33) keep the escaped path.
  var body = m.messageHtml
    ? m.messageHtml
    : esc(m.messageText||'').replace(/\n/g,'<br>');
  // AC, 1 Sept: an auto-response collapses to one line and opens on click.
  // Away replies repeat the same words to the same family every time; left
  // expanded they bury the actual conversation.
  // [1.189] — the office's side of this conversation, in the thread it is
  // about. AC: teachers see these inline too. Never mistakable for something
  // the family can read.
  // The "seen" note (1.220) — two lines, no bubble, no button, sent by hand.
  // Checked BEFORE the auto branch: it carries isAuto so that nothing counts
  // it as a reply, but it must not collapse like an away message.
  if(m.noteKind==='seen') return rNoteLine(m);
  if(_tIsTruthy(m.isAuto)) return rAutoBubble(m,mine);
  // [1.232], AC: "Otherwise, the person doesn't know which message they
  // marked, and this will easily get lost." The white circle on the roster
  // counts them; inside the thread the only difference was a ticked checkbox,
  // which is invisible while scrolling past. The bubble itself now says so,
  // and the id is on the element so [1.235] can scroll to it.
  var saved = !!m.reviewAt;
  // [1.249] — AC: "now attach sender name on the message", and, choosing
  // between two drawn options, "2 is better": the name goes on the TIMESTAMP
  // LINE, not inside the bubble. "Xavier Tombstone · Thursday, 9/3/26 2:12 AM".
  //
  // On EVERY message, including your own. This matters beyond tidiness — a
  // family thread can carry two parents and admin, and until now only the
  // incoming bubbles named anybody at all.
  //
  // _bubbleAbout is gone with it: the child a message is about now lives in
  // the thread header, once, which is AC's rule twice over.
  // [1.276] — the message currently open in the composer. Without this the
  // teacher is typing into a box with no visible connection to the bubble it
  // is going to overwrite, which is the second-screen problem in miniature.
  var editing = AMEND.kind==='edit' && AMEND.messageId===m.messageId;
  return '<div class="bubble-row'+(mine?' mine':'')+(_runStart?' run-start':'')+(_runEnd?' run-end':'')+'" id="msg-'+esc(m.messageId||'')+'">'+
    '<div class="bubble'+(mine?' mine':'')+(saved?' saved':'')+(editing?' editing':'')+'">'+
    (saved?'<div class="saved-tag">'+esc(TCH_COPY.savedForReview)+'</div>':'')+
    '<div class="bubble-text">'+body+'</div>'+
    rAttachments(m)+
    // [1.413] — one timestamp per run, on its last message.
    // ── [1.413] — EVERY message carries its time again ──────────────────
    //
    // AC, 8 September 2026, looking at a thread of his own: "No timestamps on
    // messages any longer … everything is messy."
    //
    // Grouping was Claude's suggestion and he approved it in the abstract
    // ("Good call on the grouping idea"). Seeing it, it is wrong for THIS
    // tool. Messages here are not rapid chat turns — they are studio
    // correspondence with a response clock running on them, and [1.249] put
    // the name and time on every bubble deliberately, because a family thread
    // can carry two parents and admin.
    //
    // So the timestamp suppression is withdrawn. **The runs themselves stay** —
    // consecutive messages still sit closer together with the gap between
    // turns, which was the readable half — and admin's sides ([1.413]'s other
    // half, which AC asked for by name) are untouched.
    '<div class="bubble-time">'+_bubbleMeta(m)+_readMark(m, mine)+'</div>'+
    rNotifyWarn(m)+
    rMsgTools(m,mine)+
    '</div></div>';
}
// The one meta line every human message carries: who, then when.
// [1.302], AC: "This is the format that should be included on every message —
// 'Xavier · Friday, 9/4/26 5:59 PM'". It already was — but fmtMsgTime returns
// '' for a timestamp it cannot parse, and the separator was printed before the
// time rather than between the two, so such a message rendered as "Xavier
// Tombstone ·" with a dot hanging off the end. That is what AC screenshotted.
// The separator now belongs to the pair, so a missing half takes it with it.
// ── [1.368] — a teacher sees when the family read their message ─────────
//
// AC, 7 September, answering the question [1.367] left open: "Teacher should
// see when family has read the message."
//
// The read was already recorded and ADMIN'S portal already drew it; this
// screen never did, so the person who wrote the message was the only one who
// could not see it had landed. Same field, same sentence, the screen that
// needed it most.
//
// ON THEIR OWN MESSAGES ONLY. A mark on an incoming message would be this
// teacher narrating their own reading back to themselves, which is the fault
// AC reported twice on the admin side ([1.296]).
//
// And nothing before it is read: an absence of news is silence, not a red
// word. That is [1.178] read the other way round — the resting state here is
// no mark at all, because "not yet" is not a thing that has happened.
function _readMark(m, mine){
  if(!mine || m._pending || !m.readAt) return '';
  var who=_readWho();
  return '<span class="read-mark">'+
    (who?' · Read by '+esc(who)+' at: ':' · Read at: ')+esc(fmtMsgTime(m.readAt))+'</span>';
}
// Who the reader is, from the thread this bubble is in. A family thread's
// reader is the parent; the office thread's is Admin. Named rather than
// guessed: "Read at" with no name is better than the wrong name.
function _readWho(){
  if(HOME_TAB==='family'){
    var t=ACTIVE_THREAD;
    return t ? String(_rosterParentLine(t)||t.parent1Name||'').trim() : '';
  }
  var s=ACTIVE_STAFF_THREAD;
  if(!s) return '';
  return s.contactType==='admin' ? 'Admin' : String(s.otherName||'').trim();
}
function _bubbleMeta(m){
  var who=String(m.senderName||'').trim();
  var when=fmtMsgTime(m.sentAt);
  return [who?esc(who):'', when?esc(when):''].filter(Boolean).join(' \u00b7 ');
}

// [1.237] — "a test parent received no email when a teacher sent them a
// message", and nothing on any screen said so. The server records what the
// notification actually did on the message row (notifyState/notifyDetail, see
// _notifyNewMessage) and this is where staff find out.
//
// AC, 3 September, on both halves of this:
//
//   THE WORDING is his — "message did not send", as a red warning banner. The
//   server's own reason sits under it in smaller text, because the whole point
//   of the item is that the cause stops being invisible; the banner is what
//   you notice and the second line is what you tell somebody.
//
//   WHO SEES IT: everyone on staff in the thread, not only the sender. It was
//   scoped to your own message on the first pass; AC widened it. A teacher can
//   see that a message admin sent their family never arrived, and admin — who
//   is the only one who can actually fix "no email address on file" — sees it
//   on a teacher's message too.
//
// Still only on a STAFF-sent message: this answers "did what we sent reach
// the family". And still only when something did NOT go out — 'sent' and
// 'queued' draw nothing, and a message with no state at all predates the
// record and says nothing rather than claiming a failure it cannot evidence.
function rNotifyWarn(m){
  if(m.senderType!=='teacher' && m.senderType!=='admin') return '';
  var st=m.notifyState||'';
  if(st!=='none' && st!=='error') return '';
  return '<div class="msg-notify-warn"><b>'+esc(TCH_COPY.notSent)+'</b>'+
    (m.notifyDetail?'<span>'+esc(m.notifyDetail)+'</span>':'')+'</div>';
}

// ── Two lines in the thread, not a message (AC, 3 September 2026) ────────
// The shape both system lines use. AC on the "seen" note: "It should be two
// lines only. The header line with sender and timestamp, and 2nd line text
// message." No bubble, no border, no button — a note saying the studio has it,
// which cannot be replied to and is not something to read past.
// AC, 3 September: the note is "auto-response: [first name] has seen your
// message..." with a timestamp. The sender's name moved INTO the sentence when
// he rewrote it, so the header keeps the timestamp and drops the name — it was
// printing the same person twice, once above the line and once inside it.
// [1.249] — TWO SYSTEM ROWS, TWO LABELS, and they are not the same kind of row
// any more. AC settled this over four passes:
//
//   away auto-reply -> "auto-reply:"      italic, side rule
//   seen note       -> "System Message:"  italic, side rule
//
// His correction is the one that mattered: "for the seen message it shouldn't
// say 'auto reply' because it's not an auto reply." It is a notification about
// a person's action, not a reply sent on their behalf, and labelling both
// "auto-reply:" — which is where this had got to a pass earlier — would have
// made the label mean two different things.
//
// "System Message:" returns capitalised for the seen note ONLY. @697 replaced
// it with lower-case "auto-response:" on both rows; AC has put it back on the
// one row where it is accurate, and his capitalisation is kept exactly as his
// lower-case was then.
//
// NEITHER carries a sender name: the meta line is the timestamp alone. That is
// @697's rule and it removes the double-labelling flagged on two separate
// passes — the sender moved into the sentence when AC rewrote it.
var NOTE_LABEL_SEEN='System Message:';
var NOTE_LABEL_AUTO='auto-reply:';
function rNoteLine(m){
  return _rNote(NOTE_LABEL_SEEN, m.sentAt, m.messageText);
}
function _rNote(label, at, text, refFamilyId){
  return '<div class="note-line">'+
    '<div class="note-head">'+esc(fmtMsgTime(at))+'</div>'+
    '<div class="note-body"><span class="note-label">'+esc(label)+'</span>'+
      esc(text||'')+
      // ── [1.436] — a nudge goes THROUGH to the conversation it names ────
      //
      // AC, 8 September 2026: "nudges work, but it's confusing to see the
      // nudge in the admin-teacher conversation when it's about another
      // conversation. Not a big deal but it might be nice to link directly to
      // the message being referred to so the teacher can get right to it
      // without having to search or lose their place when trying to find the
      // message. This aspect is important for teacher satisfaction using the
      // tool. They need to love using this."
      //
      // The email has deep-linked since [1.21]; the row a teacher actually
      // reads in the portal never could, so being told you owe somebody a
      // reply ended in going to look for them.
      (refFamilyId
        ? '<button type="button" class="note-goto" onclick="openFamilyRow(\''+esc(refFamilyId)+'\')">'+
            esc(TCH_COPY.nudgeGoto)+'</button>'
        : '')+
    '</div>'+
    '</div>';
}

// The record of who closed a conversation, in the same shape. AC: "The admin
// should have a record of who closed the conversation on the message when
// closed in the message thread: one line like read receipt." Drawn from the
// row's own closedAt/closedByName rather than written as a message, so closing
// never adds anything to what a family is sent — this line is staff-only.
function rClosedLine(closedAt, closedByName, unanswered){
  if(!closedAt) return '';
  return '<div class="note-line">'+
    '<div class="note-body">'+esc(closedByName||'Someone')+' ended this conversation'+
      (unanswered?' <span class="unanswered-note">'+esc(TCH_COPY.endedUnanswered)+'</span>':'')+
      ' <span class="note-when">· '+esc(fmtMsgTime(closedAt))+'</span></div>'+
    '</div>';
}

// ── Per-message controls (AC, 3 September 2026) ──────────────────────────
// The only things anyone marks by hand, and both are private to this teacher.
// "Save for review" replaces mark-unread: it points at the message rather than
// the thread, it survives being read, and it is what puts the white circle on
// the roster row. "Mark seen" sends the two-line note above — a deliberate act,
// never automatic, and it does NOT stop the clock: the conversation goes on
// ageing and stays where it is until a real reply is sent. Being seen is not
// being answered.
function rMsgTools(m, mine){
  var saved = !!m.reviewAt;
  var h = '<div class="msg-tools">'+
    '<label class="rev-check'+(saved?' on':'')+'"><input type="checkbox"'+(saved?' checked':'')+
      ' onclick="event.stopPropagation();toggleReview(\''+esc(m.messageId)+'\',this.checked)"> '+
      // AC, 3 Sept (second pass): the label follows its state.
      esc(saved?TCH_COPY.savedForReview:TCH_COPY.saveForReview)+'</label>';
  // Only on a message someone else sent: marking your own message "seen" says
  // nothing to anybody.
  if(!mine){
    h += '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="event.stopPropagation();markSeen()">'+
      esc(TCH_COPY.markSeen)+'</button>';
  }
  // UNSEND IS ONE PRESS. There is no "are you sure", and its absence is the
  // decision rather than an omission.
  //
  // It had one, built to AC's rule for the link panel ("delete always asks",
  // and the confirm IS the write). That rule is right for a saved link, which
  // is gone forever the moment it goes. It is wrong here, and AC's own
  // 6 September instruction is why: the window is ten seconds, measured
  // against Gmail's, and in Gmail Undo is a single press. A confirm strip
  // would spend three or four of those ten seconds being read and answered —
  // a safety net that makes you likelier to miss the thing it protects.
  //
  // **The ten seconds IS the confirm.** Nothing here is irreversible the way a
  // deleted link is: the message has not been emailed, nobody has read it, and
  // the sender is looking straight at it.
  //
  // The gate is on AMEND.messageId rather than on this message, and that half
  // survives from the version that did ask — while ANY amendment is open, no
  // message offers either control. Two faults produced it, both found by
  // pressing the buttons in a browser: the confirm's Unsend landed directly
  // beneath an IDENTICAL Unsend and the one that wrote was the lower twin; and
  // the message being edited went on offering Edit, where pressing it would
  // have silently thrown away what was typed.
  if(mine && !AMEND.messageId && _canAmendMsg(m)){
    h += '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="event.stopPropagation();startEditMessage(\''+esc(m.messageId)+'\')">'+
      esc(TCH_COPY.editMsg)+'</button>'+
      '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="event.stopPropagation();unsendMessage(\''+esc(m.messageId)+'\')">'+
      esc(TCH_COPY.unsend)+'</button>';
  }
  return h+'</div>';
}

// [1.189]. The teacher asked the office a question about this family; the
// answer belongs beside the question, not in another screen. Replying here
// writes the same teacher_admin row the staff thread is built from, so the
// history stays in one place — AC: "logged in the separate teacher to admin
// pathway".
// ── [1.359] — the internal bubble is RETIRED ────────────────────────────
//
// A family thread used to draw staff-only notes among the family's messages,
// with their own reply box. AC, 7 September: "I'm seeing an issue with
// carrying on admin teacher private conversations in the actual family thread.
// This whole part of the tool seems like it was over built."
//
// One screen held two audiences, so every message on it had to be read twice —
// once for what it said and once for who could see it. Staff talk in the
// teacher↔admin thread now, and only there. rInternalBubble, internalReply and
// sendInternal are gone; INTERNAL and its copy went with them.

// [1.249] — the away auto-reply is now the SAME two-line shape as the seen
// note, with its own label. It used to be a collapsed bubble opened by
// clicking (AC, 1 Sept: an auto-response "collapses to one line and opens on
// click"), which existed because a full repeated bubble buried the
// conversation. As an italic, side-ruled, labelled note it no longer does, and
// a collapsed row that shows the label and the timestamp but not the sentence
// is a worse answer than simply showing the two lines. The collapse is
// therefore gone rather than restyled — worth one word from AC if he wants it
// back.
//
// Consecutive system rows are NOT grouped, deliberately. Three writers append
// them independently and none knows about the others: the away auto-reply, the
// seen note, and the daily nudge into teacher_admin. The stack of three in
// AC's Fig-03 is three NUDGES, and those stop existing in this same release
// when staff threads leave the overdue machinery ([1.242]). Grouping would be
// machinery for a problem the release already removes. If they still stack
// afterwards it is a real item then, raised on evidence.
function rAutoBubble(m,mine){
  return _rNote(NOTE_LABEL_AUTO, m.sentAt, m.messageText, m.refFamilyId||'');
}

// [1.249] — _bubbleAbout() was here and is gone. It put the child's name on
// the BUBBLE, which is the exact instance AC ruled out twice: "Don't have the
// child info on the message. It's in the header only." rThreadKids() above is
// where it lives now, once per conversation instead of once per message.

// [1.371] — the same optional sendAt as sendFamilyMessage, and the same
// rule: one read of what is being sent, whichever of the two it becomes.
function sendStaffMessage(sendAt){
  var t=ACTIVE_STAFF_THREAD;
  var _el=document.getElementById('staff-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  // [1.454] — a staff thread has no student and no parent, so the pills are
  // not offered here. A TEMPLATE can still carry a tag into one, and a tag
  // reaching another member of staff is the same fault with a smaller
  // audience. Same merge, same gate.
  html=_tplMerge(html);
  var _unfilledS=_tplUnfilledTags(html);
  if(_unfilledS.length){
    actFail('send', TCH_COPY.tagUnfilled.replace('{tags}',
      _unfilledS.map(function(x){ return TPL_TAG_LABELS[x]||x; }).join(', ')));
    render(); return;
  }
  var text=_composerPlain(html);
  var _att=_attTakeIds();   // [1.277]
  if(!text && !_att.length) return;
  // [1.402] — as in sendFamilyMessage above, sendAt included.
  // [1.428] — as in sendFamilyMessage above.
  if(_attAnyFailed()){ actFail('send', TCH_COPY.sendBlocked); render(); return; }
  if(_attAnyUploading()){ actFail('send', TCH_COPY.sendBlockedUploading); render(); return; }
  actClear('send');
  var reqData = t.contactType==='admin'
    ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN, messageText:text, messageHtml:html}
    : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:t.otherId, teacherToken:TOKEN, messageText:text, messageHtml:html};
  reqData.attachmentIds=_att;   // [1.277]
  if(sendAt) reqData.sendAt=sendAt;   // [1.371]
  // BACKLOG 1.158 — the sender's own per-message email override, read here
  // and cleared below so the next message starts unchecked again.
  if(t.emailToo) reqData.notifyByEmail=true;
  // Same optimistic path as sendFamilyMessage() above (BACKLOG 1.124 #2).
  var clientMsgId=_ktNewClientMsgId();
  reqData.clientMsgId=clientMsgId;
  var _attRows=ATT_PENDING.filter(function(x){ return x.attachmentId; })
    .map(function(x){ return {attachmentId:x.attachmentId, fileName:x.fileName,
                              mimeType:x.mimeType, sizeBytes:x.sizeBytes}; });
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(),
    attachments:_attRows, _pending:true   // [1.277]
  };
  // [1.371] — scheduled goes to the scheduled list, not into the thread.
  if(sendAt){ pending.sendAt=sendAt; t.scheduled=(t.scheduled||[]).concat([pending]); }
  else t.messages=t.messages.concat([pending]);
  t.draft='';
  _attClear();         // [1.277]
  TPL_USED=null; TPL_NAMING=false;   // [1.127] — sent, so there is nothing left to offer to save
  _draftKeep(t, '');   // [1.336]
  t.emailToo=false;
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  // [1.371] — a scheduled reply does not answer anybody yet.
  var _rowUndo=sendAt ? null : _setRowAnswered(t);   // [1.325] — same rule on a staff row
  render();

  api({action:'sendMessage', data:reqData}, function(e,r){
    if(!ACTIVE_STAFF_THREAD || ACTIVE_STAFF_THREAD.otherId!==t.otherId) return;
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      if(sendAt) t.scheduled=(t.scheduled||[]).filter(function(m){ return m!==pending; });
      else t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=html;
      ATT_PENDING=_attRows.map(function(a){ return {tempId:'t'+a.attachmentId, fileName:a.fileName,   // [1.277]
        mimeType:a.mimeType, sizeBytes:a.sizeBytes, uploading:false, attachmentId:a.attachmentId}; });
      ATT_BUSY=0;
      _draftKeep(t, html);   // [1.336]
      _undoRowAnswered(_rowUndo);    // [1.325]
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
      pending.amendUntil=r.message.amendUntil||0;
      if(r.message.sendAt) pending.sendAt=r.message.sendAt;   // [1.371]
      if(r.message.attachments) pending.attachments=r.message.attachments;   // [1.277]
    }
    if(sendAt){
      // [1.404] — the act is confirmed here, on the server's answer, not when
      // the button was pressed. A confirmation shown before the round trip is
      // a promise rather than a fact.
      // [1.462] — NO DUPLICATE BANNER. AC, 9 September 2026, one line: *"no
      // duplicate banner."*
      //
      // The scheduled bubble already reads "Message scheduled. It will be sent on
      // …" — his own wording from [1.415] — so a banner saying it again is two
      // things saying one thing, which is [1.455] in a different place. He timed the
      // gap between them at 5-8 seconds and it was confusing at any gap.
      //
      // **The WORKING state stays**: it explains the wait, and nothing else does.
      // **The FAILED state stays**: it is the one a person must act on. Only the
      // second confirmation goes.
      actClear('send');
      _schedInvalidate(); render(); return;
    }   // [1.371]
    if(_canAmendMsg(pending)) render();   // [1.276] — see sendFamilyMessage
  });
}

// Polls every 5s for new activity: the active thread's list (family or
// staff, whichever tab is open) plus whichever conversation is currently
// expanded, via the lock-free doGetMessagesSince() so this never trips the
// shared save-lock or marks anything read on its own (see the matching
// comment in Code.js). Paused while the tab isn't visible.
function _startMessagePolling(){
  if(_pollTimer) return;
  _pollTimer=setInterval(_pollTick,5000);
  // Coming back to the tab refreshes at once rather than waiting out the rest
  // of the interval (AC, 1 Sept: "can the tool load new messages upon login so
  // I can access right away?"). Polling pauses while hidden, so without this
  // the worst case is a full 5 seconds of stale screen at exactly the moment
  // someone is looking. Cheap now that a poll with nothing to report never
  // touches the messages sheet (1.159).
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') _pollTick();
  });
  window.addEventListener('focus',_pollTick);
}
// ── [1.293] — the poll fits inside its own interval ─────────────────────
//
// It ran every five seconds and made up to THREE requests: the family roster,
// the staff roster, and the open thread. At the ~2s fixed cost measured in
// [1.263], three sequential requests do not fit in five seconds — so they
// overlapped, and a slow answer could land on top of a newer one. Seven
// teachers on the 22nd is four requests a second against one script with a
// shared lock.
//
// [1.292] took the two rosters down to one. This adds the other half: a tick
// that finds the previous request still in flight SKIPS rather than queueing
// behind it — see THREADS._inFlight in loadThreads and _thrPollBusy below.
// Skipping is right rather than merely cheap: the answer that is already on
// its way is newer than the one this tick would have asked for.
// [1.383] — the amendment watermark, one per portal. It is the server clock
// from the last poll that was actually applied, sent straight back so the
// server can tell "has anything happened to a row this client already holds"
// apart from "is there a newer message". Without it a read receipt could never
// reach an open thread, and one edit put the client on a full sheet read
// forever. Advanced ONLY on a poll whose answer was used.
var _ktPollAmendAt=0;
var _thrPollBusy=false;
var _thrPollBusyAt=0;   // [1.400] — when, so the guard can expire
function _pollTick(){
  if(document.hidden || !TOKEN) return;
  _schedSweepDue();   // [1.410] — no request unless something is actually due
  if(HOME_TAB==='family'){
    // BACKLOG 1.124 #1. This was gated on FAMILY_VIEW==='list', which was
    // right while a thread REPLACED the roster and wrong the moment @650 put
    // both panes on screen: unread badges and previews froze for as long as a
    // conversation stayed open. Polled in both views now — the fetch is the
    // same one, and it is what also delivers the messaging lock flag.
    loadThreads(true);   // [1.292] — one roster, and it guards itself
    if((!_thrPollBusy || _guardStale(_thrPollBusyAt)) && FAMILY_VIEW==='thread' && ACTIVE_THREAD && !ACTIVE_THREAD.loading && !ACTIVE_THREAD._sendInFlight){
      var ft=ACTIVE_THREAD;
      _thrPollBusy=true; _thrPollBusyAt=Date.now();   // [1.400]
      api({action:'getMessagesSince', data:{conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN, sinceSentAt:String(_maxSentAt(ft.messages)||0), sinceAmendAt:String(_ktPollAmendAt||0)}}, function(e,r){
        _thrPollBusy=false;
        if(!ACTIVE_THREAD||ACTIVE_THREAD.familyId!==ft.familyId) return;
        if(e||!r||!r.ok) return;
        if(r.now) _ktPollAmendAt=Number(r.now)||_ktPollAmendAt;   // [1.383]
        // [1.276] — the duplication guard this used to hold inline lives in
        // _applyPoll now, alongside the two things it could not do: replace an
        // edited message in place, and remove one that was unsent.
        var _res=_applyPoll(ACTIVE_THREAD.messages, r);
        // [1.371] — before the early return below, because a scheduled message
        // can change with no message having arrived: edited in another tab,
        // cancelled on a phone. A tick that returned early would leave the old
        // bubble on screen until the thread was reopened.
        var _sch=_applySchedPoll(ACTIVE_THREAD, r);
        if(!_res.changed){ if(_sch) render(); return; }
        ACTIVE_THREAD.messages=_res.list;
        THREAD_CACHE[_threadCacheKey({conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID})]=ACTIVE_THREAD.messages;
        // Only something ARRIVING scrolls the thread. A message vanishing
        // under the reader must not also throw them to the bottom.
        if(_res.added) _shouldScrollMsgList=true;
        render();
        if(!_res.added) return;
        // [1.263] — a message that ARRIVES while you are looking at the thread
        // has been read as surely as one that was there when you opened it.
        // The old shape only ever stamped on open, so anything delivered by
        // the poll stayed unread until the thread was opened again.
        _markThreadRead({conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN});
      });
    }
  } else {
    loadThreads(true);   // [1.292] — the same one roster, in either view
    if((!_thrPollBusy || _guardStale(_thrPollBusyAt)) && STAFF_VIEW==='thread' && ACTIVE_STAFF_THREAD && !ACTIVE_STAFF_THREAD.loading && !ACTIVE_STAFF_THREAD._sendInFlight){
      var st=ACTIVE_STAFF_THREAD;
      _thrPollBusy=true; _thrPollBusyAt=Date.now();   // [1.400]
      var reqData=st.contactType==='admin'
        ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
        : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:st.otherId, teacherToken:TOKEN};
      reqData.sinceSentAt=String(_maxSentAt(st.messages)||0);
      reqData.sinceAmendAt=String(_ktPollAmendAt||0);   // [1.383]
      api({action:'getMessagesSince', data:reqData}, function(e,r){
        _thrPollBusy=false;
        if(!ACTIVE_STAFF_THREAD||ACTIVE_STAFF_THREAD.otherId!==st.otherId) return;
        if(e||!r||!r.ok) return;
        if(r.now) _ktPollAmendAt=Number(r.now)||_ktPollAmendAt;   // [1.383]
        var _res=_applyPoll(ACTIVE_STAFF_THREAD.messages, r);   // [1.276]
        var _sch=_applySchedPoll(ACTIVE_STAFF_THREAD, r);        // [1.371]
        if(!_res.changed){ if(_sch) render(); return; }
        ACTIVE_STAFF_THREAD.messages=_res.list;
        THREAD_CACHE[_threadCacheKey(reqData)]=ACTIVE_STAFF_THREAD.messages;
        if(_res.added) _shouldScrollMsgList=true;
        render();
        if(!_res.added) return;
        _markThreadRead({conversationType:reqData.conversationType, teacherId:TEACHER_ID, staffId2:reqData.staffId2, teacherToken:TOKEN});   // [1.263]
      });
    }
  }
}

function doSignOut(){
  _ktClearSession();
  // [1.336] — drafts are this teacher's unsent words on a shared machine.
  DRAFTS={}; try{ localStorage.removeItem('kl_teacher_drafts'); }catch(e){}
  // [1.465] — this teacher's shelves go with them off a shared machine, and so
  // does the panel's open state. The remembered FILTER stays: it is a tag
  // preference, not anybody's material, and it is what makes the next sign-in
  // two clicks instead of four.
  PICK=''; PICK_Q=''; LINK_ADDED={}; LIBRARY_OPEN=false; LIB_EDIT=''; LIB_DEL=''; LIB_KEPT={};
  LIB_MINE=[]; LIB_SHELF_STUDIO=[]; LIB_TAGS=[]; _libLoaded=false; _libInFlight=false;
  if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; }
  TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
  LF={email:'', password:'', remember:true};
  HOME_TAB='family';
  _openPane('');   // [1.336] — both flags, both threads, one call
  THREADS={loading:false, list:[], _sig:'', locked:false};   // [1.292]
  STAFF_PICKER={loading:false, query:'', all:[]};
  PAGE='login'; render();
}

// ============================================================
// INIT
// ============================================================
// [1.137] — this browser's own id, made once and kept. It IDENTIFIES, it does
// not authenticate: all it ever says is "the same device that claimed this
// link is asking again". It is not in the email, so forwarding the email does
// not carry it.
//
// A browser with storage switched off gets no id and cannot claim. The server
// lets that click through rather than refusing it — being unable to bind is
// not a reason to lock a real parent out of their own portal.
function _ktDeviceId(){
  try{
    var id=localStorage.getItem('kl_device');
    if(!id){
      id=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
      localStorage.setItem('kl_device', id);
    }
    return id;
  }catch(e){ return ''; }
}
// Set once boot() has settled the emailed link, so re-entering boot() below
// does not try to claim it a second time. _magicRefused blanks the token on
// that second pass — a link belonging to somebody else's device has to be
// treated as if it were never in the URL at all.
var _magicSettled=false, _magicRefused=false;
function boot(){
  _draftsLoad();   // [1.336] — anything unsent from last time is back before the first render
  // [1.465] — and the remembered library filter, which is the biggest of the
  // four savings AC scoped: a piano teacher's "piano" is still on when they
  // open the picker, so the common case is two clicks rather than four.
  _libFilterLoad();
  var resetTokenFromUrl = '';
  var loginTokenFromUrl = '';
  try {
    var params = new URLSearchParams(window.location.search);
    resetTokenFromUrl = params.get('resetToken') || '';
    loginTokenFromUrl = params.get('token') || '';
    // BACKLOG 1.124 #3 — the notification email now names the conversation
    // it is about, so a teacher lands on the message rather than the roster.
    // Consumed once, by loadFamilyThreads(), which is the first point the
    // family's name is known.
    _pendingOpenFamilyId = params.get('openFamilyId') || '';
  } catch(e) { /* URLSearchParams unsupported — treat as no token */ }

  // ── [1.137] — settle the emailed link before anything else ────────────
  // An emailed link is a working key, and until now a year-long reusable one:
  // a forwarded email handed over a year of portal access. The first device to
  // use a link now claims it; a different device finds it claimed and gets the
  // ordinary login screen, which is exactly what AC asked a second click
  // should do on 28 August.
  //
  // Run BEFORE the token is used, and boot() is re-entered once it answers, so
  // everything downstream is the code that was already there rather than a
  // second copy of it.
  if(loginTokenFromUrl && !_magicSettled){
    // THE SESSION THIS BROWSER ALREADY HAS WINS. It is what keeps a parent
    // re-opening the same email untouched, and it stops a perfectly good link
    // being spent by a device that did not need it.
    var _sess=null;
    try{ _sess=_ktReadSession(); }catch(e){ _sess=null; }
    if(_sess && _sess.token){
      _magicSettled=true; _magicRefused=true;   // ignore the link entirely
    } else {
      _magicSettled=true;
      api({action:'claimMagicLink', data:{kind:'teacher', token:loginTokenFromUrl,
                                          deviceId:_ktDeviceId()}}, function(ce,cr){
        if(ce||!cr||!cr.ok){
          _magicRefused=true;
          showMsg((cr&&cr.reason==='claimed') ? TCH_COPY.linkClaimed : TCH_COPY.linkExpired, 'e');
        }
        boot();
      });
      return;
    }
  }
  if(_magicRefused) loginTokenFromUrl='';

  if(loginTokenFromUrl){
    // Magic link from a do-not-reply notification email — a fully valid
    // teacher session token already, minted server-side the same way a
    // normal login does (_mintTeacherMagicLink in Code.js). Mirrors the
    // family portal's identical ?token= handling in boot().
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal */ }
    TOKEN = loginTokenFromUrl;
    _ktSaveSession(TOKEN, '', '');
    // Falls through to the remembered-session block below, which re-reads
    // what was just saved and validates it via teacherCheckSession — same
    // reasoning as the family portal: an invalid/expired token drops back
    // to login with a clear message instead of a populated-looking shell.
  }

  if(resetTokenFromUrl){
    // Strip the token out of the address bar immediately — single-use,
    // short-lived credential, never something to bookmark. Mirrors the
    // family portal's identical boot()-time handling.
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal */ }

    RESET_TOKEN = resetTokenFromUrl;
    PAGE = 'setpw';
    SPW.checking = true;
    render();
    api({action:'teacherValidateResetToken', data:{resetToken:resetTokenFromUrl}}, function(e2,r2){
      SPW.checking = false;
      if(e2||!r2||!r2.ok){
        SPW.invalid = true;
        SPW.email = (r2&&r2.email)||'';
      } else {
        SPW.email = r2.email||'';
      }
      render();
    });
    return;
  }

  var saved = _ktReadSession();
  if(saved && saved.token){
    TOKEN = saved.token;
    api({action:'teacherCheckSession', data:{teacherToken:saved.token}}, function(e,r){
      // [1.181] — a failed REQUEST is not an invalid LOGIN. This used to treat
      // them the same and delete the saved session, so a dropped connection,
      // a phone waking on bad wifi, or an Apps Script hiccup logged the
      // teacher out permanently. It is also what emptied every remembered
      // login during the 1 Sept outage. Only the server saying so clears it.
      if(e||!r){ _ktBootRetry(saved); return; }
      if(r.ok){
        TEACHER_ID = r.teacherId;
        TEACHER_NAME = r.teacherName||'';
        _ktSaveSession(TOKEN, TEACHER_ID, TEACHER_NAME);
        PAGE = 'home';
        render();
        loadFamilyThreads();
        // Both rosters, not just the visible one — otherwise the staff badge
        // reads zero on every return visit until the tab is opened, which is
        // 1.161 #1 all over again. Missed on this path when that was fixed.
        loadStaffThreads(true);
        _startMessagePolling();
        loadTeacherSettings();
        loadScheduled();   // [1.373]
      } else {
        _ktClearSession();
        TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
        PAGE = 'login';
        render();
      }
    });
    return;
  }

  PAGE = 'login';
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  boot();
});
</script>
</body>
</html>
