// in the DOM would vanish under the teacher's hand five seconds later.
// ── [1.494] — WHICH picker is open inside the composer: '' | 'file' | 'link'.
// There is no Library button any more (AC: "is there really a reason to have
// a library button here at all?" — no). Add file and Add link each open their
// own picker at once, with the new thing at the top and the library below.
var PICK='';
var PICK_Q='';            // the picker's own search, so the manager's remembered filter cannot hide files here
var LINK_ADDED={};
var LINK_SELECTED='';     // the saved link whose address and text are in the fields, awaiting Add link        // library link ids inserted into the OPEN message — "Link added" on the row
// [1.481] — the panel drawn on the home page rather than inside a composer.
// The flag is set for the length of one render and cleared straight after, so
// nothing else in the file has to know about it.
var LIBRARY_OPEN=false, LIB_STANDALONE=false;
var LIB_FILTER=[];        // tag ids, and 'p:<word>' for a teacher's own words
var LIB_Q='';
var LIB_EDIT='';          // the attachmentId whose row is opened for editing
var LIB_DEL='';           // the attachmentId a delete is being confirmed for
var LIB_MINE=[], LIB_SHELF_STUDIO=[], LIB_TAGS=[];
// [1.471] — and the LINKS on the same two shelves. AC: *"one library seems
// best"*, then the instruction that shapes the screen: *"teachers will need a
// visual separation of files and site links."* So they are held apart here and
// drawn apart below — one shelf, two labelled groups.
var LIB_MY_LINKS=[], LIB_STUDIO_LINKS=[];
var _libLoaded=false, _libInFlight=false;

// THE FILTER REMEMBERS — saving #1, and the only piece of this that survives a
// reload. Kept where the drafts and the session are kept, and read through the
// same try/catch: a browser with storage blocked gets a working picker with no
// memory rather than a broken one.
var LIB_FILTER_KEY='kl_teacher_libfilter';
function _libFilterSave(){
  try{ localStorage.setItem(LIB_FILTER_KEY, JSON.stringify(LIB_FILTER)); }catch(e){}
}
function _libFilterLoad(){
  try{
    var raw=JSON.parse(localStorage.getItem(LIB_FILTER_KEY)||'[]');
    LIB_FILTER=Object.prototype.toString.call(raw)==='[object Array]'?raw:[];
  }catch(e){ LIB_FILTER=[]; }
}
// A remembered filter is DROPPED when what it names is gone — a retired tag, or
// a private word whose last file was deleted. Left standing it would filter
// every file out, and the picker would open empty and read as broken by the one
// feature meant to save time. Run after every load of the shelves.
function _libFilterPrune(){
  var live={};
  LIB_TAGS.forEach(function(t){ live[t.tagId]=true; });
  LIB_MINE.concat(LIB_MY_LINKS).forEach(function(f){
    (f.privateTags||[]).forEach(function(w){ live['p:'+w]=true; });
  });
  var kept=LIB_FILTER.filter(function(v){ return !!live[v]; });
  if(kept.length!==LIB_FILTER.length){ LIB_FILTER=kept; _libFilterSave(); }
}

// ── Fetched BEFORE it is asked for ──────────────────────────────────────
// [1.333]'s finding, and the reason it is worth repeating here: AC pressed Link
// and waited five to ten seconds for a list that could have been fetched while
// he was reading the thread. Both requests go out when the roster loads, so the
// panel opens instantly — which is the whole promise of "no upload wait".
function loadLibrary(force, shelvesOnly){
  if(force){ _libLoaded=false; _libInFlight=false; }
  if(_libLoaded || _libInFlight) return;
  _libInFlight=true;
  api({action:'getLibrary', data:{teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    _libInFlight=false; _libLoaded=true;
    if(!e && r && r.ok){
      LIB_MINE=(r.mine||[]).map(_libNormFile);
      LIB_SHELF_STUDIO=(r.studio||[]).map(_libNormFile);
      LIB_MY_LINKS=(r.myLinks||[]).map(_libNormLink);
      LIB_STUDIO_LINKS=(r.studioLinks||[]).map(_libNormLink);
    }
    _libFilterPrune();
    // [1.485] — the panel, not the page. The shelves are the only thing this
    // answer changes, and a poll landing at the same moment should not have the
    // whole screen rebuilt twice.
    _libRedraw();
  });
  // [1.485] — only when the vocabulary could have changed. A shelf refresh
  // after a rename does not need to ask AC's tag list again.
  if(shelvesOnly && LIB_TAGS.length) return;
  api({action:'getTags', data:{teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(!e && r && r.ok) LIB_TAGS=r.tags||[];
    _libFilterPrune();
    _libRedraw();
  });
}
// [1.485] — a refresh re-reads the SHELVES. It used to re-read the tag
// vocabulary with them, which is a second request after every rename, every
// save and every delete for a list that changes when AC edits Settings. The
// tags are re-read when something could actually have changed them.
function _libRefresh(){
  _libLoaded=false; _libInFlight=false;
  loadLibrary(false, true);
}

// ── [1.471] — one shape for a file and a link ───────────────────────────
//
// A link is given the same field names a file has — `id`, `fileName`, `tags` —
// so **every rule already written works on both without being written twice**:
// the filter, the search, the tag-narrowing, the remembered filter's pruning.
// What differs is drawn, not decided: a badge, a second line, and what pressing
// the row does.
function _libNormFile(f){ f.kind='file'; f.id=f.attachmentId; return f; }
function _libNormLink(l){
  l.kind='link'; l.id=l.linkId;
  l.fileName=l.label;   // the name every filter and search already reads
  return l;
}
function _libLinkHost(url){
  var m=String(url||'').match(/^https?:\/\/([^\/?#]+)/i);
  return m?m[1].replace(/^www\./i,''):String(url||'');
}
function _libAllItems(){
  return LIB_MINE.concat(LIB_MY_LINKS, LIB_SHELF_STUDIO, LIB_STUDIO_LINKS);
}

// ── Filtering: tags AND text, narrowing ONE list ────────────────────────
// AC: *"Admin and teachers should be able to use both tags and text search at
// the same time... like the tags 'scales' and 'piano' and text 'Hanon'."* Not a
// tag view and a search view — the same list, narrowed by both at once.
function _libTagName(id){
  for(var i=0;i<LIB_TAGS.length;i++) if(LIB_TAGS[i].tagId===id) return LIB_TAGS[i].name||'';
  return '';
}
function _libMatch(f, filter, q){
  for(var i=0;i<filter.length;i++){
    var v=filter[i];
    if(v.indexOf('p:')===0){
      if((f.privateTags||[]).indexOf(v.slice(2))<0) return false;
    } else if((f.tags||[]).indexOf(v)<0) return false;
  }
  if(q){
    // The tag NAMES are in the haystack too, so typing "scales" finds the file
    // whether that word is on the tag or in the filename — a teacher should not
    // have to know which.
    var hay=String(f.fileName||'');
    (f.tags||[]).forEach(function(t){ hay+=' '+_libTagName(t); });
    (f.privateTags||[]).forEach(function(w){ hay+=' '+w; });
    if(hay.toLowerCase().indexOf(q.toLowerCase())<0) return false;
  }
  return true;
}
function _libFiltered(list){
  return (list||[]).filter(function(f){ return _libMatch(f, LIB_FILTER, LIB_Q); });
}
// TAGS NARROW THEMSELVES — saving #2. A tag is offered only if pressing it
// would leave something on screen, so no sequence of presses can reach an empty
// list. A tag already ON is always offered, or there would be no way to press
// it off again.
function _libOffered(){
  var all=_libAllItems();
  var out=[];
  LIB_TAGS.forEach(function(t){
    if(LIB_FILTER.indexOf(t.tagId)>-1){ out.push({v:t.tagId, name:t.name, priv:false}); return; }
    var next=LIB_FILTER.concat([t.tagId]);
    for(var i=0;i<all.length;i++){
      if(_libMatch(all[i], next, LIB_Q)){ out.push({v:t.tagId, name:t.name, priv:false}); return; }
    }
  });
  // A teacher's own words, gathered from their own files — there is no
  // vocabulary to read them from, which is the point of a private tag.
  var seen={};
  var ownItems=LIB_MINE.concat(LIB_MY_LINKS);
  ownItems.forEach(function(f){ (f.privateTags||[]).forEach(function(w){ seen[w]=true; }); });
  Object.keys(seen).sort().forEach(function(w){
    var v='p:'+w;
    if(LIB_FILTER.indexOf(v)>-1){ out.push({v:v, name:w, priv:true}); return; }
    var next=LIB_FILTER.concat([v]);
    for(var i=0;i<ownItems.length;i++){
      if(_libMatch(ownItems[i], next, LIB_Q)){ out.push({v:v, name:w, priv:true}); return; }
    }
  });
  return out;
}

// ── Opening, filtering, closing ─────────────────────────────────────────
// ── [1.494] — THE TWO PICKERS ───────────────────────────────────────────
//
// AC, 10 September 2026, after four passes over a mockup drawn in the
// portal's own styles: two buttons beside Send, no Library button. Each opens
// its picker on the first press — "the button functions should get the
// teacher to the file or link picker immediately" — with the way to add a NEW
// one at the top (the device chooser; the paste row) and the library below,
// holding ONLY that kind: "it shouldn't open 'My links and files' if we're
// adding a file." Tap one or several. The row itself says File attached / Link
// added, where the thumb is, because the old panel's answer landed under the
// composer out of view and read as "nothing happens." Edit Message, beside
// Send, is the way back to writing. Manage Library, at the foot, opens the
// full My Library overlay — the manager is only ever there now ([1.495]).
function pickOpen(kind, composerId){
  if(PICK===kind){ pickClose(composerId); return; }   // the pressed button, pressed again
  PICK=kind; PICK_Q='';
  _libComposerId=composerId||_libComposerId;
  loadLibrary();
  render();
  // The paste row's own opener: it remembers the highlighted words so a link
  // lands over them, pre-fills the text, and puts the cursor in the address.
  if(kind==='link') _composerLinkOpen(_libComposerId);
}
function pickClose(composerId){
  PICK=''; PICK_Q='';
  var id=composerId||_libComposerId;
  render();
  // Edit Message: back in the box, caret at the end, no scroll jump.
  var el=id?document.getElementById(id):null;
  if(!el) return;
  _focusNoScroll(el);
  try{
    var r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
}
function pickSearch(v){ PICK_Q=String(v||''); _pickRedraw(); }
// A press on a row. A file becomes one of [1.277]'s chips through libAttach;
// a link goes into the words through the same insertion the paste row uses.
// Either way the ROW says so — see rPickRow — and the picker stays open for
// the next one.
function pickUse(id, composerId){
  var it=_pickFind(id); if(!it) return;
  // AC, 11 September: a saved link FILLS the address and the text, so the
  // words can be edited, and Add link is what inserts it — like Gmail. The
  // text keeps whatever was highlighted; the link's name fills it otherwise.
  if(it.kind==='link'){
    var cid=composerId||_libComposerId;
    var st=_cmpLinkState(cid);
    st.url=it.url; st.bad=false;
    if(!st.text) st.text=it.label||it.fileName||'';
    LINK_SELECTED=id;
    _pickRedraw();
    var t=document.getElementById(cid+'-linktext');
    if(t){ _focusNoScroll(t); try{ t.setSelectionRange(t.value.length, t.value.length); }catch(e){} }
    return;
  }
  libAttach(id, composerId);
}
// The picker's items. Files: the two shelves' files. Links: the two shelves'
// links, plus a teacher's older quick links ([1.338], a separate sheet) that
// are not already on the shelf by address — so nothing a teacher saved before
// the library existed disappears from the one place they now look for it.
function _pickFiles(mine){ return _pickFiltered(mine?LIB_MINE:LIB_SHELF_STUDIO); }
function _pickLinks(mine){
  if(!mine) return _pickFiltered(LIB_STUDIO_LINKS);
  var have={}; LIB_MY_LINKS.forEach(function(l){ have[String(l.url||'').toLowerCase()]=true; });
  var extra=(SAVED_LINKS||[]).filter(function(l){ return !have[String(l.url||'').toLowerCase()]; })
    .map(function(l){ return {kind:'link', id:'q:'+l.linkId, url:l.url, label:l.label, fileName:l.label, tags:[], privateTags:[]}; });
  return _pickFiltered(LIB_MY_LINKS.concat(extra));
}
function _pickFiltered(list){ return (list||[]).filter(function(f){ return _libMatch(f, [], PICK_Q); }); }
function _pickFind(id){
  var it=_libFind(id); if(it) return it;
  return _pickLinks(true).filter(function(x){ return x.id===id; })[0]||null;
}
// Redraws the picker and nothing else — [1.485]'s rule for the manager,
// applied here: typing in the search must not rebuild the page under the
// keyboard. Keeps the field's focus and caret, and each shelf's scroll.
function _pickRedraw(){
  var panel=document.getElementById('pick-panel');
  if(!panel){ render(); return; }
  var tops=[];
  Array.prototype.forEach.call(panel.querySelectorAll('.lib-list'), function(l){ tops.push(l.scrollTop); });
  var act=document.activeElement;
  var actId=(act && panel.contains(act) && act.id) ? act.id : '';
  var selStart=null, selEnd=null;
  if(actId && act.setSelectionRange){ try{ selStart=act.selectionStart; selEnd=act.selectionEnd; }catch(e){} }
  var tmp=document.createElement('div');
  tmp.innerHTML=rPickPanel(_libComposerId);
  var fresh=tmp.firstChild;
  if(!fresh){ render(); return; }
  panel.innerHTML=fresh.innerHTML;
  Array.prototype.forEach.call(panel.querySelectorAll('.lib-list'), function(l, i){ if(tops[i]) l.scrollTop=tops[i]; });
  if(actId){
    var back=document.getElementById(actId);
    if(back){ _focusNoScroll(back); if(selStart!==null && back.setSelectionRange){ try{ back.setSelectionRange(selStart, selEnd); }catch(e){} } }
  }
}
// ── [1.495] — MY LIBRARY IS AN OVERLAY ──────────────────────────────────
// AC: "The library does not fit in the side panel. It should open as an
// overlay that has a clear obvious x to close the window." Opened from the
// My Library row in the side panel and from Manage Library in either picker;
// closed by its ×, the dimmed page behind it, or Escape.
function libraryOpen(){ LIBRARY_OPEN=true; LIB_EDIT=''; LIB_DEL=''; loadLibrary(); render(); }
function libraryClose(){ LIBRARY_OPEN=false; LIB_EDIT=''; LIB_DEL=''; LIB_ADD_LINK=false; render(); }
document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && LIBRARY_OPEN) libraryClose(); });
function rLibraryOverlay(){
  if(!LIBRARY_OPEN) return '';
  LIB_STANDALONE=true;
  var panel=rLibraryPanel('');
  LIB_STANDALONE=false;
  return '<div class="lib-scrim" onclick="libraryClose()"></div>'+
    '<div class="lib-modal" role="dialog" aria-modal="true" aria-label="'+esc(TLIB_COPY.manageHead)+'">'+
      '<div class="lib-modal-hd"><span class="lib-modal-t">'+esc(TLIB_COPY.manageHead)+'</span>'+
        '<button type="button" class="modal-x" aria-label="'+esc(TLIB_COPY.close)+'" onclick="libraryClose()">&#215;</button></div>'+
      panel+
    '</div>';
}

// ── [1.485] — REDRAW THE PANEL, NOT THE PAGE ────────────────────────────
//
// **AC:** *"All of the buttons should be instantly responsive and saving
// actions rendering etc should be kept to the most efficient pathway so that it
// is smooth reliable and stable."*
//
// `render()` rebuilds #app — every thread, every roster row, every composer —
// and then puts the caret, the message list and the shelves back. That is the
// right price for a message arriving; it is a wild overpayment for ticking a
// box. **This redraws the panel and nothing else**, keeping the two things a
// rebuild takes: the scroll of each shelf, and the focus and caret of whatever
// field is being typed in.
//
// Falls back to a full render when the panel is not on screen, so no caller
// has to know which case it is in.
function _libRedraw(){
  var panel=document.getElementById('lib-panel');
  if(!panel){ render(); return; }
  var tops=[];
  Array.prototype.forEach.call(panel.querySelectorAll('.lib-list'), function(l){ tops.push(l.scrollTop); });
  var act=document.activeElement;
  var actId=(act && panel.contains(act) && act.id) ? act.id : '';
  var selStart=null, selEnd=null;
  if(actId && act.setSelectionRange){
    try{ selStart=act.selectionStart; selEnd=act.selectionEnd; }catch(e){}
  }
  var tmp=document.createElement('div');
  LIB_STANDALONE=true;
  tmp.innerHTML=rLibraryPanel('');
  LIB_STANDALONE=false;
  var fresh=tmp.firstChild;
  if(!fresh){ render(); return; }
  // The INNER html is swapped, so the node the browser is scrolling stays the
  // same node and the scroll positions above are still about it.
  panel.innerHTML=fresh.innerHTML;
  Array.prototype.forEach.call(panel.querySelectorAll('.lib-list'), function(l, i){
    if(tops[i]) l.scrollTop=tops[i];
  });
  if(actId){
    var back=document.getElementById(actId);
    if(back){
      _focusNoScroll(back);
      if(selStart!==null && back.setSelectionRange){
        try{ back.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}
function libTag(v){
  var i=LIB_FILTER.indexOf(v);
  if(i>-1) LIB_FILTER.splice(i,1); else LIB_FILTER.push(v);
  _libFilterSave();
  _libRedraw();
}
function libClearFilter(){ LIB_FILTER=[]; LIB_Q=''; _libFilterSave(); _libRedraw(); }
// The search box keeps its own value in JS and redraws only the LIST, never
// itself — [1.17]'s Pattern B, and the reason is the same: a full render()
// while somebody is typing takes the caret with it.
function libSearch(v){
  LIB_Q=String(v||'');
  var el=document.getElementById('lib-body');
  if(el) el.innerHTML=rLibraryBody();
}

function _libFind(id){
  var all=_libAllItems();
  for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i];
  return null;
}
function _libIsLink(id){ var it=_libFind(id); return !!(it && it.kind==='link'); }

// ── ATTACHING, which is the payoff ──────────────────────────────────────
// AC: *"press Library, pick, and it attaches with no upload wait at all — the
// file is already in Drive."* The chip is [1.277]'s, so it removes the same
// way, and Send waits on it the same way — one shape for a file that came off a
// shelf and a file that came off a phone.
function libAttach(id, composerId){
  var it=_libFind(id); if(!it) return;
  // [1.471] — a LINK is not an attachment and must not pretend to be one: it
  // goes into the words of the message, through the same insertion the Link
  // button already uses. Nothing is uploaded, nothing is bound, and the family
  // gets an address they can open on any device.
  if(it.kind==='link'){ _libInsertLink(it, composerId); return; }
  if(ATT_PENDING.length >= ATT_MAX_FILES){ showMsg(TCH_COPY.attachTooMany,'e'); return; }
  var f=it;
  // Pressing a row twice is a press, not an intention. Two chips of one file
  // would send a family the same attachment twice, and the second is
  // indistinguishable from the first on the tile — so the shelf entry a chip
  // came from is remembered and the second press says so instead.
  for(var i=0;i<ATT_PENDING.length;i++){
    if(ATT_PENDING[i].fromLibrary===id) return;   // [1.494] — the row already says File attached
  }
  var rec={tempId:'t'+Date.now()+Math.random(), fileName:f.fileName, mimeType:f.mimeType,
           sizeBytes:f.sizeBytes, uploading:true, attachmentId:'', fromLibrary:id};
  ATT_PENDING.push(rec); ATT_BUSY++;
  // The panel stays OPEN. A teacher attaching three pieces of music should not
  // have to press Library three times, and closing it would be the tool
  // deciding they are finished.
  render();
  api({action:'attachFromLibrary', data:{attachmentId:id, teacherId:TEACHER_ID, teacherToken:TOKEN}},
  function(e,r){
    if(e||!r||!r.ok||!r.attachment){
      _attFail(rec,(r&&r.error)||TLIB_COPY.attachFailed);
      // A shelf entry outlives its file when somebody deletes it, and the
      // server refuses to attach a ghost ([1.464]). The row has to LEAVE the
      // list at that point: offered again, it fails again, and the teacher is
      // left pressing something that cannot work.
      if(r && /no longer available/i.test(r.error||'')) _libRefresh();
      return;
    }
    rec.uploading=false;
    rec.attachmentId=r.attachment.attachmentId;
    rec.fileName=r.attachment.fileName;
    ATT_BUSY--; render();
  });
}

// The link goes in at the cursor, with its NAME as the words — the teacher's
// own label, which is why naming one is worth a moment. [1.34]'s rule holds:
// nothing about this uses a browser dialog.
function _libInsertLink(it, composerId){
  var id=composerId||_libComposerId;
  if(!id || !document.getElementById(id)){ showMsg(TLIB_COPY.linkNoComposer,'e'); return; }
  _composerInsertLink(id, it.url, it.label||it.fileName||it.url);
}
// Which composer this panel belongs to. Set when the panel is drawn, because
// the two composers in this portal are the same function called twice and the
// panel has to insert into the one it is inside.
var _libComposerId='';

// ── SAVE TO LIBRARY ─────────────────────────────────────────────────────
// The other half of AC's design, and the one that means a teacher never has to
// think about building a library: they send this week's scales, press Save, and
// it is there next week.
//
// **A teacher may keep what a family sent them** — AC overturned my rule
// against it ([1.464]) and was right: they can already download it, so refusing
// only pushed the file out of the tool.
var LIB_KEPT={};   // attachmentIds this page has shelved, so the offer is not made twice
function libSave(attachmentId){
  if(actBusy('lib:'+attachmentId)) return;
  actStart('lib:'+attachmentId, TLIB_COPY.saving);
  api({action:'setLibrary', data:{attachmentId:attachmentId, teacherId:TEACHER_ID, teacherToken:TOKEN}},
  function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+attachmentId,(r&&r.error)||TLIB_COPY.saveFailed); return; }
    LIB_KEPT[attachmentId]=true;
    actDone('lib:'+attachmentId, TLIB_COPY.saved);
    _libRefresh();
  });
}
function _libAlready(attachmentId){
  if(LIB_KEPT[attachmentId]) return true;
  for(var i=0;i<LIB_MINE.length;i++) if(LIB_MINE[i].attachmentId===attachmentId) return true;
  return false;
}
// The control, beside the file it is about — [1.417]'s rule, and it is why this
// is a function rather than a line copied into the chip and the tile.
function rLibSave(attachmentId){
  if(!attachmentId) return '';
  if(_libAlready(attachmentId)) return '';
  return '<button type="button" class="lib-mini" onclick="event.stopPropagation();libSave(\''+
    esc(attachmentId)+'\')">'+esc(TLIB_COPY.save)+'</button>';
}

// ── MANAGING: rename, tags, and the two removals ────────────────────────
// AC asked for rename and delete and for nothing else: *"no moving between
// folders, no sharing, no permissions. Those are what go wrong and none of them
// is a teacher's job."*
//
// **Removing and deleting are two different acts** and both are offered,
// because they answer two different questions: taking a file off a shelf
// withholds nothing from anybody, and deleting it takes it out of every
// conversation it was ever sent to.
function libEdit(id){ LIB_EDIT = (LIB_EDIT===id?'':id); LIB_DEL=''; _libRedraw(); }
// ── [1.488] — the name saves when you leave the field ────────────────────
//
// AC asked what could be condensed out of seven buttons, and told me to use my
// judgement. Save name was the clearest of the two: the SAME field in the
// just-added block, one section higher up the same panel, has no such button —
// you type a name there, click away, and it is saved. A field that needs a
// button in one place and not the other teaches nothing, and a teacher who
// learns the block's behaviour loses their typing here.
//
// So this is now what the block already does, and three things about it matter:
//
//   NO CALL WHEN NOTHING CHANGED — a blur fires on the way to a tag chip. An
//   unchanged name that still sent a request would put "Renamed." on screen for
//   a rename nobody performed.
//
//   THE FORM STAYS OPEN — the button version cleared LIB_EDIT on success,
//   which was right for a press and wrong for a blur: tabbing from the name to
//   a tag would have shut the form under the teacher's hand.
//
//   BLANK PUTS THE NAME BACK — clearing the box and clicking away is a slip,
//   not an instruction to name a file nothing.
function libRename(id){
  var el=document.getElementById('lib-rn-'+id);
  var it=_libFind(id);
  if(!el || !it) return;
  var name=String(el.value||'').trim();
  if(!name || name===it.fileName){ el.value=it.fileName; return; }
  // Drawn from the model at once, so the name changes under the finger and the
  // request is the only thing that waits ([1.485]).
  it.fileName=name; if(it.kind==='link') it.label=name;
  _libRedraw();
  // [1.471] — AC: *"teachers can edit the link name when uploading (does not
  // affect link address) or after adding it to their library."* The address is
  // never sent, so it cannot be changed here by accident.
  var req=_libIsLink(id)
    ? {action:'saveLibraryLink', data:{linkId:id, label:name,
       teacherId:TEACHER_ID, teacherToken:TOKEN}}
    : {action:'renameLibraryFile', data:{attachmentId:id, fileName:name,
       teacherId:TEACHER_ID, teacherToken:TOKEN}};
  api(req, function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.renameFailed); _libRefresh(); return; }
    // The server cleans a filename ([1.465]), so what it stored is what is
    // drawn — not what was typed.
    it.fileName=r.fileName||r.label||name;
    if(it.kind==='link') it.label=it.fileName;
    _libRedraw();
  });
}
function libUnshelve(id){
  actStart('lib:'+id, TLIB_COPY.saving);
  api({action:'setLibrary', data:{attachmentId:id, remove:true,
       teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.saveFailed); return; }
    actDone('lib:'+id, TLIB_COPY.unshelved);
    LIB_EDIT=''; LIB_DEL='';
    _libRefresh();
  });
}
// The confirm is INLINE, on the row, and it names the number — the design's own
// requirement, and the reason is the trade AC took knowingly: one file, so a
// delete reaches every conversation it was ever sent to. A native confirm() is
// not used anywhere in this portal ([1.34]) and would not be able to say this.
function libAskDelete(id){ LIB_DEL=id; _libRedraw(); }
function libDelCancel(){ LIB_DEL=''; _libRedraw(); }
function libDelete(id){
  if(_libIsLink(id)){
    actStart('lib:'+id, TLIB_COPY.saving);
    api({action:'deleteLibraryLink', data:{linkId:id,
         teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
      if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.delFailed); LIB_DEL=''; render(); return; }
      actDone('lib:'+id, TLIB_COPY.deleted);
      LIB_EDIT=''; LIB_DEL=''; _libRefresh();
    });
    return;
  }
  actStart('lib:'+id, TLIB_COPY.saving);
  api({action:'deleteLibraryFile', data:{attachmentId:id,
       teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.delFailed); LIB_DEL=''; render(); return; }
    actDone('lib:'+id, TLIB_COPY.deleted);
    LIB_EDIT=''; LIB_DEL='';
    _libRefresh();
  });
}
// Tags on one file. A studio tag is a tick; a private tag is a teacher's own
// word, on their own file, invisible to everybody including admin.
// [1.484] — AC: *"when I click a tag to add, the screen jumps, but should
// not."* Two causes, and this is the second: pressing a chip rebuilt the whole
// page to change one class. **The chip is patched where it stands** — the model
// updates, the button's own look and `aria-pressed` update, and nothing else on
// screen moves. The server confirms behind it, as every other write here does.
function libFileTag(id, tagId, el){
  var f=_libFind(id); if(!f) return;
  var tags=(f.tags||[]).slice();
  var i=tags.indexOf(tagId);
  var on=i<0;
  if(i>-1) tags.splice(i,1); else tags.push(tagId);
  f.tags=tags;   // drawn from this immediately; the server confirms behind it
  if(el){
    el.classList.toggle('on', on);
    el.classList.remove('some');
    el.setAttribute('aria-pressed', on?'true':'false');
  } else { render(); }
  if(f.kind==='link'){
    api({action:'saveLibraryLink', data:{linkId:id, tags:tags,
         teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
      if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.saveFailed); _libRefresh(); return; }
      f.tags=r.tags||tags; render();
    });
    return;
  }
  api({action:'setAttachmentTags', data:{attachmentId:id, tags:tags,
       teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.saveFailed); _libRefresh(); return; }
    f.tags=r.tags||tags; render();
  });
}
function libPrivateAdd(id){
  var el=document.getElementById('lib-pt-'+id);
  var word=el?String(el.value||'').trim():'';
  if(!word) return;
  var f=_libFind(id); if(!f) return;
  var words=(f.privateTags||[]).slice();
  if(words.indexOf(word)<0) words.push(word);
  _libSetPrivate(id, f, words);
}
function libPrivateRemove(id, word){
  var f=_libFind(id); if(!f) return;
  _libSetPrivate(id, f, (f.privateTags||[]).filter(function(w){ return w!==word; }));
}
function _libSetPrivate(id, f, words){
  f.privateTags=words; render();
  var req = f.kind==='link'
    ? {action:'saveLibraryLink', data:{linkId:id, privateTags:words,
       teacherId:TEACHER_ID, teacherToken:TOKEN}}
    : {action:'setAttachmentTags', data:{attachmentId:id, privateTags:words,
       teacherId:TEACHER_ID, teacherToken:TOKEN}};
  api(req, function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.saveFailed); _libRefresh(); return; }
    f.privateTags=r.privateTags||words;
    // A word that has just been added is a word the filter can now offer, and
    // one that has just gone may be one it is still filtering by.
    _libFilterPrune(); render();
  });
}

// ── ADDING FILES STRAIGHT TO THE LIBRARY, sending nothing ───────────────
//
// **The last piece of AC's design, and it was the case he named:** *"a file can
// be added to the library without sending anything, which is how a teacher
// builds up scales and warm-ups before term."*
//
// It was reachable before this only sideways — attach a file to a message,
// press Save to Library, then take the chip off again — which is three acts and
// a draft nobody wanted. **The upload arrives already shelved and already
// tagged** ([1.465] server side), so this is one call per file and no send.
//
// The tags are the SAME pattern as admin's bulk add: picked once, before the
// files are chosen, and the filename suggests them.
// [1.468] — AC asked for tagging to happen WHILE uploading, in bulk or one at a
// time, and said teachers should have it too. **The tags-before-the-files row
// is gone**: it could not do the case he names — twenty files where eighteen
// are piano and two are violin — and two places to tag one upload is the "too
// many screens" he had just finished complaining about ([1.467]).
var LIB_ADDED=[];
// [1.469] — AC, asked whether a teacher's own word should reach a whole batch:
// **"optional. can add tags to all, some, or one."** So the batch carries a
// TICK per file. Everything lands ticked, which makes "all" the state you are
// already in; unticking gives "some"; one ticked is "one". The same three
// answers with no third control and no mode.
var LIB_ADD_SEL={};
// [1.474] — what is typed into the tag finder. In JS like every other control
// here, because render() replaces the panel every poll tick.
var LIB_TAGFIND='';
function libTagFind(v){
  LIB_TAGFIND=String(v||'');
  // [1.485] — the panel only, and _libRedraw puts the caret back where it was
  // rather than at the end: typing into the middle of a word used to jump it.
  _libRedraw();
}
function _libTagsFiltered(){
  var q=LIB_TAGFIND.trim().toLowerCase();
  if(!q) return _libTagOrder(LIB_TAGS);
  return _libTagOrder(LIB_TAGS.filter(function(t){
    return String(t.name||'').toLowerCase().indexOf(q)>-1; }));
}
// ── [1.487] — the likely tag first, the near one outlined ─────────────
//
// AC, 10 September 2026, on the row of suggestions that used to sit under a
// "Maybe:" label: *"the teacher should be able to obviously select a tag and
// add it by clicking it. Simple, easy. No need for a suggested banner. If they
// like it, they can add it. If not, they can ignore it."* And on using the
// student record for it: *"Less is more here."*
//
// So there is ONE row of chips, not two — the old suggestion row drew the same
// tag twice, once plain in the row above and once again below it with a word in
// front. Two things move within that one row, and neither adds anything to read:
//
//   ORDER — the tag matching what THIS student plays comes first, because the
//   panel knows who the message is for. Order helps a thumb find the chip; it
//   never claims the file is about that instrument. That distinction is the
//   whole reason this is ordering and not a highlight: a teacher writing to a
//   violin student also uploads general theory sheets, and a nudge that files
//   one of those under Violin is a mistake nobody ever goes back and finds —
//   the sheet then stops surfacing for every piano student they have.
//
//   OUTLINE — a tag nearly present in the item's OWN name is outlined. That
//   signal comes from what the teacher called the file, so it is about the
//   file, and it is the one guess worth drawing attention to.
//
// Standalone (the library opened from the home page, no conversation) has no
// student, so nothing leads and the row is in its usual order.
function _libLeadTag(){
  if(LIB_STANDALONE) return '';
  var v=null;
  try{ v=_tplValues(); }catch(e){ v=null; }
  return String((v&&v.instrument)||'').trim().toLowerCase();
}
function _libTagOrder(tags){
  var lead=_libLeadTag();
  if(!lead) return tags||[];
  var first=[], rest=[];
  (tags||[]).forEach(function(t){
    if(String(t.name||'').trim().toLowerCase()===lead) first.push(t); else rest.push(t);
  });
  return first.concat(rest);
}
// Ordered, and each chip carrying whether the item's own name nearly says it.
function _libTagChips(tags, name, applied){
  var near={};
  if(name) _libNearSuggest(name, tags, applied||[]).forEach(function(id){ near[id]=true; });
  return _libTagOrder(tags).map(function(t){ return { t:t, near:!!near[t.tagId] }; });
}
// Any live tag whose word appears in a filename. **Suggested, never applied
// silently** — a wrong tag on twenty files is worse than typing twenty times,
// and unticking is one press. Punctuation is ignored on both sides, so
// "warm ups" is found in "daily-warmups.pdf".
function _libSuggest(names){
  var out=[];
  LIB_TAGS.forEach(function(t){
    var w=String(t.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
    if(!w) return;
    for(var i=0;i<names.length;i++){
      var n=String(names[i]||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
      if(n.indexOf(w)>-1){ out.push(t.tagId); return; }
    }
  });
  return out;
}

// ── [1.472] — NEAR matches are OFFERED, never applied ────────────────────
//
// **AC:** *"It could also intelligently compare words and offer up matches
// based on the file name that the teacher can accept or deny."*
//
// Two tiers, and the line between them is the whole point:
//
//   * an EXACT word in the filename applies the tag — his condition for that is
//     already met, *"determining from file name is ok as long as the user can
//     delete or edit the tags"*;
//   * a NEAR match is a GUESS, and a guess that tags fifty files on its own is
//     what makes people stop trusting the suggestions at all. It is offered as
//     a chip to press.
//
// Near means one of two things, both cheap and both explainable to a person:
// a word in the name is the tag word with an ending on it (or the other way
// round), or it is one letter away from it — "vioin" for violin, "scale" for
// scales. Nothing cleverer: an algorithm nobody can predict is worse than one
// that occasionally misses.
function _libNearSuggest(name, tags, already){
  var words=String(name||'').toLowerCase().split(/[^a-z0-9]+/).filter(function(w){ return w.length>2; });
  var flat=String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  var out=[];
  (tags||[]).forEach(function(t){
    if((already||[]).indexOf(t.tagId)>-1) return;
    var w=String(t.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
    if(!w || w.length<3) return;
    if(flat.indexOf(w)>-1) return;            // exact: already applied, not a guess
    for(var i=0;i<words.length;i++){
      var word=words[i];
      // one is the other with an ending on it
      if(word.length>=4 && w.length>=4 && (word.indexOf(w)===0 || w.indexOf(word)===0)){
        out.push(t.tagId); return;
      }
      if(_libNear1(word, w)){ out.push(t.tagId); return; }
    }
  });
  return out;
}
// One letter apart: a substitution, an insertion or a deletion. Written out
// rather than pulled in, because a full edit-distance table for two short words
// is more code than the three cases it would generalise.
function _libNear1(a, b){
  if(a===b) return false;
  if(a.length<4 || b.length<4) return false;
  if(Math.abs(a.length-b.length)>1) return false;
  var i=0, j=0, diff=0;
  while(i<a.length && j<b.length){
    if(a.charAt(i)===b.charAt(j)){ i++; j++; continue; }
    if(++diff>1) return false;
    if(a.length>b.length) i++;
    else if(b.length>a.length) j++;
    else { i++; j++; }
  }
  if(i<a.length || j<b.length) diff++;
  return diff<=1;
}
function libAddFiles(){ var el=document.getElementById('lib-add-file'); if(el) el.click(); }
function libAddChosen(input){
  var files=input && input.files ? Array.prototype.slice.call(input.files) : [];
  input.value='';
  if(!files.length) return;
  // [1.468] — nobody waits to tag. They go up now, and the batch they land in
  // is where tagging happens.
  files.forEach(libAddUpload);
}
// Pasted, not typed: the box takes as many addresses as they have and each one
// becomes a row in the same batch a file upload lands in — same ticks, same
// bulk row, same names to fix.
function libAddLinks(){
  var el=document.getElementById('lib-add-links');
  var text=el?String(el.value||''):'';
  if(!text.trim()) return;
  actStart('libadd', TLIB_COPY.adding);
  api({action:'addLibraryLinks', data:{urls:text, teacherId:TEACHER_ID, teacherToken:TOKEN}},
  function(e,r){
    if(e||!r||!r.ok){ actFail('libadd',(r&&r.error)||TLIB_COPY.addLinksFailed); return; }
    if(el) el.value='';
    (r.added||[]).forEach(function(l){
      LIB_ADDED.push({attachmentId:l.linkId, fileName:l.label});
      LIB_ADD_SEL[l.linkId]=true;
    });
    // What happened to the ones that did NOT land is said, not swallowed: a
    // paste of twenty that adds fourteen has to account for the other six.
    var note=TLIB_COPY.addLinksDone.replace('{n}', String((r.added||[]).length));
    if(r.skipped) note+=' '+TLIB_COPY.addLinksDupe.replace('{n}', String(r.skipped));
    if(r.rejected) note+=' '+TLIB_COPY.addLinksBad.replace('{n}', String(r.rejected));
    actDone('libadd', note);
    _libRefresh();
  });
}

var LIB_UP=0;
function libAddUpload(file){
  if(file.size > ATT_MAX_BYTES){ showMsg(TCH_COPY.attachTooBig,'e'); return; }
  LIB_UP++;
  actStart('libadd', TLIB_COPY.adding);
  var reader=new FileReader();
  reader.onerror=function(){ LIB_UP--; actFail('libadd', TLIB_COPY.addFailed); };
  reader.onload=function(){
    var b64=String(reader.result||'');
    b64=b64.slice(b64.indexOf(',')+1);
    // NOT the composer's upload: this one says toLibrary, so the file is filed
    // in the teacher's own Library folder ([1.453]) and shelved in one call
    // rather than three. It never touches ATT_PENDING — there is no message
    // here, which is the whole point.
    api({action:'uploadAttachment', data:{fileName:file.name, mimeType:file.type,
         dataBase64:b64, toLibrary:true, tags:_libSuggest([file.name]),
         teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
      LIB_UP--;
      if(e||!r||!r.ok){ actFail('libadd',(r&&r.error)||TLIB_COPY.addFailed); _libRefresh(); return; }
      // **Suggested, never applied silently.** The rule is kept and its place
      // has moved: every tag a filename put on a file is drawn on that file's
      // own row in the batch below, one press to take off.
      if(r.attachment){
        LIB_ADDED.push({attachmentId:r.attachment.attachmentId, fileName:r.attachment.fileName});
        LIB_ADD_SEL[r.attachment.attachmentId]=true;   // lands ticked: "all" is the resting state
      }
      if(!LIB_UP) actDone('libadd', TLIB_COPY.added);
      _libRefresh();
    });
  };
  reader.readAsDataURL(file);
}

// ── [1.468] — the batch that just landed ────────────────────────────────
//
// Dismissed by hand, never by a timer: a group that vanished on its own would
// take the only place those rows are gathered.
// [1.485] — the paste box's open state. These two were lost in [1.484]'s
// rewrite of the panel while the buttons that call them stayed, so Add link did
// nothing at all: a handler named in markup and missing from the file fails
// silently in the console and looks like a dead button. There is a check for
// exactly this now.
var LIB_ADD_LINK=false;
function libAddLinkOpen(){
  LIB_ADD_LINK=true;
  _libRedraw();
  var el=document.getElementById('lib-add-links');
  if(el) _focusNoScroll(el);   // the box is open because somebody means to type in it
}
function libAddLinkClose(){ LIB_ADD_LINK=false; _libRedraw(); }
function libAddedDone(){ LIB_ADDED=[]; LIB_ADD_SEL={}; _libRedraw(); }
function libAddedSel(id){
  if(LIB_ADD_SEL[id]) delete LIB_ADD_SEL[id]; else LIB_ADD_SEL[id]=true;
  _libRedraw();   // [1.485] — a tick changes the panel and nothing else
}
// [1.470] — clears when ANYTHING is ticked, selects when nothing is. That is
// what the button beside it says it will do, and it makes "deselect" one press
// from any state rather than two from a half-ticked one.
// [1.484] — keyed on `id`, not on `attachmentId`. A LINK has no attachmentId
// ([1.471] gives it `id` and `linkId`), so every one of these read undefined and
// **a pasted link could be shown ticked and still be left out of everything the
// bar did to "the ticked files".** Found by rendering the panel against a
// fixture with one file and one link in the batch: the header said "1 ticked"
// with two boxes ticked on screen.
function libAddedSelAll(){
  var files=_libAddedFiles();
  var any=files.some(function(f){ return LIB_ADD_SEL[f.id]; });
  files.forEach(function(f){
    if(any) delete LIB_ADD_SEL[f.id]; else LIB_ADD_SEL[f.id]=true;
  });
  _libRedraw();
}
function _libAddedSelected(){
  return _libAddedFiles().filter(function(f){ return LIB_ADD_SEL[f.id]; });
}
function _libAddedFiles(){
  // Read through the real shelf every time, so a rename or a delete made while
  // the batch is open cannot leave a stale copy on screen. [1.471] — `_libFind`
  // answers for a link as readily as for a file, so a paste and an upload land
  // in the same batch and are tagged by the same row.
  return LIB_ADDED.map(function(x){ return _libFind(x.attachmentId); })
                  .filter(function(f){ return !!f; });
}
// All, some, or one: whichever is ticked. Pressing a tag every ticked file
// already carries takes it off them — the same press means the same thing as it
// does on a single row.
// [1.471]/[1.469] — renaming from the batch row itself. It writes only when
// the name actually changed, because this fires on every blur and a round trip
// per glance is the wait this whole feature exists to remove.
function libAddedRename(id){
  var el=document.getElementById('lib-bn-'+id);
  var it=_libFind(id);
  if(!el || !it) return;
  var name=String(el.value||'').trim();
  if(!name || name===it.fileName){ if(el) el.value=it.fileName; return; }
  it.fileName=name; if(it.kind==='link') it.label=name;
  var req = it.kind==='link'
    ? {action:'saveLibraryLink', data:{linkId:id, label:name, teacherId:TEACHER_ID, teacherToken:TOKEN}}
    : {action:'renameLibraryFile', data:{attachmentId:id, fileName:name,
       teacherId:TEACHER_ID, teacherToken:TOKEN}};
  api(req, function(e,r){
    if(e||!r||!r.ok){ actFail('lib:'+id,(r&&r.error)||TLIB_COPY.renameFailed); _libRefresh(); return; }
    // The server cleans a filename ([1.465]), so what it stored is what is
    // drawn — not what was typed.
    it.fileName=r.fileName||r.label||name;
    if(it.kind==='link') it.label=it.fileName;
    render();
  });
}
// [1.485] — ONE request for the whole selection, not one per file.
//
// AC: *"saving actions rendering etc should be kept to the most efficient
// pathway."* This used to call the single-row endpoint per file, so twenty
// ticked files was twenty round trips at ~2s each and twenty chances to
// half-fail. The model is patched first so the chips move on the press, and one
// call carries the change.
function libAddedTagAll(tagId){
  var files=_libAddedSelected();
  if(!files.length) return;
  var all=files.every(function(f){ return (f.tags||[]).indexOf(tagId)>-1; });
  var atts=[], links=[];
  files.forEach(function(f){
    var has=(f.tags||[]).indexOf(tagId)>-1;
    if(all===has){
      var tags=(f.tags||[]).slice();
      if(all){ tags.splice(tags.indexOf(tagId),1); } else { tags.push(tagId); }
      f.tags=tags;
    }
    if(f.kind==='link') links.push(f.id); else atts.push(f.id);
  });
  _libRedraw();
  _libBulk({attachmentIds:atts, linkIds:links}, all?{removeTag:tagId}:{addTag:tagId});
}

// The one door to the bulk endpoint. A failure re-reads the shelf rather than
// leaving the screen showing a change that did not land — the same rule every
// optimistic write in this file follows.
function _libBulk(ids, change){
  var data={attachmentIds:ids.attachmentIds||[], linkIds:ids.linkIds||[],
            teacherId:TEACHER_ID, teacherToken:TOKEN};
  Object.keys(change).forEach(function(k){ data[k]=change[k]; });
  api({action:'setLibraryTagsBulk', data:data}, function(e,r){
    if(e||!r||!r.ok){
      actFail('libadd',(r&&r.error)||TLIB_COPY.saveFailed);
      _libRefresh();
      return;
    }
    // Refused rows are named rather than swallowed: a selection that reached
    // somebody else's file is a thing to know about.
    if(r.refused) showMsg(TLIB_COPY.someRefused.replace('{n}', String(r.refused)),'e');
  });
}
// [1.469] — a teacher's OWN word, across the ticked files. **This reverses the
// note in [1.468]** that private tags belong to one file by definition: that
// reasoning was thin, and it left a teacher whose studio has made no tags able
// to organise only one file at a time — which is the whole of AC's question.
//
// It needs nothing from AC's vocabulary, so it is the one kind of tagging that
// works on day one of a studio.
// [1.469] — AC: *"should be able to remove one or more or all tags also."*
//
// **One** is the chip on a file's own row, or one file ticked. **More** is
// ticking several and pressing the chip. **All** is this: every tag off every
// ticked file in one press, their own words included — a batch that arrived
// wrongly tagged should not have to be corrected tag by tag.
function libAddedClearTags(){
  var files=_libAddedSelected();
  if(!files.length) return;
  // [1.485] — one call for the lot. This was two requests per file with
  // anything on it.
  var atts=[], links=[];
  files.forEach(function(f){
    f.tags=[]; f.privateTags=[];
    if(f.kind==='link') links.push(f.id); else atts.push(f.id);
  });
  _libRedraw();
  _libBulk({attachmentIds:atts, linkIds:links}, {clear:true});
  _libFilterPrune();
}
// [1.470] — deleting the ticked files, one press, however many that is.
//
// **It asks first, and the question counts what it is about to take**: these
// are files that may already be in a family's conversation, and [1.465]'s rule
// is that a delete says what it reaches. Counted as FILES ALREADY SENT rather
// than as a total of conversations, because two of these files may have gone to
// the same family and a summed number would be wrong in the direction that
// frightens people.
var LIB_ADD_DEL=false;
function libAddedDeleteAsk(){ LIB_ADD_DEL=true; render(); }
function libAddedDeleteCancel(){ LIB_ADD_DEL=false; render(); }
function libAddedDelete(){
  var files=_libAddedSelected();
  if(!files.length){ LIB_ADD_DEL=false; render(); return; }
  LIB_ADD_DEL=false;
  actStart('libadd', TLIB_COPY.saving);
  var left=files.length, done=0, failed=0;
  files.forEach(function(f){
    api({action:'deleteLibraryFile', data:{attachmentId:f.attachmentId,
         teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
      if(!e && r && r.ok){
        done++;
        // Out of the batch as well as off the shelf: a row left behind would be
        // a file that cannot be tagged, renamed or attached.
        LIB_ADDED=LIB_ADDED.filter(function(x){ return x.attachmentId!==f.attachmentId; });
        delete LIB_ADD_SEL[f.attachmentId];
      } else { failed++; }
      if(!--left){
        // **Partial failure is reported as partial**, not as success: admin
        // deleting a file somebody else uploaded is refused by the server, and
        // "Deleted 5" when it deleted 4 is the kind of quiet lie this project
        // has a rule about.
        if(failed) actFail('libadd', TLIB_COPY.delSelPartial.replace('{n}', String(done)).replace('{f}', String(failed)));
        else actDone('libadd', TLIB_COPY.delSelDone.replace('{n}', String(done)));
        _libRefresh();
      }
    });
  });
  render();
}
function libAddedPrivateAll(){
  var el=document.getElementById('lib-added-pt');
  var word=el?String(el.value||'').trim():'';
  if(!word) return;
  var files=_libAddedSelected();
  if(!files.length) return;
  if(el) el.value='';

  var atts=[], links=[];
  files.forEach(function(f){
    var words=(f.privateTags||[]).slice();
    if(words.indexOf(word)<0){ words.push(word); f.privateTags=words; }
    if(f.kind==='link') links.push(f.id); else atts.push(f.id);
  });

  _libBulk({attachmentIds:atts, linkIds:links}, {privateWord:word});

}
// One group: a row that tags everything in it, a row per file, and Done. The

  return '<div class="lib-new">'+

      '<div class="lib-fld">'+

      (LIB_ADD_DEL && sel.length

function rLibraryPanel(composerId){
  // [1.495] — the MANAGER, and it is drawn in one place only: the My Library
  // overlay. The composer draws rPickPanel instead.
  if(!LIB_STANDALONE) return '';
  var mine=_libFiltered(LIB_MINE), myLinks=_libFiltered(LIB_MY_LINKS);
  var studio=_libFiltered(LIB_SHELF_STUDIO), studioLinks=_libFiltered(LIB_STUDIO_LINKS);
  var total=LIB_MINE.length+LIB_MY_LINKS.length+LIB_SHELF_STUDIO.length+LIB_STUDIO_LINKS.length;
  // ── [1.484] — the search box EARNS its place ─────────────────────────
  //
  // AC: *"It's not a pro design to have them search their files like this by
  // just starting to type something."* Part of that was the order, fixed in
  // [1.480]. The rest is that a search box over four files is furniture: it
  // asks a question the eye has already answered. It appears once there is
  // enough on the shelves to be worth narrowing.
  var wantFind=(total>6)||LIB_Q||LIB_FILTER.length;
  // [1.485] — the id is what lets a press redraw THIS and nothing else.
  // No heading of its own: the overlay carries the title and the ×.
  return '<div class="lib-panel" id="lib-panel">'+
    // The two ways IN, first and loudest ([1.480]).
    '<div class="lib-add-row">'+
      '<button type="button" class="btn btn-p" onclick="libAddFiles()">'+esc(TLIB_COPY.addGo)+'</button>'+
      '<button type="button" class="btn btn-s'+(LIB_ADD_LINK?' lib-on':'')+'"'+
        ' onclick="libAddLinkOpen()">'+esc(TLIB_COPY.addLinksGo)+'</button>'+
    '</div>'+
    '<input type="file" id="lib-add-file" class="att-input" multiple accept="'+_attAccept()+'"'+
      ' onchange="libAddChosen(this)">'+
    // The paste box, only once Add link has been pressed.
    (LIB_ADD_LINK
      ? '<div class="lib-edit" style="margin-top:8px">'+
          '<div class="lib-lbl">'+esc(TLIB_COPY.addLinks)+'</div>'+
          '<textarea id="lib-add-links" rows="2" class="lib-search" style="resize:vertical"'+
            ' placeholder="'+esc(TLIB_COPY.addLinksPh)+'" aria-label="'+esc(TLIB_COPY.addLinks)+'"></textarea>'+
          '<div class="lib-edit-acts" style="margin-top:6px">'+
            '<button type="button" class="btn btn-p" onclick="libAddLinks()">'+esc(TLIB_COPY.addLinksGo)+'</button>'+
            '<button type="button" class="lib-act" onclick="libAddLinkClose()">'+esc(TLIB_COPY.cancel)+'</button>'+
          '</div>'+
        '</div>'
      : '')+
    rAct('libadd')+
    // ── The review step. AC: "it should ask for tags, etc when adding, not
    // ── after and then having to remember to edit." So what just landed sits
    // ── HERE, at the top where the press was, with the tagging on it.
    rLibraryAdded()+
    (wantFind
      // [1.488] — the way OUT of a filter sits ON the filter. It was a
      // separate "Clear filter" button in the chip row below; the box is where
      // a person looks for it, and one fewer control is on the panel. The words
      // are kept as the label a screen reader reads and the tooltip a mouse
      // finds. type="text", not "search": the browser's own × would clear the
      // typing and leave the tag chips on, which is a different thing done by
      // an identical-looking control.
      ? '<div class="lib-find">'+
          '<input id="lib-q" class="lib-search" type="text" value="'+esc(LIB_Q)+'"'+
            ' placeholder="'+esc(TLIB_COPY.search)+'" aria-label="'+esc(TLIB_COPY.search)+'"'+
            ' oninput="libSearch(this.value)">'+
          ((LIB_Q||LIB_FILTER.length)
            ? '<button type="button" class="lib-clear-x" onclick="libClearFilter()"'+
              ' aria-label="'+esc(TLIB_COPY.clear)+'" title="'+esc(TLIB_COPY.clear)+'">&#215;</button>'
            : '')+
        '</div>'+
        rLibraryTags()
      : '')+
    '<div id="lib-body" style="margin-top:9px">'+rLibraryBody()+'</div>'+
  '</div>';
}
function rLibraryTags(){
  var offered=_libOffered();
  if(!offered.length && !LIB_FILTER.length) return '';
  return '<div class="lib-tags">'+offered.map(function(t){
    var on=LIB_FILTER.indexOf(t.v)>-1;
    return '<button type="button" class="lib-tag'+(on?' on':'')+(t.priv?' priv':'')+'"'+
      ' aria-pressed="'+(on?'true':'false')+'"'+
      ' onclick="libTag(\''+esc(t.v)+'\')">'+esc(t.name)+'</button>';
  }).join('')+
  // [1.488] — the clear used to be a button at the end of this row. It is now
  // an × on the search box, where a person looks for it.
  '</div>';
}
function rLibraryBody(){
  var mine=_libFiltered(LIB_MINE), studio=_libFiltered(LIB_SHELF_STUDIO);
  var myLinks=_libFiltered(LIB_MY_LINKS), studioLinks=_libFiltered(LIB_STUDIO_LINKS);
  // Nothing at all, versus nothing MATCHING: two different facts, and telling
  // them apart is the difference between "add a file" and "clear the filter".
  if(!mine.length && !studio.length && !myLinks.length && !studioLinks.length &&
     (LIB_FILTER.length||LIB_Q)){
    return '<div class="lib-empty">'+esc(TLIB_COPY.emptyFiltered)+'</div>';
  }
  // ── [1.471] — AC'S INSTRUCTION, and it overturned my own answer ──────
  //
  // I proposed ONE list with a badge per row and argued against splitting it.
  // **AC:** *"Teachers will need a visual separation of files and site links.
  // Otherwise, things will get confusing for users who need more visual support
  // for organizing things."*
  //
  // So: a labelled group each, inside the shelf it belongs to. **A group with
  // nothing in it draws nothing at all**, so a teacher with no links sees
  // exactly what they saw before links existed — which is the only way this
  // does not become four headings in a panel that had two.
  return '<div class="lib-shelf"><div class="lib-group-hd">'+esc(TLIB_COPY.mine)+'</div>'+
      rLibSub(TLIB_COPY.filesHead, mine, true, TLIB_COPY.emptyMine, true)+
      rLibSub(TLIB_COPY.linksHead, myLinks, true, '', false)+
    '</div>'+
    '<div class="lib-shelf"><div class="lib-group-hd">'+esc(TLIB_COPY.studio)+'</div>'+
      rLibSub(TLIB_COPY.filesHead, studio, false, TLIB_COPY.emptyStudio, true)+
      rLibSub(TLIB_COPY.linksHead, studioLinks, false, '', false)+
    '</div>';
}
// A group inside a shelf: Files, then Links. `empty` is drawn only for the one
// that has something to say when it is empty — a teacher with no files needs
// telling how to get some; a teacher with no links needs nothing said at all.
function rLibSub(head, items, mine, empty, showEmpty){
  if(!items.length && !(showEmpty && empty)) return '';
  // [1.477] — the LINKS group is marked so its banner and its rows can be
  // cooled together. Keyed off the heading rather than a fourth argument: there
  // are two kinds and the heading already says which.
  var links=(head===TLIB_COPY.linksHead);
  // [1.484] — the count on the band. A shelf that says how much it holds is
  // one somebody can decide about before scrolling it.
  return '<div class="lib-sub'+(links?' links':'')+'"><div class="lib-sub-hd">'+esc(head)+
      (items.length?'<span class="lib-sub-n">'+items.length+'</span>':'')+'</div>'+
    (items.length
      ? '<div class="lib-list'+
          // [1.484] — while something in THIS list is open for editing, the
          // list gives up its scroll box: an editor whose buttons are hidden
          // inside a scroller is an editor with no buttons.
          (items.some(function(f){ var _i=f.id||f.attachmentId; return _i===LIB_EDIT||_i===LIB_DEL; })?' editing':'')+
          '">'+items.map(function(f){ return rLibRow(f, mine); }).join('')+'</div>'
      : '<div class="lib-empty">'+esc(empty)+'</div>')+
  '</div>';
}
function rLibRow(f, mine){
  var id=f.id||f.attachmentId;
  var link=f.kind==='link';
  // A link's second line is its address, where a file's is its size — the one
  // fact that tells a teacher what they are about to send.
  // ── [1.476] — the count comes OFF the row ────────────────────────────
  //
  // **AC:** *"There is no need for a 'sent to 6' count, is there? I don't think
  // anyone cares how many times it has been sent out, but maybe a quiet
  // statistic to keep for possible future data management."*
  //
  // He is right, and the row is the wrong place for it: a teacher scanning a
  // shelf is choosing what to send, and a number about the past is one more
  // thing to read past. **It is still counted** — the server works it out with
  // the list ([1.465]) — and it is still SHOWN in the one moment it decides
  // something: the delete question, where it says what the delete costs. Admin
  // keeps the column in the Settings table, which is where the studio's
  // bookkeeping lives.
  var meta=link?_libLinkHost(f.url):_attSize(f.sizeBytes);
  // [1.481] — in a message, pressing a row ATTACHES. On the home page there is
  // nothing to attach to, so it opens the file for editing instead — for a
  // teacher's own row. A studio row has nothing to edit, so it stays inert
  // rather than pretending.
  var _press=LIB_STANDALONE
    ? (mine?'libEdit(\''+esc(id)+'\')':'')
    : 'libAttach(\''+esc(id)+'\')';
  // ── [1.484] — THE NAME GETS THE ROW ──────────────────────────────────
  //
  // **AC:** *"File names are also so compressed they are unusable."* True: the
  // badge, the name, the size and Edit were one flex line inside a 300px panel,
  // so the name — the only part anybody reads — was the part that gave way.
  //
  // Two lines now. The first is the badge and the NAME, with the whole width to
  // itself and permission to wrap onto a second line before it is cut. The
  // second carries the small facts and the controls, which can be small because
  // they are the same on every row and nobody hunts for them.
  var h='<div class="lib-row'+(link?' lib-link':'')+'">'+
    '<button type="button" class="lib-pick"'+(_press?'':' disabled')+
      ' title="'+esc(link?f.url:f.fileName)+'"'+
      ' onclick="'+_press+'">'+
      '<span class="lib-kind">'+esc(link?TLIB_COPY.linkKind:_attKind(f.fileName))+'</span>'+
      '<span class="lib-name">'+esc(f.fileName)+'</span>'+
    '</button>'+
    '<div class="lib-row-foot">'+
      '<span class="lib-meta">'+esc(meta)+'</span>'+
      // Editing is offered on a teacher's OWN files only. The Keylab Master
      // Library is AC's shelf: a teacher sends from it and changes nothing on
      // it — his own ruling, and the server refuses it as well.
      (mine?'<button type="button" class="lib-act" onclick="libEdit(\''+esc(id)+'\')">'+
         esc(TLIB_COPY.manage)+'</button>':'')+
    '</div>'+
  '</div>';
  // ── [1.467] — ONE box, never three ──────────────────────────────────
  //
  // AC, on the master library: *"there are perhaps too many screens popping up
  // when deleting a file."* His screenshots show it stacking as it goes —
  // Edit opened a panel, Delete file opened a SECOND panel under it, and the
  // saving line arrived as a THIRD block ABOVE both, pushing the row this was
  // all about out of the way.
  //
  // **The panel is one place that says one thing at a time.** The question
  // REPLACES the controls it came from, the working line replaces them too, and
  // Keep it puts them back. Done and failed still draw outside it, because they
  // have to survive the panel closing.
  var st=ACT['lib:'+id];
  if(st && st.state!=='working') h+=rAct('lib:'+id);
  if(mine && (LIB_EDIT===id || LIB_DEL===id)) h+=rLibPanel(f);
  return h;
}
// The one panel, in its three states.
function rLibPanel(f){
  var id=f.attachmentId;
  var st=ACT['lib:'+id];
  if(st && st.state==='working'){
    return '<div class="lib-edit"><div class="act-note act-working">'+
      '<span class="spin">\u21bb</span> '+esc(st.text||'')+'</div></div>';
  }
  if(LIB_DEL===id) return rLibConfirmDelete(f);
  return rLibEdit(f);
}
function rLibEdit(f){
  var id=f.id||f.attachmentId;
  var link=f.kind==='link';
  // ── [1.484] — THE EDIT PANEL, REDESIGNED ─────────────────────────────
  //
  // **AC:** *"I click edit to add a tag but there is a mess of things to click
  // with no instructions, and the layout is generally unhelpful here... Your
  // own tag and add are subtle and hidden, like the other controls. The UX here
  // has not been designed fully yet."* And: *"There is also no option to save
  // the tag here. It's genuinely not there."*
  //
  // **The Add button WAS there, which makes his sentence the finding.** It was
  // an 11px text link the colour of the small print, beside a bordered input —
  // so the one thing on the panel that looked like a control was the box, and
  // the thing that acted on it looked like a caption. A control nobody can see
  // is not there.
  //
  // Rebuilt as three labelled sections and a separated footer, so the panel
  // reads as a form rather than as a heap:
  //
  //   NAME              the field, and a Save button beside it
  //   TAGS              the studio's words, pressed on and off
  //   YOUR OWN TAGS     their words, with a real field and a real Add
  //   ─────────────
  //   removals          last, behind a rule, because they undo rather than edit
  return '<div class="lib-edit">'+
    '<div class="lib-fld">'+
      '<div class="lib-lbl">'+esc(TLIB_COPY.lblName)+'</div>'+
      '<div class="lib-fld-row">'+
        // [1.488] — Enter leaves the field, and leaving the field is what
        // saves. One behaviour, and the same one the just-added block has.
        '<input id="lib-rn-'+esc(id)+'" value="'+esc(f.fileName)+'" style="flex:1"'+
          ' aria-label="'+esc(TLIB_COPY.lblName)+'"'+
          ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'+
          ' onblur="libRename(\''+esc(id)+'\')">'+
      '</div>'+
      // The address is shown and is plainly not a field: renaming does not
      // touch it, and a rule is easier to trust when you can see what it
      // protects.
      (link?'<div class="lib-meta" style="margin-top:3px">'+esc(f.url)+'</div>':'')+
    '</div>'+
    (LIB_TAGS.length
      ? '<div class="lib-fld">'+
          '<div class="lib-lbl">'+esc(TLIB_COPY.lblTags)+'</div>'+
          // [1.487] — same one row here as on a just-added item.
          '<div class="lib-tags" style="padding-top:0">'+
          _libTagChips(LIB_TAGS, f.fileName, f.tags||[]).map(function(c){
            var t=c.t, on=(f.tags||[]).indexOf(t.tagId)>-1;
            return '<button type="button" class="lib-tag'+(on?' on':(c.near?' near':''))+'"'+
              ' aria-pressed="'+(on?'true':'false')+'"'+
              ' onclick="libFileTag(\''+esc(id)+'\',\''+esc(t.tagId)+'\',this)">'+esc(t.name)+'</button>';
          }).join('')+'</div>'+
        '</div>'
      : '')+
    '<div class="lib-fld">'+
      '<div class="lib-lbl">'+esc(TLIB_COPY.lblMine)+'</div>'+
      ((f.privateTags||[]).length
        ? '<div class="lib-tags" style="padding-top:0;padding-bottom:5px">'+(f.privateTags||[]).map(function(w){
            return '<button type="button" class="lib-tag priv on" title="'+esc(TLIB_COPY.removeWord)+'"'+
              ' onclick="libPrivateRemove(\''+esc(id)+'\',\''+esc(w)+'\')">'+esc(w)+' &#215;</button>';
          }).join('')+'</div>'
        : '')+
      '<div class="lib-fld-row">'+
        '<input id="lib-pt-'+esc(id)+'" placeholder="'+esc(TLIB_COPY.privatePh)+'"'+
          ' aria-label="'+esc(TLIB_COPY.privatePh)+'"'+
          ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();libPrivateAdd(\''+esc(id)+'\');}">'+
        '<button type="button" class="lib-act" onclick="libPrivateAdd(\''+esc(id)+'\')">'+
          esc(TLIB_COPY.privateAdd)+'</button>'+
      '</div>'+
    '</div>'+
    // The two removals, last and behind a rule: they undo rather than edit, and
    // a destructive control beside a text field is one a thumb finds by
    // accident.
    '<div class="lib-foot">'+
      (link?''
           :'<button type="button" class="lib-act" onclick="libUnshelve(\''+esc(id)+'\')">'+
            esc(TLIB_COPY.unshelve)+'</button>')+
      '<button type="button" class="lib-act bad" onclick="libAskDelete(\''+esc(id)+'\')">'+
        esc(link?TLIB_COPY.linkDel:TLIB_COPY.del)+'</button>'+
      '<button type="button" class="lib-act" style="margin-left:auto"'+
        ' onclick="libEdit(\''+esc(id)+'\')">'+esc(TLIB_COPY.doneEditing)+'</button>'+
    '</div>'+
  '</div>';
}
function rLibConfirmDelete(f){
  var id=f.id||f.attachmentId;
  // [1.471] — a link's question is a DIFFERENT question, and saying so is the
  // point: deleting a file takes it out of every conversation it was sent to,
  // and deleting a link takes nothing away from anybody. A shared sentence here
  // would frighten a teacher out of tidying their own list.
  if(f.kind==='link'){
    return '<div class="lib-edit">'+
      '<div class="lib-warn">'+esc(TLIB_COPY.linkDelAsk)+'</div>'+

      '<div class="lib-edit-acts">'+
        '<button type="button" class="lib-mini bad" onclick="libDelete(\''+esc(id)+'\')">'+esc(TLIB_COPY.delGo)+'</button>'+

      '</div></div>';
  }

    '<div class="lib-edit-acts">'+
      '<button type="button" class="lib-mini bad" onclick="libDelete(\''+esc(id)+'\')">'+esc(TLIB_COPY.delGo)+'</button>'+
      '<button type="button" class="lib-mini" onclick="libDelCancel()">'+esc(TLIB_COPY.delBack)+'</button>'+
    '</div></div>';
