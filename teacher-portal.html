<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keylab Teacher Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#C2C2C2;--bg2:#CFCFCF;--bg3:#DCDCDC;--bg4:#E5E5E5;--bg5:#EFEFEF;
  --border:#999;--border2:#888;--border3:#666;
  --text:#0A0A0A;--text2:#181818;--text3:#2E2E2E;--text4:#525252;--text5:#757575;
  --green:#1A6B3A;--gbg:#D4EDE0;--gt:#0B3D20;
  --amber:#7A5000;--abg:#FAEABB;--at:#4A2E00;
  --red:#962020;--rbg:#FAD4D4;--rt:#560A0A;
  --blue:#1C4A82;--bbg:#D0E2F8;--bt:#0C2A52;
  --acc:#1E3A6E;--link:#1155CC;--r:5px;--rl:8px
}
body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding:2rem 1.25rem 4rem}
.login-w{margin:4rem auto 0;text-align:center}
.login-brand{font-family:"Inter",sans-serif;font-size:15px;letter-spacing:.1em;color:var(--acc);margin-bottom:.3rem;font-weight:500}
.login-sub{font-size:12px;color:var(--text4);margin-bottom:1.75rem}
h1{font-size:20px;font-weight:400;margin-bottom:.4rem;color:var(--text)}
h2{font-size:10px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem;font-family:"Inter",sans-serif}
p{color:var(--text3);margin-bottom:.75rem;line-height:1.65;font-size:13px}
a{color:var(--bt);text-decoration:none}
a:hover{text-decoration:underline}
.card{background:rgba(255,255,255,.45);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem;text-align:left}
.msg{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:1rem;border:1px solid;line-height:1.5}
.ms{background:var(--gbg);color:var(--gt);border-color:var(--green)}
.me{background:var(--rbg);color:var(--rt);border-color:var(--red)}
input{background:rgba(255,255,255,.45);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:9px 10px;font-family:"Inter",sans-serif;font-size:14px;width:100%;outline:none;margin-top:4px;-webkit-appearance:none}
input:focus{border-color:var(--acc);background:rgba(255,255,255,.65)}
label{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;display:block;font-family:"Inter",sans-serif}
.field{margin-bottom:1rem}
.req{color:var(--rt);margin-left:2px}
.btn{padding:10px 16px;border-radius:var(--r);font-size:13px;cursor:pointer;border:1px solid transparent;font-family:"Inter",sans-serif;transition:background .1s,opacity .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;line-height:1;letter-spacing:.01em;width:100%}
.btn-p{background:#1a4fc4;color:#fff;border-color:#1a4fc4}.btn-p:hover{background:#1440a8;border-color:#1440a8}
.btn-s{background:rgba(0,0,0,.12);color:var(--text2);border-color:var(--border2)}.btn-s:hover{background:rgba(0,0,0,.2);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.spin{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.remember-row{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;margin-bottom:.8rem}
.remember-row input{width:14px;height:14px;-webkit-appearance:checkbox;appearance:auto;margin:0;flex:0 0 auto}
.linkline{font-size:13px;color:var(--text3);text-align:center;margin-top:.5rem}
.tabbar{display:flex;gap:6px;margin-bottom:1rem;padding:5px;background:rgba(255,255,255,.35);border:1px solid var(--border);border-radius:10px}
.tab{flex:1;text-align:center;padding:9px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text4);background:transparent;cursor:pointer;border-radius:7px;font-family:"Inter",sans-serif;font-weight:600;border:1px solid transparent;transition:all .15s}
.tab.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.thread-hd{font-size:10px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem;font-family:"Inter",sans-serif}
.empty-state{text-align:center;color:var(--text4);padding:2rem 1rem;font-size:13px}
/* Status banner (BACKLOG 1.125, AC's shapes: red Away/Busy, green Available).
   Full width and unmissable on purpose — the 28 Aug worry was that a teacher
   with no return date would leave away switched on forever, and a banner they
   cannot miss is the mitigation that costs no extra fields. */
.status-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:var(--r);padding:8px 12px;margin-bottom:.75rem;font-size:12px;font-weight:700}
.status-banner.away{background:#FDECEC;border:1px solid #DC2626;color:#B91C1C}
.status-banner.avail{background:#ECFDF3;border:1px solid #16A34A;color:#15803D}
.status-banner a{font-size:11px;font-weight:600}
.away-note{background:#FDECEC;border:1px solid #DC2626;color:#B91C1C;border-radius:var(--r);
  padding:8px 10px;font-size:12px;margin-bottom:.6rem;white-space:pre-wrap}
.handoff-tag{background:var(--bg3);color:var(--text3);font-size:10px;font-weight:600;
  padding:1px 7px;border-radius:10px;margin-left:6px}
/* Unread count on a tab (1.161 #1). Blue, like every other unread mark in the
   tool, so one colour keeps meaning one thing. */
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  padding:0 5px;margin-left:6px;border-radius:9px;background:#1747C0;color:#fff;
  font-size:10px;font-weight:700;line-height:1;vertical-align:middle}
/* Roster rows read as the student now, with the parent underneath (AC). */
/* 1.191, AC: parent name on top, student and details underneath. The
   emphasis moves with the order — the top line is the one you read first, so
   it is the one that has to be the parent's name. */
.row-parent{font-size:14.5px;font-weight:600;color:var(--text)}
.row-student{font-size:12.5px;color:var(--text3);margin-top:2px}
/* "About [child]" pills (1.161 #4), shown only when a teacher has more than
   one child in that family. */
.about-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text3);margin-bottom:.5rem}
.about-pill{border:1px solid var(--border);background:var(--bg2);border-radius:20px;padding:2px 10px;cursor:pointer;font-weight:600}
.about-pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.about-tag{font-size:10px;font-weight:600;opacity:.75;display:block;margin-bottom:2px}
/* A system message never looks like a person's (AC, 1 Sept): no colour, a
   dashed edge, and one line until you ask for the rest. */
.bubble.auto{background:transparent;border:1px dashed var(--border2);color:var(--text3);cursor:pointer;max-width:100%}
/* [1.189] — the one bubble on the screen the family cannot see, and the only
   one in this colour. It says so in words too. */
.bubble.internal{background:#FAECCB;border:1px solid #D9AE55;border-left:4px solid #D9AE55;max-width:100%}
.internal-tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7A4E00;margin-bottom:.3rem}
.auto-line{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600}
.auto-when{font-weight:400;opacity:.7}
.fwd-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 12px;margin-top:.6rem;font-size:12px}
.msg-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;max-height:50vh;overflow-y:auto}
/* 1.190, AC: "NO HYPERLINK TEXT! Buttons only. For everyone." Every control
   that used to be a text link is this. Sized to be pressed, including on a
   phone, and readable at arm's length (1.186). */
.lnk-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r);
  border:1px solid var(--border2);background:rgba(255,255,255,.55);color:var(--text2);
  font-family:"Inter",sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.25;
  text-align:left}
.lnk-btn:hover{background:rgba(255,255,255,.85);color:var(--text)}
.bubble-row{display:flex}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:80%;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:var(--rl);padding:.6rem .8rem}
.bubble.mine{background:var(--acc);border-color:var(--acc);color:#fff}
.bubble-sender{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--acc);font-family:"Inter",sans-serif;margin-bottom:.25rem}
/* 1.186, AC: "the dark blue bubble and current text css using small dark red
   text is terribly hard to read and looks very computery." One messaging
   typography set, identical in all three portals, so a message reads the same
   wherever it is seen: bigger body text, timestamps that are readable rather
   than decorative, and no monospace anywhere a person's words appear. */
.bubble-text{font-size:14.5px;line-height:1.58;color:inherit}
.bubble.mine .bubble-text{color:#fff}
.bubble-time{font-size:11.5px;font-weight:500;color:var(--text4);margin-top:.35rem}
.bubble.mine .bubble-time{color:rgba(255,255,255,.88)}
/* [1.234] — the buttons go BELOW the writing box, not beside it. This was a
   row: the box and three buttons competing for one line, so the composer got
   whatever width was left. Now the box gets the whole width and the buttons
   get their own line under it. The flex:1 spacer inside the button row still
   works exactly as it did — it pushes Close conversation to the right end. */
.composer{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.composer-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.composer textarea{background:rgba(255,255,255,.55);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:10px 11px;font-family:"Inter",sans-serif;font-size:14.5px;width:100%;outline:none;resize:none;min-height:72px;max-height:200px}
.composer textarea:focus{border-color:var(--acc);background:rgba(255,255,255,.65)}
.composer .btn{width:auto;flex:0 0 auto}
/* Formatting composer (BACKLOG 1.33). The contenteditable box deliberately
   reuses the textarea's exact look so the toolbar is the only visible change. */
.composer-wrap{display:flex;flex-direction:column;gap:6px}
.cmp-tb{display:flex;flex-wrap:wrap;gap:4px}
.cmp-tb-btn{background:rgba(255,255,255,.45);border:1px solid var(--border2);color:var(--text3);border-radius:6px;min-width:32px;height:30px;padding:0 8px;font-size:12px;line-height:1;cursor:pointer;font-family:"Inter",sans-serif}
.cmp-tb-btn:hover{background:rgba(255,255,255,.75);color:var(--text)}
.cmp-tb-btn:active{background:var(--acc);color:#fff;border-color:var(--acc)}
/* 1.192, AC: the box was "very small" to write in. One line of room is fine
   for a phone reply and wrong for anything considered. */
.cmp-rich{background:rgba(255,255,255,.55);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:10px 11px;font-family:"Inter",sans-serif;font-size:14.5px;line-height:1.55;width:100%;outline:none;min-height:72px;max-height:200px;overflow-y:auto;text-align:left}
.cmp-rich:focus{border-color:var(--acc);background:rgba(255,255,255,.65)}
.cmp-rich:empty:before{content:attr(data-ph);color:var(--text5)}
.cmp-rich ul,.cmp-rich ol{margin:.25rem 0;padding-left:1.3rem}
.cmp-rich blockquote{margin:.25rem 0;padding-left:.75rem;border-left:2px solid var(--border2)}
.cmp-rich a{color:var(--bt);text-decoration:underline;word-break:break-word}
/* Toolbar state (28 Aug). :active only flashed while the mouse was down, which
   told a teacher nothing about whether bold was currently ON. .on is driven by
   _composerState() from the real selection. */
.cmp-tb-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cmp-tb-btn:focus-visible{outline:2px solid #1a4fc4;outline-offset:1px}
.cmp-div{width:1px;height:18px;background:var(--border2);opacity:.7;margin:0 2px;flex:0 0 auto}
/* Link row — replaces window.prompt(). Hidden until the Link button opens it. */
.cmp-linkrow{display:none;gap:5px;align-items:center;flex-wrap:wrap}
.cmp-linkrow.open{display:flex}
.cmp-linkrow input{flex:1;min-width:130px;margin-top:0;padding:7px 9px;font-size:13px}
.cmp-linkrow input.bad{border-color:var(--red)}
.cmp-mini{background:rgba(0,0,0,.12);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r);padding:7px 11px;font-size:12px;font-weight:600;font-family:"Inter",sans-serif;cursor:pointer;flex:0 0 auto}
.cmp-mini:hover{background:rgba(0,0,0,.2);color:var(--text)}
.cmp-guide{flex:0 0 100%;font-size:11px;color:var(--text4);line-height:1.5}
.bubble-text ul,.bubble-text ol{margin:.3rem 0;padding-left:1.25rem}
.bubble-text li{margin:.15rem 0}
.bubble-text blockquote{margin:.3rem 0;padding-left:.7rem;border-left:2px solid rgba(0,0,0,.15)}
.bubble.mine .bubble-text blockquote{border-left-color:rgba(255,255,255,.4)}
/* [1.236], AC: "the links sent by admin should be blue like normal hyperlinks
   in gmail." They were var(--acc) — #1E3A6E, the dark navy this tool uses for
   headings and primary buttons — which does not read as a link at all. This is
   Gmail's own link blue, and it is its own token rather than an existing one
   precisely so that restyling the accent can never quietly restyle links back.
   [1.190]'s standing rule is against hyperlinks that PERFORM an action; a link
   to a web page is not that, and AC said so when raising this. */
.bubble-text a{color:var(--link);text-decoration:underline;word-break:break-word}
.bubble.mine .bubble-text a{color:#fff}
.thread-list{display:flex;flex-direction:column;gap:6px}
.thread-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.45);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem;cursor:pointer;transition:background .12s}
.thread-row:hover{background:rgba(255,255,255,.65)}
.thread-row-main{min-width:0}
.thread-row-name{font-size:13px;font-weight:600;color:var(--text)}
.thread-row-preview{font-size:12px;color:var(--text4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-badge{background:#1a4fc4;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;flex:0 0 auto;cursor:pointer}
/* BACKLOG 1.128. Text colour is chosen per swatch for contrast rather than for
   consistency: white on that amber is unreadable, and darkening the amber to
   fix it would undo the saturation AC asked for. */
.msg-circle{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:600;line-height:1;cursor:pointer;
  font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,.22);box-shadow:0 0 0 1.5px rgba(255,255,255,.3)}
.mp-key{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text4);
  margin-bottom:.6rem;padding:6px 9px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r)}
.mp-key span.k{display:inline-flex;align-items:center;gap:5px}
.mp-key i{width:11px;height:11px;border-radius:50%;display:inline-block}
.msg-circle.p-new{background:#1747C0;color:#fff}
/* [1.178] the resting state: present, readable, carrying no alarm. */
.msg-circle.p-rest{background:var(--bg4);color:var(--text3);border:1px solid var(--border2);font-size:11px}
.msg-circle.p-2h{background:#8B5FCF;color:#fff}
.msg-circle.p-4h{background:#E5A700;color:#3A2900}
/* AC's key, 3 Sept 2026: blue when new, purple at 2h, amber at 4h, orange at
   12h, red once OVERDUE. Every stage moved down one and purple was added, so
   red now means only one thing — past the reply time — instead of sharing
   duty with the 12-hour band. Class names are the HOURS, not the colours,
   which is why p-8h became p-12h rather than being renamed after a hue that
   has now changed twice. */
.msg-circle.p-12h{background:#F97316;color:#3D1A00}
/* Overdue keeps a circle for the count, in a deeper red, with the OVERDUE word beside it (AC, 3 Sept). */
.msg-circle.p-od{background:#8B1A1A;color:#fff}
/* Saved for review (1.215): white circle, blue number, blue ring. Deliberately the inverse of the unread circle — same shape, opposite fill, because it is the other half of one idea. */
.msg-circle.p-review{background:#fff;color:#1747C0;border:2px solid #1747C0}
.msg-overdue{background:#B22222;color:#fff;border:1px solid #8B1A1A;border-radius:10px;padding:3px 8px;
  font-size:10px;font-weight:600;letter-spacing:.06em;white-space:nowrap;flex:0 0 auto;cursor:pointer}
/* ── The sectioned messages page (AC, 3 September 2026) ──────────────────
   Section headers carry the counts the tab badges used to, so nothing has to
   be opened to find out something is waiting. */
.zone{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text4);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.zone::after{content:"";flex:1;height:1px;background:var(--border)}
.zcount{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  padding:0 5px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);
  color:var(--text3);font-size:10px;letter-spacing:0}
.zone-empty{font-size:12px;color:var(--text4);padding:2px 2px 8px}
/* Closed Conversations: a control, not a label. Collapsed to start, and it
   carries its counts while collapsed so it says what it holds rather than
   looking empty (the resting-state rule). */
.sep{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);margin:22px 0 2px;padding-top:14px;border-top:2px solid var(--border2);
  cursor:pointer;display:flex;align-items:center;gap:6px}
.sepc{font-size:10px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text4);margin-left:auto}
.caret{display:inline-block;width:12px;color:var(--text4)}
/* The row. The parent is who the teacher is speaking with, so their name is
   the largest thing on it; the student sits under it, labelled, because that
   name belongs to the one person on the row who is not in the conversation. */
.r-parent{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.r-student{font-size:11.5px;font-weight:600;color:var(--text3);line-height:1.35;margin-bottom:2px}
.lbl{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.06em}
.dir{font-size:11px;font-weight:400;color:var(--text4)}
.row-marks{display:flex;align-items:center;gap:6px;flex:0 0 auto}
/* The reply deadline. Quiet on the row — it is a fact, not an alarm; the
   colour is what carries urgency. */
.due{font-size:11px;font-weight:600;color:var(--text4)}
.due-line{font-size:12px;font-weight:700;color:var(--text3);margin:.1rem 0 .6rem}
/* The close button in the resting slot — quiet, so a page of answered
   conversations does not read as a page of buttons. */
.row-close{font-size:10.5px;padding:3px 9px;opacity:.75}
.thread-row:hover .row-close{opacity:1}
/* Admin, wherever it appears as a correspondent — a message from the studio
   should never look like one from a family. Deliberately the SOFT blue, not
   the #1747C0 of the unread circle: two different things in one blue would
   read as related. */
.apill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:9px;
  background:var(--bbg);border:1px solid #7FA5D6;color:var(--bt);
  font-size:10px;font-weight:700;letter-spacing:.02em}
/* The searchable dropdown. */
.msg-search{position:relative;margin-bottom:.75rem}
.msg-search input{width:100%;font-size:13px}
.msg-search-x{position:absolute;right:8px;top:7px;font-size:12px}
.msg-search-menu{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--bg5);
  border:1px solid var(--border2);border-radius:var(--r);box-shadow:0 6px 18px rgba(0,0,0,.18);
  max-height:260px;overflow-y:auto}
.msg-search-item{padding:8px 10px;font-size:13px;color:var(--text);cursor:pointer;
  display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.msg-search-item:hover{background:var(--bg4)}
.msg-search-item.q{color:var(--text4);cursor:default}
.msg-search-sub{font-size:11px;color:var(--text4)}
/* Two lines in the thread, not a message (AC, 3 Sept). Deliberately without a
   bubble, a border or a background: it is a note about the conversation, not a
   turn in it. */
.note-line{padding:2px 2px 2px 0;max-width:74%}
.note-head{font-size:11px;color:var(--text4)}
.note-body{font-size:12.5px;color:var(--text3);font-style:italic}
.note-when{font-style:normal;color:var(--text4)}
/* The per-message controls. Present on every message rather than appearing
   only on some, so neither reads as a control that shows up when something is
   wrong.

   [1.230], AC: "Css for teacher message bubbles is all out of whack... no
   subtle small fonts or odd hidden colors, etc. Clear, clean, functional."
   Four things were wrong and all four were in this block:

   1. 11px, which is smaller than anything else in the thread and is the
      "subtle small font" — it is a control, not a footnote.
   2. The label wrapped to three lines. The row is a flex container and the
      label was allowed to shrink, so it broke mid-phrase rather than the ROW
      wrapping. flex-wrap on the row and nowrap on the label swap that round.
   3. The checkbox was the browser's default: a different size on every
      platform and sitting off the text baseline.
   4. THE HIDDEN COLOURS. Inside .bubble.mine the bubble is solid accent blue
      and this row inherited var(--text3) — dark grey text and a black hairline
      on dark blue. That is the half of AC's screenshot that reads as an
      accident, and it had no override at all. */
.msg-tools{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:9px;padding-top:7px;
  border-top:1px solid rgba(0,0,0,.12);font-size:12.5px;line-height:1.3;color:var(--text3)}
.msg-tools label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.msg-tools input[type=checkbox]{width:15px;height:15px;margin:0;flex:0 0 auto;accent-color:var(--acc);cursor:pointer}
.msg-tools-sep{color:var(--text5)}
.rev-check.on{font-weight:600;color:var(--acc)}
.bubble.mine .msg-tools{color:rgba(255,255,255,.92);border-top-color:rgba(255,255,255,.3)}
.bubble.mine .msg-tools input[type=checkbox]{accent-color:#fff}
.bubble.mine .msg-tools-sep{color:rgba(255,255,255,.55)}
.bubble.mine .rev-check.on{color:#fff}
.bubble.mine .lnk-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.38);color:#fff}
.bubble.mine .lnk-btn:hover{background:rgba(255,255,255,.28);color:#fff}
/* [1.232] — a message saved for review looks saved, from across the thread.
   AC: "Otherwise, the person doesn't know which message they marked, and this
   will easily get lost." An outline plus a word, not a colour alone. */
.bubble.saved{border-color:var(--acc);box-shadow:0 0 0 2px rgba(26,86,219,.18)}
.bubble.mine.saved{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.saved-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;
  color:var(--acc);margin-bottom:.3rem}
.bubble.mine .saved-tag{color:#fff}
/* [1.235] — where clicking a row in Marked for review lands. It fades, so the
   thread does not keep a permanent highlight on one message. */
.bubble-row.flash .bubble{animation:revflash 1.8s ease-out}
@keyframes revflash{0%{box-shadow:0 0 0 4px rgba(26,86,219,.45)}100%{box-shadow:0 0 0 2px rgba(26,86,219,.18)}}
/* [1.237] — AC, 4 September: "email fail message 'message did not send' red
   warning banner." A banner, not the quiet inline line this started as: it is
   the one thing on a message that means somebody has to do something. Drawn
   only when the server says nothing went out, so a notification that worked
   says nothing at all — a marker that is always present stops being read.
   The second line is the server's own reason, quieter than the banner because
   it is what you pass on rather than what you notice. */
.msg-notify-warn{display:block;margin-top:8px;padding:7px 10px;border-radius:5px;
  background:var(--rbg);border-left:3px solid var(--red);color:var(--rt)}
.msg-notify-warn b{display:block;font-size:12.5px;font-weight:700;line-height:1.3}
.msg-notify-warn span{display:block;margin-top:2px;font-size:11.5px;font-weight:500;line-height:1.35;opacity:.9}
/* On your own bubble the ground is solid accent blue, so the banner keeps its
   own light-red surface rather than inheriting — the same fault [1.230] was
   raised about, and not one to rebuild here. */
.bubble.mine .msg-notify-warn{background:var(--rbg);color:var(--rt);border-left-color:var(--red)}
/* The guide. Closed by default and quiet when closed — it sits under the
   colour key all day and should not compete with the messages. */
.guide{margin:-.35rem 0 1rem}
.guide-toggle{background:none;border:0;padding:2px 0;font-family:inherit;font-size:12px;font-weight:600;
  color:var(--acc);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.guide-toggle:hover{text-decoration:underline}
.guide-body{margin-top:.5rem;padding:.75rem .9rem;background:rgba(255,255,255,.45);
  border:1px solid var(--border);border-radius:var(--r);max-width:62ch}
.guide-sec + .guide-sec{margin-top:.45rem;border-top:1px solid var(--border);padding-top:.45rem}
/* AC, 3 September (second pass): "Section headers in the guide are dark navy
   (#1E3A6E)", item titles and body text unchanged. It is also the control that
   opens the section now, so it is sized and weighted to be pressed rather than
   read past — the 10.5px uppercase label it was is not a button. */
.guide-h{display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  background:none;border:0;padding:3px 0;font-family:inherit;
  font-size:12.5px;font-weight:700;letter-spacing:.01em;color:#1E3A6E;cursor:pointer}
.guide-h:hover{text-decoration:underline}
.guide-body ul{margin:.25rem 0 0;padding-left:1.1rem}
.guide-body li{font-size:12.5px;color:var(--text3);line-height:1.45;margin-bottom:.25rem}
.guide-body li b{color:var(--text);font-weight:700}
/* "Ask admin about this" beside Send — [1.201]'s white button with the blue
   border, so it reads as a second way to send rather than a second Send. */
.btn-ask{background:#fff;border:1px solid var(--acc);color:var(--acc)}
.closed-tag{font-size:11px;font-weight:600;color:var(--text4);padding:3px 9px;
  border:1px solid var(--border);border-radius:4px;background:var(--bg4)}
.read-toggle{flex:0 0 auto;font-size:14px;color:var(--text5);text-decoration:none;padding:0 4px}
.read-toggle:hover{color:var(--acc);text-decoration:none}
.recipient-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:.6rem;font-size:12px;color:var(--text3)}
.recipient-row label{display:flex;align-items:center;gap:5px;cursor:pointer;text-transform:none;letter-spacing:0;font-family:"Inter",sans-serif}
.recipient-row input{width:14px;height:14px;-webkit-appearance:checkbox;appearance:auto;margin:0}

/* ══════════════════════════════════════════════════════════════════════════
   DESKTOP (AC, 28 Aug). The portal was built mobile-first and capped at 420px
   on EVERY screen, so a teacher writing a practice assignment on a laptop
   composed in a phone column with the rest of the display empty.

   AC's brief was that admin's Comms panel is the right size. The thing that
   makes that panel good to write in is not its pixel width -- it is a fixed
   grid filling the viewport with the editor set to flex:1, so the body grows
   into whatever height is available (EnrollmentAdmin.html, rComms()). That is
   what is reproduced here: roster and conversation side by side, both filling
   the window, composer growing down the page.

   Breakpoint at 900px, chosen so an iPad in PORTRAIT (768px) keeps the phone
   layout. At 768 a 260px roster would leave the composer narrower than the
   phone column it replaced, which is worse than not splitting at all. iPads
   in landscape (1024) and every laptop clear 900 comfortably.

   Below 900px nothing changes: .panes collapses to a plain block and .only-sm
   / .only-lg restore the exact one-view-at-a-time behaviour that shipped.
   ══════════════════════════════════════════════════════════════════════════ */
.only-lg{display:none}
@media (min-width:900px){
  .wrap{max-width:1120px;padding:2rem 2rem 2.5rem}
  .only-lg{display:block}
  .only-sm{display:none}

  /* Two panes, filling the window. The height subtracts the brand row, the
     tab bar and the page padding above them. */
  .panes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1rem;
         height:calc(100vh - 11.5rem);min-height:430px}
  .pane{background:rgba(255,255,255,.28);border:1px solid var(--border);
        border-radius:var(--rl);padding:1rem;display:flex;flex-direction:column;
        min-height:0;overflow:hidden}

  /* Each pane scrolls internally rather than the page scrolling as a whole. */
  .pane .thread-list{flex:1;overflow-y:auto;min-height:0;margin-right:-4px;padding-right:4px}
  .pane .msg-list{flex:1;max-height:none;min-height:0;margin-bottom:.75rem}

  /* The point of the exercise: the composer grows instead of scrolling inside
     160px. Capped at 40vh so a long message can never push Send off-screen. */
  /* 1.192 — on a desktop there is room, so use it: the composer opens at a
     paragraph rather than a line, and still grows to 40vh. */
  .pane .cmp-rich{max-height:40vh;min-height:150px}

  /* The thread pane's header stays put while the messages scroll under it. */
  .pane .thread-hd{flex:0 0 auto}
  .pane-empty{flex:1;display:flex;align-items:center;justify-content:center;
              color:var(--text4);font-size:13px;text-align:center;padding:1rem}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
// ============================================================
// STATE
// ============================================================
// PAGE values: boot | login | needsSetup | forgotpw | setpw | home
var PAGE = 'boot';
var TOKEN = '', TEACHER_ID = '', TEACHER_NAME = '';
var HOME_TAB = 'family'; // 'family' | 'staff' | 'settings'
// The teacher's own status and settings (BACKLOG 1.125, 1.132). Loaded once
// at sign-in, because the banner is on every screen.
var TSET = {loading:false, saving:false, loaded:false,
            awayEnabled:false, awayMessage:'', afterHoursMessage:'', awayDefaultCopy:'',
            notifyOpen:9, notifyClose:17, notifyDerived:false,
            draftAway:'', draftAfter:''};
var MSG = {m:'', t:''};
var busy = false;
var RESET_TOKEN = '';
var _pollTimer = null;
var _pendingOpenFamilyId = '';   // set by boot() from ?openFamilyId=, consumed once by loadFamilyThreads()
var _shouldScrollMsgList = false; // see render() — scroll-to-newest, set only when messages actually change
// [1.235] — set when a conversation is opened FROM the Marked for review
// section, cleared by the first render that has a thread to look in.
var _focusReview = false;

// Staff Messages state. STAFF_VIEW: 'list' (the whole team, always shown
// directly — 1.19, 18 Aug) | 'thread' (one open conversation — admin or
// another staff member).
var STAFF_VIEW = 'list';
var STAFF_THREADS = {loading:false, list:[]};
var STAFF_PICKER = {loading:false, query:'', all:[]};
var ACTIVE_STAFF_THREAD = null; // {contactType:'admin'|'staff', otherId, otherName, messages, draft, sending, loading}

// Family Messages state. FAMILY_VIEW: 'list' (existing conversations) |
// 'picker' (start a new one — any family, confirmed 18 Aug §7 item 4) |
// 'thread' (one open conversation).
var FAMILY_VIEW = 'list';

// BACKLOG 1.136. Delivered on the roster payload rather than a config call --
// this portal has no getPublicConfig, and the roster is fetched on load and
// again every 5 seconds, so flipping the lock in admin reaches teachers within
// seconds without a reload.
var MSG_LOCK = { locked:false, msg:'' };
// Sheets turns a stored "TRUE" into a real boolean, so a config flag can arrive
// as either. The other two portals both carry an isTruthy() for this; this one
// had no config flags until now and so had none.
function _tIsTruthy(v){ return v===true||v==='TRUE'||v==='true'; }
var FAMILY_THREADS = {loading:false, list:[], _sig:''};
// Roster search (BACKLOG 1.161 #3). familyIds is what the server matched;
// an empty query means show everything.
// AC, 3 September: "Dropdown with all the teacher's families and students,
// searchable by either. Make sure the text field doesn't time out or act
// jumpy." Names come from the roster the page already has, so typing filters
// locally and costs no round trip at all — the old version debounced a server
// search, which is what made it feel laggy. `matches` is only ever what is
// currently typed; nothing is cached across keystrokes.
var MSG_SEARCH = {query:'', open:false};
var FAMILY_PICKER = {loading:false, query:'', all:[]};
var ACTIVE_THREAD = null; // {familyId, parent1Name, parent2Name, messages, draft, sending, loading, notifyP1, notifyP2}

// Login form state — single-screen email+password (not the family portal's
// two-step flow) — confirmed with AC, see SPEC_MESSAGING_V1.md §4.
var LF = {email:'', password:'', remember:true};

// forgot password / reset password
var FP = {email:'', done:false, success:false, error:'', busy:false};
// set/reset password (reached via emailed ?resetToken= link)
var SPW = {checking:false, invalid:false, resent:false, resending:false, email:'', pw1:'', pw2:'', busy:false, success:false, error:''};

// ============================================================
// API
// ============================================================
var GAS_URL = 'https://script.google.com/a/macros/keylab.nyc/s/AKfycbzY4K1XCbYZlj4fXksfwEZ3Kxbeolr9abRuifT-_TY4hgfPZP9gbL1dSCn1_zeFRsvl3g/exec';
function api(payload, cb){
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  })
  .then(function(res){ return res.json(); })
  .then(function(r){ cb(null, r); })
  .catch(function(e){ cb(e); });
}
// ============================================================
// HELPERS
// ============================================================
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showMsg(m, t){
  MSG={m:m, t:t||'s'}; render();
  setTimeout(function(){ MSG={m:'',t:''}; render(); }, 7000);
}

// Formats an epoch-ms timestamp as "Tue, 8/18/26 5:30 PM" — see BACKLOG.md
// 1.18. Falls back to the raw value for anything that doesn't parse (e.g.
// a message sent before this fix, still holding the old date-only string).
function fmtMsgTime(ms){
  var n=Number(ms);
  if(!n) return String(ms||'');
  var d=new Date(n);
  if(isNaN(d.getTime())) return String(ms||'');
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var h=d.getHours(), mins=d.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0) h12=12;
  var mm=mins<10?'0'+mins:String(mins);
  return days[d.getDay()]+', '+(d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(-2)+' '+h12+':'+mm+' '+ampm;
}

// AC, 3 September: "The teacher should see a reply by deadline on a message to
// make it extra clear so they aren't doing math (and neither am I)."
//
// The deadline has been computed on the server since [1.197] — per teacher,
// with the evening and weekend rules applied — and sent on every row as
// replyDueBy. It has simply never been shown. Nothing is derived here: the
// portals must not re-derive a rule whose inputs they cannot see, which is why
// [1.197] moved the calculation server-side in the first place.
//
// Full date in the open conversation, where there is room and it must be
// unambiguous. On a roster row, weekday and time only — a deadline is never
// more than three days out, so the date adds length without adding meaning.
function fmtDueFull(ms){
  return Number(ms) ? 'Reply by '+fmtMsgTime(ms) : '';
}
function fmtDueShort(ms){
  var n=Number(ms);
  if(!n) return '';
  var d=new Date(n);
  if(isNaN(d.getTime())) return '';
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var h=d.getHours(), mins=d.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0) h12=12;
  var mm=mins<10?'0'+mins:String(mins);
  return 'Reply by '+days[d.getDay()]+' '+h12+(mins?':'+mm:'')+' '+ampm;
}

function _ktNewClientMsgId(){
  return 'cmsg-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
}
function _maxSentAt(msgs){
  var max=0;
  (msgs||[]).forEach(function(m){ var n=Number(m.sentAt)||0; if(n>max) max=n; });
  return max;
}

// "Remember me" persistent session — small localStorage wrapper, safe to
// call even where storage is unavailable/blocked. Mirrors the family
// portal's _klSaveSession()/_klReadSession()/_klClearSession() pattern.
function _ktSaveSession(token, teacherId, teacherName){
  try{ localStorage.setItem('kl_teacher_session', JSON.stringify({token:token, teacherId:teacherId, teacherName:teacherName||''})); }catch(e){}
}
function _ktReadSession(){
  try{
    var raw=localStorage.getItem('kl_teacher_session');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function _ktClearSession(){
  try{ localStorage.removeItem('kl_teacher_session'); }catch(e){}
}
// [1.181] — the server could not be reached, which says nothing about whether
// this login is good. The session is kept, the teacher is told plainly, and it
// retries by itself. Backs off so a long outage does not hammer the server,
// and never gives up: coming back from a dead spot should just work.
var _ktRetryMs=4000;
function _ktBootRetry(saved){
  PAGE='boot'; BOOT_OFFLINE=true; render();
  setTimeout(function(){
    api({action:'teacherCheckSession', data:{teacherToken:saved.token}}, function(e2,r2){
      if(e2||!r2){ _ktRetryMs=Math.min(_ktRetryMs*2, 60000); _ktBootRetry(saved); return; }
      BOOT_OFFLINE=false; _ktRetryMs=4000;
      if(r2.ok){
        TEACHER_ID=r2.teacherId; TEACHER_NAME=r2.teacherName||'';
        _ktSaveSession(TOKEN, TEACHER_ID, TEACHER_NAME);
        PAGE='home'; render();
        loadFamilyThreads();
        // Both rosters, same as sign-in — a badge that is only true once you
        // visit the tab is not a badge (1.161 #1).
        loadStaffThreads(true);
        _startMessagePolling(); loadTeacherSettings();
      } else {
        _ktClearSession(); TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
        PAGE='login'; render();
      }
    });
  }, _ktRetryMs);
}
var BOOT_OFFLINE=false;

// ============================================================
// RENDER ROOT
// ============================================================
function render(){
  var el=document.getElementById('app');
  if(!el) return;
  var h='';
  if(MSG.m) h+='<div class="msg m'+esc(MSG.t)+'">'+esc(MSG.m)+'</div>';
  if(PAGE==='boot')          h+=rBoot();
  else if(PAGE==='login')    h+=rLogin();
  else if(PAGE==='forgotpw') h+=rForgotPassword();
  else if(PAGE==='setpw')    h+=rSetPassword();
  else                       h+=rHome();
  // render() replaces #app wholesale, so a message arriving mid-poll would
  // otherwise yank the teacher's cursor out of a half-typed message — the
  // teacher-side twin of the family bug fixed in 1.32. Caret goes to the end
  // rather than its exact offset: a composer is written at the end, and exact
  // offset restoration across a full innerHTML rebuild isn't reliable.
  var _focusedComposer='';
  var _ae=document.activeElement;
  if(_ae && _ae.classList && _ae.classList.contains('cmp-rich')) _focusedComposer=_ae.id;
  // The link row's two inputs need the same protection as the composer itself:
  // they are plain inputs, so caret position CAN be restored exactly, unlike
  // the contenteditable below.
  var _focusedLink='', _focusedLinkPos=0;
  // 1.193, AC: "The cursor should simply stay active until I click out of the
  // window. Why does it need to time out?" It wasn't a timeout — it was this
  // list. Any field NOT named here lost the caret every time the 5-second
  // poll re-rendered, which while typing reads exactly like a timeout. The
  // rule is now the field's type, not its name, so a field added later
  // cannot be born with the bug (the family portal has always worked this
  // way; this brings the teacher portal into line).
  var _aeTag=_ae&&(_ae.tagName||'').toLowerCase();
  if(_ae && _ae.id && (_aeTag==='textarea' ||
     (_aeTag==='input' && /^(text|tel|email|search|url|number|password|date)$/i.test(_ae.type||'text')))){
    _focusedLink=_ae.id;
    try{ _focusedLinkPos=_ae.selectionStart; }catch(e){}
  }
  // 1.192, AC: "when scrolling to the bottom of the message, the screen jumps
  // and resets position." Nothing preserved the thread's scroll offset, so
  // every poll re-render dropped the reader back to the top of the list.
  var _prevList=el.querySelector('.msg-list');
  var _prevListTop=_prevList?_prevList.scrollTop:null;
  // [1.221], AC: "composers are still jumpy, with unstable scrolling snaps."
  // The residue of 1.192/1.193, and it is the refocus that does it: focus()
  // scrolls the focused element into view, so every poll landing while the
  // composer had the caret yanked the page to it. preventScroll stops that at
  // source; the window offset is remembered as well, because replacing the
  // page's HTML can briefly shorten the document and the browser clamps the
  // scroll position when it does.
  var _prevWinY=window.pageYOffset||document.documentElement.scrollTop||0;
  el.innerHTML=h;
  if(_focusedLink){
    var _li=document.getElementById(_focusedLink);
    if(_li){
      _focusNoScroll(_li);
      try{ _li.setSelectionRange(_focusedLinkPos,_focusedLinkPos); }catch(e){}
    }
  }
  if(_focusedComposer){
    var _ce=document.getElementById(_focusedComposer);
    if(_ce){
      _focusNoScroll(_ce);
      try{
        var _r=document.createRange(); _r.selectNodeContents(_ce); _r.collapse(false);
        var _s=window.getSelection(); _s.removeAllRanges(); _s.addRange(_r);
      }catch(e){}
    }
  }
  // Scroll to the newest message, not the oldest (1.27, 18 Aug) — only at
  // the specific call sites where messages actually changed, not on every
  // render (typing in the composer re-renders too), so it doesn't fight
  // someone scrolled up reading history.
  // [1.235] — clicking a row in Marked for review lands ON the marked message.
  // AC's answer: open the thread, jump to it, highlight it briefly. Which is
  // also why [1.232] had to come first — there has to be something to land on.
  // Deliberately not scrollIntoView(): that scrolls every ancestor including
  // the window, which is [1.221] exactly.
  var _didFocusReview=false;
  if(_focusReview){
    var mlR=el.querySelector('.msg-list');
    if(mlR){
      _focusReview=false;   // one jump per click, whether or not it lands
      var _tgt=mlR.querySelector('.bubble.saved');
      if(_tgt&&_tgt.parentNode){
        _shouldScrollMsgList=false;
        var _rw=_tgt.parentNode;
        mlR.scrollTop=Math.max(0,_rw.offsetTop-mlR.offsetTop-12);
        _rw.className+=' flash';
        _didFocusReview=true;
      }
    }
  }
  if(_didFocusReview){
    /* already positioned */
  } else if(_shouldScrollMsgList){
    _shouldScrollMsgList=false;
    var ml=el.querySelector('.msg-list');
    if(ml) ml.scrollTop=ml.scrollHeight;
  } else if(_prevListTop!==null){
    // Put the reader back exactly where they were (1.192).
    var ml2=el.querySelector('.msg-list');
    if(ml2) ml2.scrollTop=_prevListTop;
  }
  // [1.221] — and the page itself, last, after every other restore above has
  // had its say.
  var _nowWinY=window.pageYOffset||document.documentElement.scrollTop||0;
  if(_prevWinY&&_nowWinY!==_prevWinY) window.scrollTo(0,_prevWinY);
}

// [1.221] — focus without the browser's automatic scroll-into-view. Where
// preventScroll is not honoured, the scroll offsets are put back by the
// caller, so the worst case is the behaviour we already had.
function _focusNoScroll(el){
  try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} }
}

function loginHeader(){
  return '<div class="login-brand">KEYLAB</div><div class="login-sub">Teacher Portal</div>';
}

// ============================================================
// BOOT
// ============================================================
// [1.181] — while a reconnect is retrying, say so. A spinner that never
// resolves is indistinguishable from a broken portal, and the one thing a
// person must not conclude here is that their login is gone.
// AC's copy, 1 Sept.
function rBoot(){
  return '<div class="login-w">'+loginHeader()+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:22px">↻</span>'+
    (BOOT_OFFLINE?'<div style="margin-top:.9rem;font-size:13px;line-height:1.5">The server is temporarily not responding. Your account is still active, but you may not be able to log in until the issue resolves.</div>':'')+
    '</div></div>';
}

// ============================================================
// LOGIN — single screen, email + password + Remember me together
// (not the family portal's two-step email-then-password flow)
// ============================================================
function rLogin(){
  var btn=busy
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Signing in...</button>'
    :'<button class="btn btn-p" onclick="doLogin()">Sign In</button>';
  return '<div class="login-w">'+loginHeader()+
    '<div class="field"><label>Email<span class="req">*</span></label>'+
    '<input id="te" type="email" autocomplete="username" inputmode="email" value="'+esc(LF.email)+'" oninput="LF.email=this.value" onkeydown="if(event.keyCode===13)doLogin()"></div>'+
    '<div class="field"><label>Password<span class="req">*</span></label>'+
    '<input id="tp" type="password" autocomplete="current-password" value="'+esc(LF.password)+'" oninput="LF.password=this.value" onkeydown="if(event.keyCode===13)doLogin()"></div>'+
    '<label class="remember-row"><input type="checkbox" id="tf-remember" '+(LF.remember?'checked':'')+' onchange="LF.remember=this.checked"> Remember me</label>'+
    btn+
    '<p class="linkline"><button type="button" class="lnk-btn" onclick="PAGE=&apos;forgotpw&apos;;FP={email:LF.email,done:false,success:false,error:&apos;&apos;,busy:false};render()">Forgot your password?</button></p>'+
    '</div>';
}

function doLogin(){
  var email=(document.getElementById('te')||{}).value||LF.email;
  var password=(document.getElementById('tp')||{}).value||LF.password;
  LF.email=(email||'').trim().toLowerCase();
  LF.password=password||'';
  if(!LF.email||LF.email.indexOf('@')===-1){ showMsg('Please enter a valid email address.','e'); return; }
  if(!LF.password){ showMsg('Please enter your password.','e'); return; }
  busy=true; render();
  api({action:'teacherLogin', data:{teacherEmail:LF.email, teacherPassword:LF.password}}, function(e,r){
    busy=false;
    if(e||!r||!r.ok){
      if(r&&r.needsSetup){
        // Account exists but has never had a password — reuse the same
        // begin-reset flow "Forgot your password?" uses, since both land on
        // the same set-new-password screen via email (mirrors the family
        // portal's doBeginResetFromLogin()).
        doBeginResetFromLogin();
        return;
      }
      showMsg((r&&r.error)||'Login failed','e');
      render(); return;
    }
    TOKEN=r.token; TEACHER_ID=r.teacherId; TEACHER_NAME=r.teacherName||'';
    if(LF.remember) _ktSaveSession(r.token, r.teacherId, r.teacherName);
    PAGE='home'; render();
    loadFamilyThreads();
    // Both rosters at sign-in, not just the visible one: a badge that only
    // becomes true once you visit the tab is not a badge (1.161 #1).
    loadStaffThreads(true);
    _startMessagePolling();
    loadTeacherSettings();
  });
}

function doBeginResetFromLogin(){
  busy=true; render();
  api({action:'teacherBeginReset', data:{email:LF.email}}, function(e,r){
    busy=false;
    PAGE='forgotpw';
    FP={email:LF.email, done:true, success:!!(r&&r.ok), error:(r&&r.error)||'', busy:false};
    render();
  });
}

function rSetPassword(){

        ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Sending...</button>'
        :'<button class="btn btn-p" onclick="doResendResetLink()">Send me a new link</button>')
      :'';
    return '<div class="login-w">'+loginHeader()+

      (resendBtn||'')+
      '<button class="btn btn-s" style="margin-top:.5rem" onclick="PAGE=&apos;login&apos;;render()">Back to Sign In</button></div>';
  }
  if(SPW.success){
    return '<div class="login-w">'+loginHeader()+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:22px">↻</span></div></div>';
  }
  var btn=SPW.busy
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Saving...</button>'

    (SPW.error?'<p style="color:var(--rt)">'+esc(SPW.error)+'</p>':'')+
    (SPW.email?'<p style="font-size:13px;color:var(--text3)">Setting a password for <strong>'+esc(SPW.email)+'</strong></p>':'')+
    '<div class="field"><label>New password<span class="req">*</span></label>'+
    '<input id="spw1" type="password" autocomplete="new-password" value="'+esc(SPW.pw1)+'" oninput="SPW.pw1=this.value"></div>'+
    '<div class="field"><label>Confirm password<span class="req">*</span></label>'+
    '<input id="spw2" type="password" autocomplete="new-password" value="'+esc(SPW.pw2)+'" oninput="SPW.pw2=this.value" onkeydown="if(event.keyCode===13)doCompleteReset()"></div>'+
    btn+'</div>';
}

function doCompleteReset(){
  var pw1=(document.getElementById('spw1')||{}).value||SPW.pw1;
  var pw2=(document.getElementById('spw2')||{}).value||SPW.pw2;
  SPW.pw1=pw1; SPW.pw2=pw2; SPW.error='';
  if(!pw1||pw1.length<8){ SPW.error='Password must be at least 8 characters.'; render(); return; }
  if(pw1!==pw2){ SPW.error='Passwords don\'t match'; render(); return; }
  SPW.busy=true; render();
  api({action:'teacherCompleteReset', data:{resetToken:RESET_TOKEN, newPassword:pw1}}, function(e,r){
    SPW.busy=false;
    if(e||!r||!r.ok){
      SPW.error=(r&&r.error)||'Something went wrong. Please try again.';
      render(); return;
    }
    SPW.success=true;
    render();
    if(r.token&&r.teacherId){
      TOKEN=r.token; TEACHER_ID=r.teacherId; TEACHER_NAME=r.teacherName||'';
      _ktSaveSession(r.token, r.teacherId, r.teacherName);
      PAGE='home'; render();
      loadFamilyThreads();
      loadStaffThreads(true);   // both rosters, see above
      _startMessagePolling();
      loadTeacherSettings();
    } else {
      PAGE='login'; render();
    }
  });
}

function doResendResetLink(){
  if(!SPW.email) return;
  SPW.resending=true; render();
  api({action:'teacherBeginReset', data:{email:SPW.email}}, function(e,r){
    SPW.resending=false;
    if(e||!r||!r.ok){
      showMsg((r&&r.error)||'Something went wrong. Please try again.','e');
      render(); return;
    }
    SPW.resent=true; render();
  });
}

// ── The teacher's guide (AC, 3 September 2026) ──────────────────────────
// Asked for as "an expandable user guide for teachers to click under their
// color key... simple, clear, concise terms that leave no ambiguity".
//
// **THIS COPY IS CLAUDE'S, NOT AC'S, AND IT IS TEACHER-FACING.** Every other
// teacher-facing sentence in this file is AC's own. He asked for this one to
// be drafted rather than left blank, so it is written functionally — what the
// control does, in the fewest words that leave no second reading — rather than
// in his voice. It is flagged for him to edit or replace.
//
// Closed by default, and it stays closed between renders unless the teacher
// opens it: a guide that reopens itself every five seconds is worse than no
// guide.
var GUIDE_OPEN = false;
// AC, 3 September: the guide should render as collapsible SECTIONS rather than
// one long block — it is eight sections deep now, and opening it to check one
// thing meant scrolling past the other seven.
//
// Every section starts closed, including when the guide itself is first
// opened. A teacher opens the guide with a question in mind; showing all of it
// expanded is the state that made this an item. Nothing here remembers itself
// between sessions on purpose: the next question will be a different one.
var GUIDE_SEC_OPEN = {};
function toggleGuideSec(i){ GUIDE_SEC_OPEN[i]=!GUIDE_SEC_OPEN[i]; render(); }
function rGuide(){
  // One return, one closing tag: an early return that closed the wrapper in a
  // second place read as unbalanced markup to the check suite, and a reader
  // has the same problem.
  var body='';
  if(GUIDE_OPEN){
    body='<div class="guide-body">'+TCH_COPY.guide.map(function(sec,i){
      var on=!!GUIDE_SEC_OPEN[i];
      return '<div class="guide-sec">'+
        '<button type="button" class="guide-h" onclick="toggleGuideSec('+i+')">'+
          '<span class="caret">'+(on?'▾':'▸')+'</span>'+esc(sec.h)+'</button>'+
        (on?'<ul>'+
          sec.items.map(function(li){
            return '<li><b>'+esc(li.t)+'</b> — '+esc(li.d)+'</li>';
          }).join('')+
        '</ul>':'')+
        '</div>';
    }).join('')+'</div>';
  }
  return '<div class="guide">'+
    '<button type="button" class="guide-toggle" onclick="GUIDE_OPEN=!GUIDE_OPEN;render()">'+
      '<span class="caret">'+(GUIDE_OPEN?'▾':'▸')+'</span>'+esc(TCH_COPY.guideTitle)+'</button>'+
    body+'</div>';
}
function rHome(){
  // BACKLOG 1.161 #1 — a teacher reading a staff thread or editing their away
  // message used to have no idea a parent had written. The counts are already
  // in the roster payloads; this is them, summed, where they can be seen
  // before opening anything. Same idea the family portal got in 1.7b.
  var famUnread=(FAMILY_THREADS.list||[]).reduce(function(n,t){return n+(Number(t.unread)||0);},0);
  var staffUnread=(STAFF_THREADS.list||[]).reduce(function(n,t){return n+(Number(t.unread)||0);},0);
  // AC, 3 September: "Teachers should not be tabbing through different message
  // sections. They should be on the same page scrollable to different
  // sections." So the two MESSAGE tabs are gone and their contents are one
  // scrolling page; Settings is not a message section and keeps its own tab.
  // The section headers carry the counts the tab badges used to
  // ([1.161] #1's guarantee — a teacher must not have to open something to
  // discover a message is waiting — now met by having nothing to open).
  var tabs='<div class="tabbar">'+
    '<div class="tab'+(HOME_TAB!=='settings'?' on':'')+'" onclick="switchTab(\'family\')">Messages'+rTabBadge(famUnread+staffUnread)+'</div>'+
    '<div class="tab'+(HOME_TAB==='settings'?' on':'')+'" onclick="switchTab(\'settings\')">Settings</div>'+
    '</div>';
  var body = HOME_TAB==='settings' ? rTeacherSettings()
           : rTimerKey()+rMessagesPage();
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">'+
    '<div class="login-brand" style="margin:0">KEYLAB</div>'+
    '<button type="button" class="lnk-btn"  onclick="doSignOut()">Sign Out</button></div>'+
    rStatusBanner()+tabs+body;
}

// AC, 1 Sept: red "Away/Busy" when away is on, green "Status: Available" when

// ============================================================
// SETTINGS — away notice (1.125) and the after-hours line (1.132)
// ============================================================
// Two fields, deliberately not one: away is a deliberate act with an end,
// after-hours is standing and automatic. Both are the teacher's own words —
// nothing here is written for them.
//
// AC's copy for this panel, 3 September. Kept in one object rather than inline
// in the markup for the same reason TCH_COPY exists: his words are the thing
// that must not be edited by accident while somebody is changing a div.
var TSET_COPY={
  awayHeading:'Away / Busy Message',
  // AC's third revision of this sentence on 3 September.
  awayBody:'When enabled, families, other staff, and admin see this before they compose their message to you. If they send you a message, it also appears in the thread as an auto-generated message. Change the message to suit your needs, or use the generic message.',
  afterHeading:'After hours',
  afterBody:'Shown to a family before creating a message and sending outside of your set working hours. Feel free to customize your away message or leave it blank to use the studio\'s generic after hours message.',
  // AC proposed this line with a second half about nudges, and asked for it to
  // be fact-checked before it shipped. Half of it was wrong: the automatic
  // nudge is gated on the same window (Code.js, _sendNudge_), so a teacher is
  // never nudged outside their own hours. What CAN arrive at any time is a
  // staff message where admin ticked the email override ([1.158]). This is his
  // corrected line, and the reason it reads the way it does.
  hoursNote:'Family messages and notifications are only sent within your regular working hours, but admin may email you outside your working hours if something is time sensitive.'
};
function rTeacherSettings(){
  if(TSET.loading&&!TSET.loaded){
    return '<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:20px">↻</span></div>';
  }
  var h='<div class="card">';
  // AC's heading and copy, 3 September — his THIRD revision of this box that
  // day. The heading gained "Message"; the audience widened from families to
  // families, staff and admin, which is what the code has always done; and the
  // last sentence changed from explaining why the message appears to telling
  // the teacher they can change it.
  h+='<div class="thread-hd">'+esc(TSET_COPY.awayHeading)+'</div>';
  h+='<div style="font-size:12px;color:var(--text3);margin-bottom:.6rem">'+esc(TSET_COPY.awayBody)+'</div>';
  // The generic message as the placeholder — greyed until the teacher writes
  // their own, so "or use the generic message" points at something visible.
  // It comes from the server (AWAY_DEFAULT_COPY, the sentence that actually
  // goes out); the fallback below is only for a payload that predates it, and
  // is deliberately NOT a second copy of the wording.
  h+='<textarea id="tset-away" rows="3" placeholder="'+esc(TSET.awayDefaultCopy||'Leave this blank to use the studio\'s generic away message.')+'" '+
     'oninput="TSET.draftAway=this.value" style="width:100%">'+esc(TSET.draftAway)+'</textarea>';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-top:.6rem">'+
     (TSET.awayEnabled
       ? '<button class="btn btn-s" onclick="setAway(false)">Turn off away</button>'
       : '<button class="btn btn-p" onclick="setAway(true)">Turn on away</button>')+
     (TSET.saving?'<span class="spin">↻</span>':'')+
     '</div>';
  h+='</div>';

  h+='<div class="card" style="margin-top:.75rem">';
  h+='<div class="thread-hd">'+esc(TSET_COPY.afterHeading)+'</div>';
  h+='<div style="font-size:12px;color:var(--text3);margin-bottom:.6rem">'+esc(TSET_COPY.afterBody)+'</div>';
  h+='<textarea id="tset-after" rows="3" placeholder="Your own after-hours message (optional)" '+
     'oninput="TSET.draftAfter=this.value" style="width:100%">'+esc(TSET.draftAfter)+'</textarea>';
  h+='<div style="font-size:11px;color:var(--text4);margin-top:.5rem">'+
     'We only email you between '+_fmtHour(TSET.notifyOpen)+' and '+_fmtHour(TSET.notifyClose)+
     (TSET.notifyDerived?', from your own availability.':', the studio\'s standard hours.')+
     ' '+esc(TSET_COPY.hoursNote)+'</div>';
  h+='<div style="margin-top:.6rem"><button class="btn btn-s" onclick="saveTeacherSettings()">Save</button></div>';
  h+='</div>';
  return h;
}
function _fmtHour(h){
  h=Number(h)||0;
  var ap=h>=12?'pm':'am', h12=h%12; if(h12===0)h12=12;
  return h12+ap;
}
function loadTeacherSettings(){
  TSET.loading=true;
  api({action:'teacherGetSettings', data:{teacherToken:TOKEN}}, function(e,r){
    TSET.loading=false;
    if(e||!r||!r.ok) return;   // silent: a settings read must never block messaging
    var st=r.settings||{};
    TSET.awayEnabled=!!st.awayEnabled;
    TSET.awayMessage=st.awayMessage||'';
    TSET.afterHoursMessage=st.afterHoursMessage||'';
    TSET.awayDefaultCopy=st.awayDefaultCopy||TSET.awayDefaultCopy;
    TSET.notifyOpen=st.notifyOpen; TSET.notifyClose=st.notifyClose;
    TSET.notifyDerived=!!st.notifyDerived;
    TSET.draftAway=TSET.awayMessage;
    TSET.draftAfter=TSET.afterHoursMessage;
    TSET.loaded=true;
    render();
  });
}
function setAway(on){
  var msg=(document.getElementById('tset-away')||{}).value;
  if(msg===undefined) msg=TSET.draftAway;
  // The refusal that used to be here is gone, found 4 September while wiring
  // the generic message into this box. [1.196] took it out of the SERVER on
  // 2 September — "away without writing anything", using AC's default wording
  // — and the portal kept its own copy of the old rule, so the switch still
  // demanded text the tool no longer needed. A teacher who switches Away on
  // with an empty box now gets AWAY_DEFAULT_COPY, which is the sentence shown
  // greyed in that same box.
  _saveSettings({awayEnabled:on, awayMessage:msg});
}
function saveTeacherSettings(){
  _saveSettings({
    awayEnabled:TSET.awayEnabled,
    awayMessage:(document.getElementById('tset-away')||{}).value,
    afterHoursMessage:(document.getElementById('tset-after')||{}).value
  });
}
function _saveSettings(fields){
  TSET.saving=true; render();
  var d={teacherToken:TOKEN};
  for(var k in fields) if(fields[k]!==undefined) d[k]=fields[k];
  api({action:'teacherSaveSettings', data:d}, function(e,r){
    TSET.saving=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not save.','e'); render(); return; }
    var st=r.settings||{};
    TSET.awayEnabled=!!st.awayEnabled;
    TSET.awayMessage=st.awayMessage||'';
    TSET.afterHoursMessage=st.afterHoursMessage||'';
    TSET.awayDefaultCopy=st.awayDefaultCopy||TSET.awayDefaultCopy;
    TSET.draftAway=TSET.awayMessage;
    TSET.draftAfter=TSET.afterHoursMessage;
    TSET.loaded=true;
    showMsg(TSET.awayEnabled?'You\'re set to away.':'Saved.','s');
    render();
  });
}

function rTabBadge(n){
  if(!n) return '';
  // [1.222] — a spreadsheet epoch-zero cell arrives as a large NEGATIVE
  // number, which is truthy and used to print as "12/30/99". Anything before
  // the year 2000 is not a real message time; showing nothing is honest.
  if(n < 946684800000) return '';
  return '<span class="tab-badge">'+n+'</span>';
}

function switchTab(tab){
  HOME_TAB=tab;
  render();
  if(tab==='settings' && !TSET.loaded && !TSET.loading) loadTeacherSettings();
  if(tab==='staff' && STAFF_VIEW==='list'){
    if(!STAFF_PICKER.all.length && !STAFF_PICKER.loading) loadStaffDirectory();
    if(!STAFF_THREADS.list.length && !STAFF_THREADS.loading) loadStaffThreads();
  }
  if(tab==='family' && FAMILY_VIEW==='list' && !FAMILY_THREADS.list.length && !FAMILY_THREADS.loading) loadFamilyThreads();
}

// ══ The teacher's messages, one scrolling page (AC, 3 September 2026) ══════
