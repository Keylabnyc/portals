  // [1.320] — the deadline is on the title line now; see the note above.
  // ── [1.428] — Send is DISABLED while a file is still going up ─────────
  //
  // AC, 8 September 2026: "The send button should be greyed out until the file
  // has been added, seeing as the user can't send until the file is added. The
  // user CAN click on send and it will send as soon as the file loads, but this
  // creates confusion: did the message send? What's happening while the file is
  // loading and the family clicks send?"
  //
  // **This REVERSES [1.402]'s held press**, which was built to his earlier
  // instruction that Send should wait and say so. He has now used it and
  // prefers the button plainly unavailable with a reason. His current word
  // wins, and the reason is rendered beside the button rather than as a toast.
  var _upBusy=_attAnyUploading();
  var sendBtn=AMEND.kind==='edit' ? rEditActions() : (t.sending || actBusy('send')
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
    :rAttachButton()+
      (_upBusy
        ? '<button class="btn btn-p" disabled title="'+esc(TCH_COPY.sendBlockedUploading)+'">Send</button>'
        : '<button class="btn btn-p" onclick="sendFamilyMessage()">Send</button>')+
      // [1.371] — beside Send, not inside a menu. It is one of two ways to
      // finish the message that is already written.
      '<button type="button" class="btn btn-s" onclick="openSendLater()">'+esc(TCH_COPY.sendLater)+'</button>')+
    // [1.359] — one press, straight to the thread with the office.
    '<button type="button" class="btn btn-ask" onclick="askAdminAbout()">'+
      esc(CMP_COPY.askAdmin)+'</button>'+
    '<span style="flex:1"></span>'+
    // [1.287] — nothing sent yet, so there is nothing to close. AC: "a
    // conversation that is opened but never started should not need to be
    // closed. It should be as though it never existed."
    // [1.309]/[1.312] — nothing to close before a first message, and nothing
    // to offer while a reply is owed: the server refuses it either way, and a
    // button that fails is worse than no button. The teacher is told why by
    // the row's own line, in AC's words.
    (!(t.messages||[]).length || (_cRow&&Number(_cRow.waitingSince))
      ? ''
      : _cRow&&_cRow.closed
      // [1.347] — inside the OPEN thread the state still has to be said: this
      // sits where the End Conversation button was, and an empty gap would
      // leave a teacher wondering whether they had ended it. It says
      // "Archived", which is the word AC chose for where the conversation now
      // lives, rather than a third one.
      ? '<span class="closed-tag'+(_r&&_r.closedUnanswered?' unanswered':'')+'">'+
        esc(_r&&_r.closedUnanswered?TCH_COPY.endedUnanswered:'Archived')+'</span>'
      : '<button type="button" class="btn btn-s" onclick="closeConversation()">'+esc(TCH_COPY.closeConversation)+'</button>');
  // BACKLOG 1.161 #4 — which child, asked only when a teacher has more than
  // one child in this family. One child and it is set automatically with
  // nothing on screen.
  var _kids=t.students||[];
  if(_kids.length>1){
    var _sel=_threadStudentId(t);
    h+='<div class="about-row"><span>About</span>'+
      _kids.map(function(st){
        return '<span class="about-pill'+(_sel===st.studentId?' on':'')+'" '+
          'onclick="ACTIVE_THREAD.studentId=\''+esc(st.studentId)+'\';render()">'+esc(st.studentName)+'</span>';
      }).join('')+
      '<span class="about-pill'+(_sel?'':' on')+'" onclick="ACTIVE_THREAD.studentId=\'\';render()">Something else</span>'+
      '</div>';
  }
  h+=rComposer('family-composer',t.draft,'_composerSync(\'family-composer\')',sendBtn);
  // BACKLOG 1.135 — ask the office for help with a family question. Sharing,
  // not handing over: the conversation still ages against this teacher until
  // one of them answers, and a note saying what is needed is required, so a
  // forward is a question rather than a task passed along.
  // [1.233] — AC's dialog, in the same inline shape the Ask Admin panel uses,
  // so a decision is made where the button is rather than in a browser popup
  // that says nothing about this thread.
  if(t.closeReviewOpen){
    h+='<div class="fwd-box">'+
       '<div style="margin-bottom:.55rem">'+esc(TCH_COPY.closeNeedsReview)+'</div>'+
       '<div style="display:flex;gap:8px;justify-content:flex-end">'+
         '<button class="btn btn-s" onclick="cancelCloseReview()">'+esc(TCH_COPY.cancel)+'</button>'+
         (t.closing
           ? '<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
           : '<button class="btn btn-p" onclick="clearAndClose()">'+esc(TCH_COPY.clearAndClose)+'</button>')+
       '</div></div>';
  }
  // [1.438] — the same inline shape, for the case AC named: ending a
  // conversation a family is still waiting on. In the thread, where the
  // messages that are unanswered are on screen behind it.
  if(t.closeUnansweredAsk){
    h+='<div class="fwd-box">'+
       '<div style="margin-bottom:.55rem">'+esc(TCH_COPY.closeUnansweredAsk)+'</div>'+
       '<div style="display:flex;gap:8px;justify-content:flex-end">'+
         '<button class="btn btn-s" onclick="cancelCloseUnanswered()">'+esc(TCH_COPY.closeUnansweredBack)+'</button>'+
         (t.closing
           ? '<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
           : '<button class="btn btn-p" onclick="confirmCloseUnanswered()">'+esc(TCH_COPY.closeUnansweredGo)+'</button>')+
       '</div></div>';
  }
  // [1.359] — the forward panel is gone. Ask Admin opens the teacher's own
  // thread with the office; there is nothing to fill in here first.
  return h;
}

// The conversation's roster row, for the facts the thread payload does not
// carry — whether it is closed, and who closed it.
function _convRow(familyId){
  return (FAMILY_THREADS.list||[]).filter(function(x){ return x.familyId===familyId; })[0]||null;
}

// ── The three things a teacher does to a conversation (3 September 2026) ──

// Save a message for review ([1.215]). Private, per message, and the only
// hand-made mark left anywhere: it replaced mark-unread, which marked a whole
// thread and claimed something untrue about a message that had been read.
// Optimistic — the tick is instant and the roster catches up behind it, since
// a checkbox that waits on a round trip feels broken.
function toggleReview(messageId, on){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  var was=null;
  (t.messages||[]).forEach(function(m){
    if(m.messageId!==messageId) return;
    was=m.reviewAt||'';
    m.reviewAt=on?Date.now():'';
  });
  // [1.231] — held until the write lands, so a wholesale re-read of the
  // thread (a manual Refresh, or the re-read after Mark seen) cannot put a
  // tick back the way it was before the server has been told. The poll itself
  // only ever APPENDS, so it was never the risk; these two are.
  t._reviewPending=t._reviewPending||{};
  t._reviewPending[messageId]=on?Date.now():'';
  render();   // the tick, the marked bubble and the roster circle, all now
  api({action:'setMessageReview', data:_threadKey(t,{messageId:messageId, review:!!on})}, function(e,r){
    delete t._reviewPending[messageId];
    if(e||!r||!r.ok){
      // Put it back rather than leaving a tick that did not stick.
      (t.messages||[]).forEach(function(m){ if(m.messageId===messageId) m.reviewAt=was; });
      showMsg((r&&r.error)||'Could not save that for review.','e'); render(); return;
    }
    // ── [1.315] — the ROW's count moves too, not only the thread's ─────────
    //
    // AC: "Saved for review badge on teacher card correctly shows no messages
    // saved for review when message is opened, but reverts back to the state
    // of the card when the messages were saved for review. It clears
    // eventually in a few minutes."
    //
    // _reviewCountFor reads the OPEN thread's messages and is right while the
    // thread is open — which is why the badge looks correct at first. Close the
    // thread and it falls back to the roster's number, which is whatever the
    // server last said, and that is the old count until a roster fetch lands.
    // So the badge was correct, then wrong, then correct again.
    //
    // The fix is the lesson [1.311] cost: **when the truth changes, move every
    // copy of it, not only the one on screen.** The write has landed; the
    // roster row is a copy of what the server now holds, so it is updated to
    // match rather than left to be corrected later.
    _setRowReviewCount(t, _openReviewMarks(t));
    _refreshRosters();
  });
}

// [1.315] — the roster row for an open thread, so a confirmed change to its
// review count is written where the row will read it after the thread closes.
// Writes into THREADS.list, never into FAMILY_THREADS/STAFF_THREADS: those are
// computed views and a write to one goes into an object nobody keeps ([1.311]).
function _setRowReviewCount(t, n){
  if(!t) return;
  var kind = t.familyId ? 'family' : (t.contactType==='admin' ? 'admin' : 'staff');
  var id = t.familyId || (kind==='admin' ? 'admin' : t.otherId);
  (THREADS.list||[]).forEach(function(row){
    if(row.kind===kind && (kind==='admin' || row.id===id)) row.reviewCount=n;
  });
}

// ── [1.325] — THE ROW ANSWERS THE MOMENT YOU SEND ───────────────────────
//
// AC, 5 September, timing it: "When I click close conversation on the message
// after sending a reply and no reply is due any longer, it takes up to 20
// seconds for the 'close conversation' button to show in place of the blue
// message numbered badge. This should be instant, and process in the
// background."
//
// This is NOT [1.279], which made the close ACTION optimistic. It happens one
// step earlier: the badge and the End Conversation button are decided by
// `awaitingReply` and `waitingSince`, which are SERVER fields — so the row
// went on saying a reply was owed until a roster fetch came back and said
// otherwise. A poll tick plus [1.263]'s ~2s per request is his twenty seconds.
//
// Sending a reply is the one event where this client knows the answer before
// the server does: nothing can still be owed by a teacher who has just
// answered. So the row is updated from the send, and the roster fetch that
// follows confirms it rather than being waited on.
//
// Written into THREADS.list and nowhere else — FAMILY_THREADS/STAFF_THREADS are
// computed views and a write to one lands in an object nobody keeps ([1.311]).
// Returns what it overwrote so a failed send can put it back.
function _setRowAnswered(t){
  if(!t) return null;
  var kind = t.familyId ? 'family' : (t.contactType==='admin' ? 'admin' : 'staff');
  var id = t.familyId || (kind==='admin' ? 'admin' : t.otherId);
  var undo=[];
  (THREADS.list||[]).forEach(function(row){
    if(row.kind!==kind) return;
    if(kind!=='admin' && row.id!==id) return;
    undo.push({row:row, awaitingReply:row.awaitingReply, waitingSince:row.waitingSince,
               unread:row.unread, replyDueBy:row.replyDueBy});
    row.awaitingReply=0; row.waitingSince=0; row.unread=0; row.replyDueBy=0;
  });
  return undo.length?undo:null;
}
function _undoRowAnswered(undo){
  if(!undo) return;
  undo.forEach(function(u){
    u.row.awaitingReply=u.awaitingReply; u.row.waitingSince=u.waitingSince;
    u.row.unread=u.unread; u.row.replyDueBy=u.replyDueBy;
  });
}

// Re-applies whatever this client has ticked and the server has not yet
// confirmed, after a fetch that replaced the thread wholesale.
function _applyPendingReviews(t){
  if(!t||!t._reviewPending) return;
  (t.messages||[]).forEach(function(m){
    if(m.messageId && t._reviewPending.hasOwnProperty(m.messageId)) m.reviewAt=t._reviewPending[m.messageId];
  });
}

// [1.233] — clearing every review mark in this conversation, which is the
// first half of Clear & close. One server call, not a loop: a close that
// half-clears is worse than one that refuses.
function clearAllReviews(t, done){
  if(!t) return;
  (t.messages||[]).forEach(function(m){ if(m.reviewAt) m.reviewAt=''; });
  t._reviewPending={};
  render();
  api({action:'clearConversationReviews', data:_threadKey(t,{})}, function(e,r){
    if(e||!r||!r.ok){
      // Nothing was cleared and nothing is closed — put the thread back the
      // way it was and say so, rather than leaving a half-done action.
      t.closing=false; t.closeReviewOpen=false;
      showMsg((r&&r.error)||'Could not clear those.','e');
      _refreshOpenThread(); render(); return;
    }
    _refreshRosters();
    if(done) done();
  });
}

// "Mark seen" ([1.220]) — the two-line note, sent on purpose. It does NOT stop
// the clock: the conversation goes on ageing, keeps its place, and stays on
// admin's list until someone actually answers. Being seen is not being
// answered, and the tool must never let the two look the same — that is the
// whole of the item.
function markSeen(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.seenSending) return;
  t.seenSending=true; render();
  api({action:'markMessageSeen', data:_threadKey(t,{})}, function(e,r){
    t.seenSending=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send that.','e'); render(); return; }
    _refreshOpenThread();
  });
}

// Closing, which is deliberate and confirmed (AC, 3 Sept: "make teachers
// formally close conversations using a checkbox or button to close, with a
// confirm step"). Replying closes nothing — a teacher who answers "I'll check
// and come back to you" has replied without finishing, and no rule can tell
// that from a real answer.
// [1.233], AC: "Don't allow user to close conversation unless all reviewed
// messages are cleared."
//
// He then replaced the greyed-out button with a dialog, and it is the better
// of the two: the button stays live and EXPLAINS ITSELF at the moment it is
// pressed, rather than being disabled with the reason somewhere else on the
// page.
// [1.327], AC 5 September — a conversation with no marks used to get a plain
// "Close conversation?" confirm as well. That one is gone: there is nothing to
// warn about, and it stood between him and the one action he takes most.
function _openReviewMarks(t){
  var n=0;
  (t&&t.messages||[]).forEach(function(m){ if(m.reviewAt) n++; });
  return n;
}
// ── [1.438] — ending WITHOUT a reply asks first ──────────────────────────
//
// AC, 8 September 2026: "teacher can end a conversation without a reply, but is
// not prompted to confirm this step 'End conversation without a reply?'"
//
// **This is not the confirm [1.327] withdrew.** That one asked before every
// close, and AC took it out because it guarded nothing: *"It's archived, and
// can't be archived if a reply is due, so this doesn't really serve a
// purpose."* The second half of that sentence stopped being true later the
// same day — [1.335] removed the refusal, so a conversation CAN now be ended
// with a family still waiting. **The confirm he withdrew guarded a case that
// could not happen; this one guards the case that now can.**
//
// So it asks ONLY when a reply is genuinely owed. Ending an answered
// conversation is still one press, which is the common case and the one his
// withdrawal was about.
function _owesFamilyReply(t){
  if(!t) return false;
  var row=_convRow(t.familyId);
  return !!(row && Number(row.awaitingReply)>0);
}
function closeConversation(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.closing) return;
  if(_openReviewMarks(t)){ t.closeReviewOpen=true; render(); return; }
  if(t===ACTIVE_THREAD && _owesFamilyReply(t) && !t.closeUnansweredOk){
    t.closeUnansweredAsk=true; render(); return;
  }
  _doCloseConversation(t);
}
function cancelCloseUnanswered(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  t.closeUnansweredAsk=false; render();
}
function confirmCloseUnanswered(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  t.closeUnansweredAsk=false; t.closeUnansweredOk=true;
  _doCloseConversation(t);
}
// Clear & close: one action, in that order. Closing first and clearing after
// would leave a thread closed with marks still on it if the second call
// failed, which is the state the whole item exists to prevent.
function clearAndClose(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.closing) return;
  t.closing=true; render();
  clearAllReviews(t, function(){ _doCloseConversation(t); });
}
function cancelCloseReview(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  t.closeReviewOpen=false; t.closing=false; render();
}
// ── [1.337] — ending from inside the thread moves the row too ───────────
//
// AC, 5 September 2026: "after replying and ending a conversation, the teacher
// still sees the message in the new messages area, but it should be archived.
// This makes the teacher end the conversation twice."
//
// **Established by comparing the two paths rather than guessing at one.**
// There are two ways to end a conversation and they were not the same:
//
//   closeRow()          patches the roster row optimistically ([1.279]/[1.311])
//                       and the row moves on the click.
//   closeConversation() patched NOTHING. It wrote, then asked for a fresh
//                       roster, and the row sat under Messages until that
//                       round trip came back — [1.263]'s ~2s plus a rebuild,
//                       on top of a reply that had just made the same trip.
//
// So the conversation AC had just ended went on looking un-ended, and ending
// it again is the obvious thing to do. **Same fault as [1.325] and the same
// answer: the client knows the outcome, so it draws it.**
//
// The pane is cleared with it. An ended conversation left open on the right,
// beside a list that has filed it away, is the two halves of the screen
// disagreeing again ([1.283]) — and there is nothing more to do in it.
function _doCloseConversation(t){
  t.closing=true; t.closeReviewOpen=false; render();
  var _w=_draftWhere(t);
  var _src=_w ? (THREADS.list||[]).filter(function(x){
    return x.kind===(_w[0]==='family'?'family':(_w[0]==='admin'?'admin':'staff')) &&
           (_w[0]==='admin' || x.id===_w[1]);
  })[0] : null;
  var _was=!!(_src&&_src.closed);
  if(_src) _src.closed=true;
  _openPane('');            // [1.336]'s setter — nothing is open, and both flags say so
  render();
  api({action:'setConversationClosed', data:_threadKey(t,{closed:true})}, function(e,r){
    t.closing=false;
    if(e||!r||!r.ok){
      if(_src) _src.closed=_was;
      showMsg((r&&r.error)||'Could not end that.','e'); render(); return;
    }
    _refreshRosters();
  });
}

// The four fields every one of these endpoints identifies a conversation by,
// in one place — three copies of this is how two of them would end up
// disagreeing about which thread they were talking to.
function _threadKey(t, extra){
  var d={teacherToken:TOKEN, teacherId:TEACHER_ID};
  if(t===ACTIVE_STAFF_THREAD){
    // A staff thread names itself by who it is with, not by a family.
    if(t.contactType==='admin'){ d.conversationType='teacher_admin'; }
    else { d.conversationType='staff_staff'; d.staffId2=t.otherId; }
  } else {
    d.conversationType='family_teacher';
    d.familyId=t.familyId;
  }
  Object.keys(extra||{}).forEach(function(k){ d[k]=extra[k]; });
  return d;
}
function _refreshRosters(){ loadThreads(true); }   // [1.292] — one list, one call
function _refreshOpenThread(){
  if(ACTIVE_STAFF_THREAD) refreshStaffThread(); else if(ACTIVE_THREAD) refreshFamilyThread();
}

// Sends the family's latest message to the office with the teacher's own note,
// and tells the family it has happened (AC's copy, server-side).
// ── [1.359] — Ask Admin takes you to admin ──────────────────────────────
//
// AC, 7 September: "Perhaps the best solution is simply a separate thread for
// the teacher and admin where a teacher can simply ask about a conversation
// that the admin already has oversight on anyway?"
//
// It used to copy the family's message into the staff thread, mark the
// conversation shared and pause the response clock. All of that existed to
// give admin context admin already had — they can open any family conversation
// whenever they like. So this now does the one thing it was ever for: it opens
// the teacher's thread with the office, with the family's name already in the
// box, and the teacher writes their own question.
//
// The family's name is put in the DRAFT rather than sent: it is a starting
// point a teacher can delete, not a header the tool insists on.
function askAdminAbout(){
  var t=ACTIVE_THREAD;
  if(!t) return;
  var who=String(_rosterParentLine(t)||t.parent1Name||'').trim();
  var lead='About '+(who||'this family')+': ';
  var existing=_draftGet('admin','admin')||'';
  // Never overwrite something already half-written to admin, and never repeat
  // the lead if it is already there.
  if(!existing.trim()) _draftSet('admin','admin', esc(lead));
  else if(existing.indexOf(lead)===-1) _draftSet('admin','admin', esc(lead)+'<br>'+existing);
  HOME_TAB='staff';
  openStaffThread('admin','admin','Admin');
}

// [1.371] — sendAt is optional and is the ONLY difference between sending and
// scheduling on this side. Everything about what is being sent — the words,
// the files, which parents are ticked, the student — is read exactly once,
// here, so the two cannot drift apart.
function sendFamilyMessage(sendAt){
  var t=ACTIVE_THREAD;
  var _el=document.getElementById('family-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  var text=_composerPlain(html);
  // [1.277] — a message can be a file with nothing written on it, which is
  // most of why a teacher wants this at all: a photo of a page of music.
  var _att=_attTakeIds();
  if(!text && !_att.length) return;
  // A file still going up is the one thing worth waiting for. Sending now
  // would send the message without it and leave the upload orphaned.
  // [1.428] — the button is disabled while an upload is in flight, so this is
  // now a backstop rather than the mechanism: a keyboard send, or a race
  // between the click and the upload finishing. It refuses plainly instead of
  // holding a press the teacher can no longer see.
  if(_attAnyFailed()){ actFail('send', TCH_COPY.sendBlocked); render(); return; }
  if(_attAnyUploading()){ actFail('send', TCH_COPY.sendBlockedUploading); render(); return; }
  actClear('send');
  var notifyParents=[];
  if(!t.parent1Name || !t.parent2Name){
    // Only one parent on file — nothing to choose, notify whichever exists.
    notifyParents=undefined;
  } else {
    if(t.notifyP1) notifyParents.push('parent1');
    if(t.notifyP2) notifyParents.push('parent2');
  }
  // BACKLOG 1.124 #2. This used to cost the teacher TWO sequential Apps Script
  // round trips before their own words left the box: a sendMessage, then a full
  // refreshFamilyThread() to fetch back the message just sent. The family
  // portal has done it properly since 1.46 and this is that pattern ported --
  // append locally, post in the background, reconcile in place.
  var clientMsgId=_ktNewClientMsgId();
  var _stuId=_threadStudentId(t);   // which child (1.161 #4)
  // [1.277] — the optimistic bubble carries the files too, drawn from what the
  // chips already know. Without this a message with a photo appears blank for
  // the length of a round trip, which is exactly the flicker [1.43] removed.
  var _attRows=ATT_PENDING.filter(function(x){ return x.attachmentId; })
    .map(function(x){ return {attachmentId:x.attachmentId, fileName:x.fileName,
                              mimeType:x.mimeType, sizeBytes:x.sizeBytes}; });
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(), studentId:_stuId,
    attachments:_attRows, _pending:true
  };
  // [1.371] — a scheduled message goes into the SCHEDULED list optimistically,
  // not into the thread. Putting it in the thread would show the teacher a
  // message that has not been sent sitting where sent messages are, which is
  // the one impression this feature must not give.
  if(sendAt){ pending.sendAt=sendAt; t.scheduled=(t.scheduled||[]).concat([pending]); }
  else t.messages=t.messages.concat([pending]);
  t.draft='';
  _attClear();         // [1.277]
  TPL_USED=null; TPL_NAMING=false;   // [1.127] — sent, so there is nothing left to offer to save — sent, so the chips go with the draft
  _draftKeep(t, '');   // [1.336] — sent is not a draft any more
  // Stops the 5s poll delivering this same message back before the server has
  // confirmed it, which would show it twice.
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  // [1.371] — and it does NOT stop the clock. A scheduled reply is not a
  // reply; the family is still waiting, and the row must go on saying so.
  var _rowUndo=sendAt ? null : _setRowAnswered(t);   // [1.325] — the row stops owing a reply now
  render();

  api({action:'sendMessage', data:{conversationType:'family_teacher', familyId:t.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN, messageText:text, messageHtml:html, studentId:_stuId, notifyParents:notifyParents, clientMsgId:clientMsgId, attachmentIds:_att, sendAt:sendAt||''}}, function(e,r){
    if(!ACTIVE_THREAD || ACTIVE_THREAD.familyId!==t.familyId) return; // navigated away mid-flight
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      // Put it back where the teacher can see and retry it, rather than losing
      // words they watched "send".
      if(sendAt) t.scheduled=(t.scheduled||[]).filter(function(m){ return m!==pending; });
      else t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=html;
      // [1.277] — and the files come back with the words. They are still
      // uploaded and still unbound, so the ids are good and a retry sends them.
      ATT_PENDING=_attRows.map(function(a){ return {tempId:'t'+a.attachmentId, fileName:a.fileName,
        mimeType:a.mimeType, sizeBytes:a.sizeBytes, uploading:false, attachmentId:a.attachmentId}; });
      ATT_BUSY=0;
      _draftKeep(t, html);   // [1.336] — it never left, so it is a draft again
      _undoRowAnswered(_rowUndo);    // [1.325] — nothing was sent, so nothing was answered
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    // Reconciled in place from the server's own row, and deliberately NO
    // render() on success: the message is already on screen exactly as it will
    // stay, and re-rendering it is the flicker this exists to remove.
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
      pending.amendUntil=r.message.amendUntil||0;
      if(r.message.sendAt) pending.sendAt=r.message.sendAt;   // [1.371]
      if(r.message.attachments) pending.attachments=r.message.attachments;   // [1.277]
    }
    // [1.371] — the Scheduled count changed, and it is on the screen behind
    // this thread. Refreshed here rather than on a poll, because the teacher
    // has just this moment created the thing it counts.
    if(sendAt){
      // [1.404] — the act is confirmed here, on the server's answer, not when
      // the button was pressed. A confirmation shown before the round trip is
      // a promise rather than a fact.
      actDone('send', TCH_COPY.scheduledDone.replace('{when}', fmtMsgTime(Number(sendAt)||_schedJustSetAt)));
      _schedInvalidate(); render(); return;
    }
    // [1.276] — ONE exception to the no-render rule above, and it is the whole
    // reason the window is usable. Unsend cannot be drawn until the message has
    // an id, and the id arrives here; without this the two words would not
    // appear until the next poll, spending up to five seconds of a ten-second
    // window. This is not [1.43]'s flicker — the thread is redrawn with exactly
    // the same content plus two words, and the composer's caret survives a
    // render ([1.332]).
    if(_canAmendMsg(pending)) render();
  });
}

// ============================================================
// FORMATTING COMPOSER (BACKLOG 1.33)
// ============================================================
// Button-driven only — no typed syntax, no keyboard shortcuts to learn
// (settled with AC: teachers won't know them). Same execCommand approach
// already proven in admin's Comms toolbar, minus its colour/font/image extras.
//
// IMPORTANT: nothing in this section is a security control. _composerClean()
// below is a tidiness pass, because contenteditable emits browser-specific
// soup (div line wrappers, span style attributes, &nbsp;) and pasted content
// drags in whatever the source page had. The real boundary is _sanitizeMessageHtml_()
// in Code.js, which re-checks everything server-side and assumes this file
// could be bypassed entirely — because it can: anything can POST to sendMessage.

// Tags kept, normalized to a single spelling each so the server sees a small,
// predictable vocabulary. Everything else is unwrapped, keeping its text.
var CMP_KEEP={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote'};

// Elements whose CONTENT has to go as well, not just their tag. Everything
// else is unwrapped (tag dropped, words kept), which is right for a pasted
// span but wrong for a script element — unwrapping that would drop the tag
// and leave 'alert(1)' sitting in the message as visible text.
var CMP_DROP={SCRIPT:1,STYLE:1,NOSCRIPT:1,TEMPLATE:1,IFRAME:1,OBJECT:1,EMBED:1,HEAD:1,TITLE:1};

// Reads bold/italic/underline out of an inline style attribute. Pasted content
// carries formatting this way rather than as tags — Docs and Word both put
// bold on a <span style="font-weight:700"> — so without this, pasting loses
// every bit of emphasis. Returns null when there is no style attribute at all.
function _styleFlags(n){
  var st=(n.getAttribute&&n.getAttribute('style'))||'';
  if(!st) return null;
  st=st.toLowerCase();
  var f={};
  var fw=/font-weight\s*:\s*([a-z0-9]+)/.exec(st);
  if(fw){
    f.boldSet=true;
    f.bold=(fw[1]==='bold'||fw[1]==='bolder'||parseInt(fw[1],10)>=600);
  }
  if(/font-style\s*:\s*italic/.test(st)) f.italic=true;
  if(/text-decoration[^;]*underline/.test(st)) f.underline=true;
  return f;
}

function _composerClean(node){
  var out='';
  for(var i=0;i<node.childNodes.length;i++){
    var n=node.childNodes[i];
    if(n.nodeType===3){ out+=esc(n.nodeValue); continue; }
    if(n.nodeType!==1) continue;
    var tag=n.nodeName;
    if(CMP_DROP[tag]) continue;
    if(tag==='BR'){ out+='<br>'; continue; }
    var inner=_composerClean(n);
    if(tag==='A'){
      var href=n.getAttribute('href')||'';
      // Mirrors the server's rule so the toolbar can't silently produce a link
      // the server will then drop. The server still re-checks it.
      if(/^(https?:\/\/|mailto:)/i.test(href) && !/[\s"'<>\\]/.test(href)) out+='<a href="'+esc(href)+'">'+inner+'</a>';
      else out+=inner;
      continue;
    }
    var flags=_styleFlags(n);
    var keep=CMP_KEEP[tag];
    // [1.332] — a list nested by indenting comes out of the browser as a UL
    // sitting directly inside a UL, which is not valid and renders differently
    // in different mail clients. It belongs inside an item, so it is given one.
    if((tag==='UL'||tag==='OL')&&(node.nodeName==='UL'||node.nodeName==='OL')){
      if(inner) out+='<li><'+keep+'>'+inner+'</'+keep+'></li>';
      continue;
    }
    // An explicit font-weight:normal cancels a bold tag. Google Docs wraps its
    // ENTIRE clipboard payload in <b style="font-weight:normal">, so honouring
    // the tag over the style would make every message pasted from Docs bold.
    if(keep==='b' && flags && flags.boldSet && !flags.bold) keep=null;
    if(keep){ if(inner) out+='<'+keep+'>'+inner+'</'+keep+'>'; continue; }
    // Formatting carried as an inline style instead of a tag gets promoted to
    // the real tag, so pasted bold/italic survives.
    if(inner && flags){
      if(flags.underline) inner='<u>'+inner+'</u>';
      if(flags.italic) inner='<i>'+inner+'</i>';
      if(flags.bold) inner='<b>'+inner+'</b>';
    }
    // DIV/P are how contenteditable wraps each new line — become line breaks.
    if(tag==='DIV'||tag==='P'){ out+=(out&&!/<br>$/.test(out)?'<br>':'')+inner; continue; }
    out+=inner; // SPAN, FONT, and anything pasted in: unwrap, keep the words
  }
  return out;
}

// Only used to decide "is this message empty" before sending. The real
// plain-text copy stored on the record is derived server-side from the
// sanitized HTML, never from here — see the note on doSendMessage().
function _composerPlain(html){
  return String(html||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ')
    .replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
}

// ── [1.336] — the draft belongs to the CONVERSATION, not to the pane ─────
//
// AC, 5 September 2026: "Save the message being written as a draft message, or
// allow teacher to click save as draft so they don't lose changes. The solution
// here needs to be the most efficient, clear, quick, and stable option. Use
// industry standards to guide your decision."
//
// **The tool was worse than he thought, and this is the part worth recording.**
// He assumed switching was BLOCKED to protect a half-written message. It was
// not blocked (see [1.336] in _openPane) and nothing was protected:
// openFamilyThread() built a fresh ACTIVE_THREAD with draft:'' every single
// time, so switching conversations discarded what you were typing, silently,
// with no way back. There was no guard — there was a data loss.
//
// **The standard is autosave per thread, not a Save-as-draft button.** Every
// mail client has worked this way for fifteen years: the draft belongs to the
// conversation, it is kept as it is typed, it comes back when you return, and
// nobody presses anything. A button to press is a button to forget, and it is
// forgotten exactly when it matters — which is the case AC is describing.
//
// Keyed by the same conversation key THREAD_CACHE uses, so a draft and the
// messages it belongs with can never be filed under different names. Held in
// localStorage as well as memory, so a reload, a crash or a closed tab does
// not lose it either — the same wrapper "remember me" uses, equally
// unavailable-safe.
var DRAFTS = {};
function _draftKey(kind, id){
  return kind==='family' ? 'ft_'+id : (kind==='admin' ? 'ta_admin' : 'ss_'+id);
}
function _draftsLoad(){
  try{ DRAFTS = JSON.parse(localStorage.getItem('kl_teacher_drafts')||'{}') || {}; }
  catch(e){ DRAFTS = {}; }
}
function _draftsSave(){
  try{ localStorage.setItem('kl_teacher_drafts', JSON.stringify(DRAFTS)); }catch(e){}
}
function _draftGet(kind, id){ return DRAFTS[_draftKey(kind,id)] || ''; }
function _draftSet(kind, id, html){
  var k=_draftKey(kind,id);
  // An empty draft is deleted rather than stored as '': a store full of empty
  // strings is a store that grows forever and answers every question "yes".
  if(html && html.replace(/<[^>]*>/g,'').trim()) DRAFTS[k]=html;
  else delete DRAFTS[k];
  _draftsSave();
}
// Which conversation the open thread is, in the two words the key needs.
function _draftWhere(t){
  if(!t) return null;
  if(t.familyId) return ['family', t.familyId];
  return t.contactType==='admin' ? ['admin','admin'] : ['staff', t.otherId];
}

function _composerInput(el){
  // Browsers leave a stray line-break wrapper behind when the box is emptied,
  // which defeats the :empty placeholder rule. Clear it only when there is
  // genuinely nothing left — the list check keeps an empty bullet the teacher
  // just created from being wiped out from under them.
  if(!el.textContent.trim() && !el.querySelector('ul,ol,a')) el.innerHTML='';
  return _composerClean(el);
}

function _composerSync(id){
  var el=document.getElementById(id); if(!el) return;
  // _composerInput rather than _composerClean: it also clears the stray
  // line-break wrapper browsers leave behind in an emptied box, which is what
  // the :empty placeholder rule depends on. [1.336] routed both composers'
  // oninput through here, so that cleanup has to happen here too or the
  // placeholder stops coming back.
  var v=_composerInput(el);
  _tplOfferSync(id);   // [1.127] — the offer to keep this as a template, live
  if(id==='family-composer' && ACTIVE_THREAD){ ACTIVE_THREAD.draft=v; _draftKeep(ACTIVE_THREAD, v); }
  if(id==='staff-composer' && ACTIVE_STAFF_THREAD){ ACTIVE_STAFF_THREAD.draft=v; _draftKeep(ACTIVE_STAFF_THREAD, v); }
}
// [1.336] — one place the draft is written from, so the two composers cannot
// end up keeping it differently.
function _draftKeep(t, v){
  var w=_draftWhere(t);
  if(w) _draftSet(w[0], w[1], v);
}

function _composerCmd(id,cmd){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  // styleWithCSS(false) makes the browser emit <b> rather than
  // <span style="font-weight:bold">, which the allowlist would otherwise drop.
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand(cmd,false,null);
  _composerSync(id);
  _composerState(id);
}

// Paste keeps its formatting (AC's call, 19 Aug) — a teacher pasting a
// bulleted practice list out of Docs keeps the bullets. What survives is
// whatever _composerClean() allows, so pasted content lands in exactly the
// same shape as content typed with the toolbar.
//
// The clipboard HTML is parsed with DOMParser, never by assigning innerHTML:
// a DOMParser document is inert, so a pasted image with an onerror handler or
// a pasted script element can't run while we walk it. The server sanitizer
// still re-checks the result regardless.
function _composerPaste(ev){
  var cd=ev.clipboardData||window.clipboardData;
  if(!cd) return;
  var html='';
  try{ html=cd.getData('text/html')||''; }catch(e){}
  // No HTML flavour on the clipboard (plain-text copy, most mobile keyboards):
  // let the browser's own plain-text paste happen untouched.
  if(!html) return;
  ev.preventDefault();
  var clean='';
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    clean=_composerClean(doc.body);
  }catch(e){
    clean=esc(cd.getData('text/plain')||'');
  }
  if(clean) document.execCommand('insertHTML',false,clean);
}

// ── [1.332] ─ Tab indents a list item; it does not leave the box ───────
//
// AC, 5 September 2026: "Allow teachers to tab to indent a bullet or list item.
// Currently when teacher's or admin tabs messages, it takes them out of the
// compose window."
//
// Nothing listened for Tab at all, so it did what Tab does in a browser and
// moved the focus to Send. There was no way to nest a bullet by any means.
//
// **Only inside a list.** Tab on a plain line still moves the focus on, which
// is what keeps the box from being a keyboard trap: a person who reaches the
// composer by keyboard has to be able to leave it the same way. It is also
// the only honest scope for the word "indent" here — outside a list the
// browser's indent emits a blockquote, which is exactly the confusion [1.332]
// removed the buttons over.
function _composerKey(ev,id){
  if(ev.key!=='Tab'||ev.altKey||ev.ctrlKey||ev.metaKey) return;
  if(!_composerSelIn(id,'li')) return;
  ev.preventDefault();
  _composerCmd(id, ev.shiftKey?'outdent':'indent');
}

// ── [1.332] ─ Clear formatting clears the formatting ─────────────────
//
// removeFormat is INLINE-ONLY: it takes off bold, italic and underline and
// leaves lists, quotes and links exactly where they were. So the one button
// labelled "get me out of this" did nothing to the two states a person most
// wants out of — a list they entered by accident, and a quote they cannot see.
// Found by running it, not by reading it.
//
// The loops are guarded rather than trusted: each execCommand unwraps ONE
// level, a list can be nested several deep now that Tab indents, and a
// selection that stops moving must not spin forever.
function _composerClearFmt(id){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand('removeFormat',false,null);
  document.execCommand('unlink',false,null);
  var g=0;
  while(_composerSelIn(id,'ul')&&g++<12) document.execCommand('insertUnorderedList',false,null);
  g=0;
  while(_composerSelIn(id,'ol')&&g++<12) document.execCommand('insertOrderedList',false,null);
  g=0;
  // Angle-bracket form built from a variable, so the tag-balance check in
  // scripts/check.js doesn't read it as a real open tag.
  var _div='div';
  while(_composerSelIn(id,'blockquote')&&g++<12) document.execCommand('formatBlock',false,'<'+_div+'>');
  _composerSync(id);
  _composerState(id);
}
// Is the caret inside <sel> and still within this composer? Used for the two
// states document.queryCommandState() cannot answer honestly.
function _composerSelIn(id,selector){
  var el=document.getElementById(id); if(!el) return false;
  var s=window.getSelection();
  if(!s || !s.anchorNode) return false;
  var n=s.anchorNode;
  var e=(n.nodeType===1)?n:n.parentElement;
  return !!(e && el.contains(e) && e.closest && e.closest(selector));
}

// ── [1.332] ─ the caret survives the poll where it actually was ────────
//
// The re-render used to put the caret at the END of the message, on the
// reasoning that "a composer is written at the end". That is true of a first
// draft and false of every correction: pause for five seconds while fixing a
// word in the middle and the next keystroke landed at the bottom instead.
//
// Offsets are counted in TEXT, not in nodes, so they survive the box being
// rebuilt from cleaned HTML — which is what actually happens on a poll tick.
function _cmpOffsetOf(el,node,off){
  var r=document.createRange();
  r.selectNodeContents(el);
  try{ r.setEnd(node,off); }catch(e){ return 0; }
  return r.toString().length;
}
function _cmpOffsets(el){
  if(!el) return null;
  var s=window.getSelection();
  if(!s||!s.rangeCount) return null;
  var r=s.getRangeAt(0);
  if(!el.contains(r.startContainer)||!el.contains(r.endContainer)) return null;
  return {start:_cmpOffsetOf(el,r.startContainer,r.startOffset),

}
// ── [1.416] — a caret at the start of a bullet, not the end of the one above ──
//
// AC, 8 September 2026: "when adding bullet point links, the links are always
// placed at the end of the previous line, not after the bullet."
//
// The offsets [1.332] stores are a count of TEXT CHARACTERS, with nothing
// between blocks — so <li>first</li><li>second</li> is "firstsecond", and
// position 5 is BOTH the end of the first bullet and the start of the second.
// This walker took the first node that could hold the position, which is
// always the earlier one. Every restore into the start of a block landed at
// the end of the block before it; the link is just where it shows.
//
// Resolved by asking which BLOCK each candidate is in. On an exact boundary
// between two text nodes in DIFFERENT blocks, the later one wins — a caret
// there belongs to the block it is at the start of.
//
// Deliberately NOT applied to a boundary INSIDE one block. "<b>bo</b>ld" is
// two text nodes at one position, and the end of the first is where typing
// inherits the bold; moving it to the start of the second would silently
// change what the next character looks like.
function _cmpBlockOf(node){
  var BLOCKS={LI:1,P:1,DIV:1,BLOCKQUOTE:1,UL:1,OL:1,TD:1,TH:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1};

  while(n){
    if(n.nodeType===1&&BLOCKS[n.tagName]) return n;
    n=n.parentNode;
  }

}
// The choice itself, kept pure so it can be run by a check rather than read.
// `items` is one entry per text node, in document order: {len, block}, where
// block is any value that is equal for two nodes in the same block and
// different otherwise.
function _cmpPickIndex(items,pos){
  if(!items||!items.length) return null;
  var seen=0;
  for(var i=0;i<items.length;i++){
    var len=items[i].len;
    if(seen+len>pos) return {index:i, off:pos-seen};
    if(seen+len===pos){
      // Exactly on the boundary. Stay here unless the very next node starts a
      // DIFFERENT block, in which case the caret belongs to that block.
      var nx=items[i+1];
      if(nx && nx.block!==items[i].block) return {index:i+1, off:0};
      return {index:i, off:pos-seen};
    }
    seen+=len;
  }
  var last=items.length-1;
  return {index:last, off:items[last].len};
}
function _cmpNodeAt(el,pos){
  var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null,false),n;
  var nodes=[],items=[];
  while((n=w.nextNode())){
    nodes.push(n);
    items.push({len:(n.nodeValue||'').length, block:_cmpBlockOf(n)});
  }
  var pick=_cmpPickIndex(items,pos);
  if(!pick) return null;
  return {node:nodes[pick.index], off:pick.off};
}
// Falls back to the end of the box rather than to nothing: a caret that lands
// one character out is a nuisance, a caret that lands nowhere loses the next
// thing typed.
function _cmpRestore(el,off){
  if(!el) return false;
  var r=document.createRange();
  try{
    var a=off?_cmpNodeAt(el,off.start):null;
    var b=off?_cmpNodeAt(el,off.end):null;
    if(a) r.setStart(a.node,a.off); else { r.selectNodeContents(el); r.collapse(false); }
    if(b) r.setEnd(b.node,b.off); else r.collapse(true);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    return true;
  }catch(e){ return false; }
}

  var el=document.getElementById(id);
  // [1.332] — TEXT OFFSETS, not a Range. A Range points at nodes, and the 5s
  // poll rebuilds the box, so the highlight was silently lost whenever a tick
  // landed between pressing Link and pressing Add link: the link then landed
  // at the end of the message instead of over the highlighted words. Sixth
  // instance of [1.32]'s trap, and the last one that stores a live node.
  _cmpLinkSel[id]=el?_cmpOffsets(el):null;
  var st=_cmpLinkState(id);
  st.open=true; st.url=''; st.bad=false;
  // Pre-fill the link text with whatever is selected, so highlighting a phrase
  // and pressing Link does the obvious thing.
  st.text=(sel && !sel.isCollapsed && el && el.contains(sel.anchorNode)) ? String(sel).trim() : '';
  var t=document.getElementById(id+'-linktext');
  var u=document.getElementById(id+'-linkurl');
  if(t) t.value=st.text;
  if(u){ u.value=''; u.classList.remove('bad'); u.placeholder=CMP_COPY.linkUrlPlaceholder; }
  row.classList.add('open');
  if(u) u.focus();
}

function _composerLinkClose(id){
  var row=document.getElementById(id+'-linkrow'); if(row) row.classList.remove('open');
  var st=_cmpLinkState(id);
  st.open=false; st.url=''; st.text=''; st.bad=false;
  _cmpLinkSel[id]=null;
  var el=document.getElementById(id); if(el) el.focus();
}

function _composerLinkKey(ev,id){
  if(ev.key==='Enter'){ ev.preventDefault(); _composerLinkInsert(id); }
  if(ev.key==='Escape'){ ev.preventDefault(); _composerLinkClose(id); }
}

// AC, 28 Aug: site.com, www.site.com, https://www.site.com and https://site.com
// must all work. So https:// is PREPENDED when absent rather than demanded.
// Being lenient here is safe -- this file is not the security boundary.
// _sanitizeMessageHtml_() in Code.js re-checks every href server-side and
// assumes this file was bypassed, because it can be. Strictness here buys
// nothing and costs teachers working links.
function _composerNormalizeUrl(raw){
  var u=String(raw||'').trim();
  if(!u) return '';
  if(/[\s"'<>\\]/.test(u)) return '';          // spaces or quotes: not an address
  if(/^mailto:/i.test(u)) return u;
  if(!/^https?:\/\//i.test(u)){
    // Any other scheme (javascript:, data:, file:) is refused outright rather
    // than having https:// glued in front of it.
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    u='https://'+u;
  }
  // Must have a dot somewhere in the host, or "https://notes" would pass.
  var host=u.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0];
  if(host.indexOf('.')===-1) return '';
  return u;
}

function _composerLinkInsert(id){
  var el=document.getElementById(id); if(!el) return;
  var uIn=document.getElementById(id+'-linkurl');
  var tIn=document.getElementById(id+'-linktext');
  var url=_composerNormalizeUrl(uIn?uIn.value:'');
  if(!url){
    // Corrected in place instead of thrown as a page-level toast -- the error
    // belongs next to the field that caused it.
    var stBad=_cmpLinkState(id); stBad.bad=true; stBad.url='';
    if(uIn){ uIn.classList.add('bad'); uIn.value=''; uIn.placeholder=CMP_COPY.linkRejected; uIn.focus(); }
    return;
  }
  var label=(tIn && tIn.value.trim()) || url.replace(/^https?:\/\//i,'');
  el.focus();
  var saved=_cmpLinkSel[id];
  if(saved) _cmpRestore(el,saved);
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(label)+'</a>&nbsp;');
  _composerLinkClose(id);
  _composerSync(id);
}

// ── Toolbar active state ───────────────────────────────────────────────────
// Nothing reflected back before this, so a teacher had to type a letter to
// find out whether bold was on. queryCommandState covers the inline and list
// commands; blockquote has no state to query, so it is resolved from the DOM.
var _CMP_STATE_CMDS=['bold','italic','underline','insertUnorderedList','insertOrderedList'];

function _composerState(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  _CMP_STATE_CMDS.forEach(function(c){
    var b=wrap.querySelector('[data-cmd="'+c+'"]'); if(!b) return;
    var on=false;
    try{ on=document.queryCommandState(c); }catch(e){}
    // queryCommandState('underline') is TRUE for ANY selection inside a link,
    // because a link RENDERS underlined -- verified in the browser, not
    // guessed. Left alone, the Underline button lights up on its own the
    // moment a teacher clicks into a link they just added, claiming
    // formatting they never applied. Inside a link, ask the DOM instead.
    //
    // Resolved from the selection's anchor, which covers every selection a
    // person can actually make -- a click, a drag, or Ctrl+A all anchor on a
    // text node. It does NOT cover a programmatic selectNodeContents() of the
    // whole box, where the anchor is the composer div itself and there is no
    // link ancestor to find; nothing in the UI produces that.
    if(c==='underline' && on && _composerSelIn(id,'a')) on=_composerSelIn(id,'u');
    b.classList.toggle('on',!!on);
  });
}

function _composerStateClear(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  var btns=wrap.querySelectorAll('.cmp-tb-btn.on');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
}

  // words, moved beside Send on 3 Sept at AC's instruction.
  askAdmin:'Ask Admin',
  placeholder:'Type your message here...',
  linkUrlPlaceholder:'Add link here',
  linkTextPlaceholder:'Link text (optional)',
  linkAdd:'Add link',

  bold:'Bold', italic:'Italic', underline:'Underline',

  // Shift+Tab do the indenting now, inside a list.
  bullet:'Bullet list', number:'Numbered list',
  link:'Link', clear:'Clear formatting'
};

function _tbBtn(id,cmd,label,title){
  // onmousedown/preventDefault keeps the text selection alive when the button

  // data-cmd is what _composerState() reads to light the button up.
  return '<button type="button" class="cmp-tb-btn" data-cmd="'+cmd+'" title="'+esc(title)+'" onmousedown="event.preventDefault()"'+
    ' onclick="_composerCmd(\''+id+'\',\''+cmd+'\')">'+label+'</button>';
}

// The toolbar now carries everything _sanitizeMessageHtml_() accepts and
// nothing it doesn't (AC, 28 Aug: "as much formatting control and function as
// possible"). Italic, underline, quote and clear-formatting were added then.
// The first three were already reachable by PASTING -- _composerClean()
// promotes pasted <i>/<u> and styled spans -- so a teacher could receive that
// formatting into a message but had no button to produce it.
//
// Adding a control the server would strip is the mistake to avoid here, so
// this list and MSG_ALLOWED_TAGS in Code.js have to stay in step. That is why
// admin's colour, font-size, alignment, image and divider buttons are absent
// and must stay absent: every one of them is dropped server-side.
//
// Grouped with dividers -- emphasis, structure, link, reset -- so the row reads
// as four decisions rather than ten buttons.
//
// [1.332], AC 5 September 2026: "there are some functions like a ❝ button that
// doesn't seem to do anything but indent. The teacher doesn't need that."
// **He was describing three buttons, not one.** Driven in a real browser, ❝

    '<button type="button" class="cmp-tb-btn" title="'+esc(CMP_COPY.clear)+'" onmousedown="event.preventDefault()"'+
      ' onclick="_composerClearFmt(\''+id+'\')">✕</button>'+
    // ── [1.434] — the merge tags, on the toolbar where a message is WRITTEN ──
    //
    // AC, 8 September 2026: "merge tags need to be typed in and can't be
    // selected. Merge tags pills are already in the code and should be
    // available for teachers too."

    // They were in the template editor and nowhere else, so writing an

// Plain text at the cursor, never insertHTML: a merge tag must carry none of
// the formatting active where it lands, or it is markup-wrapped from the
// moment it is inserted and the substitution can no longer find it — the same
// trap [1.412] closed on the admin side.
function _composerInsertTag(id, tag){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  var txt='['+tag+']';
  var placed=false;
  try{ placed=document.execCommand('insertText', false, txt); }catch(e){ placed=false; }
  if(!placed) el.appendChild(document.createTextNode(txt));
  _composerSync(id);
}

// ── [1.277] — attachments, teacher side ─────────────────────────────────
// Staff attach; families receive and open (AC, 5 September). Nothing here ever
// sees a Drive link: a tile asks the server for an attachment id and the
// server decides, from the conversation the file was sent to, whether to
// answer. That is the whole point of the design and it is why there is a fetch
// where a plain <img src> would have been simpler.
//
// A thread draws THUMBNAILS — a few kilobytes each, cached by id for the life
// of the page — and the file itself is fetched only when somebody taps it. The
// 5-second poll rebuilds this page constantly ([1.193]), so anything fetched
// per render would be fetched every five seconds; the cache is what makes the
// tiles free after the first time.
var ATT_THUMBS = {};        // attachmentId -> data: URI, '' while in flight, false if there is none
var ATT_PENDING = [];       // uploaded but not yet sent — the chips under the composer
var ATT_BUSY = 0;           // uploads in flight, so Send can wait for them
var ATT_MAX_BYTES = 10*1024*1024;
// Ten files to a message (AC, 6 September). The server drops anything past
// this when the send claims them; refusing here as well is the courtesy —
// a teacher finds out when they pick the eleventh, not when it vanishes.
var ATT_MAX_FILES = 10;

// The label on a non-image tile, taken from the FILE'S OWN NAME.
//
// It was the literal string 'PDF' until AC asked for text formats on
// 6 September, at which point every Word document in the tool would have been
// drawn as a PDF — a tile that lies about what it is holding, on the one
// screen where a parent decides whether to bother opening it. Derived, it
// cannot be wrong: the server has already forced the extension to agree with
// the bytes it verified (_attachSafeName_), so the name is trustworthy here in
// a way a client-supplied name normally would not be.
function _attKind(name){
  var ext=String(name||'').split('.').pop().toUpperCase();
  return (ext && ext.length<=4) ? ext : 'FILE';
}
function _attSize(n){
  n=Number(n)||0;
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return Math.round(n/1024)+' KB';
  return (Math.round(n/104857.6)/10)+' MB';
}
// Fetched once per attachment per page. A miss schedules the request and
// returns nothing to draw; when it lands, render() puts it on screen.
function _attThumb(id){
  if(ATT_THUMBS.hasOwnProperty(id)) return ATT_THUMBS[id];
  ATT_THUMBS[id]='';
  api({action:'getAttachment', data:{attachmentId:id, thumb:true, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(!e && r && r.ok && r.dataBase64){
      ATT_THUMBS[id]='data:'+(r.mimeType||'image/png')+';base64,'+r.dataBase64;
      render(); return;
    }
    // [1.384] — tell "there is no thumbnail for this file" apart from "that
    // request failed". Drive genuinely makes none for some types and says so
    // with none:true; caching a FAILURE as though it were that answer left a
    // plain tile for the life of the page, with a reload the only way back. A
    // failure forgets, so the next render asks again.
    if(!e && r && r.ok){ ATT_THUMBS[id]=false; render(); return; }
    delete ATT_THUMBS[id];
  });
  return '';
}
function rAttachments(m){
  var list=m.attachments||[];
  if(!list.length) return '';
  return '<div class="att-strip">'+list.map(function(a){
    var thumb=_attThumb(a.attachmentId);
    var art = thumb
      ? '<img class="att-thumb" src="'+esc(thumb)+'" alt="">'
      : (ATT_THUMBS.hasOwnProperty(a.attachmentId) && ATT_THUMBS[a.attachmentId]===''
          // [1.401] — in flight, not "there isn't one".
          ? '<span class="att-glyph loading"><span class="spin">&#8635;</span></span>'
          : '<span class="att-glyph">'+esc(_attKind(a.fileName))+'</span>');
    return '<button type="button" class="att-tile" title="'+esc(a.fileName)+'"'+
      ' onclick="event.stopPropagation();openAttachment(\''+esc(a.attachmentId)+'\')">'+
      art+
      '<span class="att-meta"><span class="att-name">'+esc(a.fileName)+'</span>'+
      '<span class="att-size">'+esc(_attSize(a.sizeBytes))+'</span></span></button>';
  }).join('')+'</div>';
}
// The slow path, and a deliberate act: the whole file, base64, through the
// same authenticated request everything else uses. A blob URL rather than a
// data: URI so a 10MB PDF is not put through the address bar.
function openAttachment(id){
  showMsg(TCH_COPY.attachOpening,'i');
  api({action:'getAttachment', data:{attachmentId:id, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
    if(e||!r||!r.ok||!r.dataBase64){ showMsg((r&&r.error)||'Could not open that file.','e'); return; }
    _attOpenBlob(r.dataBase64, r.mimeType, r.fileName);
  });
}
// Shared by all three portals, and the base64 is decoded in chunks: a single
// atob over ten megabytes builds a ten-million-character string and then a
// ten-million-element array, which is what makes a phone drop the tab.
function _attOpenBlob(b64, mimeType, fileName){
  try{
    var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
    for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([bytes],{type:mimeType||'application/octet-stream'}));
    var w=window.open(url,'_blank');
    // A blocked pop-up is the common case on a phone, and a file that silently
    // does not open is worse than a link to press. So: fall back to a real
    // click on a real anchor, which is a user gesture the browser allows.
    if(!w){
      var a=document.createElement('a');
      a.href=url; a.target='_blank'; a.rel='noopener'; a.download=fileName||'attachment';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    // Long enough for the new tab to have taken the bytes, then the memory
    // goes back. Without this every file opened stays in the page until it is
    // reloaded.
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 60000);
  }catch(e){ showMsg('Could not open that file.','e'); }
}

// ── Attaching ───────────────────────────────────────────────────────────
// The file goes up WHILE the teacher is still typing, and Send then carries an
// id rather than ten megabytes. That is what keeps [1.43]'s "click send, see
// the message" true with a file attached — a 10MB upload riding along with the
// send would have made every message with a photo take ten seconds.
function attachPick(){
  var el=document.getElementById('att-file');
  if(el) el.click();
}
function attachChosen(input){
  var files=input && input.files ? Array.prototype.slice.call(input.files) : [];
  input.value='';   // so choosing the same file twice in a row still fires
  files.forEach(attachUpload);
}
function attachUpload(file){
  if(ATT_PENDING.length >= ATT_MAX_FILES){ showMsg(TCH_COPY.attachTooMany,'e'); return; }
  // Refused on the client too, so a teacher who picks a 40MB video is told at
  // once instead of after a minute of uploading. The server refuses it as well
  // — that is the rule; this is the courtesy.
  if(file.size > ATT_MAX_BYTES){ showMsg(TCH_COPY.attachTooBig,'e'); return; }
  var rec={tempId:'t'+Date.now()+Math.random(), fileName:file.name, mimeType:file.type,
           sizeBytes:file.size, uploading:true, attachmentId:''};
  ATT_PENDING.push(rec); ATT_BUSY++; render();
  var reader=new FileReader();
  reader.onerror=function(){ _attFail(rec,'That file could not be read.'); };
  reader.onload=function(){
    var b64=String(reader.result||'');
    b64=b64.slice(b64.indexOf(',')+1);   // strip the data: prefix
    api({action:'uploadAttachment', data:{fileName:file.name, mimeType:file.type,
         dataBase64:b64, teacherId:TEACHER_ID, teacherToken:TOKEN}}, function(e,r){
      if(e||!r||!r.ok||!r.attachment){ _attFail(rec,(r&&r.error)||'That file could not be attached.'); return; }
      rec.uploading=false;
      rec.attachmentId=r.attachment.attachmentId;
      rec.fileName=r.attachment.fileName;   // the server cleans the name; show what it stored
      ATT_BUSY--; render();
    });
  };
  reader.readAsDataURL(file);
}
// [1.402] — a failed file STAYS, marked. AC's blocked-send copy says "remove
// file and reattach", which needs something to remove; and a teacher with
// several files needs to see WHICH one failed. See the family portal's twin.
function _attFail(rec, msg){
  rec.uploading=false;
  rec.failed=true;
  rec.error=msg||TCH_COPY.attachFailed;
  ATT_BUSY--; showMsg(msg,'e'); render();
}
function _attAnyUploading(){ return ATT_PENDING.some(function(x){ return x.uploading; }); }
function _attAnyFailed(){ return ATT_PENDING.some(function(x){ return x.failed; }); }
// [1.402]'s held press was REMOVED on 8 September 2026, the same evening it
// shipped. It queued a Send pressed during an upload and replayed it when the
// upload landed. AC used it and preferred the button plainly unavailable with
// a reason on screen — see [1.428] at the Send button. A held press and a
// disabled button are two answers to one question, and keeping both would
// leave a queued send firing from a control the teacher can no longer see.

function attachRemove(tempId){
  // Only from the composer. The upload itself is left alone: an id that is
  // never sent is never bound to a message, and the server's sweep removes it
  // a day later. Deleting it here would need a second endpoint to do what
  // doing nothing already does.
  ATT_PENDING=ATT_PENDING.filter(function(x){ return x.tempId!==tempId; });
  ATT_BUSY=ATT_PENDING.filter(function(x){ return x.uploading; }).length;
  render();
}
function _attTakeIds(){
  return ATT_PENDING.filter(function(x){ return x.attachmentId; })
                    .map(function(x){ return x.attachmentId; });
}
function _attClear(){ ATT_PENDING=[]; ATT_BUSY=0; }
// [1.277] — the accepted formats, ONCE, feeding three things: the picker's
// filter, the list a teacher can open, and nothing else. AC asked for the list
// to be reachable on screen rather than guessed at, and a second hand-written
// copy of it is exactly how a screen ends up naming a format the tool refuses.
// scripts/check.js pins the mime half against the server's own allowlist, so
// this list cannot drift from what is actually accepted either.
var ATT_TYPES=[
  {m:'image/jpeg',x:'JPG'}, {m:'image/png',x:'PNG'}, {m:'image/gif',x:'GIF'},
  {m:'image/webp',x:'WEBP'}, {m:'image/heic',x:'HEIC'}, {m:'image/heif',x:'HEIC'},
  {m:'application/pdf',x:'PDF'},
  {m:'text/plain',x:'TXT'},
  {m:'application/rtf',x:'RTF'}, {m:'text/rtf',x:'RTF'},
  {m:'application/msword',x:'DOC'},
  {m:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',x:'DOCX'},
  {m:'audio/mpeg',x:'MP3'},
  {m:'audio/mp4',x:'M4A'}, {m:'audio/x-m4a',x:'M4A'},
  {m:'audio/wav',x:'WAV'}, {m:'audio/x-wav',x:'WAV'},
  {m:'audio/aac',x:'AAC'},
  {m:'audio/ogg',x:'OGG'}
  // No video: AC, 6 September, "videos have to be sent via a link." 10MB is
  // thirty seconds of phone video, and a file served through the portal has to
  // travel whole. The Link button in the composer is the route for those.
];
function _attAccept(){ return ATT_TYPES.map(function(t){ return t.m; }).join(','); }
function _attFormatList(){
  var seen={}, out=[];
  ATT_TYPES.forEach(function(t){ if(!seen[t.x]){ seen[t.x]=1; out.push(t.x); } });
  return out.join(', ');
}
var ATT_FORMATS_OPEN=false;
function attToggleFormats(){ ATT_FORMATS_OPEN=!ATT_FORMATS_OPEN; render(); }
// The instruction is ON SCREEN, not in a tooltip. AC, 6 September: "that text
// should be included as an actual instruction with the button for the accepted
// file format list. this should not just be a helpful tip." A hover tip is
// invisible on a phone, which is where teachers use this — so the limits are
// stated where they will be read, and the full list is one press away rather
// than something you discover by being refused.
function rAttachRow(){
  var h='<input type="file" id="att-file" class="att-input" multiple '+
        'accept="'+_attAccept()+'" onchange="attachChosen(this)">'+
        '<div class="att-guide">'+esc(TCH_COPY.attachHint)+
          ' <button type="button" class="att-formats" onclick="attToggleFormats()">'+
          esc(TCH_COPY.attachFormats)+'</button>'+
          (ATT_FORMATS_OPEN?'<span class="att-formats-list">'+esc(_attFormatList())+'</span>':'')+
        '</div>';
  if(!ATT_PENDING.length) return h;
  // [1.403] — the family portal's twin, same two states, same wording. The
  // finished state is the loud one: a chip with an × reads as an input
  // control, not as confirmation that the file is attached.
  var _up=ATT_PENDING.filter(function(a){ return a.uploading; });
  if(_up.length){
    h+='<div class="att-banner"><span class="spin">&#8635;</span> '+
       esc(_up.length>1?TCH_COPY.attachMany:TCH_COPY.attachOne)+'</div>';
  }
  var _done=ATT_PENDING.filter(function(a){ return !a.uploading; });
  if(_done.length){
    h+='<div class="att-done">'+
       '<div class="att-done-hd">'+esc(TCH_COPY.attachedHead)+'</div>'+
       _done.map(function(a){
         return '<div class="att-done-row'+(a.failed?' bad':'')+'">'+
           '<span class="att-tick">'+(a.failed?'&#33;':'&#10003;')+'</span>'+
           '<span class="att-chip-name">'+esc(a.fileName)+'</span>'+
           '<span class="att-size">'+esc(_attSize(a.sizeBytes))+'</span>'+
           (a.failed?'<span class="att-err">'+esc(a.error||TCH_COPY.attachFailed)+'</span>':'')+
           '<button type="button" class="att-x" aria-label="'+esc(TCH_COPY.attachRemove)+'"'+
             ' onclick="attachRemove(\''+esc(a.tempId)+'\')">&#215;</button></div>';
       }).join('')+'</div>';
  }
  return h;
}
function rAttachButton(){
  // Beside Send, in "the row where the things you do with a message already
  // live" — [1.234]'s own words. Not on the formatting toolbar: everything
  // there produces markup the server's allowlist accepts, and a control that
  // does something else on that row would be the odd one out.
  return '<button type="button" class="btn btn-s btn-attach" title="'+esc(TCH_COPY.attachTip)+'"'+
    ' onclick="attachPick()">'+esc(TCH_COPY.attach)+'</button>';
}

// ── [1.276] — one merge for every poll in this file ─────────────────────
// Three things can come back from a poll now, not one: messages that arrived,
// messages that were EDITED (same id, same sentAt, different words) and
// messages that were UNSENT (an id and nothing else). The old shape handled
// only the first, and its duplication guard — drop anything whose id we
// already hold, which is [1.43]'s and is still exactly right for a resend —
// is precisely what would swallow an edit.
//
// So the guard moves inside one function that knows the difference, and both
// poll sites call it. Two copies of this, in two branches of _pollTick, is how
// an edit lands in the family tab and not the staff one.
// [1.371] — the scheduled half of a poll, and it is a REPLACEMENT rather than
// a merge. The server sends the whole list for this thread every time it does
// a real read, because the four things that change it — scheduling, editing,
// cancelling, releasing — are four different shapes and a release is both an
// add and a remove of the same row. Replacing says all of that in one line.
//
// A poll with no news omits the key entirely, which is why this tests for
// undefined rather than for length: an absent key means "nothing changed", and
// treating it as an empty list would make every quiet tick wipe the bubbles
// off a teacher's open thread.
function _applySchedPoll(t, r){
  if(!r || typeof r.scheduled === 'undefined') return false;
  var before=(t.scheduled||[]).map(function(m){ return m.messageId+':'+m.sendAt+':'+(m.messageText||''); }).join('|');
  var after=(r.scheduled||[]).map(function(m){ return m.messageId+':'+m.sendAt+':'+(m.messageText||''); }).join('|');
  if(before===after) return false;
  t.scheduled=r.scheduled||[];
  return true;
}
function _applyPoll(list, r){
  var gone={};
  ((r&&r.retracted)||[]).forEach(function(id){ if(id) gone[id]=true; });
  var out=[], at={}, added=0, changed=false;
  (list||[]).forEach(function(m){
    if(m.messageId && gone[m.messageId]){ changed=true; return; }
    if(m.messageId) at[m.messageId]=out.length;
    out.push(m);
  });
  ((r&&r.messages)||[]).forEach(function(m){
    if(m.messageId && gone[m.messageId]) return;
    if(m.messageId && at.hasOwnProperty(m.messageId)){
      var cur=out[at[m.messageId]];
      // [1.383] — readAt counts as a change. Comparing only the words meant a
      // message that came back solely because the family had READ it was
      // recognised as "already have it" and dropped, and the "Read by …" mark
      // AC asked for never appeared until the thread was reopened.
      if(String(cur.messageText||'')!==String(m.messageText||'') ||
         String(cur.messageHtml||'')!==String(m.messageHtml||'') ||
         String(cur.readAt||'')!==String(m.readAt||'')){
        out[at[m.messageId]]=m; changed=true;
      }
      return;
    }
    if(m.messageId) at[m.messageId]=out.length;
    out.push(m); added++; changed=true;
  });
  return {list:out, added:added, changed:changed};
}

// ── [1.276] — unsend and edit, teacher side ─────────────────────────────
// The window is two minutes (AC, 6 September) and the server is the gate:
// _canAmendMessage_ in Code.js checks that you sent it, that it is inside the
// window and that the family has not read it. This is only what decides
// whether the two words are DRAWN. A clock a few seconds out shows a control
// the server then refuses, which is a toast — not a message pulled back from
// somebody who was reading it.
var MSG_UNSEND_WINDOW_MS=10*1000;
// Opening an edit buys two minutes, server-side — nobody retypes a sentence in
// ten seconds. The client never computes this; it reads amendUntil off the
// message, which is the server's own answer.
var MSG_AMEND_GRACE_MS=2*60*1000;
// The one timer this needs. A ten-second window redrawn only by a 5-second
// poll would leave Unsend on screen for up to five seconds after it had
// stopped working — a button that fails is worse than no button ([1.309]'s
// rule). So the render schedules a single wake-up at the exact moment the last
// live window closes. One timer for the whole thread, not one per message.
var _amendTimer=null;
function _amendTick(atMs){
  var wait=atMs-Date.now();
  if(wait<0) wait=0;
  if(_amendTimer){ clearTimeout(_amendTimer.id); _amendTimer=null; }
  _amendTimer={at:atMs, id:setTimeout(function(){ _amendTimer=null; render(); }, wait+250)};
}
// One open amendment at a time: {messageId, kind:'confirm'|'edit', stash}.
// stash is the draft that was in the composer when Edit was pressed — editing
// borrows the composer, and a teacher's half-written next message must not be
// the price of fixing a typo in the last one.
var AMEND={messageId:'', kind:'', stash:''};
function _canAmendMsg(m){
  if(!m || !m.messageId || m._pending) return false;
  if(m.senderId!==TEACHER_ID) return false;
  if(m.readAt) return false;
  if(_tIsTruthy(m.isAuto)) return false;
  // [1.380] — a message released from a schedule gets no window. Its email
  // went at the moment of release rather than being held, so an Unsend here
  // would empty the family's portal and leave the email standing. AC, 7
  // September: "If the teacher hasn't cancelled or edited by the time the
  // message goes out, that's on them." The server refuses it either way; this
  // is what stops the control being drawn.
  if(m.releasedAt) return false;

  // The deadline comes off the ROW, because opening an edit moves it and a
  // window recomputed from sentAt would close under somebody mid-word. The
  // fallback covers a message sent before the column existed.
  var until=Number(m.amendUntil)||((Number(m.sentAt)||0)+MSG_UNSEND_WINDOW_MS);
  if(Date.now()>=until) return false;
  // Whichever live window closes first is when this thread needs redrawing.
  if(!_amendTimer || until<_amendTimer.at) _amendTick(until);
  return true;
}
// ═══════════════════════════════════════════════════════════════════════
// [1.371] — scheduled send
// ═══════════════════════════════════════════════════════════════════════
// AC, 7 September: "schedule send a message so they can prepare replies and
// queue them to send during the hours that are most convenient to them."
//
// One open scheduling action at a time, exactly like AMEND above and for the
// same reason: two confirms on screen at once is how the wrong twin gets
// pressed ([1.276] found that by pressing them).
//
//   picking   — the composer's picker is open, no message involved yet
//   confirm   — 'send-now' or 'cancel' on a scheduled message
var SCHED={mode:'', messageId:'', at:''};
// The Scheduled list, loaded on demand and kept for the count.
var SCHED_LIST={loading:false, loaded:false, rows:[], open:false};

// TIME IS THE DEVICE'S LOCAL TIME, and that is a correction to the plan.
//
// BACKLOG said the picked time would be studio time (America/New_York) and
// converted on the way in and out. Then this file was actually read:
// fmtMsgTime() and every other timestamp in all three portals are rendered
// with plain getHours()/getDate(), which is the DEVICE's timezone, not the
// studio's. A picker that alone spoke studio time would be the only control on
// the screen that did — a teacher in another timezone would see every message
// stamped in their local time and one control silently in another.
//
// So the picker matches the rest of the screen, and what travels is epoch
// milliseconds, which is unambiguous whoever reads it. For everybody actually
// in the studio the two are the same thing.
//
// The wider question — that these portals show studio times in device time at
// all — is real and is bigger than this feature. Logged as its own item rather
// than half-fixed inside this one.
function _schedMsToLocalInput(ms){
  var d=new Date(Number(ms)||Date.now());
  function p2(n){ return n<10?'0'+n:String(n); }
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+
         'T'+p2(d.getHours())+':'+p2(d.getMinutes());
}
function _schedLocalInputToMs(v){
  if(!v) return 0;
  var t=new Date(String(v)).getTime();
  return isNaN(t)?0:t;
}
// The picker opens on a sensible time rather than blank: an hour from now,
// rounded to the next five minutes. A blank datetime-local on a phone is three
// taps before it is even a date.
function _schedDefault(){
  var t=Date.now()+60*60*1000;
  var d=new Date(t); d.setSeconds(0,0);
  d.setMinutes(Math.ceil(d.getMinutes()/5)*5);
  return _schedMsToLocalInput(d.getTime());
}
function _schedMin(){ return _schedMsToLocalInput(Date.now()+60*1000); }
// "Sending Monday, 9/14/26 9:00 AM" — fmtMsgTime is what every other time in
// this portal is drawn with, so a scheduled time reads the same as a sent one.
// [1.415] — AC's confirmation wording replaces "Scheduled for". It is the
// second of his two strings: this one is what a waiting message says about
// itself, after the fact.
function _schedWhen(ms){ return TCH_COPY.scheduledConfirm+' '+fmtMsgTime(ms); }

// ── The composer control ───────────────────────────────────────────────
function openSendLater(){
  // Nothing to schedule is not an error state, it is simply not a thing to do.
  var c=_amendCtx(); if(!c) return;
  SCHED={mode:'picking', messageId:'', at:_schedDefault()};
  render();
}
function closeSchedule(){ SCHED={mode:'', messageId:'', at:''}; render(); }
function _schedSetAt(v){ SCHED.at=v; }
// The picker panel, drawn under the composer while it is open. Inline rather
// than a dialog because it belongs to the message being written — a modal here
// would be the second screen PROCESS.md calls a defect.
function rSendLaterPanel(){
  if(SCHED.mode!=='picking') return '';
  return '<div class="sched-panel">'+
    '<label class="sched-lbl">'+esc(TCH_COPY.schedulePick)+'</label>'+
    '<input type="datetime-local" class="sched-input" id="sched-at"'+
      ' min="'+esc(_schedMin())+'" value="'+esc(SCHED.at||'')+'"'+
      ' oninput="_schedSetAt(this.value)">'+
    // [1.415] — AC's preview line, which the button below answers. Absent
    // until a time is picked: a question naming no time is not a question.
    (SCHED.at?'<div class="sched-preview">'+esc(TCH_COPY.schedulePreview)+' '+
       esc(fmtMsgTime(_schedLocalInputToMs(SCHED.at)))+'?</div>':'')+
    '<div class="sched-acts">'+
      '<button type="button" class="btn btn-p" onclick="confirmSendLater()">'+esc(TCH_COPY.scheduleGo)+'</button>'+
      '<button type="button" class="btn btn-s" onclick="closeSchedule()">'+esc(TCH_COPY.scheduleCancel)+'</button>'+
    '</div></div>';
}
// Sends the composer's contents with a sendAt. Everything else about sending —
// what is in the box, which parents are ticked, the files — is read by the
// ordinary send functions, so this hands the time to THEM rather than growing
// a second copy of the send path.
function confirmSendLater(){
  var el=document.getElementById('sched-at');
  var at=_schedLocalInputToMs(el?el.value:SCHED.at);
  if(!at || at < Date.now()+60*1000){ showMsg(TCH_COPY.schedulePast,'e'); return; }
  // Almost always a typo in the year. A question, not a refusal.
  if(at > Date.now()+14*24*60*60*1000 && !confirm(TCH_COPY.scheduleFar)) return;
  SCHED={mode:'', messageId:'', at:''};
  // [1.404] — AC: scheduling "works, but no success banner 'message
  // scheduled'". The bubble says what it IS; this says the act SUCCEEDED,
  // which is a different thing and the one that was missing.
  actStart('send', TCH_COPY.schedulingMsg);
