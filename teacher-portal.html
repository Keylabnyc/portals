<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
// ============================================================
// STATE
// ============================================================
// PAGE values: boot | login | needsSetup | forgotpw | setpw | home
var PAGE = 'boot';
var TOKEN = '', TEACHER_ID = '', TEACHER_NAME = '';
var HOME_TAB = 'family'; // 'family' | 'staff' | 'settings'
// The teacher's own status and settings (BACKLOG 1.125, 1.132). Loaded once
// at sign-in, because the banner is on every screen.
var TSET = {tpls:null, tplEdit:-1, tplDel:-1, tplBackup:null, tplsSaved:false, tplsErr:'',
  tplFocus:-1,
            loading:false, saving:false, loaded:false,
            awayEnabled:false, awayMessage:'', afterHoursMessage:'', awayDefaultCopy:'',
            notifyOpen:9, notifyClose:17, notifyDerived:false,
            draftAway:'', draftAfter:'',
            // [1.338] — the teacher's OWN link library, edited here and drawn in
            // their composer. null means "not fetched yet", which is not the same
            // as [] — an empty library is a real state and must not re-fetch.
            links:null, linksSaved:false, linksErr:'',
            // Which row is open for editing, and which is asking to be deleted.
            // -1 is "none", and only one row is ever in either state.
            linkEdit:-1, linkDel:-1, linkBackup:null};
var MSG = {m:'', t:''};
var busy = false;
var RESET_TOKEN = '';
var _pollTimer = null;
var _pendingOpenFamilyId = '';   // set by boot() from ?openFamilyId=, consumed once by loadFamilyThreads()
var _shouldScrollMsgList = false; // see render() — scroll-to-newest, set only when messages actually change
// [1.235] — set when a conversation is opened FROM the Marked for review
// section, cleared by the first render that has a thread to look in.
var _focusReview = false;

// Staff Messages state. STAFF_VIEW: 'list' (the whole team, always shown
// directly — 1.19, 18 Aug) | 'thread' (one open conversation — admin or
// another staff member).
var STAFF_VIEW = 'list';
// ── [1.292] — ONE ROSTER ────────────────────────────────────────────────
//
// AC: "Shouldn't the teacher's portal just keep one list also?" It should. It
// held two — families from one endpoint, staff from another — merged on screen
// by _msgRows(). Two lists means two requests, two arrival times and two
// snapshots of the sheet, and every question about a row was answered from
// whichever list happened to hold it. The two could disagree, and did.
//
// THREADS is that one list, in the shape the screen draws, straight from the
// server ([1.292]'s getTeacherThreads). FAMILY_THREADS and STAFF_THREADS
// survive as VIEWS onto it — computed, never assigned — so the twenty-odd
// places that read them keep working and cannot drift out of step with it,
// because there is nothing left to drift from.
var THREADS = {loading:false, list:[], _sig:'', locked:false};
function _threadsOfKind(k){
  return (THREADS.list||[]).filter(function(r){ return r.kind===k; });
}
// The two old names, as VIEWS. Reading either gives a slice of THREADS, so a
// caller cannot be looking at an older answer than its neighbour.
var FAMILY_THREADS = {};
var STAFF_THREADS = {};
Object.defineProperty(FAMILY_THREADS, 'list', { get: function(){
  return _threadsOfKind('family').map(function(r){
    return {familyId:r.id, parent1Name:r.parent1Name, parent2Name:r.parent2Name,
            students:r.students, unread:r.unread, reviewCount:r.reviewCount,
            waitingSince:r.waitingSince, replyDueBy:r.replyDueBy, closed:r.closed,
            closedByName:r.closedByName, lastMessageAt:r.lastMessageAt,
            // [1.352] — these two were dropped by this projection, which is
            // the LAST link in a chain of three that all had to be fixed for
            // one line to appear. rClosedLine() draws "Dana Reed ended this
            // conversation · Tuesday 3:14 PM" and returns '' without a
            // closedAt, so the line AC asked for on 3 September has never
            // rendered — the server did not send the field, and this view
            // would have dropped it if it had.
            closedAt:r.closedAt, closedUnanswered:r.closedUnanswered,
            lastMessageText:r.lastMessageText, lastSenderName:r.lastSenderName,
            lastSenderIsTeacher:r.lastSenderIsTeacher,
            hasMessages:r.hasMessages};
  });
} });
Object.defineProperty(FAMILY_THREADS, 'loading', { get: function(){ return THREADS.loading; } });
Object.defineProperty(STAFF_THREADS, 'list', { get: function(){
  return (THREADS.list||[]).filter(function(r){ return r.kind!=='family'; }).map(function(r){
    return {contactType:r.kind==='admin'?'admin':'staff', teacherId:r.id,
            teacherName:r.name, unread:r.unread, reviewCount:r.reviewCount,
            waitingSince:r.waitingSince, replyDueBy:r.replyDueBy, closed:r.closed,
            closedByName:r.closedByName, lastMessageAt:r.lastMessageAt,
            // [1.352] — the same two, for the staff thread's own closed line.
            closedAt:r.closedAt, closedUnanswered:r.closedUnanswered,
            lastMessageText:r.lastMessageText, lastSenderName:r.lastSenderName,
            hasMessages:r.hasMessages};
  });
} });
Object.defineProperty(STAFF_THREADS, 'loading', { get: function(){ return THREADS.loading; } });
var STAFF_PICKER = {loading:false, query:'', all:[]};
var ACTIVE_STAFF_THREAD = null; // {contactType:'admin'|'staff', otherId, otherName, messages, draft, sending, loading}

// Family Messages state. FAMILY_VIEW: 'list' (existing conversations) |
// 'picker' is retired ([1.261]) — the roster lists everybody, so there is
// nothing a separate start-a-conversation view would add |
// 'thread' (one open conversation).
var FAMILY_VIEW = 'list';

// ── [1.336] — ONE pane, so ONE thing can be open in it ───────────────────
//
// AC, 5 September 2026, twice: "teacher can't click a message to view it in
// the message list while another message is open... Any message clicked on the
// left should open instantly."
//
// **Found by reading what the pane actually chooses, not by guessing.** There
// are two view flags for one pane and rMessagesPage picks between them:
//
//     var thread = STAFF_VIEW==='thread' ? rStaffThread()
//                : FAMILY_VIEW==='thread' ? rFamilyThread() : ...
//
// STAFF wins. So with a staff thread open, clicking a FAMILY row set
// FAMILY_VIEW='thread' — and nothing changed on screen, because STAFF_VIEW was
// still 'thread' and got there first. The click worked perfectly and had no
// visible effect, which is exactly what AC described. The other direction
// happened to work, which is why it looked intermittent.
//
// **This is [1.292]'s fault in a second place: two copies of one truth.** The
// portal held two rosters and they could disagree; it holds two view flags for
// one pane and they can disagree too. The fix is the same shape — one place
// decides, and the flags are only ever set together.
//
// Every assignment to either flag goes through here, and check.js asserts that
// no other line in this file assigns one, so a third caller cannot reintroduce
// the state where both say 'thread'.
function _openPane(kind){
  FAMILY_VIEW = (kind==='family') ? 'thread' : 'list';
  STAFF_VIEW  = (kind==='staff')  ? 'thread' : 'list';
  if(kind!=='family') ACTIVE_THREAD=null;
  if(kind!=='staff')  ACTIVE_STAFF_THREAD=null;
}

// BACKLOG 1.136. Delivered on the roster payload rather than a config call --
// this portal has no getPublicConfig, and the roster is fetched on load and
// again every 5 seconds, so flipping the lock in admin reaches teachers within
// seconds without a reload.
var MSG_LOCK = { locked:false, msg:'' };
// Sheets turns a stored "TRUE" into a real boolean, so a config flag can arrive
// as either. The other two portals both carry an isTruthy() for this; this one
// had no config flags until now and so had none.
function _tIsTruthy(v){ return v===true||v==='TRUE'||v==='true'; }
// Roster search (BACKLOG 1.161 #3). familyIds is what the server matched;
// an empty query means show everything.
// AC, 3 September: "Dropdown with all the teacher's families and students,
// searchable by either. Make sure the text field doesn't time out or act
// jumpy." Names come from the roster the page already has, so typing filters
// locally and costs no round trip at all — the old version debounced a server
// search, which is what made it feel laggy. `matches` is only ever what is
// currently typed; nothing is cached across keystrokes.
// [1.348] — the search reaches into the MESSAGES as well as the names now.
// hits/hitsFor hold the server's answer and the query it belongs to, so a
// stale answer is never drawn against a newer query.
var MSG_SEARCH = {query:'', open:false, hits:{}, hitsFor:'', searching:false, _t:null};
// [1.261] — FAMILY_PICKER and its six functions were here. The picker screen
// is gone: the roster contains every family this teacher teaches ([1.172]) and
// every staff contact including Admin ([1.260]), so the search on the roster
// finds anybody and clicking them opens the thread. One screen.
var ACTIVE_THREAD = null; // {familyId, parent1Name, parent2Name, messages, draft, sending, loading, notifyP1, notifyP2}

// Login form state — single-screen email+password (not the family portal's
// two-step flow) — confirmed with AC, see SPEC_MESSAGING_V1.md §4.
var LF = {email:'', password:'', remember:true};

// forgot password / reset password
var FP = {email:'', done:false, success:false, error:'', busy:false};
// set/reset password (reached via emailed ?resetToken= link)
var SPW = {checking:false, invalid:false, resent:false, resending:false, email:'', pw1:'', pw2:'', busy:false, success:false, error:''};

// ============================================================
// API
// ============================================================
var GAS_URL = 'https://script.google.com/a/macros/keylab.nyc/s/AKfycbzY4K1XCbYZlj4fXksfwEZ3Kxbeolr9abRuifT-_TY4hgfPZP9gbL1dSCn1_zeFRsvl3g/exec';
function api(payload, cb){
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  })
  .then(function(res){ return res.json(); })
  .then(function(r){ cb(null, r); })
  .catch(function(e){ cb(e); });
}
// ============================================================
// HELPERS
// ============================================================
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showMsg(m, t){
  MSG={m:m, t:t||'s'}; render();
  setTimeout(function(){ MSG={m:'',t:''}; render(); }, 7000);
}

// ── [1.404] — ONE status mechanism, and it lives BESIDE THE CONTROL ───────
//
// AC, 8 September 2026, for the third time: *"put status banners by the
// function buttons, not at the top of the screen whenever possible and don't
// make the gray. Status banners should be clear and visible, not subtle and
// hidden."* And, on the same pass: *"success messages ... are still showing up
// in the right corner of the screen instead of at the button the action takes
// place ... it's very easy to miss these throughout the tool."*
//
// **Four of his findings are this one fault** — saving a template, turning Away
// on, scheduling a message, attaching a file: each does the thing and says
// nothing, or says it somewhere nobody is looking.
//
// **showMsg() is why it keeps happening.** It is the easy call and it is always
// a corner toast, so reaching for it is how a state ends up hidden. This is the
// alternative, and the question to ask before using either is *"which control
// is this about, and can the message live there instead?"*
//
// Three states, deliberately no more: WORKING, DONE, FAILED. Keyed by the
// control, so two actions cannot fight over one line, and rendered by whoever
// draws that control — which is what puts it in the right place without this
// module knowing anything about layout.
var ACT = {};   // key -> {state:'working'|'done'|'failed', text:''}
var _actTimers = {};
function actStart(key, text){
  ACT[key] = {state:'working', text:text||''};
  if(_actTimers[key]){ clearTimeout(_actTimers[key]); delete _actTimers[key]; }
  render();
}
// Done clears itself. A confirmation that stays for ever stops being a
// confirmation and becomes furniture — but it stays long enough to be READ,
// which is the half the old toast got wrong by being somewhere else entirely.
function actDone(key, text){
  ACT[key] = {state:'done', text:text||''};
  if(_actTimers[key]) clearTimeout(_actTimers[key]);
  _actTimers[key] = setTimeout(function(){ delete ACT[key]; delete _actTimers[key]; render(); }, 4000);
  render();
}
// A failure does NOT clear itself. It is the one state a person has to act on.
function actFail(key, text){
  ACT[key] = {state:'failed', text:text||''};
  if(_actTimers[key]){ clearTimeout(_actTimers[key]); delete _actTimers[key]; }
  render();
}
function actClear(key){
  if(_actTimers[key]){ clearTimeout(_actTimers[key]); delete _actTimers[key]; }
  if(ACT[key]){ delete ACT[key]; render(); }
}
function actBusy(key){ return !!(ACT[key] && ACT[key].state==='working'); }
// Drawn by whatever draws the control. Empty when there is nothing to say, so
// a caller can put it anywhere unconditionally.
function rAct(key){
  var a=ACT[key]; if(!a) return '';
  var icon = a.state==='working' ? '<span class="spin">\u21bb</span> '
           : a.state==='done'    ? '\u2713 ' : '\u0021 ';
  return '<div class="act-note act-'+a.state+'">'+icon+esc(a.text||'')+'</div>';
}

// Formats an epoch-ms timestamp as "Thursday, 9/3/26 2:12 AM" — see BACKLOG
// 1.18. Falls back to the raw value for anything that doesn't parse (e.g.
// a message sent before this fix, still holding the old date-only string).
//
// [1.249] — THE FULL WEEKDAY, everywhere, in all three portals. AC gave this
// for the system row; it is applied to every message timestamp rather than to
// that one line, because two date formats in one thread is the exact
// inconsistency he raised a pass earlier, and applying it to one row would
// have preserved it.
function fmtMsgTime(ms){
  var n=Number(ms);
  if(!n) return String(ms||'');
  var d=new Date(n);
  if(isNaN(d.getTime())) return String(ms||'');
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var h=d.getHours(), mins=d.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0) h12=12;
  var mm=mins<10?'0'+mins:String(mins);
  return days[d.getDay()]+', '+(d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(-2)+' '+h12+':'+mm+' '+ampm;
}

// "Remember me" persistent session — small localStorage wrapper, safe to
// call even where storage is unavailable/blocked. Mirrors the family
// portal's _klSaveSession()/_klReadSession()/_klClearSession() pattern.
function _ktSaveSession(token, teacherId, teacherName){
  try{ localStorage.setItem('kl_teacher_session', JSON.stringify({token:token, teacherId:teacherId, teacherName:teacherName||''})); }catch(e){}
}
function _ktReadSession(){
  try{
    var raw=localStorage.getItem('kl_teacher_session');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function _ktClearSession(){
  try{ localStorage.removeItem('kl_teacher_session'); }catch(e){}
}
// [1.181] — the server could not be reached, which says nothing about whether
// this login is good. The session is kept, the teacher is told plainly, and it
// retries by itself. Backs off so a long outage does not hammer the server,
// and never gives up: coming back from a dead spot should just work.
var _ktRetryMs=4000;
function _ktBootRetry(saved){
  PAGE='boot'; BOOT_OFFLINE=true; render();
  setTimeout(function(){
    api({action:'teacherCheckSession', data:{teacherToken:saved.token}}, function(e2,r2){
      if(e2||!r2){ _ktRetryMs=Math.min(_ktRetryMs*2, 60000); _ktBootRetry(saved); return; }
      BOOT_OFFLINE=false; _ktRetryMs=4000;
      if(r2.ok){
        TEACHER_ID=r2.teacherId; TEACHER_NAME=r2.teacherName||'';
        _ktSaveSession(TOKEN, TEACHER_ID, TEACHER_NAME);
        PAGE='home'; render();
        loadFamilyThreads();
        // Both rosters, same as sign-in — a badge that is only true once you
        // visit the tab is not a badge (1.161 #1).
        loadStaffThreads(true);
        _startMessagePolling(); loadTeacherSettings(); loadScheduled();   // [1.373]
      } else {
        _ktClearSession(); TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
        PAGE='login'; render();
      }
    });
  }, _ktRetryMs);
}
var BOOT_OFFLINE=false;

// ============================================================
// RENDER ROOT
// ============================================================
// ── [1.259] — render() cannot re-enter itself ───────────────────────────
// AC's report was "teacher portal text entry is backwards" — typing "this is
// broken" into the message search produced "nekorb si siht". The cause is not
// the caret; it is that render() calls itself, from inside its own focus
// restore:
//
//   1. oninput -> render(). The caret position is captured correctly, then
//      the container's innerHTML is replaced.
//   2. The restore block focuses the NEW input, which fires its onfocus
//      handler, which calls render() AGAIN — re-entrantly, from inside step 2.
//   3. That nested render captures selectionStart on an input it has just
//      focused and not yet positioned: 0. It rebuilds and sets the caret to 0.
//   4. The outer render then positions the element it captured, which the
//      nested render has already detached. Nothing happens on screen.
//
// So every keystroke lands in front of the last one.
//
// THE FIX IS THE RE-ENTRANCY, NOT THE CARET, and that distinction is the whole
// point of [1.265]. Removing the offending onfocus fixes the search box and
// leaves the trap armed for the next handler that calls render() — which is
// how [1.32], [1.193], [1.221] and [1.239] each fixed one call site of one
// bug, four times, and this became the fifth instance.
//
// A render requested while a render is running is DROPPED, not queued. The
// one already in progress reads the same state and will draw it: every
// handler that triggers this mutates state first and renders second, so the
// in-flight render has already seen the change or is about to. Queueing would
// re-run the same draw for no reason and reintroduce the caret problem one
// tick later.
var _rendering = false;
function render(){
  if(_rendering) return;
  _rendering=true;
  try{ _renderBody(); } finally { _rendering=false; }
}
function _renderBody(){
  var el=document.getElementById('app');
  if(!el) return;
  var h='';
  if(MSG.m) h+='<div class="msg m'+esc(MSG.t)+'">'+esc(MSG.m)+'</div>';
  if(PAGE==='boot')          h+=rBoot();
  else if(PAGE==='login')    h+=rLogin();
  else if(PAGE==='forgotpw') h+=rForgotPassword();
  else if(PAGE==='setpw')    h+=rSetPassword();
  else                       h+=rHome()+rLibraryOverlay();   // [1.495]
  // render() replaces #app wholesale, so a message arriving mid-poll would
  // otherwise yank the teacher's cursor out of a half-typed message — the
  // teacher-side twin of the family bug fixed in 1.32.
  //
  // [1.332] — and it goes back WHERE IT WAS, not to the end. The old comment
  // here said exact restoration "isn't reliable" and sent the caret to the
  // bottom of the message every five seconds instead; measured in a browser,
  // a text offset survives the rebuild perfectly well, because the box is
  // rebuilt from its own cleaned HTML. Editing a word mid-message was
  // impossible if you paused, which is a fair share of "the composer is
  // unreliable".
  var _focusedComposer='';
  var _composerOff=null;
  var _ae=document.activeElement;
  if(_ae && _ae.classList && _ae.classList.contains('cmp-rich')){
    _focusedComposer=_ae.id;
    _composerOff=_cmpOffsets(_ae);
  }
  // The link row's two inputs need the same protection as the composer itself:
  // they are plain inputs, so caret position CAN be restored exactly, unlike
  // the contenteditable below.
  var _focusedLink='', _focusedLinkPos=0;
  // 1.193, AC: "The cursor should simply stay active until I click out of the
  // window. Why does it need to time out?" It wasn't a timeout — it was this
  // list. Any field NOT named here lost the caret every time the 5-second
  // poll re-rendered, which while typing reads exactly like a timeout. The
  // rule is now the field's type, not its name, so a field added later
  // cannot be born with the bug (the family portal has always worked this
  // way; this brings the teacher portal into line).
  var _aeTag=_ae&&(_ae.tagName||'').toLowerCase();
  if(_ae && _ae.id && (_aeTag==='textarea' ||
     (_aeTag==='input' && /^(text|tel|email|search|url|number|password|date)$/i.test(_ae.type||'text')))){
    _focusedLink=_ae.id;
    try{ _focusedLinkPos=_ae.selectionStart; }catch(e){}
  }
  // 1.192, AC: "when scrolling to the bottom of the message, the screen jumps
  // and resets position." Nothing preserved the thread's scroll offset, so
  // every poll re-render dropped the reader back to the top of the list.
  var _prevList=el.querySelector('.msg-list');
  var _prevListTop=_prevList?_prevList.scrollTop:null;
  // [1.484] — AC: "when I click a tag to add, the screen jumps, but should
  // not." The library's shelves scroll inside themselves, and render() replaces
  // #app wholesale — so every press put every one of those lists back to the
  // top while the reader was halfway down it. Remembered by INDEX, which is
  // enough: the panel redraws the same lists in the same order, and a list that
  // has gone is one whose scroll nobody wants back.
  var _prevLibTops=[];
  Array.prototype.forEach.call(el.querySelectorAll('.lib-list'), function(l){
    _prevLibTops.push(l.scrollTop);
  });
  // [1.221], AC: "composers are still jumpy, with unstable scrolling snaps."
  // The residue of 1.192/1.193, and it is the refocus that does it: focus()
  // scrolls the focused element into view, so every poll landing while the
  // composer had the caret yanked the page to it. preventScroll stops that at
  // source; the window offset is remembered as well, because replacing the
  // page's HTML can briefly shorten the document and the browser clamps the
  // scroll position when it does.
  var _prevWinY=window.pageYOffset||document.documentElement.scrollTop||0;
  el.innerHTML=h;
  // [1.127] — an arrow-key reorder has to leave the focus ON THE ROW IT MOVED,
  // and that cannot be done at the call site: the save that follows re-renders
  // twice more and each rebuild throws the focus back to the body. Found by
  // pressing the key twice — the first press moved a row and the second did
  // nothing at all, which reads as the feature being broken.
  //
  // The row's grip is a BUTTON, so the id-based restoration above does not
  // cover it; and it must not simply be restored by id either, because the
  // point is to follow the row to its new position.
  //
  // Only ever taken from the body, never from something the teacher has since
  // clicked into — and touching anything else clears it.
  if(TSET.tplFocus>=0){
    var _ag=document.activeElement;
    if(!_ag || _ag===document.body || (_ag.classList && _ag.classList.contains('lnk-grip'))){
      var _gp=el.querySelector('#ttpl-row'+TSET.tplFocus+' .lnk-grip');
      if(_gp) _focusNoScroll(_gp);
    } else { TSET.tplFocus=-1; }
  }
  if(_focusedLink){
    var _li=document.getElementById(_focusedLink);
    if(_li){
      _focusNoScroll(_li);
      try{ _li.setSelectionRange(_focusedLinkPos,_focusedLinkPos); }catch(e){}
    }
  }
  if(_focusedComposer){
    var _ce=document.getElementById(_focusedComposer);
    if(_ce){
      _focusNoScroll(_ce);
      _cmpRestore(_ce,_composerOff);
      // [1.332] — and the toolbar lights are re-read. They are rebuilt with
      // the rest of #app, so without this Bold looks OFF while bold is still
      // on, every five seconds.
      _composerState(_focusedComposer);
    }
  }
  // Scroll to the newest message, not the oldest (1.27, 18 Aug) — only at
  // the specific call sites where messages actually changed, not on every
  // render (typing in the composer re-renders too), so it doesn't fight
  // someone scrolled up reading history.
  // [1.235] — clicking a row in Marked for review lands ON the marked message.
  // AC's answer: open the thread, jump to it, highlight it briefly. Which is
  // also why [1.232] had to come first — there has to be something to land on.
  // Deliberately not scrollIntoView(): that scrolls every ancestor including
  // the window, which is [1.221] exactly.
  var _didFocusReview=false;
  if(_focusReview){
    var mlR=el.querySelector('.msg-list');
    if(mlR){
      _focusReview=false;   // one jump per click, whether or not it lands
      var _tgt=mlR.querySelector('.bubble.saved');
      if(_tgt&&_tgt.parentNode){
        _shouldScrollMsgList=false;
        var _rw=_tgt.parentNode;
        mlR.scrollTop=Math.max(0,_rw.offsetTop-mlR.offsetTop-12);
        _rw.className+=' flash';
        _didFocusReview=true;
      }
    }
  }
  if(_didFocusReview){
    /* already positioned */
  } else if(_shouldScrollMsgList){
    _shouldScrollMsgList=false;
    var ml=el.querySelector('.msg-list');
    if(ml) ml.scrollTop=ml.scrollHeight;
  } else if(_prevListTop!==null){
    // Put the reader back exactly where they were (1.192).
    var ml2=el.querySelector('.msg-list');
    if(ml2) ml2.scrollTop=_prevListTop;
  }
  // [1.484] — the library's own lists, put back before the page is.
  Array.prototype.forEach.call(el.querySelectorAll('.lib-list'), function(l, i){
    if(_prevLibTops[i]) l.scrollTop=_prevLibTops[i];
  });
  // [1.221] — and the page itself, last, after every other restore above has
  // had its say.
  var _nowWinY=window.pageYOffset||document.documentElement.scrollTop||0;
  if(_prevWinY&&_nowWinY!==_prevWinY) window.scrollTo(0,_prevWinY);
}

// [1.221] — focus without the browser's automatic scroll-into-view. Where
// preventScroll is not honoured, the scroll offsets are put back by the
// caller, so the worst case is the behaviour we already had.
function _focusNoScroll(el){
  try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} }
}

function loginHeader(){

// ============================================================
// LOGIN — single screen, email + password + Remember me together
// (not the family portal's two-step email-then-password flow)
// ============================================================
function rLogin(){
  var btn=busy
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Signing in...</button>'
    :'<button class="btn btn-p" onclick="doLogin()">Sign In</button>';
  return '<div class="login-w">'+loginHeader()+
    '<div class="field"><label>Email<span class="req">*</span></label>'+
    '<input id="te" type="email" autocomplete="username" inputmode="email" value="'+esc(LF.email)+'" oninput="LF.email=this.value" onkeydown="if(event.keyCode===13)doLogin()"></div>'+
    '<div class="field"><label>Password<span class="req">*</span></label>'+
    '<input id="tp" type="password" autocomplete="current-password" value="'+esc(LF.password)+'" oninput="LF.password=this.value" onkeydown="if(event.keyCode===13)doLogin()"></div>'+
    '<label class="remember-row"><input type="checkbox" id="tf-remember" '+(LF.remember?'checked':'')+' onchange="LF.remember=this.checked"> Remember me</label>'+
    btn+
    '<p class="linkline"><button type="button" class="lnk-btn" onclick="PAGE=&apos;forgotpw&apos;;FP={email:LF.email,done:false,success:false,error:&apos;&apos;,busy:false};render()">Forgot your password?</button></p>'+
    '</div>';
}

function doLogin(){
  var email=(document.getElementById('te')||{}).value||LF.email;
  var password=(document.getElementById('tp')||{}).value||LF.password;
  LF.email=(email||'').trim().toLowerCase();
  LF.password=password||'';
  if(!LF.email||LF.email.indexOf('@')===-1){ showMsg('Please enter a valid email address.','e'); return; }
  if(!LF.password){ showMsg('Please enter your password.','e'); return; }
  busy=true; render();
  api({action:'teacherLogin', data:{teacherEmail:LF.email, teacherPassword:LF.password}}, function(e,r){
    busy=false;
    if(e||!r||!r.ok){
      if(r&&r.needsSetup){
        // Account exists but has never had a password — reuse the same
        // begin-reset flow "Forgot your password?" uses, since both land on
        // the same set-new-password screen via email (mirrors the family
        // portal's doBeginResetFromLogin()).
        doBeginResetFromLogin();
        return;
      }
      showMsg((r&&r.error)||'Login failed','e');
      render(); return;
    }
    TOKEN=r.token; TEACHER_ID=r.teacherId; TEACHER_NAME=r.teacherName||'';
    if(LF.remember) _ktSaveSession(r.token, r.teacherId, r.teacherName);
    PAGE='home'; render();
    loadFamilyThreads();
    // Both rosters at sign-in, not just the visible one: a badge that only
    // becomes true once you visit the tab is not a badge (1.161 #1).
    loadStaffThreads(true);
    _startMessagePolling();
    loadTeacherSettings();
    loadScheduled();   // [1.373] — the count, before they look for it
  });
}

function doBeginResetFromLogin(){
  busy=true; render();
  api({action:'teacherBeginReset', data:{email:LF.email}}, function(e,r){
    busy=false;
    PAGE='forgotpw';
    FP={email:LF.email, done:true, success:!!(r&&r.ok), error:(r&&r.error)||'', busy:false};
    render();
  });
}

    }
    return '<div class="login-w">'+loginHeader()+

      '<button class="btn btn-s" style="margin-top:.5rem" onclick="PAGE=&apos;login&apos;;render()">Back to Sign In</button></div>';
  }

    ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Sending...</button>'

function doBeginReset(){
  var email=(document.getElementById('fpe')||{}).value||FP.email;
  FP.email=(email||'').trim().toLowerCase();
  if(!FP.email||FP.email.indexOf('@')===-1){ showMsg('Please enter a valid email address.','e'); return; }

  api({action:'teacherBeginReset', data:{email:FP.email}}, function(e,r){
    FP.busy=false;
    FP.done=true;
    FP.success=!!(r&&r.ok);
    FP.error=(r&&r.error)||'';
    render();
  });
}

// ============================================================
// SET / RESET PASSWORD (reached via emailed ?resetToken= link)
// ============================================================
function rSetPassword(){
  if(SPW.checking){
    return '<div class="login-w">'+loginHeader()+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:22px">↻</span></div></div>';
  }
  if(SPW.invalid){
    if(SPW.resent){
      return '<div class="login-w">'+loginHeader()+
        '<h1>Check your email</h1>'+
        '<p>We’ve sent a fresh reset link to <strong>'+esc(SPW.email)+'</strong>.</p>'+
        '<button class="btn btn-p" onclick="PAGE=&apos;login&apos;;render()">Back to Sign In</button></div>';
    }
    var resendBtn=SPW.email
      ?(SPW.resending
        ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Sending...</button>'
        :'<button class="btn btn-p" onclick="doResendResetLink()">Send me a new link</button>')
      :'';
    return '<div class="login-w">'+loginHeader()+
      '<h1>This link has expired</h1>'+
      (resendBtn||'')+
      '<button class="btn btn-s" style="margin-top:.5rem" onclick="PAGE=&apos;login&apos;;render()">Back to Sign In</button></div>';
  }
  if(SPW.success){
    return '<div class="login-w">'+loginHeader()+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:22px">↻</span></div></div>';
  }
  var btn=SPW.busy
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span> Saving...</button>'
    :'<button class="btn btn-p" onclick="doCompleteReset()">Save Password</button>';
  return '<div class="login-w">'+loginHeader()+
    '<h1>Set your password</h1>'+
    '<p>Must be at least 8 characters.</p>'+
    (SPW.error?'<p style="color:var(--rt)">'+esc(SPW.error)+'</p>':'')+
    (SPW.email?'<p style="font-size:13px;color:var(--text3)">Setting a password for <strong>'+esc(SPW.email)+'</strong></p>':'')+
    '<div class="field"><label>New password<span class="req">*</span></label>'+
    '<input id="spw1" type="password" autocomplete="new-password" value="'+esc(SPW.pw1)+'" oninput="SPW.pw1=this.value"></div>'+
    '<div class="field"><label>Confirm password<span class="req">*</span></label>'+
    '<input id="spw2" type="password" autocomplete="new-password" value="'+esc(SPW.pw2)+'" oninput="SPW.pw2=this.value" onkeydown="if(event.keyCode===13)doCompleteReset()"></div>'+
    btn+'</div>';
}

function doCompleteReset(){
  var pw1=(document.getElementById('spw1')||{}).value||SPW.pw1;
  var pw2=(document.getElementById('spw2')||{}).value||SPW.pw2;
  SPW.pw1=pw1; SPW.pw2=pw2; SPW.error='';
  if(!pw1||pw1.length<8){ SPW.error='Password must be at least 8 characters.'; render(); return; }
  if(pw1!==pw2){ SPW.error='Passwords don\'t match'; render(); return; }
  SPW.busy=true; render();
  api({action:'teacherCompleteReset', data:{resetToken:RESET_TOKEN, newPassword:pw1}}, function(e,r){
    SPW.busy=false;
    if(e||!r||!r.ok){
      SPW.error=(r&&r.error)||'Something went wrong. Please try again.';
      render(); return;
    }
    SPW.success=true;
    render();
    if(r.token&&r.teacherId){
      TOKEN=r.token; TEACHER_ID=r.teacherId; TEACHER_NAME=r.teacherName||'';
      _ktSaveSession(r.token, r.teacherId, r.teacherName);
      PAGE='home'; render();
      loadThreads();
      _startMessagePolling();
      loadTeacherSettings();
      loadScheduled();   // [1.373]
    } else {
      PAGE='login'; render();
    }
  });
}

function doResendResetLink(){
  if(!SPW.email) return;
  SPW.resending=true; render();
  api({action:'teacherBeginReset', data:{email:SPW.email}}, function(e,r){
    SPW.resending=false;
    if(e||!r||!r.ok){
      showMsg((r&&r.error)||'Something went wrong. Please try again.','e');
      render(); return;
    }
    SPW.resent=true; render();
  });
}

// ============================================================
// [1.176], AC: the Message Response Timer Key showed for admin and not for
// teachers, "who are the people the colours are aimed at". Same wording and
// same order as admin's, so the two screens cannot explain it differently.
function rTimerKey(){
  return '<div class="mp-key">'+
    '<span style="font-weight:700;color:var(--text3)">'+esc(CMP_COPY.keyLead)+'</span>'+
    // [1.249] — four stages, matching the strip on the rows and, word for
    // word, AC's own guide copy below it ("Grey - under 4 hours, amber at 4
    // hours, orange at 12 hours ... Red when past the response deadline").
    // The swatches are the strip's own tokens, so this key cannot describe a
    // colour the rows do not draw. The 2h purple is retired.
    // ── [1.354] — four entries, not five ──────────────────────────────
    //
    // AC, 6 September: "remove the grey under 4h. Just keep it blue."
    //

var GUIDE_SEC_OPEN = {};

// Tags out AND ENTITIES DECODED. The second half was missing and it showed: a
// template reading "Great lesson today — really solid work" was drawn as
// "Great lesson today &mdash; really sol…", found by opening the panel rather
// than reading it.
//
// It was worse than cosmetic. This feeds the EDIT BOX, and saving re-escapes
// what is in that box — so an em dash would have become &amp;mdash; on the
// first save and &amp;amp;mdash; on the second. A template edited twice would
// have filled with visible junk.
//
// A textarea is the decoder on purpose: assigning to its innerHTML cannot run
// anything, because a textarea's content is raw text by definition. A div
// would decode just as well and would also fire an inline handler on any
// markup that carried one.
function _ttplDecode(html){
  try{
    var t=document.createElement('textarea');
    t.innerHTML=String(html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]*>/g,'');
    return t.value;
  }catch(e){ return String(html||'').replace(/<[^>]*>/g,''); }
}
function _ttplPreview(body){
  var t=_ttplDecode(body).replace(/\s+/g,' ').trim();
  return t.length>70 ? t.slice(0,70)+'…' : t;
}
function _ttplToText(body){ return _ttplDecode(body); }

    // here IS the order in the composer's picker, which is the point of it —
    // the two or three a teacher sends every day belong at the top.
    //

    // HTML5 drag-and-drop does not fire on touch AT ALL, and this portal is
    // used on a phone between lessons; pointer events cover both. And a button
    // can be reached by keyboard, so the arrow keys move a row for anyone who

// At the cursor if the box has focus, at the end otherwise — a tag appended to
// the end of a finished sentence is a tag somebody has to move.
function ttplInsertTag(i, tag){
  var el=document.getElementById('ttpl-b'+i); if(!el) return;
  var t='['+tag+']';
  var a=el.selectionStart, b=el.selectionEnd;
  if(a===null||a===undefined){ el.value+=t; }
  else { el.value = el.value.slice(0,a) + t + el.value.slice(b); a+=t.length; }
  ttplBodyTyped(i, el.value);
  el.focus();
  try{ el.setSelectionRange(a,a); }catch(e){}
}
// The box is a textarea, so what comes out of it is plain text and saving it
// re-escapes it. That is fine for a row somebody edited — they were looking at
// plain text and that is what they changed.
//
// It is NOT fine for the others, and this flag is what keeps them out of it: a
// template saved from the composer carries real markup — bold, and the link
// buttons from [1.338] — and running every row through the text box on every
// save would have quietly stripped the formatting off templates nobody
// touched. **A drag to reorder would have flattened the whole library.**
function ttplBodyTyped(i, v){
  if(!TSET.tpls || !TSET.tpls[i]) return;
  TSET.tpls[i].body=v; TSET.tpls[i]._txt=true;
}
// ── [1.127] — reordering the library, by drag or by arrow key ───────────
// AC: "Teachers should be able to reorganize their templates in whatever order
// they want by dragging and dropping order."
//
// The order is not decoration. It is the order of the picker in the composer,
// so putting the two a teacher sends every day at the top is the difference
// between a list they scan and a list they read.
//
// Nothing is re-rendered mid-drag: the rows are moved with a transform and the
// array is spliced once, on release. Re-rendering on every pointermove would
// destroy the very elements being measured.
var TDRAG=null;
function ttplGrab(e,i){
  // Not while a row is open for editing or asking to be deleted — its form
  // would be dragged along with it, and the re-render on drop would throw away
  // what was typed.
  if(TSET.tplEdit>=0 || TSET.tplDel>=0) return;
  var list=document.getElementById('ttpl-list'); if(!list) return;
  var items=[].slice.call(list.children);
  if(items.length<2 || !items[i]) return;
  TDRAG={i:i, to:i, y0:e.clientY, el:items[i], items:items,
         box:items.map(function(el){ var r=el.getBoundingClientRect(); return {top:r.top, h:r.height}; })};
  TDRAG.el.classList.add('lnk-drag');
  // Capture, or the pointer leaves the little grip within a few pixels and the
  // drag ends the moment it starts.
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function ttplDragMove(e){
  if(!TDRAG) return;
  e.preventDefault();
  var d=TDRAG, dy=e.clientY-d.y0, H=d.box[d.i].h;
  d.el.style.transform='translateY('+dy+'px)';
  // Where it would land: the number of OTHER rows whose middle is now above
  // the middle of the row being dragged. That is the splice index directly,
  // because the dragged row is taken out of the list before it goes back in.
  var mid=d.box[d.i].top + H/2 + dy, to=0;
  d.box.forEach(function(b,k){ if(k!==d.i && (b.top+b.h/2)<mid) to++; });
  d.to=to;
  // The others slide out of the way, so the gap the row will drop into is
  // visible rather than guessed at.
  d.items.forEach(function(el,k){
    if(k===d.i) return;
    var shift=0;
    if(k>d.i && k<=to) shift=-H;
    else if(k<d.i && k>=to) shift=H;
    el.style.transform = shift ? 'translateY('+shift+'px)' : '';
  });
}
function ttplDrop(){
  if(!TDRAG) return;
  var d=TDRAG; TDRAG=null;
  d.items.forEach(function(el){ el.style.transform=''; el.classList.remove('lnk-drag'); });
  if(d.to===d.i){ return; }        // put back where it came from: nothing to save
  ttplMoveTo(d.i, d.to);
}
// Arrow keys on the grip, doing exactly what the drag does. Not an accessible
// afterthought — it is also the faster way to nudge one row up.
function ttplGripKey(e,i){
  var dir = e.key==='ArrowUp' ? -1 : (e.key==='ArrowDown' ? 1 : 0);
  if(!dir) return;
  if(TSET.tplEdit>=0 || TSET.tplDel>=0) return;
  var to=i+dir;
  if(to<0 || to>=(TSET.tpls||[]).length) return;
  e.preventDefault();
  // Set BEFORE the move, so the render inside it already puts the focus back.
  TSET.tplFocus=to;
  ttplMoveTo(i,to);
}
function ttplMoveTo(from,to){
  if(!TSET.tpls || from===to) return;
  var row=TSET.tpls.splice(from,1)[0];
  TSET.tpls.splice(to,0,row);
  render();
  // Saved immediately. There is no page-level commit anywhere in this panel
  // ([1.338]'s rule), so an order that only survived until the next reload
  // would be a bug rather than a choice.
  ttplSave();
}
function ttplLoad(){
  if(TSET.tpls) return;
  TSET.tpls=[];
  api({action:'getTeacherTemplates', data:{teacherToken:TOKEN}}, function(e,r){
    TSET.tpls=(!e&&r&&r.ok&&r.templates)||[]; render();
  });
}
function ttplEdit(i){
  // A copy first, so Cancel is a real way back — the boxes write straight into
  // the list as they are typed ([1.338]).
  TSET.tplBackup=JSON.parse(JSON.stringify(TSET.tpls[i]||{}));
  TSET.tplEdit=i; TSET.tplDel=-1; render();
}
function ttplCancel(){
  var i=TSET.tplEdit;
  if(i>=0 && TSET.tpls && TSET.tpls[i] && TSET.tplBackup) TSET.tpls[i]=TSET.tplBackup;
  TSET.tplEdit=-1; TSET.tplBackup=null; render();
}
function ttplDelAsk(i){ TSET.tplDel=i; TSET.tplEdit=-1; render(); }
function ttplDelCancel(){ TSET.tplDel=-1; render(); }
function ttplDelDo(i){ TSET.tpls.splice(i,1); TSET.tplDel=-1; ttplSave(); }
// ── [1.404] + [1.429] — saving a template says so, and names it ──────────
//
// AC: "Templates work, but I can rename several the exact same name. Button
// behaviors don't tell me anything about progress, and there is no banner for
// successfully adding a new template confirming the name etc."
//
// Both halves are here: the duplicate-name refusal, and a status that names
// the template back so a teacher knows WHICH one was saved.
function ttplSave(){
  TSET.tplsErr='';
  // [1.429] — two templates with one name is a picker where a teacher cannot
  // tell their own work apart. Refused here rather than server-side because
  // the teacher is looking at the box they typed it into; the server refuses
  // an empty name already and this is the same courtesy one level up.
  var seen={}, dup='';
  (TSET.tpls||[]).forEach(function(t){
    var k=String(t.label||'').trim().toLowerCase();
    if(!k) return;
    if(seen[k]) dup=String(t.label||'').trim(); else seen[k]=true;
  });
  if(dup){
    actFail('tpl', TCH_COPY.tplDuplicate.replace('{name}', dup));
    render();
    return;
  }
  var payload=(TSET.tpls||[]).map(function(t){
    return {templateId:t.templateId, label:t.label,
            body: t._txt ? esc(_ttplToText(t.body)).replace(/\n/g,'<br>') : t.body};
  });
  var _named=(TSET.tpls||[])[TSET.tplEdit];
  var _name=_named ? String(_named.label||'').trim() : '';
  actStart('tpl', TCH_COPY.savingTemplate);
  render();
  api({action:'saveTeacherTemplates', data:{teacherToken:TOKEN, templates:payload}}, function(e,r){
    if(e||!r||!r.ok){ TSET.tplsErr=(r&&r.error)||'Could not save.'; actFail('tpl',(r&&r.error)||'Could not save.'); render(); return; }
    TSET.tpls=null; TSET.tplEdit=-1; TSET.tplDel=-1; TSET.tplBackup=null; ttplLoad();
    // The COMPOSER's copy is stale the moment this saves.
    SAVED_TPLS=[]; _savedTplsLoaded=false; _savedTplsInFlight=false; loadSavedTpls();
    actDone('tpl', _name ? TCH_COPY.savedTemplateNamed.replace('{name}', _name) : TCH_COPY.savedTemplate);
    render();
  });
}

// One row, and it is its own unit of work. AC, 6 September: "there is no need
// for update link library. Simply save the link to save it. Click delete on
// the link to delete it. Click edit to edit it." So Edit and Delete sit on the
// row at rest, the boxes exist only while that row is open, and Save closes it
// — there is no page-level commit left to forget.
function rTlinksItem(i,l){
  var open=(i===TSET.linkEdit);
  var nm=String(l.label||''), ur=String(l.url||'');
  // A row with nothing in it yet says so, in AC's words, and draws ONE line
  // rather than a greyed example that reads like a link somebody saved.
  var blank=(!nm&&!ur);
  var h='<div class="lnk-item"><div class="lnk-hd">'+
    '<button type="button" class="lnk-open" aria-expanded="'+(open?'true':'false')+'"'+
      ' aria-label="Edit '+esc(nm||TLINK_COPY.blank)+'"'+
      ' onclick="'+(open?'tlinksCancel()':'tlinksEdit('+i+')')+'">'+
      '<span class="lnk-nm'+(nm?'':' lnk-ph')+'">'+esc(nm||TLINK_COPY.blank)+'</span>'+
      (blank?'':'<span class="lnk-ur">'+esc(ur)+'</span>')+
    '</button>';
  var asking=(i===TSET.linkDel);
  if(!asking && !open){
    h+='<button type="button" class="lnk-a" onclick="tlinksEdit('+i+')">'+esc(TLINK_COPY.edit)+'</button>'+
       '<button type="button" class="lnk-x" onclick="tlinksDelAsk('+i+')">'+esc(TLINK_COPY.del)+'</button>';
  }
  h+='</div>';
  if(asking){
    // AC, 6 September: "always a confirm step to delete". Its own strip under
    // the row, not three more controls on the name line — and inline rather
    // than a browser confirm(), for [1.34]'s reason: a native dialog cannot be
    // styled, cannot be corrected, and drops the sender out of the page.
    h+='<div class="lnk-confirm">'+
       '<span class="lnk-ask">'+esc(TLINK_COPY.delAsk)+'</span>'+
       '<button type="button" class="btn btn-s" style="font-size:12px" onclick="tlinksDelCancel()">'+esc(TLINK_COPY.delNo)+'</button>'+
       '<button type="button" class="btn btn-x" style="font-size:12px" onclick="tlinksDelDo('+i+')">'+esc(TLINK_COPY.delYes)+'</button>'+
       '</div>';
  }
  if(open) h+=rTlinksForm(i,l);
  return h+'</div>';
}
// The open row. Stacked and labelled rather than two boxes side by side: the
// teacher portal's column is 420px wide, and three controls on one line was
// three cramped controls ([1.332] — found by opening it, not reading it).
function rTlinksForm(i,l){
  var h='<div class="lnk-form">';
  // [1.193]'s rule — every field a re-render can rebuild needs an id, or the
  // caret is lost mid-word and reads as a timeout.
  h+='<div class="lnk-lb">'+esc(TLINK_COPY.nameLbl)+'</div>'+
     '<input id="tlink-n'+i+'" type="text" value="'+esc(l.label||'')+'" placeholder="'+esc(TLINK_COPY.namePh)+'"'+
     ' aria-label="'+esc(TLINK_COPY.nameLbl)+'" oninput="TSET.links['+i+'].label=this.value">';
  h+='<div class="lnk-lb">'+esc(TLINK_COPY.urlLbl)+'</div>'+
     '<input id="tlink-u'+i+'" type="text" value="'+esc(l.url||'')+'" placeholder="'+esc(TLINK_COPY.urlPh)+'"'+
     ' aria-label="'+esc(TLINK_COPY.urlLbl)+'" oninput="TSET.links['+i+'].url=this.value">';
  h+='<div class="lnk-frow">'+
     '<button type="button" class="btn btn-s" style="font-size:12px" onclick="tlinksCancel()">'+esc(TLINK_COPY.cancel)+'</button>'+
     '<button type="button" class="btn btn-p" style="font-size:12px" onclick="tlinksSave()">'+esc(TLINK_COPY.save)+'</button>'+
     '</div></div>';
  return h;
}
// Opening a row takes a copy of what is stored, so Cancel is a real way back
// rather than a word for "stop typing" — the boxes write straight into the
// list as they are typed.
function tlinksEdit(i){
  var l=(TSET.links||[])[i]||{};
  TSET.linkBackup={label:l.label||'', url:l.url||''};
  TSET.linkEdit=i; TSET.linkDel=-1; TSET.linksSaved=false; TSET.linksErr=''; render();
}
function tlinksCancel(){
  var i=TSET.linkEdit, rows=(TSET.links||[]).slice();
  if(i>=0 && rows[i]){
    var b=TSET.linkBackup;
    // A row that was never anything comes out entirely; one that existed goes
    // back to what was stored.
    if(!b || (!b.label && !b.url)) rows.splice(i,1);
    else { rows[i].label=b.label; rows[i].url=b.url; }
    TSET.links=rows;
  }
  TSET.linkEdit=-1; TSET.linkDel=-1; TSET.linkBackup=null; render();
}
function tlinksDelAsk(i){
  TSET.linkDel=i; TSET.linkEdit=-1; render();
}
function tlinksDelCancel(){
  TSET.linkDel=-1; render();
}
// The confirm IS the save: a row that vanished from the screen but is still in
// the sheet until a second button is found is the worse of the two answers.
function tlinksDelDo(i){
  var rows=(TSET.links||[]).slice();
  rows.splice(i,1);
  TSET.links=rows; TSET.linkDel=-1; TSET.linkEdit=-1; TSET.linkBackup=null;
  tlinksSave();
}
function tlinksAdd(){
  TSET.links=(TSET.links||[]).concat([{linkId:'',label:'',url:''}]);
  TSET.linkEdit=TSET.links.length-1; TSET.linkDel=-1; TSET.linkBackup={label:'',url:''};
  TSET.linksSaved=false; TSET.linksErr=''; render();
}
function tlinksLoad(){
  // [] is a real answer and a truthy guard, so an empty library is fetched
  // once and not on every visit to Settings ([1.333]'s lesson, same trap).
  if(TSET.links) return;
  TSET.links=[];
  _linkApi(function(list){ TSET.links=list||[]; render(); });
}
function tlinksSave(){
  TSET.linksErr='';
  api({action:'saveTeacherLinks', data:{teacherToken:TOKEN, links:JSON.stringify(TSET.links||[])}}, function(e,r){
    if(e||!r||!r.ok){ TSET.linksErr=(r&&r.error)||'Could not save.'; render(); return; }
    // Re-read rather than trusting what was typed: the server normalises an
    // address ("keylab.nyc" becomes "https://keylab.nyc") and drops the rows
    // that were cleared, and the list on screen should be what was stored.
    TSET.links=null; TSET.linkEdit=-1; TSET.linkDel=-1; TSET.linkBackup=null; tlinksLoad();
    // And the COMPOSER's copy is stale the moment this saves — it was warmed
    // when the roster loaded ([1.333]) and would otherwise offer yesterday's
    // list until the next sign-in.
    SAVED_LINKS=[]; _savedLinksLoaded=false; _savedLinksInFlight=false; loadSavedLinks();
    TSET.linksSaved=true; render();
    setTimeout(function(){ TSET.linksSaved=false; render(); },3000);
  });
}
