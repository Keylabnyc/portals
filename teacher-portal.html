       (t.forwardNoteError
         ? '<div style="color:var(--rt);font-size:12px;font-weight:600;margin-bottom:.4rem;text-align:right">'+
           esc(CMP_COPY.forwardNeedsNote)+'</div>'
         : '')+
       '<div style="display:flex;gap:8px;justify-content:flex-end">'+
         '<button class="btn btn-s" onclick="ACTIVE_THREAD.forwardOpen=false;ACTIVE_THREAD.forwardNoteError=false;render()">Cancel</button>'+
         (t.forwarding
           ? '<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
           : '<button class="btn btn-p" onclick="forwardToAdmin()">Send to admin</button>')+
       '</div></div>';
  }
  return h;
}

// The conversation's roster row, for the facts the thread payload does not
// carry — whether it is closed, and who closed it.
function _convRow(familyId){
  return (FAMILY_THREADS.list||[]).filter(function(x){ return x.familyId===familyId; })[0]||null;
}

// ── The three things a teacher does to a conversation (3 September 2026) ──

// Save a message for review ([1.215]). Private, per message, and the only
// hand-made mark left anywhere: it replaced mark-unread, which marked a whole
// thread and claimed something untrue about a message that had been read.
// Optimistic — the tick is instant and the roster catches up behind it, since
// a checkbox that waits on a round trip feels broken.
function toggleReview(messageId, on){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  var was=null;
  (t.messages||[]).forEach(function(m){
    if(m.messageId!==messageId) return;
    was=m.reviewAt||'';
    m.reviewAt=on?Date.now():'';
  });
  // [1.231] — held until the write lands, so a wholesale re-read of the
  // thread (a manual Refresh, or the re-read after Mark seen) cannot put a
  // tick back the way it was before the server has been told. The poll itself
  // only ever APPENDS, so it was never the risk; these two are.
  t._reviewPending=t._reviewPending||{};
  t._reviewPending[messageId]=on?Date.now():'';
  render();   // the tick, the marked bubble and the roster circle, all now
  api({action:'setMessageReview', data:_threadKey(t,{messageId:messageId, review:!!on})}, function(e,r){
    delete t._reviewPending[messageId];
    if(e||!r||!r.ok){
      // Put it back rather than leaving a tick that did not stick.
      (t.messages||[]).forEach(function(m){ if(m.messageId===messageId) m.reviewAt=was; });
      showMsg((r&&r.error)||'Could not save that for review.','e'); render(); return;
    }
    // ── [1.315] — the ROW's count moves too, not only the thread's ─────────
    //
    // AC: "Saved for review badge on teacher card correctly shows no messages
    // saved for review when message is opened, but reverts back to the state
    // of the card when the messages were saved for review. It clears
    // eventually in a few minutes."
    //
    // _reviewCountFor reads the OPEN thread's messages and is right while the
    // thread is open — which is why the badge looks correct at first. Close the
    // thread and it falls back to the roster's number, which is whatever the
    // server last said, and that is the old count until a roster fetch lands.
    // So the badge was correct, then wrong, then correct again.
    //
    // The fix is the lesson [1.311] cost: **when the truth changes, move every
    // copy of it, not only the one on screen.** The write has landed; the
    // roster row is a copy of what the server now holds, so it is updated to
    // match rather than left to be corrected later.
    _setRowReviewCount(t, _openReviewMarks(t));
    _refreshRosters();
  });
}

// [1.315] — the roster row for an open thread, so a confirmed change to its
// review count is written where the row will read it after the thread closes.
// Writes into THREADS.list, never into FAMILY_THREADS/STAFF_THREADS: those are
// computed views and a write to one goes into an object nobody keeps ([1.311]).
function _setRowReviewCount(t, n){
  if(!t) return;
  var kind = t.familyId ? 'family' : (t.contactType==='admin' ? 'admin' : 'staff');
  var id = t.familyId || (kind==='admin' ? 'admin' : t.otherId);
  (THREADS.list||[]).forEach(function(row){
    if(row.kind===kind && (kind==='admin' || row.id===id)) row.reviewCount=n;
  });
}

// Re-applies whatever this client has ticked and the server has not yet
// confirmed, after a fetch that replaced the thread wholesale.
function _applyPendingReviews(t){
  if(!t||!t._reviewPending) return;
  (t.messages||[]).forEach(function(m){
    if(m.messageId && t._reviewPending.hasOwnProperty(m.messageId)) m.reviewAt=t._reviewPending[m.messageId];
  });
}

// [1.233] — clearing every review mark in this conversation, which is the
// first half of Clear & close. One server call, not a loop: a close that
// half-clears is worse than one that refuses.
function clearAllReviews(t, done){
  if(!t) return;
  (t.messages||[]).forEach(function(m){ if(m.reviewAt) m.reviewAt=''; });
  t._reviewPending={};
  render();
  api({action:'clearConversationReviews', data:_threadKey(t,{})}, function(e,r){
    if(e||!r||!r.ok){
      // Nothing was cleared and nothing is closed — put the thread back the
      // way it was and say so, rather than leaving a half-done action.
      t.closing=false; t.closeReviewOpen=false;
      showMsg((r&&r.error)||'Could not clear those.','e');
      _refreshOpenThread(); render(); return;
    }
    _refreshRosters();
    if(done) done();
  });
}

// "Mark seen" ([1.220]) — the two-line note, sent on purpose. It does NOT stop
// the clock: the conversation goes on ageing, keeps its place, and stays on
// admin's list until someone actually answers. Being seen is not being
// answered, and the tool must never let the two look the same — that is the
// whole of the item.
function markSeen(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.seenSending) return;
  t.seenSending=true; render();
  api({action:'markMessageSeen', data:_threadKey(t,{})}, function(e,r){
    t.seenSending=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send that.','e'); render(); return; }
    _refreshOpenThread();
  });
}

// Closing, which is deliberate and confirmed (AC, 3 Sept: "make teachers
// formally close conversations using a checkbox or button to close, with a
// confirm step"). Replying closes nothing — a teacher who answers "I'll check
// and come back to you" has replied without finishing, and no rule can tell
// that from a real answer.
// [1.233], AC: "Don't allow user to close conversation unless all reviewed
// messages are cleared."
//
// He then replaced the greyed-out button with a dialog, and it is the better
// of the two: the button stays live and EXPLAINS ITSELF at the moment it is
// pressed, rather than being disabled with the reason somewhere else on the
// page. A conversation with no marks still gets the plain confirm — two
// dialogs, each saying the one thing that matters at that moment.
function _openReviewMarks(t){
  var n=0;
  (t&&t.messages||[]).forEach(function(m){ if(m.reviewAt) n++; });
  return n;
}
function closeConversation(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.closing) return;
  if(_openReviewMarks(t)){ t.closeReviewOpen=true; render(); return; }
  if(!confirm(TCH_COPY.closeConfirm)) return;
  _doCloseConversation(t);
}
// Clear & close: one action, in that order. Closing first and clearing after
// would leave a thread closed with marks still on it if the second call
// failed, which is the state the whole item exists to prevent.
function clearAndClose(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t||t.closing) return;
  t.closing=true; render();
  clearAllReviews(t, function(){ _doCloseConversation(t); });
}
function cancelCloseReview(){
  var t=ACTIVE_THREAD||ACTIVE_STAFF_THREAD;
  if(!t) return;
  t.closeReviewOpen=false; t.closing=false; render();
}
function _doCloseConversation(t){
  t.closing=true; t.closeReviewOpen=false; render();
  api({action:'setConversationClosed', data:_threadKey(t,{closed:true})}, function(e,r){
    t.closing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not close that.','e'); render(); return; }
    _refreshRosters();
    _refreshOpenThread();
  });
}

// The four fields every one of these endpoints identifies a conversation by,
// in one place — three copies of this is how two of them would end up
// disagreeing about which thread they were talking to.
function _threadKey(t, extra){
  var d={teacherToken:TOKEN, teacherId:TEACHER_ID};
  if(t===ACTIVE_STAFF_THREAD){
    // A staff thread names itself by who it is with, not by a family.
    if(t.contactType==='admin'){ d.conversationType='teacher_admin'; }
    else { d.conversationType='staff_staff'; d.staffId2=t.otherId; }
  } else {
    d.conversationType='family_teacher';
    d.familyId=t.familyId;
  }
  Object.keys(extra||{}).forEach(function(k){ d[k]=extra[k]; });
  return d;
}
function _refreshRosters(){ loadThreads(true); }   // [1.292] — one list, one call
function _refreshOpenThread(){
  if(ACTIVE_STAFF_THREAD) refreshStaffThread(); else if(ACTIVE_THREAD) refreshFamilyThread();
}

// Sends the family's latest message to the office with the teacher's own note,
// and tells the family it has happened (AC's copy, server-side).
function forwardToAdmin(){
  var t=ACTIVE_THREAD;
  if(!t||t.forwarding) return;
  var note=((document.getElementById('fwd-note')||{}).value||t.forwardNote||'').trim();
  // [1.176], AC: the validation banner belongs next to the button, not at the
  // top of the page where the eye is not.
  if(!note){ t.forwardNoteError=true; render(); return; }
  t.forwardNoteError=false;
  t.forwardNote=note;
  t.forwarding=true; render();
  api({action:'forwardToAdmin', data:{teacherToken:TOKEN, familyId:t.familyId, note:note}}, function(e,r){
    t.forwarding=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send.','e'); render(); return; }
    t.forwardOpen=false; t.forwardNote='';
    if(r.message) t.messages=t.messages.concat([r.message]);
    _shouldScrollMsgList=true;
    showMsg('Sent to admin.','s');
    render();
    loadFamilyThreads(true);
  });
}

function sendFamilyMessage(){
  var t=ACTIVE_THREAD;
  var _el=document.getElementById('family-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  var text=_composerPlain(html);
  if(!text) return;
  var notifyParents=[];
  if(!t.parent1Name || !t.parent2Name){
    // Only one parent on file — nothing to choose, notify whichever exists.
    notifyParents=undefined;
  } else {
    if(t.notifyP1) notifyParents.push('parent1');
    if(t.notifyP2) notifyParents.push('parent2');
  }
  // BACKLOG 1.124 #2. This used to cost the teacher TWO sequential Apps Script
  // round trips before their own words left the box: a sendMessage, then a full
  // refreshFamilyThread() to fetch back the message just sent. The family
  // portal has done it properly since 1.46 and this is that pattern ported --
  // append locally, post in the background, reconcile in place.
  var clientMsgId=_ktNewClientMsgId();
  var _stuId=_threadStudentId(t);   // which child (1.161 #4)
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(), studentId:_stuId, _pending:true
  };
  t.messages=t.messages.concat([pending]);
  t.draft='';
  // Stops the 5s poll delivering this same message back before the server has
  // confirmed it, which would show it twice.
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  render();

  api({action:'sendMessage', data:{conversationType:'family_teacher', familyId:t.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN, messageText:text, messageHtml:html, studentId:_stuId, notifyParents:notifyParents, clientMsgId:clientMsgId}}, function(e,r){
    if(!ACTIVE_THREAD || ACTIVE_THREAD.familyId!==t.familyId) return; // navigated away mid-flight
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      // Put it back where the teacher can see and retry it, rather than losing
      // words they watched "send".
      t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=html;
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    // Reconciled in place from the server's own row, and deliberately NO
    // render() on success: the message is already on screen exactly as it will
    // stay, and re-rendering it is the flicker this exists to remove.
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
    }
  });
}


function loadStaffDirectory(){
  STAFF_PICKER.loading=true; render();
  api({action:'getStaffDirectory', data:{teacherToken:TOKEN}}, function(e,r){
    STAFF_PICKER.loading=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not load staff.','e'); render(); return; }
    STAFF_PICKER.all=r.staff||[];
    render();
  });
}

function openStaffThread(contactType, otherId, otherName, focusReview){
  _focusReview=!!focusReview;   // [1.235]
  var reqData = contactType==='admin'
    ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
    : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:otherId, teacherToken:TOKEN};
  var _had=_cachedMessages(reqData);   // [1.291]
  ACTIVE_STAFF_THREAD = {contactType:contactType, otherId:otherId, otherName:otherName, messages:_had||[], draft:'', sending:false,
                         loading:!_had, refreshing:!!_had};
  STAFF_VIEW='thread';
  _shouldScrollMsgList=true;
  render();
  api({action:'getConversation', data:reqData}, function(e,r){
    if(!ACTIVE_STAFF_THREAD || ACTIVE_STAFF_THREAD.otherId!==otherId) return; // navigated away before this resolved
    ACTIVE_STAFF_THREAD.loading=false; ACTIVE_STAFF_THREAD.refreshing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not load messages.','e'); render(); return; }
    ACTIVE_STAFF_THREAD.messages=r.messages||[];
    THREAD_CACHE[_threadCacheKey(reqData)]=ACTIVE_STAFF_THREAD.messages;
    _applyPendingReviews(ACTIVE_STAFF_THREAD);   // [1.231]
    _shouldScrollMsgList=true; render();
    _markThreadRead(reqData);   // [1.263] — after the thread is drawn, never before
  });
}

// Manual "Refresh" — same reasoning as refreshFamilyThread() above.
function refreshStaffThread(){
  var t=ACTIVE_STAFF_THREAD;
  if(!t||t.refreshing) return;
  t.refreshing=true; render();
  var reqData = t.contactType==='admin'
    ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
    : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:t.otherId, teacherToken:TOKEN};
  api({action:'getConversation', data:reqData}, function(e,r){
    if(!ACTIVE_STAFF_THREAD||ACTIVE_STAFF_THREAD.otherId!==t.otherId) return;
    ACTIVE_STAFF_THREAD.refreshing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not refresh.','e'); render(); return; }
    ACTIVE_STAFF_THREAD.messages=r.messages||[];
    THREAD_CACHE[_threadCacheKey(reqData)]=ACTIVE_STAFF_THREAD.messages;
    _applyPendingReviews(ACTIVE_STAFF_THREAD);   // [1.231]
    _shouldScrollMsgList=true; render();
    _markThreadRead(reqData);   // [1.263]
  });
}

function rStaffThread(){
  var t=ACTIVE_STAFF_THREAD;
  var h='<div class="only-sm"><button class="btn btn-s" style="margin-bottom:1rem" onclick="STAFF_VIEW=\'list\';ACTIVE_STAFF_THREAD=null;loadStaffThreads()">← Back</button></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div class="thread-hd" style="margin-bottom:0">'+esc(t.otherName)+'</div>'+
    '<button type="button" class="lnk-btn"  onclick="refreshStaffThread()">'+(t.refreshing?'<span class="spin">↻</span>':'↻ Refresh')+'</button></div>';
  if(t.loading){
    return h+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:20px">↻</span></div>';
  }
  if(!t.messages.length){
    h+='<div class="empty-state">No messages yet — send a message to get started.</div>';
  } else {
    h+='<div class="msg-list">'+t.messages.map(rMessageBubble).join('')+'</div>';
  }
  var sendBtn=(t.sending
    ?'<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
    :'<button class="btn btn-p" onclick="sendStaffMessage()">Send</button>')+
    // Same row as the family thread, minus "Ask admin about this" — you do not
    // ask admin about a conversation you are already having with them.
    '<span style="flex:1"></span>'+
    // [1.287] — nothing sent yet, so there is nothing to close. AC: "a
    // conversation that is opened but never started should not need to be
    // closed. It should be as though it never existed."
    ((t.messages||[]).length
      ? '<button type="button" class="btn btn-s" onclick="closeConversation()">'+esc(TCH_COPY.closeConversation)+'</button>'
      : '');
  // BACKLOG 1.158 — staff messages stay in-app by default (AC, 1 Sept), with
  // the same per-message override admin has always had, for reaching someone
  // who is not watching the portal. Unchecked every time on purpose: a sticky
  // setting would quietly become "email everything".
  // Same trap as .msg-tools label above: the inline style set size and colour
  // but not text-transform, so the page-wide label rule still rendered this as
  // SMALL CAPS. Given a class so it is styled in one place with the rest.
  h+='<label class="opt-check">'+
     '<input type="checkbox" '+(t.emailToo?'checked':'')+' onchange="ACTIVE_STAFF_THREAD.emailToo=this.checked"> '+
     'Also send by email (for something that can\'t wait for the portal)</label>';
  h+=rComposer('staff-composer',t.draft,'ACTIVE_STAFF_THREAD.draft=_composerInput(this)',sendBtn);
  // [1.233] — the same dialog as the family thread. A staff conversation can
  // hold review marks too, and closing one with marks outstanding is the same
  // mistake wherever it happens.
  if(t.closeReviewOpen){
    h+='<div class="fwd-box">'+
       '<div style="margin-bottom:.55rem">'+esc(TCH_COPY.closeNeedsReview)+'</div>'+
       '<div style="display:flex;gap:8px;justify-content:flex-end">'+
         '<button class="btn btn-s" onclick="cancelCloseReview()">'+esc(TCH_COPY.cancel)+'</button>'+
         (t.closing
           ? '<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
           : '<button class="btn btn-p" onclick="clearAndClose()">'+esc(TCH_COPY.clearAndClose)+'</button>')+
       '</div></div>';
  }
  return h;
}

// ============================================================
// FORMATTING COMPOSER (BACKLOG 1.33)
// ============================================================
// Button-driven only — no typed syntax, no keyboard shortcuts to learn
// (settled with AC: teachers won't know them). Same execCommand approach
// already proven in admin's Comms toolbar, minus its colour/font/image extras.
//
// IMPORTANT: nothing in this section is a security control. _composerClean()
// below is a tidiness pass, because contenteditable emits browser-specific
// soup (div line wrappers, span style attributes, &nbsp;) and pasted content
// drags in whatever the source page had. The real boundary is _sanitizeMessageHtml_()
// in Code.js, which re-checks everything server-side and assumes this file
// could be bypassed entirely — because it can: anything can POST to sendMessage.

// Tags kept, normalized to a single spelling each so the server sees a small,
// predictable vocabulary. Everything else is unwrapped, keeping its text.
var CMP_KEEP={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote'};

// Elements whose CONTENT has to go as well, not just their tag. Everything
// else is unwrapped (tag dropped, words kept), which is right for a pasted
// span but wrong for a script element — unwrapping that would drop the tag
// and leave 'alert(1)' sitting in the message as visible text.
var CMP_DROP={SCRIPT:1,STYLE:1,NOSCRIPT:1,TEMPLATE:1,IFRAME:1,OBJECT:1,EMBED:1,HEAD:1,TITLE:1};

// Reads bold/italic/underline out of an inline style attribute. Pasted content
// carries formatting this way rather than as tags — Docs and Word both put
// bold on a <span style="font-weight:700"> — so without this, pasting loses
// every bit of emphasis. Returns null when there is no style attribute at all.
function _styleFlags(n){
  var st=(n.getAttribute&&n.getAttribute('style'))||'';
  if(!st) return null;
  st=st.toLowerCase();
  var f={};
  var fw=/font-weight\s*:\s*([a-z0-9]+)/.exec(st);
  if(fw){
    f.boldSet=true;
    f.bold=(fw[1]==='bold'||fw[1]==='bolder'||parseInt(fw[1],10)>=600);
  }
  if(/font-style\s*:\s*italic/.test(st)) f.italic=true;
  if(/text-decoration[^;]*underline/.test(st)) f.underline=true;
  return f;
}

function _composerClean(node){
  var out='';
  for(var i=0;i<node.childNodes.length;i++){
    var n=node.childNodes[i];
    if(n.nodeType===3){ out+=esc(n.nodeValue); continue; }
    if(n.nodeType!==1) continue;
    var tag=n.nodeName;
    if(CMP_DROP[tag]) continue;
    if(tag==='BR'){ out+='<br>'; continue; }
    var inner=_composerClean(n);
    if(tag==='A'){
      var href=n.getAttribute('href')||'';
      // Mirrors the server's rule so the toolbar can't silently produce a link
      // the server will then drop. The server still re-checks it.
      if(/^(https?:\/\/|mailto:)/i.test(href) && !/[\s"'<>\\]/.test(href)) out+='<a href="'+esc(href)+'">'+inner+'</a>';
      else out+=inner;
      continue;
    }
    var flags=_styleFlags(n);
    var keep=CMP_KEEP[tag];
    // An explicit font-weight:normal cancels a bold tag. Google Docs wraps its
    // ENTIRE clipboard payload in <b style="font-weight:normal">, so honouring
    // the tag over the style would make every message pasted from Docs bold.
    if(keep==='b' && flags && flags.boldSet && !flags.bold) keep=null;
    if(keep){ if(inner) out+='<'+keep+'>'+inner+'</'+keep+'>'; continue; }
    // Formatting carried as an inline style instead of a tag gets promoted to
    // the real tag, so pasted bold/italic survives.
    if(inner && flags){
      if(flags.underline) inner='<u>'+inner+'</u>';
      if(flags.italic) inner='<i>'+inner+'</i>';
      if(flags.bold) inner='<b>'+inner+'</b>';
    }
    // DIV/P are how contenteditable wraps each new line — become line breaks.
    if(tag==='DIV'||tag==='P'){ out+=(out&&!/<br>$/.test(out)?'<br>':'')+inner; continue; }
    out+=inner; // SPAN, FONT, and anything pasted in: unwrap, keep the words
  }
  return out;
}

// Only used to decide "is this message empty" before sending. The real
// plain-text copy stored on the record is derived server-side from the
// sanitized HTML, never from here — see the note on doSendMessage().
function _composerPlain(html){
  return String(html||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ')
    .replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
}

function _composerInput(el){
  // Browsers leave a stray line-break wrapper behind when the box is emptied,
  // which defeats the :empty placeholder rule. Clear it only when there is
  // genuinely nothing left — the list check keeps an empty bullet the teacher
  // just created from being wiped out from under them.
  if(!el.textContent.trim() && !el.querySelector('ul,ol,a')) el.innerHTML='';
  return _composerClean(el);
}

function _composerSync(id){
  var el=document.getElementById(id); if(!el) return;
  var v=_composerClean(el);
  if(id==='family-composer' && ACTIVE_THREAD) ACTIVE_THREAD.draft=v;
  if(id==='staff-composer' && ACTIVE_STAFF_THREAD) ACTIVE_STAFF_THREAD.draft=v;
}

function _composerCmd(id,cmd){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  // styleWithCSS(false) makes the browser emit <b> rather than
  // <span style="font-weight:bold">, which the allowlist would otherwise drop.
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand(cmd,false,null);
  _composerSync(id);
  _composerState(id);
}

// Paste keeps its formatting (AC's call, 19 Aug) — a teacher pasting a
// bulleted practice list out of Docs keeps the bullets. What survives is
// whatever _composerClean() allows, so pasted content lands in exactly the
// same shape as content typed with the toolbar.
//
// The clipboard HTML is parsed with DOMParser, never by assigning innerHTML:
// a DOMParser document is inert, so a pasted image with an onerror handler or
// a pasted script element can't run while we walk it. The server sanitizer
// still re-checks the result regardless.
function _composerPaste(ev){
  var cd=ev.clipboardData||window.clipboardData;
  if(!cd) return;
  var html='';
  try{ html=cd.getData('text/html')||''; }catch(e){}
  // No HTML flavour on the clipboard (plain-text copy, most mobile keyboards):
  // let the browser's own plain-text paste happen untouched.
  if(!html) return;
  ev.preventDefault();
  var clean='';
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    clean=_composerClean(doc.body);
  }catch(e){
    clean=esc(cd.getData('text/plain')||'');
  }
  if(clean) document.execCommand('insertHTML',false,clean);
}

// Quote toggles rather than only applying, so a teacher can get back out of a
// blockquote with the same button they used to enter one. formatBlock('div')
// is the standard way to undo it.
function _composerQuote(id){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  // Angle-bracket form: Chrome and Safari accept either, Firefox only this one.
  // Built from a variable rather than written as a bracketed literal, so the
  // tag-balance check in scripts/check.js doesn't read it as a real open tag.
  var _blk=_composerInQuote(id)?'div':'blockquote';
  document.execCommand('formatBlock',false,'<'+_blk+'>');
  _composerSync(id);
  _composerState(id);
}
// Is the caret inside <sel> and still within this composer? Used for the two
// states document.queryCommandState() cannot answer honestly.
function _composerSelIn(id,selector){
  var el=document.getElementById(id); if(!el) return false;
  var s=window.getSelection();
  if(!s || !s.anchorNode) return false;
  var n=s.anchorNode;
  var e=(n.nodeType===1)?n:n.parentElement;
  return !!(e && el.contains(e) && e.closest && e.closest(selector));
}
function _composerInQuote(id){ return _composerSelIn(id,'blockquote'); }

// ── Link row ───────────────────────────────────────────────────────────────
// The selection is saved on open because clicking into the URL input collapses
// it; without this, inserting the link would drop it wherever the caret
// happened to land rather than over the words the teacher had highlighted.
var _cmpLinkSel={};

// Open state and half-typed values live HERE, not in the DOM, because render()
// replaces #app wholesale every poll tick (5s). Left in the DOM, a teacher
// typing a URL would watch it vanish a few seconds later -- the same failure
// as 1.32 in the family portal and 1.28 here, one control further in.
// rComposerLinkRow() renders from this object, so a re-render redraws the row
// exactly as it was.
var _cmpLink={};
function _cmpLinkState(id){
  if(!_cmpLink[id]) _cmpLink[id]={open:false,url:'',text:'',bad:false};
  return _cmpLink[id];
}

function _composerLinkOpen(id){
  var row=document.getElementById(id+'-linkrow'); if(!row) return;
  var sel=window.getSelection();
  var el=document.getElementById(id);
  _cmpLinkSel[id]=(sel && sel.rangeCount && el && el.contains(sel.anchorNode))
    ? sel.getRangeAt(0).cloneRange() : null;
  var st=_cmpLinkState(id);
  st.open=true; st.url=''; st.bad=false;
  // Pre-fill the link text with whatever is selected, so highlighting a phrase
  // and pressing Link does the obvious thing.
  st.text=(sel && !sel.isCollapsed && el && el.contains(sel.anchorNode)) ? String(sel).trim() : '';
  var t=document.getElementById(id+'-linktext');
  var u=document.getElementById(id+'-linkurl');
  if(t) t.value=st.text;
  if(u){ u.value=''; u.classList.remove('bad'); u.placeholder=CMP_COPY.linkUrlPlaceholder; }
  row.classList.add('open');
  if(u) u.focus();
}

function _composerLinkClose(id){
  var row=document.getElementById(id+'-linkrow'); if(row) row.classList.remove('open');
  var st=_cmpLinkState(id);
  st.open=false; st.url=''; st.text=''; st.bad=false;
  _cmpLinkSel[id]=null;
  var el=document.getElementById(id); if(el) el.focus();
}

function _composerLinkKey(ev,id){
  if(ev.key==='Enter'){ ev.preventDefault(); _composerLinkInsert(id); }
  if(ev.key==='Escape'){ ev.preventDefault(); _composerLinkClose(id); }
}

// AC, 28 Aug: site.com, www.site.com, https://www.site.com and https://site.com
// must all work. So https:// is PREPENDED when absent rather than demanded.
// Being lenient here is safe -- this file is not the security boundary.
// _sanitizeMessageHtml_() in Code.js re-checks every href server-side and
// assumes this file was bypassed, because it can be. Strictness here buys
// nothing and costs teachers working links.
function _composerNormalizeUrl(raw){
  var u=String(raw||'').trim();
  if(!u) return '';
  if(/[\s"'<>\\]/.test(u)) return '';          // spaces or quotes: not an address
  if(/^mailto:/i.test(u)) return u;
  if(!/^https?:\/\//i.test(u)){
    // Any other scheme (javascript:, data:, file:) is refused outright rather
    // than having https:// glued in front of it.
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    u='https://'+u;
  }
  // Must have a dot somewhere in the host, or "https://notes" would pass.
  var host=u.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0];
  if(host.indexOf('.')===-1) return '';
  return u;
}

function _composerLinkInsert(id){
  var el=document.getElementById(id); if(!el) return;
  var uIn=document.getElementById(id+'-linkurl');
  var tIn=document.getElementById(id+'-linktext');
  var url=_composerNormalizeUrl(uIn?uIn.value:'');
  if(!url){
    // Corrected in place instead of thrown as a page-level toast -- the error
    // belongs next to the field that caused it.
    var stBad=_cmpLinkState(id); stBad.bad=true; stBad.url='';
    if(uIn){ uIn.classList.add('bad'); uIn.value=''; uIn.placeholder=CMP_COPY.linkRejected; uIn.focus(); }
    return;
  }
  var label=(tIn && tIn.value.trim()) || url.replace(/^https?:\/\//i,'');
  el.focus();
  var saved=_cmpLinkSel[id];
  if(saved){
    try{
      var sel=window.getSelection();
      sel.removeAllRanges(); sel.addRange(saved);
    }catch(e){}
  }
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(label)+'</a>&nbsp;');
  _composerLinkClose(id);
  _composerSync(id);
}

// ── Toolbar active state ───────────────────────────────────────────────────
// Nothing reflected back before this, so a teacher had to type a letter to
// find out whether bold was on. queryCommandState covers the inline and list
// commands; blockquote has no state to query, so it is resolved from the DOM.
var _CMP_STATE_CMDS=['bold','italic','underline','insertUnorderedList','insertOrderedList'];

function _composerState(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  _CMP_STATE_CMDS.forEach(function(c){
    var b=wrap.querySelector('[data-cmd="'+c+'"]'); if(!b) return;
    var on=false;
    try{ on=document.queryCommandState(c); }catch(e){}
    // queryCommandState('underline') is TRUE for ANY selection inside a link,
    // because a link RENDERS underlined -- verified in the browser, not
    // guessed. Left alone, the Underline button lights up on its own the
    // moment a teacher clicks into a link they just added, claiming
    // formatting they never applied. Inside a link, ask the DOM instead.
    //
    // Resolved from the selection's anchor, which covers every selection a
    // person can actually make -- a click, a drag, or Ctrl+A all anchor on a
    // text node. It does NOT cover a programmatic selectNodeContents() of the
    // whole box, where the anchor is the composer div itself and there is no
    // link ancestor to find; nothing in the UI produces that.
    if(c==='underline' && on && _composerSelIn(id,'a')) on=_composerSelIn(id,'u');
    b.classList.toggle('on',!!on);
  });
  var q=wrap.querySelector('[data-quote]');
  if(q) q.classList.toggle('on',_composerInQuote(id));
}

function _composerStateClear(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  var btns=wrap.querySelectorAll('.cmp-tb-btn.on');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
}

function _tbBtn(id,cmd,label,title){
  // onmousedown/preventDefault keeps the text selection alive when the button
  // takes the click — without it, execCommand has nothing to act on.
  // data-cmd is what _composerState() reads to light the button up.
  return '<button type="button" class="cmp-tb-btn" data-cmd="'+cmd+'" title="'+esc(title)+'" onmousedown="event.preventDefault()"'+
    ' onclick="_composerCmd(\''+id+'\',\''+cmd+'\')">'+label+'</button>';
}

// nothing it doesn't (AC, 28 Aug: "as much formatting control and function as
// possible"). Italic, underline, quote and clear-formatting were added then.

function rMessageBubble(m){
  var mine = m.senderId===TEACHER_ID;
  // messageHtml is set only when the sender used the formatting toolbar, and
  // has already been through _sanitizeMessageHtml_() server-side. Plain
  // messages (and everything sent before 1.33) keep the escaped path.
  var body = m.messageHtml
    ? m.messageHtml
    : esc(m.messageText||'').replace(/\n/g,'<br>');
  // AC, 1 Sept: an auto-response collapses to one line and opens on click.
  // Away replies repeat the same words to the same family every time; left
  // expanded they bury the actual conversation.
  // [1.189] — the office's side of this conversation, in the thread it is
  // about. AC: teachers see these inline too. Never mistakable for something
  // the family can read.
  if(m.staffOnly) return rInternalBubble(m);
  // The "seen" note (1.220) — two lines, no bubble, no button, sent by hand.
  // Checked BEFORE the auto branch: it carries isAuto so that nothing counts
  // it as a reply, but it must not collapse like an away message.
  if(m.noteKind==='seen') return rNoteLine(m);
  if(_tIsTruthy(m.isAuto)) return rAutoBubble(m,mine);
  // [1.232], AC: "Otherwise, the person doesn't know which message they
  // marked, and this will easily get lost." The white circle on the roster
  // counts them; inside the thread the only difference was a ticked checkbox,
  // which is invisible while scrolling past. The bubble itself now says so,
  // and the id is on the element so [1.235] can scroll to it.
  var saved = !!m.reviewAt;
  // [1.249] — AC: "now attach sender name on the message", and, choosing
  // between two drawn options, "2 is better": the name goes on the TIMESTAMP
  // LINE, not inside the bubble. "Xavier Tombstone · Thursday, 9/3/26 2:12 AM".
  //
  // On EVERY message, including your own. This matters beyond tidiness — a
  // family thread can carry two parents and admin, and until now only the
  // incoming bubbles named anybody at all.
  //
  // _bubbleAbout is gone with it: the child a message is about now lives in
  // the thread header, once, which is AC's rule twice over.
  return '<div class="bubble-row'+(mine?' mine':'')+'" id="msg-'+esc(m.messageId||'')+'">'+
    '<div class="bubble'+(mine?' mine':'')+(saved?' saved':'')+'">'+
    (saved?'<div class="saved-tag">'+esc(TCH_COPY.savedForReview)+'</div>':'')+
    '<div class="bubble-text">'+body+'</div>'+
    '<div class="bubble-time">'+_bubbleMeta(m)+'</div>'+
    rNotifyWarn(m)+
    rMsgTools(m,mine)+
    '</div></div>';
}
// The one meta line every human message carries: who, then when.
// [1.302], AC: "This is the format that should be included on every message —
// 'Xavier · Friday, 9/4/26 5:59 PM'". It already was — but fmtMsgTime returns
// '' for a timestamp it cannot parse, and the separator was printed before the
// time rather than between the two, so such a message rendered as "Xavier
// Tombstone ·" with a dot hanging off the end. That is what AC screenshotted.
// The separator now belongs to the pair, so a missing half takes it with it.
function _bubbleMeta(m){
  var who=String(m.senderName||'').trim();
  var when=fmtMsgTime(m.sentAt);
  return [who?esc(who):'', when?esc(when):''].filter(Boolean).join(' \u00b7 ');
}

// [1.237] — "a test parent received no email when a teacher sent them a
// message", and nothing on any screen said so. The server records what the
// notification actually did on the message row (notifyState/notifyDetail, see
// _notifyNewMessage) and this is where staff find out.
//
// AC, 3 September, on both halves of this:
//
//   THE WORDING is his — "message did not send", as a red warning banner. The
//   server's own reason sits under it in smaller text, because the whole point
//   of the item is that the cause stops being invisible; the banner is what
//   you notice and the second line is what you tell somebody.
//
//   WHO SEES IT: everyone on staff in the thread, not only the sender. It was
//   scoped to your own message on the first pass; AC widened it. A teacher can
//   see that a message admin sent their family never arrived, and admin — who
//   is the only one who can actually fix "no email address on file" — sees it
//   on a teacher's message too.
//
// Still only on a STAFF-sent message: this answers "did what we sent reach
// the family". And still only when something did NOT go out — 'sent' and
// 'queued' draw nothing, and a message with no state at all predates the
// record and says nothing rather than claiming a failure it cannot evidence.
function rNotifyWarn(m){
  if(m.senderType!=='teacher' && m.senderType!=='admin') return '';
  var st=m.notifyState||'';
  if(st!=='none' && st!=='error') return '';
  return '<div class="msg-notify-warn"><b>'+esc(TCH_COPY.notSent)+'</b>'+
    (m.notifyDetail?'<span>'+esc(m.notifyDetail)+'</span>':'')+'</div>';
}

// ── Two lines in the thread, not a message (AC, 3 September 2026) ────────
// The shape both system lines use. AC on the "seen" note: "It should be two
// lines only. The header line with sender and timestamp, and 2nd line text
// message." No bubble, no border, no button — a note saying the studio has it,
// which cannot be replied to and is not something to read past.
// AC, 3 September: the note is "auto-response: [first name] has seen your
// message..." with a timestamp. The sender's name moved INTO the sentence when
// he rewrote it, so the header keeps the timestamp and drops the name — it was
// printing the same person twice, once above the line and once inside it.
// [1.249] — TWO SYSTEM ROWS, TWO LABELS, and they are not the same kind of row
// any more. AC settled this over four passes:
//
//   away auto-reply -> "auto-reply:"      italic, side rule
//   seen note       -> "System Message:"  italic, side rule
//
// His correction is the one that mattered: "for the seen message it shouldn't
// say 'auto reply' because it's not an auto reply." It is a notification about
// a person's action, not a reply sent on their behalf, and labelling both
// "auto-reply:" — which is where this had got to a pass earlier — would have
// made the label mean two different things.
//
// "System Message:" returns capitalised for the seen note ONLY. @697 replaced
// it with lower-case "auto-response:" on both rows; AC has put it back on the
// one row where it is accurate, and his capitalisation is kept exactly as his
// lower-case was then.
//
// NEITHER carries a sender name: the meta line is the timestamp alone. That is
// @697's rule and it removes the double-labelling flagged on two separate
// passes — the sender moved into the sentence when AC rewrote it.
var NOTE_LABEL_SEEN='System Message:';
var NOTE_LABEL_AUTO='auto-reply:';
function rNoteLine(m){
  return _rNote(NOTE_LABEL_SEEN, m.sentAt, m.messageText);
}
function _rNote(label, at, text){
  return '<div class="note-line">'+
    '<div class="note-head">'+esc(fmtMsgTime(at))+'</div>'+
    '<div class="note-body"><span class="note-label">'+esc(label)+'</span>'+
      esc(text||'')+'</div>'+
    '</div>';
}

// The record of who closed a conversation, in the same shape. AC: "The admin
// should have a record of who closed the conversation on the message when
// closed in the message thread: one line like read receipt." Drawn from the
// row's own closedAt/closedByName rather than written as a message, so closing
// never adds anything to what a family is sent — this line is staff-only.
function rClosedLine(closedAt, closedByName){
  if(!closedAt) return '';
  return '<div class="note-line">'+
    '<div class="note-body">'+esc(closedByName||'Someone')+' closed this conversation'+
      ' <span class="note-when">· '+esc(fmtMsgTime(closedAt))+'</span></div>'+
    '</div>';
}

// ── Per-message controls (AC, 3 September 2026) ──────────────────────────
// The only things anyone marks by hand, and both are private to this teacher.
// "Save for review" replaces mark-unread: it points at the message rather than
// the thread, it survives being read, and it is what puts the white circle on
// the roster row. "Mark seen" sends the two-line note above — a deliberate act,
// never automatic, and it does NOT stop the clock: the conversation goes on
// ageing and stays where it is until a real reply is sent. Being seen is not
// being answered.
function rMsgTools(m, mine){
  var saved = !!m.reviewAt;
  var h = '<div class="msg-tools">'+
    '<label class="rev-check'+(saved?' on':'')+'"><input type="checkbox"'+(saved?' checked':'')+
      ' onclick="event.stopPropagation();toggleReview(\''+esc(m.messageId)+'\',this.checked)"> '+
      // AC, 3 Sept (second pass): the label follows its state.
      esc(saved?TCH_COPY.savedForReview:TCH_COPY.saveForReview)+'</label>';
  // Only on a message someone else sent: marking your own message "seen" says
  // nothing to anybody.
  if(!mine){
    h += '<span class="msg-tools-sep">·</span>'+
      '<button type="button" class="lnk-btn" onclick="event.stopPropagation();markSeen()">'+
      esc(TCH_COPY.markSeen)+'</button>';
  }
  return h+'</div>';
}

// [1.189]. The teacher asked the office a question about this family; the
// answer belongs beside the question, not in another screen. Replying here
// writes the same teacher_admin row the staff thread is built from, so the
// history stays in one place — AC: "logged in the separate teacher to admin
// pathway".
var INTERNAL={replyTo:'', draft:'', sending:false};
function rInternalBubble(m){
  var open=INTERNAL.replyTo===m.messageId;
  var body=m.messageHtml?m.messageHtml:esc(m.messageText||'').replace(/\n/g,'<br>');
  var h='<div class="bubble-row"><div class="bubble internal">'+
    '<div class="internal-tag">'+esc(CMP_COPY.internal)+'</div>'+

    '<div class="bubble-text">'+body+'</div>'+
    '<div class="bubble-time">'+_bubbleMeta(m)+'</div>'+
    '<button type="button" class="btn btn-s" style="margin-top:.45rem" '+
      'onclick="internalReply(\''+esc(m.messageId)+'\')">'+esc(CMP_COPY.internalReply)+'</button>';
  if(open){
    h+='<div style="margin-top:.5rem;display:flex;flex-direction:column;gap:6px">'+
      '<textarea id="tch-internal" rows="3" placeholder="'+esc(CMP_COPY.internalPh)+'" '+
        'oninput="INTERNAL.draft=this.value">'+esc(INTERNAL.draft||'')+'</textarea>'+
      '<div style="display:flex;gap:6px">'+
        (INTERNAL.sending
          ?'<button class="btn btn-p" disabled><span class="spin">↻</span></button>'
          :'<button class="btn btn-p" onclick="sendInternal()">Send</button>')+
        '<button class="btn btn-s" onclick="internalReply(\'\')">Cancel</button>'+
      '</div></div>';
  }
  return h+'</div></div>';
}
function internalReply(messageId){
  INTERNAL.replyTo=messageId||'';
  if(!messageId) INTERNAL.draft='';
  render();
}
function sendInternal(){
  var t=ACTIVE_THREAD; if(!t) return;
  var el=document.getElementById('tch-internal');
  var text=((el?el.value:INTERNAL.draft)||'').trim();
  if(!text) return;
  INTERNAL.sending=true;render();
  api({action:'sendMessage', data:{conversationType:'teacher_admin', teacherId:TEACHER_ID,
       teacherToken:TOKEN, aboutFamilyId:t.familyId, messageText:text}}, function(e,r){
    INTERNAL.sending=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send','e'); render(); return; }
    INTERNAL.draft='';INTERNAL.replyTo='';
    refreshFamilyThread();
    render();
  });
}

// [1.249] — the away auto-reply is now the SAME two-line shape as the seen
// note, with its own label. It used to be a collapsed bubble opened by
// clicking (AC, 1 Sept: an auto-response "collapses to one line and opens on
// click"), which existed because a full repeated bubble buried the
// conversation. As an italic, side-ruled, labelled note it no longer does, and
// a collapsed row that shows the label and the timestamp but not the sentence
// is a worse answer than simply showing the two lines. The collapse is
// therefore gone rather than restyled — worth one word from AC if he wants it
// back.
//
// Consecutive system rows are NOT grouped, deliberately. Three writers append
// them independently and none knows about the others: the away auto-reply, the
// seen note, and the daily nudge into teacher_admin. The stack of three in
// AC's Fig-03 is three NUDGES, and those stop existing in this same release
// when staff threads leave the overdue machinery ([1.242]). Grouping would be
// machinery for a problem the release already removes. If they still stack
// afterwards it is a real item then, raised on evidence.
function rAutoBubble(m,mine){
  return _rNote(NOTE_LABEL_AUTO, m.sentAt, m.messageText);
}

// [1.249] — _bubbleAbout() was here and is gone. It put the child's name on
// the BUBBLE, which is the exact instance AC ruled out twice: "Don't have the
// child info on the message. It's in the header only." rThreadKids() above is
// where it lives now, once per conversation instead of once per message.

function sendStaffMessage(){
  var t=ACTIVE_STAFF_THREAD;
  var _el=document.getElementById('staff-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  var text=_composerPlain(html);
  if(!text) return;
  var reqData = t.contactType==='admin'
    ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN, messageText:text, messageHtml:html}
    : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:t.otherId, teacherToken:TOKEN, messageText:text, messageHtml:html};
  // BACKLOG 1.158 — the sender's own per-message email override, read here
  // and cleared below so the next message starts unchecked again.
  if(t.emailToo) reqData.notifyByEmail=true;
  // Same optimistic path as sendFamilyMessage() above (BACKLOG 1.124 #2).
  var clientMsgId=_ktNewClientMsgId();
  reqData.clientMsgId=clientMsgId;
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(), _pending:true
  };
  t.messages=t.messages.concat([pending]);
  t.draft='';
  t.emailToo=false;
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  render();

  api({action:'sendMessage', data:reqData}, function(e,r){
    if(!ACTIVE_STAFF_THREAD || ACTIVE_STAFF_THREAD.otherId!==t.otherId) return;
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=html;
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
    }
  });
}

// Polls every 5s for new activity: the active thread's list (family or
// staff, whichever tab is open) plus whichever conversation is currently
// expanded, via the lock-free doGetMessagesSince() so this never trips the
// shared save-lock or marks anything read on its own (see the matching
// comment in Code.js). Paused while the tab isn't visible.
function _startMessagePolling(){
  if(_pollTimer) return;
  _pollTimer=setInterval(_pollTick,5000);
  // Coming back to the tab refreshes at once rather than waiting out the rest
  // of the interval (AC, 1 Sept: "can the tool load new messages upon login so
  // I can access right away?"). Polling pauses while hidden, so without this
  // the worst case is a full 5 seconds of stale screen at exactly the moment
  // someone is looking. Cheap now that a poll with nothing to report never
  // touches the messages sheet (1.159).
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') _pollTick();
  });
  window.addEventListener('focus',_pollTick);
}
// ── [1.293] — the poll fits inside its own interval ─────────────────────
//
// It ran every five seconds and made up to THREE requests: the family roster,
// the staff roster, and the open thread. At the ~2s fixed cost measured in
// [1.263], three sequential requests do not fit in five seconds — so they
// overlapped, and a slow answer could land on top of a newer one. Seven
// teachers on the 22nd is four requests a second against one script with a
// shared lock.
//
// [1.292] took the two rosters down to one. This adds the other half: a tick
// that finds the previous request still in flight SKIPS rather than queueing
// behind it — see THREADS._inFlight in loadThreads and _thrPollBusy below.
// Skipping is right rather than merely cheap: the answer that is already on
// its way is newer than the one this tick would have asked for.
var _thrPollBusy=false;
function _pollTick(){
  if(document.hidden || !TOKEN) return;
  if(HOME_TAB==='family'){
    // BACKLOG 1.124 #1. This was gated on FAMILY_VIEW==='list', which was
    // right while a thread REPLACED the roster and wrong the moment @650 put
    // both panes on screen: unread badges and previews froze for as long as a
    // conversation stayed open. Polled in both views now — the fetch is the
    // same one, and it is what also delivers the messaging lock flag.
    loadThreads(true);   // [1.292] — one roster, and it guards itself
    if(!_thrPollBusy && FAMILY_VIEW==='thread' && ACTIVE_THREAD && !ACTIVE_THREAD.loading && !ACTIVE_THREAD._sendInFlight){
      var ft=ACTIVE_THREAD;
      _thrPollBusy=true;
      api({action:'getMessagesSince', data:{conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN, sinceSentAt:String(_maxSentAt(ft.messages)||0)}}, function(e,r){
        _thrPollBusy=false;
        if(!ACTIVE_THREAD||ACTIVE_THREAD.familyId!==ft.familyId) return;
        if(e||!r||!r.ok||!r.messages||!r.messages.length) return;
        // Second guard, independent of _sendInFlight: drop anything already
        // held by id. Duplicated messages are the failure this path has to
        // avoid, and one filter covers every route to it.
        var _have={};
        ACTIVE_THREAD.messages.forEach(function(m){ if(m.messageId) _have[m.messageId]=true; });
        var _fresh=r.messages.filter(function(m){ return !m.messageId || !_have[m.messageId]; });
        if(!_fresh.length) return;
        ACTIVE_THREAD.messages=ACTIVE_THREAD.messages.concat(_fresh);
        THREAD_CACHE[_threadCacheKey({conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID})]=ACTIVE_THREAD.messages;
        _shouldScrollMsgList=true; render();
        // [1.263] — a message that ARRIVES while you are looking at the thread
        // has been read as surely as one that was there when you opened it.
        // The old shape only ever stamped on open, so anything delivered by
        // the poll stayed unread until the thread was opened again.
        _markThreadRead({conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN});
      });
    }
  } else {
    loadThreads(true);   // [1.292] — the same one roster, in either view
    if(!_thrPollBusy && STAFF_VIEW==='thread' && ACTIVE_STAFF_THREAD && !ACTIVE_STAFF_THREAD.loading && !ACTIVE_STAFF_THREAD._sendInFlight){
      var st=ACTIVE_STAFF_THREAD;
      _thrPollBusy=true;
      var reqData=st.contactType==='admin'
        ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
        : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:st.otherId, teacherToken:TOKEN};
      reqData.sinceSentAt=String(_maxSentAt(st.messages)||0);
      api({action:'getMessagesSince', data:reqData}, function(e,r){
        _thrPollBusy=false;
        if(!ACTIVE_STAFF_THREAD||ACTIVE_STAFF_THREAD.otherId!==st.otherId) return;
        if(e||!r||!r.ok||!r.messages||!r.messages.length) return;
        // Second guard, independent of _sendInFlight: drop anything already
        // held by id. Duplicated messages are the failure this path has to
        // avoid, and one filter covers every route to it.
        var _have={};
        ACTIVE_STAFF_THREAD.messages.forEach(function(m){ if(m.messageId) _have[m.messageId]=true; });
        var _fresh=r.messages.filter(function(m){ return !m.messageId || !_have[m.messageId]; });
        if(!_fresh.length) return;
        ACTIVE_STAFF_THREAD.messages=ACTIVE_STAFF_THREAD.messages.concat(_fresh);
        THREAD_CACHE[_threadCacheKey(reqData)]=ACTIVE_STAFF_THREAD.messages;
        _shouldScrollMsgList=true; render();
        _markThreadRead({conversationType:reqData.conversationType, teacherId:TEACHER_ID, staffId2:reqData.staffId2, teacherToken:TOKEN});   // [1.263]
      });
    }
  }
}

function doSignOut(){
  _ktClearSession();
  if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; }
  TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
  LF={email:'', password:'', remember:true};
  HOME_TAB='family';
  STAFF_VIEW='list';
  THREADS={loading:false, list:[], _sig:'', locked:false};   // [1.292]
  STAFF_PICKER={loading:false, query:'', all:[]};
  ACTIVE_STAFF_THREAD=null;
  FAMILY_VIEW='list';

  ACTIVE_THREAD=null;
  PAGE='login'; render();
}

// ============================================================
// INIT
// ============================================================
function boot(){
  var resetTokenFromUrl = '';
  var loginTokenFromUrl = '';
  try {
    var params = new URLSearchParams(window.location.search);
    resetTokenFromUrl = params.get('resetToken') || '';
    loginTokenFromUrl = params.get('token') || '';
    // BACKLOG 1.124 #3 — the notification email now names the conversation
    // it is about, so a teacher lands on the message rather than the roster.
    // Consumed once, by loadFamilyThreads(), which is the first point the
    // family's name is known.
    _pendingOpenFamilyId = params.get('openFamilyId') || '';
  } catch(e) { /* URLSearchParams unsupported — treat as no token */ }

  if(loginTokenFromUrl){
    // Magic link from a do-not-reply notification email — a fully valid
    // teacher session token already, minted server-side the same way a
    // normal login does (_mintTeacherMagicLink in Code.js). Mirrors the
    // family portal's identical ?token= handling in boot().
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal */ }
    TOKEN = loginTokenFromUrl;
    _ktSaveSession(TOKEN, '', '');
    // Falls through to the remembered-session block below, which re-reads
    // what was just saved and validates it via teacherCheckSession — same
    // reasoning as the family portal: an invalid/expired token drops back
    // to login with a clear message instead of a populated-looking shell.
  }

  if(resetTokenFromUrl){
    // Strip the token out of the address bar immediately — single-use,
    // short-lived credential, never something to bookmark. Mirrors the
    // family portal's identical boot()-time handling.
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal */ }

    RESET_TOKEN = resetTokenFromUrl;
    PAGE = 'setpw';
    SPW.checking = true;
    render();
    api({action:'teacherValidateResetToken', data:{resetToken:resetTokenFromUrl}}, function(e2,r2){
      SPW.checking = false;
      if(e2||!r2||!r2.ok){
        SPW.invalid = true;
        SPW.email = (r2&&r2.email)||'';
      } else {
        SPW.email = r2.email||'';
      }
      render();
    });
    return;
  }

  var saved = _ktReadSession();
  if(saved && saved.token){
    TOKEN = saved.token;
    api({action:'teacherCheckSession', data:{teacherToken:saved.token}}, function(e,r){
      // [1.181] — a failed REQUEST is not an invalid LOGIN. This used to treat
      // them the same and delete the saved session, so a dropped connection,
      // a phone waking on bad wifi, or an Apps Script hiccup logged the
      // teacher out permanently. It is also what emptied every remembered
      // login during the 1 Sept outage. Only the server saying so clears it.
      if(e||!r){ _ktBootRetry(saved); return; }
      if(r.ok){
        TEACHER_ID = r.teacherId;
        TEACHER_NAME = r.teacherName||'';
        _ktSaveSession(TOKEN, TEACHER_ID, TEACHER_NAME);
        PAGE = 'home';
        render();
        loadFamilyThreads();
        // Both rosters, not just the visible one — otherwise the staff badge
        // reads zero on every return visit until the tab is opened, which is
        // 1.161 #1 all over again. Missed on this path when that was fixed.
        loadStaffThreads(true);
        _startMessagePolling();
        loadTeacherSettings();
      } else {
        _ktClearSession();
        TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
        PAGE = 'login';
        render();
      }
    });
    return;
  }

  PAGE = 'login';
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  boot();
});
</script>
