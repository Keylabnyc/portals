// Two panes on desktop, one view at a time on a phone -- from the SAME render
// functions. Nothing about rFamilyThreadList() or rFamilyThread() changes; the
// difference is entirely which of the two panes CSS shows. That is deliberate:
// a second set of render functions for desktop would be two things to keep in
// step, which is how the pricing bug in 1.120 happened one tab over.
// A teacher shown a dead composer with no explanation files a bug, so the
// lock says the same thing to them that it says to families (AC, 28 Aug).
// Staff Messages is deliberately untouched -- teachers can still reach each
// other and admin throughout.
function rMessagingLocked(){
  var m=String(MSG_LOCK.msg||'').trim();
  return '<div class="card" style="text-align:center">'+
    '<div style="font-size:24px;line-height:1;margin-bottom:.6rem">\u{1f6e0}\u{fe0f}</div>'+
    '<div class="thread-hd" style="margin-bottom:.5rem">Messaging is paused</div>'+
    '<div style="font-size:13px;color:var(--text3);white-space:pre-wrap">'+
      (m?esc(m):'Family messaging is switched off at the moment. Staff messages still work as normal.')+
    '</div></div>';
}

// ══ The teacher's messages, one scrolling page (AC, 3 September 2026) ══════
//
// Four sections, in the order a teacher has to do something about them:
//
//   New Messages          everything owed — unread OR read-but-unanswered.
//   Marked for review     read, nothing new on it, saved by this teacher.
//   Closed Conversations  everything else, split Families / Admin & staff.
//
// THE TOP SECTION IS NOT SPLIT BY WHO WROTE, and that is deliberate — flagged
// to AC rather than slipped in. It is the one place a teacher answers "what do
// I owe?", and splitting it into family and admin means an overdue parent
// message and an overdue admin message sit in two places with neither visible
// at a glance. AC's teacher/admin split lives in the two browsing areas below,
// where you are looking for a person rather than reacting to something.
//
// The section names are AC's own words. "New Messages" holds read-but-
// unanswered conversations too, which makes it slightly wider than its name —
// recorded here because it is his call and should not be "fixed" by someone
// later reading the name literally.
var CLOSED_OPEN = false;   // AC's browsing areas start collapsed — see below.
// KIDS_OPEN was removed by [1.409], 8 September 2026 — AC: "Remove the 'lesson
// phases and details' from the teacher portal … Just list everything." There is
// no collapsed state left to hold. Admin keeps its own; his instruction named
// this portal.


// [1.231], AC: "Save optimistically and process on the back end... like with
// all other buttons and saving functions in the tool."
//
// The tick already flipped instantly; the white circle on the ROW did not,
// because its number came from the roster payload and the roster is only
// re-read after the write comes back. So the visible half of the action
// lagged by a round trip, which is what makes a control feel broken.
//
// The fix is not a pending-delta ledger reconciled against the server — that
// is the race [1.46] and [1.124 #2] each had to solve for sending, and it is
// only necessary when the client cannot know the answer. Here it can: an open
// conversation holds ALL of its messages, and this client has already applied
// the tick to them. So the open conversation's count is counted from the
// messages on screen, and every other row keeps the server's number, which is
// the only one it has. Nothing to reconcile and nothing a landing poll can
// undo, because the number is derived rather than stored.
function _reviewCountFor(kind, id, serverN){
  var t = (kind==='family') ? ACTIVE_THREAD : ACTIVE_STAFF_THREAD;
  var open = t && !t.loading &&
    (kind==='family' ? t.familyId===id
                     : (kind==='admin' ? t.contactType==='admin' : t.otherId===id));
  if(!open) return Number(serverN)||0;
  var n=0;
  (t.messages||[]).forEach(function(m){ if(m.reviewAt) n++; });
  return n;
}

// One shape for both kinds of conversation, so a section can hold either.
function _msgRows(){
  // [1.292] — the server already returns this shape, so this is now a thin
  // pass that adds only the two things the CLIENT knows and the server does
  // not: the review count including ticks not yet confirmed, and the preview
  // suppressed on a row with no messages.
  return (THREADS.list||[]).map(function(t){
    return {kind:t.kind, id:t.id, row:t, name:t.name||'',
      unread:Number(t.unread)||0,
      // [1.304] — what the blue badge counts: messages still owed a reply.
      // `unread` goes to zero the moment the thread is OPENED, which is
      // exactly when a reply is still owed and the count matters most.
      awaiting:Number(t.awaitingReply)||0,
      review:_reviewCountFor(t.kind, t.id, t.reviewCount),
      waitingSince:Number(t.waitingSince)||0, replyDueBy:Number(t.replyDueBy)||0,
      closed:!!t.closed, at:Number(t.lastMessageAt)||0,
      preview:t.hasMessages?(t.lastMessageText||''):'',
      sender:t.lastSenderName||'',
      hasMessages:!!t.hasMessages};
  });
}

// Which section a conversation belongs to. A conversation is in exactly one.
//
// AC, 3 Sept: "when a new message arrives, the thread should bump up back to
// the new messages area and not be stuck in a stale area", and "marked for
// review is strictly for read messages that don't have new messages". Both
// fall out of the order of these tests rather than needing a rule of their
// own: anything owed is caught first, so a review-marked thread that receives
// a new message leaves the review area by itself and carries both circles at
// the top.
// Is this row the conversation currently on screen? Asked by _sectionOf so a
// contact being written to for the first time appears in the live list rather
// than nowhere.
function _isOpenRow(r){
  if(!r) return false;
  if(r.kind==='family') return FAMILY_VIEW==='thread' && !!ACTIVE_THREAD && ACTIVE_THREAD.familyId===r.id;
  if(!ACTIVE_STAFF_THREAD || STAFF_VIEW!=='thread') return false;
  if(r.kind==='admin') return ACTIVE_STAFF_THREAD.contactType==='admin';
  return ACTIVE_STAFF_THREAD.otherId===r.id;
}
function _sectionOf(r){
  // AC, 3 September, settling what a reply does and does not do: a
  // conversation you have answered but not closed "sits in the new messages
  // area". Replying is not closing — you decide when something is finished —
  // so an answered conversation stays where you can see it, with the Close
  // conversation button in the slot the circle has vacated.
  //
  // This is the correction to a real mistake: when the two browsing areas were
  // put under a "Closed Conversations" separator, replying still closed a
  // conversation automatically, so everything down there genuinely was closed.
  // AC then reversed auto-close and the section rule was not carried over, so
  // answered-but-open conversations were filed under a heading that said they
  // were closed. Now only closed ones are, and the heading is true again.
  if(r.closed) return 'closed';
  // ── [1.283] — the conversation that is OPEN always has a row ────────────
  //
  // AC, testing @712: "teacher can't click on a family to compose a message.
  // Search works, but family card doesn't appear in the message list on the
  // left and there is no way to assign a recipient."
  //
  // THIS IS A REGRESSION [1.273] CAUSED, and the mechanism was never broken —
  // running the page shows the search dropdown offering the family and its
  // handler opening the thread correctly. What broke is that the dropdown is
  // transient: clearMsgSearch() closes it the moment it is used, and after
  // that the LEFT LIST has no row for a family with no messages, because
  // [1.273] stopped drawing those. So the right pane sits open on somebody the
  // left pane says nothing about, and nothing on screen names a recipient.
  //
  // The rule that was missing is this one line: a list that does not contain
  // what is open beside it is the two halves of the screen disagreeing about
  // what exists — the same class of fault as [1.272]'s rows stating things
  // that were not true.
  //
  // It also answers "no way to assign a recipient" without a recipient field:
  // the row names them, and so does the thread header ([1.275]).
  if(!r.hasMessages && _isOpenRow(r)) return 'new';
  // [1.244]/[1.260] — a contact you have never written to is not a conversation
  // at all, and it is not a CLOSED one either. It used to return 'closed' here,
  // which put a teacher's entire browsable roster — every family they had never
  // messaged, and every staff contact — under a heading reading "Closed
  // Conversations". [1.244] logged that on 3 September ("Fourteen families the
  // teacher has never written to are being described as closed conversations")
  // and it was skipped; AC then hit it from the other direction: "Options to
  // see a staff list has disappeared... There is no way for a teacher to
  // message admin."
  //
  // It has its own bucket now, and Closed means closed.
  if(!r.hasMessages) return 'contacts';
  // [1.306] — the review SECTION is gone from this portal (AC: "Teacher's
  // don't need a marked for review section. They can just see the white circle
  // with the blue number, right?"), so nothing is filed there any more. The
  // mark itself and its badge are untouched; only the bucket is.

  return 'new';
}

// Unread first, then whoever has been waiting longest. Within the browsing
// areas, most recent first — there is no urgency there to sort by.
function _sortNew(a,b){
  if((a.unread>0)!==(b.unread>0)) return a.unread>0?-1:1;
  if(a.waitingSince&&b.waitingSince) return a.waitingSince-b.waitingSince;
  if(a.waitingSince) return -1;
  if(b.waitingSince) return 1;
  return b.at-a.at;
}

// ── [1.382] — the lock takes FAMILY messaging away, not the whole page ──
//
// This returned rMessagingLocked() for the entire Messages page, which took
// Staff Messages with it — while the words on that very card read "Family
// messaging is switched off at the moment. Staff messages still work as
// normal." They do: the server scopes the lock to family_teacher deliberately,
// so teacher↔admin and staff↔staff carry on working throughout. The teacher
// simply could not reach them, and a lock is exactly the moment a teacher
// needs to ask the office what is going on.
//
// So the card takes the place of the FAMILY half only, and the roster's family
// rows go with it — for the reason the family portal gives for the same
// decision (BACKLOG 1.136): a list of people you cannot write to invites
// precisely the click that then does nothing. Admin and every staff contact
// stay exactly where they were.
function rMessagesPage(){
  // Locked and looking at a family thread: there is nothing to look at. Put
  // the teacher back on the staff side rather than drawing a dead pane.
  // Through _openPane, never by assigning the flag: the two view flags have
  // exactly one setter and a second assignment anywhere is how the
  // both-panes-claim-the-screen bug comes back. The check suite pins that.
  if(MSG_LOCK.locked && FAMILY_VIEW==='thread') _openPane('');
  var showThread = FAMILY_VIEW==='thread' || STAFF_VIEW==='thread';
  var thread = STAFF_VIEW==='thread' ? rStaffThread()
             : FAMILY_VIEW==='thread' ? rFamilyThread()
             : '<div class="pane-empty">Choose a conversation to open it.</div>';
  // The notice sits ABOVE the roster, which now holds only Admin and staff —
  // see rSectionedRoster.
  var roster = MSG_LOCK.locked
    ? rMessagingLocked()+rSectionedRoster()
    : rSectionedRoster();
  return '<div class="panes">'+
    '<div class="pane'+(showThread?' only-lg':'')+'">'+roster+'</div>'+
    '<div class="pane'+(showThread?'':' only-lg')+'">'+thread+'</div>'+
  '</div>';
}

function rSectionedRoster(){
  // [1.261] — the "+ New Conversation" button that was here is gone. AC on
  // admin's copy of it: "a waste of time. Click and it takes several seconds
  // to load a list that can easily be accessed via search on the main message
  // page." The same is true here, and more so: this roster already lists every
  // family the teacher teaches ([1.172]) and now every staff contact and Admin
  // ([1.260]), so a second screen offered nothing the search below does not.
  var h=rMsgSearch();
  if(FAMILY_THREADS.loading && !FAMILY_THREADS.list.length){
    return h+'<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:20px">↻</span></div>';
  }
  var all=_msgRows();
  // ── [1.382] — while messaging is locked, the family rows go ─────────────
  //
  // The notice above this roster says family messaging is off and staff
  // messaging is not, and the list has to agree with it. Leaving the family
  // rows in place would mean a row that opens nothing: the thread pane refuses
  // to draw a family conversation while locked, so the click lands and the
  // screen does not move — which is the dead click BACKLOG 1.136 removed from
  // the family portal for the same reason. The teacher keeps Admin and every
  // staff contact, which is the whole point of the fix.
  if(MSG_LOCK.locked) all=all.filter(function(r){ return r.kind!=='family'; });
  // A search narrows the whole page rather than one section of it, so a
  // parent is found without knowing which section they ended up in.
  if(MSG_SEARCH.query){
    var hits=_searchHits();
    all=all.filter(function(r){ return hits.indexOf(r.kind+':'+r.id)!==-1; });
  }
  var news=all.filter(function(r){return _sectionOf(r)==='new';}).sort(_sortNew);
  // [1.306], AC: "Teacher's don't need a marked for review section. They can
  // just see the white circle with the blue number, right? The messages don't
  // go down to that section when marked anyways, so we can just get rid of
  // that section on the teacher portal." Right on both counts — a conversation
  // with an unanswered message stays in Messages by design ([1.253]: anything
  // owed is caught first), so the section only ever held answered threads with
  // a mark on them, which the badge already says. The MARK itself is
  // untouched: it is on the message, and the row's outline badge counts it.
  var revs=[];
  // [1.244]/[1.260] — two different things that used to share one bucket.
  // "Contacts" is everybody you have never written to; "Closed" is a
  // conversation somebody deliberately finished. A browsing list has no
  // urgency to sort by, so contacts go alphabetically and closed by recency.
  var mates=all.filter(function(r){return _sectionOf(r)==='contacts';})
    .sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); });
  var shut=all.filter(function(r){return _sectionOf(r)==='closed';}).sort(function(a,b){return b.at-a.at;});
  // [1.273] — families with no conversation are no longer listed anywhere;
  // only the staff contacts are. See the note below the staff section.
  var staff=mates.filter(function(r){return r.kind!=='family';});

  // [1.373] — what this teacher has scheduled, above the conversations,
  // because it is the thing they came back to check. Absent entirely when
  // there is nothing scheduled: this is NOT the hidden-section fault AC named
  // below. That rule is about a SECTION of the conversation list appearing and
  // disappearing under someone learning the page. This is a message the
  // teacher wrote themselves an hour ago and knows is there — and a permanent
  // "Scheduled (0)" would be a control that never does anything for anyone who
  // does not use the feature.
  h+=rScheduledLine();
  h+=rZone(TCH_COPY.sectionNew, news.length)+
     (news.length?'<div class="thread-list">'+news.map(rConvRow).join('')+'</div>'
                 :'<div class="zone-empty">Nothing waiting on you.</div>');
  // AC, 3 September (after seeing it live): "i don't like hidden areas that
  // only appear when they have a message in them like messages for review.
  // Show all areas all the time. Messages, parent / teacher conversations,
  // saved for review, closed conversations. Otherwise, it's confusing and
  // changes all the time."
  //
  // This is [1.178]'s rule applied to a SECTION rather than to a marker, and
  // it is the same mistake in a different place: a heading that appears only
  // when something is wrong means the page you learn is never the page you
  // get. Empty is a state, and it says "nothing here" rather than not existing.
  // [1.306] — no Marked for review section here. See _sectionOf.

  // [1.260] — AC's two browsing areas are out from under "Closed
  // Conversations" and are their own always-visible sections. They were nested
  // inside it because _sectionOf() filed anything with no messages as closed,
  // so "Admin & staff" only existed if a teacher expanded a heading that said
  // those conversations were finished. AC: "Options to see a staff list has
  // disappeared in teacher portal. There is no way for a teacher to message
  // admin."
  //
  // Admin & staff comes FIRST of the two: it is short, it is the same for
  // every teacher, and it holds the one contact a teacher needs when they do
  // not know who else to ask. Families can be twenty-four rows.
  h+=rZone(TCH_COPY.sectionStaff, staff.length)+
     (staff.length?'<div class="thread-list">'+staff.map(rConvRow).join('')+'</div>'
                  :'<div class="zone-empty">Nobody to show.</div>');
  // ── [1.273] — no list of every family here either ───────────────────────
  //
  // AC, 4 September, after the same fix landed on the admin screen: "Teachers
  // may not know the name of the parent, but getting rid of the full list is
  // good there also. A teacher should be able to search by student or parent,
  // and either parent if two parents."
  //
  // So families a teacher has never written to appear only once something is
  // typed, exactly as on the admin screen — and the search already matches
  // BOTH parents and every student, which is what makes removing the list safe
  // here: a teacher who only knows the child can still find the family.
  //
  // ADMIN & STAFF ABOVE IS DELIBERATELY NOT TREATED THIS WAY. It is short, it
  // is the same for every teacher, and AC asked for it by name on 3 September
  // — "Options to see a staff list has disappeared in teacher portal. There is
  // no way for a teacher to message admin." A teacher who does not know who to
  // ask needs to SEE that list, not guess a name into a search box.
  // ── [1.273] — no list of every family here either ───────────────────────
  //
  // AC, 4 September, after the same fix landed on the admin screen: "Teachers
  // may not know the name of the parent, but getting rid of the full list is
  // good there also. A teacher should be able to search by student or parent,
  // and either parent if two parents."
  //
  // Families a teacher has never written to are drawn NOWHERE now. Not gated
  // behind a query, not moved — gone. The search box at the top of this pane
  // already offers every family by EITHER parent's name and every student by
  // their own (_searchNames), and clicking a result opens the thread. A second
  // list below it would have put the same names on screen twice.
  //
  // ADMIN & STAFF ABOVE IS DELIBERATELY KEPT. It is short, identical for every
  // teacher, and AC asked for it by name on 3 September — "Options to see a
  // staff list has disappeared in teacher portal. There is no way for a
  // teacher to message admin." Somebody who does not know who to ask has to
  // SEE that list, not guess a name into a search box.
  // Closed now holds only what is actually closed, so the heading is true.
  // Still collapsed to start and still carrying its count while collapsed —
  // it says what it holds rather than looking empty ([1.178]).
  h+='<div class="sep" onclick="CLOSED_OPEN=!CLOSED_OPEN;render()">'+
     '<span class="caret">'+(CLOSED_OPEN?'▾':'▸')+'</span>'+esc(TCH_COPY.sectionClosed)+
     '<span class="sepc">'+shut.length+'</span></div>';
  if(CLOSED_OPEN){
    h+=(shut.length?'<div class="thread-list">'+shut.map(rConvRow).join('')+'</div>'
                   :'<div class="zone-empty">Nothing closed.</div>');
  }
  return h;
}

// The search itself. One input and a list under it — every family and every
// student this teacher has, matched on either, so typing "Charlie" and typing
// "Ragsdale" land in the same conversation. It reaches every section,
// including the closed ones, so finding a parent never depends on knowing
// where they ended up.
//
// ON NOT GOING JUMPY, which AC asked for specifically: this page repaints on
// every poll that finds something new, and a field inside a repaint loses
// whatever is half-typed in it — the same root as [1.193]'s "why does the
// cursor time out?" and [1.221]'s snapping composer. render() already restores
// the caret for any text input BY TYPE rather than by name ([1.193]), which is
// what makes this safe; there is a check that the rule still covers it.
function rMsgSearch(){
  var q=MSG_SEARCH.query||'';
  var h='<div class="msg-search">'+
    '<input id="msg-search" type="text" autocomplete="off" placeholder="'+esc(TCH_COPY.searchPlaceholder)+'" '+
      'value="'+esc(q)+'" oninput="onMsgSearch(this.value)" onfocus="MSG_SEARCH.open=true;render()">';
  if(q){
    h+='<button type="button" class="lnk-btn msg-search-x" onclick="clearMsgSearch()" '+
       'aria-label="Clear search">✕</button>';
  }
  if(MSG_SEARCH.open && q){
    var hits=_searchNames(q);
    h+='<div class="msg-search-menu">'+
      (hits.length?hits.map(function(o){
        return '<div class="msg-search-item" onclick="'+o.open+'">'+esc(o.label)+
          (o.sub?'<span class="msg-search-sub">'+esc(o.sub)+'</span>':'')+'</div>';
      }).join(''):'<div class="msg-search-item q">Nothing matches that.</div>')+
      '</div>';
  }
  return h+'</div>';
}

function onMsgSearch(v){
  MSG_SEARCH.query=v; MSG_SEARCH.open=true; render();
  // ── [1.348] — searching what was SAID, not only who it was said to ──────
  //
  // Until now this box matched names and nothing else: the server has had an
  // endpoint that searches message bodies the whole time and NO PORTAL EVER
  // CALLED IT, so a teacher could not search their messages at all. Found by
  // driving the endpoint and then looking for its caller.
  //
  // Debounced, because it reads every message this teacher has: firing on each
  // keystroke would put five reads behind one word.
  if(MSG_SEARCH._t) clearTimeout(MSG_SEARCH._t);
  var q=String(v||'').trim();
  if(q.length<2){ MSG_SEARCH.hits={}; MSG_SEARCH.hitsFor=''; MSG_SEARCH.searching=false; return; }
  MSG_SEARCH.searching=true;
  MSG_SEARCH._t=setTimeout(function(){
    api({action:'searchTeacherMessages', data:{teacherToken:TOKEN, query:q}}, function(e,r){
      MSG_SEARCH.searching=false;
      // The box may have moved on while this was in flight. Answering a query
      // the teacher has stopped typing would mark rows against words that are
      // no longer on screen.
      if(String(MSG_SEARCH.query||'').trim()!==q) return;
      MSG_SEARCH.hits=(!e&&r&&r.ok&&r.matches)||{};
      MSG_SEARCH.hitsFor=q;
      render();
    });
  },350);
}
function clearMsgSearch(){
  MSG_SEARCH.query=''; MSG_SEARCH.open=false;
  MSG_SEARCH.hits={}; MSG_SEARCH.hitsFor='';
  if(MSG_SEARCH._t) clearTimeout(MSG_SEARCH._t);
  render();
}
// The match for this row, but only while the search that found it is still the
// one in the box.
function _msgSearchHit(r){
  if(!r || r.kind!=='family') return null;
  var q=String(MSG_SEARCH.query||'').trim();
  if(!q || q!==MSG_SEARCH.hitsFor) return null;
  return (MSG_SEARCH.hits||{})[r.id]||null;
}

// Every name the dropdown can offer: each family by its parents, each student
// by their own name, and every staff conversation. A student and their parent
// open the same thread, because there is one conversation per family.
function _searchNames(q){
  var needle=String(q||'').toLowerCase().trim();
  if(!needle) return [];
  var out=[];
  // ── [1.408] — ONE result per student, carrying its parents ─────────────
  //
  // AC, 8 September 2026: "Teacher search results reads a bit messy. It doesn't
  // need to have the student and the parent separately. If possible, the
  // results should return the student and parent as one result."
  //
  // It emitted up to TWO rows for the same family — one for the parents,
  // matched on their name, and one per student, matched on theirs — and both
  // opened the identical conversation. Searching "j" gave AC five rows for
  // three families, with the same two people facing each other twice.
  //
  // One row per STUDENT now, whichever half of the family the query matched:
  // the student is what a teacher thinks in, and the parents belong on it as
  // the people they will actually be writing to. A family with no student on
  // file still gets a row — it is a real conversation, and losing it to a tidy
  // is worse than the mess this fixes.
  //
  // A student is pushed at most once per family, so a query matching BOTH the
  // parent and the child ("Walton") emits one row rather than two.
  //
  // Each row carries its familyId, which is what [1.348]'s merge below dedupes
  // on. That used to key on the PARENT LABEL — the label this change removed —
  // so without this a family found by name AND by message content would come
  // back twice, once as its student and once as its parents. Found in review.
  (FAMILY_THREADS.list||[]).forEach(function(t){
    var parents=_rosterParentLine(t)||'Family';
    var open='openFamilyRow(\''+esc(t.familyId)+'\');clearMsgSearch()';
    var parentHit=parents.toLowerCase().indexOf(needle)!==-1;
    var kids=(t.students||[]);
    var pushed=false;
    kids.forEach(function(st){
      var nm=String(st.studentName||'');
      if(!parentHit && nm.toLowerCase().indexOf(needle)===-1) return;
      out.push({label:nm||parents, sub:parents, open:open, _fid:t.familyId});
      pushed=true;
    });
    // A family that matched on the parents but has no students on file, or one
    // whose only match was the parents and who has no children listed.
    if(!pushed && parentHit){
      out.push({label:parents, sub:_rosterStudentLine(t), open:open, _fid:t.familyId});
    }
  });
  (STAFF_THREADS.list||[]).forEach(function(x){
    var nm=x.contactType==='admin'?'Admin':(x.teacherName||'');
    if(nm.toLowerCase().indexOf(needle)===-1) return;
    out.push({label:nm, sub:'Admin & staff',
      open:(x.contactType==='admin'
        ? 'openStaffThread(\'admin\',\'admin\',\'Admin\')'
        : 'openStaffThread(\'staff\',\''+esc(x.teacherId)+'\',\''+esc(nm)+'\')')+';clearMsgSearch()'});
  });
  // [1.348] — and the families whose MESSAGES matched, which no name above can
  // find. Found by running it: the list below the box narrowed to one family
  // while the box itself still said "Nothing matches that", which is the two
  // halves of one screen disagreeing about what exists.
  if(needle===MSG_SEARCH.hitsFor){
    // Keyed on familyId, not on the label. [1.408] relabelled these rows by
    // STUDENT, and a guard reading the parent label stopped matching them —
    // which would have put a family found by name AND by message content on
    // screen twice. The id cannot drift with the wording.
    var already={};
    out.forEach(function(o){ if(o._fid) already[o._fid]=true; });
    Object.keys(MSG_SEARCH.hits||{}).forEach(function(fid){
      var t=null;
      // `fam`, not `x`: `x` is the staff row everywhere else in this
      // function, and a check that works out which fields a staff row needs
      // reads every field taken off an `x` in here as one of them.
      (FAMILY_THREADS.list||[]).forEach(function(fam){ if(fam.familyId===fid) t=fam; });
      if(!t) return;
      var parents=_rosterParentLine(t)||'Family';
      if(already[fid]) return;
      // Labelled by the words that matched, not by the name: the teacher typed
      // "recital", and a bare name in the list would not say why it is there.
      out.push({label:parents, _fid:fid,
                sub:(MSG_SEARCH.hits[fid].extract||'').replace(/\s+/g,' ').slice(0,60),
                open:'openFamilyRow(\''+esc(fid)+'\');clearMsgSearch()'});
    });
  }
  return out.slice(0,12);
}

// Which conversations survive a search, for the sections themselves — the same
// matching as the dropdown, expressed as keys.
function _searchHits(){
  var needle=String(MSG_SEARCH.query||'').toLowerCase().trim();
  var keys=[];
  (FAMILY_THREADS.list||[]).forEach(function(t){
    var hay=[_rosterParentLine(t), _rosterStudentLine(t)].join(' ').toLowerCase();
    if(hay.indexOf(needle)!==-1) keys.push('family:'+t.familyId);
  });
  (STAFF_THREADS.list||[]).forEach(function(x){
    var nm=(x.contactType==='admin'?'Admin':(x.teacherName||'')).toLowerCase();
    if(nm.indexOf(needle)!==-1) keys.push((x.contactType==='admin'?'admin:admin':'staff:'+x.teacherId));
  });
  // [1.348] — and the families whose MESSAGES matched, which the names above
  // cannot find. Only while the answer belongs to the words in the box.
  if(needle && needle===MSG_SEARCH.hitsFor){
    Object.keys(MSG_SEARCH.hits||{}).forEach(function(fid){
      if(keys.indexOf('family:'+fid)===-1) keys.push('family:'+fid);
    });
  }
  return keys;
}

// The searched words, marked inside the extract. Escaped FIRST and the marks
// put in afterwards, on the escaped string — the other order would let a
// message containing markup write it into the row.
function _rMark(text, q){
  var out=esc(String(text||''));
  var needle=esc(String(q||'').trim());
  if(!needle) return out;
  var lower=out.toLowerCase(), find=needle.toLowerCase(), res='', i=0;
  for(;;){
    var at=lower.indexOf(find, i);
    if(at===-1){ res+=out.slice(i); break; }
    res+=out.slice(i,at)+'<mark>'+out.slice(at,at+needle.length)+'</mark>';
    i=at+needle.length;
  }
  return res;
}

function rZone(label, n){
  return '<div class="zone">'+esc(label)+
    (n?'<span class="zcount">'+n+'</span>':'')+'</div>';
}

// One row, both kinds. AC, 3 September:
//   • the parent is who the teacher is speaking with, so the parent's name is
//     the largest thing on the row and the student sits under it, labelled;
//   • the arrow ALWAYS points right and the sender is always on the left —
//     the first draft flipped it to keep the parent's name in one column, and
//     that put the recipient first, which is [1.205] backwards;
//   • "we don't need the word parent actually. Just student:" — the two names
//     on the top line are the people talking and need no explaining; only the
//     student is labelled, being the one name on the row belonging to someone
//     who is not in the conversation;
//   • staff conversations carry no parent and no student at all.
// AC, 3 September: "It's not clear who's sending, who's receiving, the arrows
// are small and thin and are visual clutter... Messages were addressed in the
// admin message area. Adopt that css."
//
// This is the admin page's _admRowNames(), for a roster where one of the two
// parties is always the teacher reading it. Three things change from what was
// here:
//
//   BOTH PARTIES ARE NAMED. It used to draw "You →" or "→ you" and the other
//   side only — so a row whose other side had no name (which was every staff
//   and admin row, see doGetTeacherStaffThreads) rendered as a bare arrow with
//   nothing on either end. That is what AC was looking at.
//
//   THE ARROW IS THE SEPARATOR, not part of a phrase. One glyph between two
//   names, in the same .dir style admin uses, rather than "You →" read as a
//   unit and a second arrow-word at the far end.
//
//   THE LAST SPEAKER LEADS, so the row reads in the direction the message
//   travelled — admin's rule, and the reason the arrow means anything.
//
// Every fallback is a real word: a family with no parent name on file is
// "Family", a staff member with no name is "Staff". A blank is never correct
// here, because the whole point of the line is to say who.
// [1.249] — ONE NAME, the person the teacher is speaking with. The row used to
// read "Xavier Tombstone → Adrian Cohen", which in AC's Fig-03 wrapped to one
// word per line in the admin pane, and the "→ You" half said nothing a roster
// of your own conversations does not already say. AC: "message cards in this
// order: Parent Name, no child name or overdue, etc on next line, just go to
// message."
//
// CONSEQUENCE, flagged when the row was cut back and accepted: the type word
// (Family / Admin / Staff) is gone with it, so a teacher tells a family thread
// from a staff one by the name alone. "Admin" is self-evident — it keeps its
// pill — but a colleague's name beside a parent's name is not. This is the one
// part of [1.249]/C3 the new row does not answer.
function _rowNames(r){
  return r.kind==='family' ? esc(_rosterParentLine(r.row)||'Family')
       : r.kind==='admin'  ? '<span class="apill">Admin</span>'
                           : esc(r.name||'Staff');
}

// [1.235] — focusReview is set only for the rows in the Marked for review
// section, so opening a conversation from anywhere else still lands at the
// newest message. It is the section that carries the intent, not the row.
// [1.249] — THE ROW IS: parent name, time, message preview, colour strip,
// badge. Nothing else. Everything below was taken off it, and each one is
// named because each will otherwise be re-reported as missing:
//
//   the student / lesson line — moved into the THREAD HEADER, AC's own split
//     of the question ("When teacher opens message, he sees children's info
//     ... as a subheader under parent name, not on the message bubble itself");
//   the reply deadline and the word "overdue" — the red strip carries urgency
//     alone. This is coherent ONLY because AC's guide copy names the colours,
//     which is why that copy is load-bearing rather than decorative;
//   the "Admin asked" tag, the Nudge and "Answered by you" chips, the coloured
//     status dot, the red "!", the "→ You" direction and the full date — the
//     four competing signals of [1.245], with no hierarchy between them.
//
// The metadata line goes with them: there is no second line but the preview.
function rConvRow(r, focusReview){
  var _f = focusReview ? ',true' : '';
  var open = r.kind==='family'
    ? 'openFamilyRow(\'' + esc(r.id) + '\''+_f+')'
    : (r.kind==='admin' ? 'openStaffThread(\'admin\',\'admin\',\'Admin\''+_f+')'
                        : 'openStaffThread(\'staff\',\'' + esc(r.id) + '\',\'' + esc(r.name||'') + '\''+_f+')');
  var head = _rowNames(r);
  var when = r.at ? ' <span class="dir">· '+esc(fmtMsgTime(r.at))+'</span>' : '';
  // Rule 1: the left edge bar carries time pressure and nothing else ever
  // colours it. A closed conversation is waiting on nobody, so it rests.
  var age = (!r.closed && _agingMark(r.waitingSince, r.replyDueBy)) || {cls:'age-rest', label:''};
  return '<div class="thread-row '+age.cls+'" onclick="'+open+'"'+
    (age.label?' title="'+esc(age.label)+'"':'')+'>'+
    // [1.310], AC: "the text is squashed". The wait line and the Close button
    // were both in the RIGHT-hand column, which is flex:0 0 auto — so as they
    // grew, the name and preview beside them were squeezed to nothing. The
    // sentence belongs with the text it is about; only the badges and the one
    // button stay on the right.
    '<div class="thread-row-main">'+
    '<div class="r-parent">'+head+when+'</div>'+
    // [1.314], AC: "Remove the message preview text from the message card."
    // The row's job is to say WHO and WHETHER SOMETHING IS OWED; the message
    // itself is one click away and was the longest thing on a card in a pane
    // that can be 180px wide. It is the last of [1.284]'s "too much
    // information squashed together", and the fourth thing to come off this
    // row after the student line, the deadline and the ageing badge ([1.249]).
    //
    // "No messages yet" STAYS on a contact who has none — that is not a
    // preview of a message, it is the answer to "is there anything here",
    // which is the one thing a row with no name under it cannot show.
    // [1.348] — WHILE SEARCHING, and only then, the row says why it matched.
    // [1.284] took the message preview off this row deliberately — "the row's
    // job is to say who and whether something is owed" — and that still holds
    // when nothing has been typed. A search asks a different question, and a
    // list of names that shrinks without saying what it found is the thing
    // that made a teacher open every thread in turn.
    (_msgSearchHit(r)
      ? '<div class="thread-row-preview srch">'+_rMark(_msgSearchHit(r).extract, MSG_SEARCH.query)+'</div>'
      : r.hasMessages ? ''
      : '<div class="thread-row-preview"><span style="opacity:.7">No messages yet</span></div>')+
    _rowWaitLine(r)+
    '</div>'+
    '<div class="row-marks">'+rRowMarks(r)+'</div></div>';
}

// What sits on the right of a row. AC, 3 September: "If the message has been
// responded to and there is no bubble, maybe put the 'close conversation'
// button in place of that?"
//
// So the empty slot gets the one action that conversation still has. It is not
// the repetition [1.198] set out to strip, because it appears ONLY where there
// is nothing else to show — a row that is waiting on you shows why, and a row
// that is not offers the thing you might want to do with it. The confirm still
// guards it, so a stray click cannot close anything.
// [1.249] — the badge is always drawn now, in one of its two row states, so
// the slot never sits empty and "nothing is owed" is a state you can see
// rather than an absence you have to interpret ([1.178], and the same three
// states [1.250] gives the family's contact row).
//
// The resting Close button AC asked for on 3 September stays, BESIDE the grey
// badge rather than in place of it. Worth one word from AC if he wants only
// one of the two there: the badge is a status and the button is an action, so
// they are not the competing signals [1.245] was about, but it is his call.
// [1.297] — the direction of the ONE saved message, in the grammar [1.275b]
// settled: "From [sender] to [recipient]". Returns '' when there is not
// exactly one saved (the server sends the sender only then), so the row falls
// through to the wait line.
function _rowReviewNames(r){
  var t=String((r.row||{}).reviewSenderType||'');
  if(!t) return '';
  var sender=esc(String((r.row||{}).reviewSenderName||'').trim());
  var them=r.kind==='family' ? esc(_rosterParentLine(r.row)||'them') : esc(r.name||'them');
  var wrap=function(from,to){
    return '<span class="wait-line"><span class="dir">From</span> '+from+
           ' <span class="dir">to</span> '+to+'</span>';
  };
  // "you" rather than the teacher's own name: they are reading their own row.
  if(t==='teacher') return wrap(sender||'you', them);
  return wrap(sender||them, 'you');
}

// [1.294] — who owes the reply, in AC's words: "waiting for [recipient] to
// reply and waiting for your reply." On this side the answer is simpler than
// admin's, because a teacher is a party to every conversation on their own
// roster: either they owe it or the other person does. waitingSince is set
// only while somebody is waiting on THIS teacher (see the server's
// _buildTeacherFamilyThreads_), so a row that has one is theirs to answer.
function _rowWaitLine(r){
  if(!r || r.closed) return '';
  // [1.297] — a row carrying ONE saved message names THAT message instead.
  var rn=_rowReviewNames(r);
  if(rn) return rn;
  // ── [1.316] — one grammar, and "Waiting for..." is struck from the tool ──
  //
  // AC, 4 September 2026, third and final word on this: "the words waiting for
  // your reply were to be struck from the tool."
  //
  // He gave "waiting for [recipient] to reply / waiting for your reply" that
  // morning and it shipped in @719. He then twice said it should be the to/from
  // grammar instead — first "that is supposed to be swapped out for our agreed
  // solution for message to/from", then this. **The from/to sentence is the one
  // he wants everywhere**, and it says the same thing in the same shape whether
  // admin is a party to the conversation or only watching it, which is why he
  // kept coming back to it.
  //
  // "you" rather than the reader's own name: they are reading their own row.
  if(!r.hasMessages) return '';
  var them=r.kind==='family' ? esc(_rosterParentLine(r.row)||'them') : esc(r.name||'them');
  var sender=esc(String(r.sender||'').trim());
  var wrap=function(from,to){
    return '<span class="wait-line"><span class="dir">From</span> '+from+
           ' <span class="dir">to</span> '+to+'</span>';
  };
  // [1.317] — only "waiting for YOUR reply" was struck. AC: "You left in the
  // 'waiting for adrian to reply' or 'waiting for Xavier to reply' though,
  // right?" The two sentences say different things and both are his:
  //
  //   THEY owe it   "Waiting for Rachel to reply" — somebody else is late,
  //                 which from/to would not say.
  //   YOU owe it    "From Rachel Lande to you" — you know you owe it; what you
  //                 want is who it is from.
  if((r.row||{}).lastSenderIsTeacher){
    var first=String(_rosterParentLine(r.row)||r.name||'').trim().split(/\s+/)[0];
    return first ? '<span class="wait-line">Waiting for '+esc(first)+' to reply</span>' : '';
  }
  return wrap(sender||them, 'you');
}

function rRowMarks(r){
  // ── [1.347] — the plain "Closed" pill is gone ──────────────────────────
  //
  // AC, 6 September, asked which of three words one state should use and
  // answered with a shape rather than a word: "End Conversation, no pill,
  // Archived conversations." So the ACTION keeps his words and the SECTION
  // keeps his words, and the label in between goes — a row sitting under
  // "Archived conversations" does not also need a badge saying it is closed.
  //
  // The blue "ended without a reply" mark STAYS. It is not this label under
  // another name: it says something the section cannot, which is that the
  // conversation ended while somebody was still owed an answer ([1.335], his
  // own). Flagged to him in one line rather than swept away with the pill.
  if(r.closed) return r.closedUnanswered
    ? '<span class="closed-tag unanswered" title="Ended without a reply">'+esc(TCH_COPY.endedUnanswered)+'</span>'
    : '';
  // ── [1.287] — nothing to close, so nothing offers to close it ───────────
  //
  // AC, 4 September: "a conversation that is opened but never started should
  // not need to be closed. It should be as though it never existed."
  //
  // [1.283] gave the open conversation a row so the left pane names who the
  // right pane is writing to. That row then inherited the resting Close
  // button, which asks you to finish something that has not begun — and
  // closing it would write a closedAt onto a conversation with no messages,
  // making a real record out of a click. Walk away instead and there is
  // nothing to walk away from: no messages, no row, no trace.
  //
  // The badge is dropped with it. A grey zero on a conversation that does not
  // exist is [1.178] backwards — a resting state for something with no state.
  if(!r.hasMessages) return '';
  // [1.305], AC: "Clicking close conversation doesn't do anything on the
  // teacher side. That should be accessible from the message card in the left
  // hand side." It was on the row already, but ONLY when nothing was unread or
  // saved — so the rows he most wanted to close were the ones that hid it. It
  // is offered on every open conversation now. The confirm still guards it,
  // and a thread with saved marks still has to clear them first ([1.233]).
  var marks=rReadMark(r.awaiting)+rReviewMark(r.review);
  // [1.335], AC 5 September: "Teacher needs to be able to 'End conversation
  // without responding' for conversations that don't require a response."
  //
  // [1.309] hid this button whenever a reply was owed, because the server
  // refused the write and inviting a click that fails is worse than not
  // offering it. The server no longer refuses — it RECORDS — so the button is
  // offered on every open conversation again. The two halves have to move
  // together: a button the server refuses, or a refusal with no button, are
  // both worse than either state.
  return marks+'<button type="button" class="btn btn-s row-close" '+
    'onclick="event.stopPropagation();closeRow('+_rowArgs(r)+')">'+
    esc(TCH_COPY.closeConversation)+'</button>';
}

// Closing from the roster, without opening the conversation first. Same
// confirm and the same endpoint as the button in the thread.
function _rowArgs(r){
  return "'"+esc(r.kind)+"','"+esc(r.id)+"'";
}
function closeRow(kind, id){
  // [1.233] — the same rule from the roster. This path has no thread open, so
  // it goes on the row's own review count, which is the number the white
  // circle beside the button is already showing. The dialog is the browser's
  // here rather than the inline panel: there is no thread on screen to put a
  // panel inside, and the alternative — opening the conversation just to
  // refuse — is a worse answer to "close this row".
  var _r=_msgRows().filter(function(x){ return x.kind===kind && x.id===id; })[0];
  var _marks=_r?Number(_r.review)||0:0;
  // [1.327] — one dialog, and only when there is something to lose. Ending a
  // conversation with no saved marks now happens on the click, because the
  // server already refuses to end one that owes a reply and the row already
  // hides the button in that case ([1.309]) — so the confirm was guarding
  // against nothing. A thread with review marks still asks, because ending it
  // CLEARS them and that cannot be undone.
  if(_marks && !confirm(TCH_COPY.closeNeedsReview)) return;
  var d={teacherToken:TOKEN, teacherId:TEACHER_ID, closed:true};
  if(kind==='family'){ d.conversationType='family_teacher'; d.familyId=id; }
  else if(kind==='admin'){ d.conversationType='teacher_admin'; }
  else { d.conversationType='staff_staff'; d.staffId2=id; }
  // ── [1.279] — the row moves NOW, not in twenty seconds ──────────────────
  //
  // AC, timing it: "it takes about 20 seconds for a teacher's conversation
  // marked as cleared to actually clear. Should be optimistic."
  //
  // Two round trips before anything moved: the write, then a full roster
  // reload nobody was waiting to read. At [1.263]'s measured ~2s fixed plus
  // ~1s a sheet read, twenty seconds is arithmetic, not a mystery.
  //
  // The same shape toggleReview() has used since [1.231], which is the model
  // in this file: move it locally, draw, write, put it back if the write
  // fails. The roster refresh still runs — the server decides what is really
  // closed — but behind the change rather than in front of it.
  // [1.311] — THE ROW ITSELF, out of THREADS.list.
  //
  // AC: "when closing the conversation, it takes up to 30 seconds to take
  // effect." [1.279] made this optimistic in @713 and it worked. [1.292] then
  // turned FAMILY_THREADS and STAFF_THREADS into read-only VIEWS that build a
  // fresh object on every read — so the optimistic write went into a throwaway
  // copy and vanished, and the row only moved when the server answered. **A
  // regression Claude introduced with the one-roster refactor**, and the exact
  // failure a computed view invites: it reads like an object you can write to.
  var _src=(THREADS.list||[]).filter(function(x){
    return x.kind===kind && (kind==='admin' ? true : x.id===id);
  })[0];
  var _was=!!(_src&&_src.closed);
  var _go=function(){
    if(_src){ _src.closed=true; render(); }
    api({action:'setConversationClosed', data:d}, function(e,r){
      if(e||!r||!r.ok){
        if(_src){ _src.closed=_was; render(); }
        showMsg((r&&r.error)||'Could not close that.','e'); return;
      }
      _refreshRosters();
    });
  };
  if(!_marks) return _go();
  // Clear first, close second — a close that half-clears is the state this
  // item exists to prevent.
  var _c={teacherToken:TOKEN, teacherId:TEACHER_ID};
  ['conversationType','familyId','staffId2'].forEach(function(k){ if(d[k]!==undefined) _c[k]=d[k]; });
  api({action:'clearConversationReviews', data:_c}, function(e,r){
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not clear those.','e'); return; }
    _go();
  });
}

// Who spoke last, for the direction on the row. The roster carries the last
// sender for family threads; for a staff thread "waiting on you" is the same
// question and is already answered by waitingSince.
// [1.249] — _lastWasMine() was here and is gone with the two-name direction
// line it decided the order of. The row names one person now.

function _rosterStudentLine(t){
  var kids=t.students||[];
  if(!kids.length) return [t.parent1Name,t.parent2Name].filter(Boolean).join(' & ')||'Family';
  return kids.map(function(st){
    var bits=[st.day,st.time].filter(Boolean).join(' ');
    return [st.studentName, [bits,st.instrument].filter(Boolean).join(' ')]
      .filter(Boolean).join(' - ');
  }).join(' · ');
}
function _rosterParentLine(t){
  return [t.parent1Name,t.parent2Name].filter(Boolean).join(' & ')||'';
}

var RESP_OPEN_HOUR=9, RESP_CLOSE_HOUR=17;   // studio hours — kept for the notify window, no longer the clock

function _respHoursBetween(fromMs, toMs){
  var from=Number(fromMs)||0, to=Number(toMs)||0;
  if(!from || to<=from) return 0;
  var open=0;
  var d=new Date(from);
  // Hour by hour, capped: anything older than a month is far past OVERDUE
  // already, so the loop stops rather than being made clever.
  for(var i=0;i<24*31 && d.getTime()<to;i++){
    var day=d.getDay(), hr=d.getHours();
    var next=new Date(d.getTime()); next.setMinutes(0,0,0); next.setHours(hr+1);
    if(day>=1 && day<=5){
      open+=(Math.min(to,next.getTime())-d.getTime())/3600000;
    }
    d=next;
  }
  return open;
}

// [1.178] — the resting stage is drawn too, in a definite grey. This used to
// return null under two hours and the row fell back to a bare ○, which is why
// AC reported "no status on a conversation at all". null now means only one
// thing: nobody is waiting. Kept character-identical to the admin copy — a
// teacher and admin looking at the same conversation must never see different
// colours (there is a check for exactly this).
//
// [1.249] — FOUR STAGES, and what the mark drives has changed. It used to
// colour the BADGE, through five stages with a purple at 2h. AC cut his own
// key to four — "simplify to three, under 4 hours no color or grey, amber at
// 4h, nudge at 12 hours, then 24 hours overdue" — then added the nudge stage
// back as its own colour: "let's turn to orange at 12 hour mark when nudge
// has been fired". What it colours now is the row's LEFT EDGE STRIP, and the
// badge carries the count alone.
//
// The 12h stage is keyed on twelve elapsed hours rather than on the nudge
// having actually fired, and deliberately: AC's own guide copy — which is
// load-bearing, since the row no longer carries the words "overdue" or a
// deadline — says "orange at 12 hours (you'll also receive an automated
// reminder)". Twelve hours is the mark and the reminder is its consequence.
function _agingMark(waitingSince, dueBy){
  if(!waitingSince) return null;
  var now=Date.now();
  var h=_respHoursBetween(waitingSince, now);
  // [1.197] — OVERDUE is the server's deadline, not a count. The deadline is
  // per teacher (their own evening boundary), which the portal cannot derive,
  // so it arrives on the row as replyDueBy. The 24-hour fallback is only for a
  // row from an older payload.
  if(dueBy ? (now>=Number(dueBy)) : (h>=24)) return {cls:'age-od', overdue:true, label:'Overdue'};
  var n=Math.round(h);
  if(h>=12) return {cls:'age-12h', t:n+'h', label:'Waiting '+n+'h'};
  if(h>=4) return {cls:'age-4h', t:n+'h', label:'Waiting '+n+'h'};
  // [1.354] — blue, not grey. Grey is now only a row with nothing owed.
  return {cls:'age-wait', t:(n>=1?n+'h':'new'), label:(n>=1?'Waiting '+n+'h':'Waiting — less than an hour')};
}

// ── The ageing circle (BACKLOG 1.128, rebuilt 3 September 2026) ─────────
// AC, 3 Sept: "it seems unnecessary to have an unread button. If the message
// has been read, it's read... Read becomes automatic for everyone."
//
// So this is no longer a control. Mark-unread is gone from all three portals:
// it marked a whole thread, it asserted something untrue about a message that
// had been read, and it was most of why [1.216] says the counts are messy.
// Saving an individual message for review replaces it. Read has always been
// stamped automatically on open by doGetConversation(), so nothing had to be
// built for "read is automatic" — the manual buttons were overrides on top of
// behaviour that was already right, and they simply go.
//
// AC, 3 Sept, on what the mark now means: "agreed on the color not showing the
// hours." THE NUMBER IS ALWAYS A COUNT. THE COLOUR IS ALWAYS THE AGE. The
// circle used to hold the unread count for two hours and then silently switch
// to holding a duration ("6h"), so its content changed meaning as time passed
// — which is [1.216]'s complaint present in the design. Now the count stays at
// every stage and the colour alone says how long.
//
// He asked what happens with two unread messages sent at different times, and
// whether each needs its own circle: no. One circle, the count says how many,
// and the colour comes from the OLDEST unanswered one — see [1.228], which is
// the defect that question uncovered.
// [1.249] — RULE 2: the badge carries who is waiting, and nothing else ever
// colours it. It took the ageing colour as well until now, so one control was
// answering two questions and the row then repeated the second answer in a
// dot, a tag and a deadline. The age moved to the left edge strip and the word
// OVERDUE came off the row entirely.
//
// Two states here, both drawn at rest:
//   filled blue with the count — someone is waiting on you
//   grey, with no number       — read, nothing owed
// The "0" in the grey badge is a transparent spacer, hidden from screen
// readers, so the two states are the same size and the row does not shift as
// it changes. The aria-label carries the meaning.
// [1.295], AC: "there are no outstanding messages for me to read so there
// should be no blue circle. It should be the close conversation button,
// right?" Yes — a badge saying zero is a number about nothing. The resting
// state [1.178] asks for is still there; it is the Close button beside it and
// the sentence before it, which say more than a grey nought did.
function rReadMark(unread){
  var n = Number(unread) || 0;
  if (!n) return '';
  return '<div class="msg-circle p-new" aria-label="'+n+' waiting for a reply">'+n+'</div>';
}

// The white circle: how many messages in this thread this teacher has saved
// for review ([1.215]). A separate meaning from the one above and never mixed
// with it — the blue/aged circle says someone is waiting on you, this one says
// you parked something for yourself. Private: nobody else is sent it.
// [1.249] — the outline badge with a count: YOUR OWN saved-for-review marks.
// A different question from "who is waiting", which is why it may sit
// alongside the filled badge rather than replacing it. Private: nobody else is
// sent it.
function rReviewMark(count){
  var n = Number(count) || 0;
  if (!n) return '';
  return '<div class="msg-circle p-review" title="Saved for review" aria-label="'+n+' saved for review">'+n+'</div>';
}

// [1.292] — ONE loader, one request, one signature. It replaces
// loadFamilyThreads and loadStaffThreads, which fetched two lists that could
// arrive at different times from different snapshots of the sheet.
// ── [1.400] — a guard that can never be released stops the poll for good ──
//
// AC, 8 September 2026: "Teacher email notifications are firing quickly, but
// messages are not updating automatically … Clicking refresh loads the
// message, but the new message should show up sooner. Check the code to see
// what's happening."
//
// This is the mechanism, and it explains the shape of what he saw exactly.
// [1.293] added _inFlight so a tick finding the previous request still running
// SKIPS rather than queueing behind it — which is right. What it has never had
// is a way to be wrong: the flag is cleared in the response callback and
// NOWHERE ELSE, so a request whose callback never arrives — a dropped Apps
// Script response, a request killed by a phone suspending the tab, a network
// blip — leaves _inFlight true for the life of the page. **The roster then
// never polls again.** _thrPollBusy has the identical shape.
//
// And it matches AC's own observation, which a guess would not: Refresh keeps
// working, because Refresh is a different path that does not consult this flag.
// The poll is the only thing that stops.
//
// A guard that cannot expire is not a guard, it is a latch. Every one of them
// now carries the time it was set, and a guard older than the longest a real
// round trip can take is treated as gone rather than as running. The cost of
// being wrong is one duplicate request; the cost of the latch is a portal that
// silently stops updating until it is reloaded.
var POLL_GUARD_MAX_MS=45000;
function _guardStale(setAt){ return !setAt || (Date.now()-setAt)>POLL_GUARD_MAX_MS; }
function loadThreads(silent){
  // [1.400] — held only while a request could still plausibly be alive.
  if(THREADS._inFlight && !_guardStale(THREADS._inFlightAt)) return;
  THREADS._inFlight=true;
  THREADS._inFlightAt=Date.now();
  if(!silent){ THREADS.loading=true; render(); }
  api({action:'getTeacherThreads', data:{teacherToken:TOKEN}}, function(e,r){
    THREADS._inFlight=false;
    THREADS.loading=false;
    if(e||!r||!r.ok){ if(!silent) showMsg((r&&r.error)||'Could not load conversations.','e'); render(); return; }
    // [1.176], AC: "The browser reloads when navigating away to another tab and
    // back." It was not a reload — every focus event re-rendered the whole page
    // whether or not anything had changed, which looks identical. The roster is
    // only reapplied when it actually differs, so a silent poll on an unchanged
    // list costs nothing on screen.
    var _sig=_famSig(r.threads||[]);
    var _changed=(_sig!==THREADS._sig);
    THREADS._sig=_sig;
    THREADS.list=r.threads||[];
    // [1.333] — warm the link library here, minutes before anyone presses
    // Link, rather than making the first press pay for it. Guarded inside
    // loadSavedLinks(), so the poll running every few seconds costs one call.
    loadSavedLinks();
    loadSavedTpls();   // [1.127] — warmed the same way and for the same reason
    MSG_LOCK.locked = _tIsTruthy(r.messagingLocked);
    MSG_LOCK.msg = r.messagingLockedMsg||'';
    // The deep link from a notification email, spent the moment the roster
    // arrives — and only once, so a later refresh does not drag the teacher
    // back out of whatever they moved on to.
    if(_pendingOpenFamilyId){
      var _want=_pendingOpenFamilyId;
      _pendingOpenFamilyId='';
      var _row=_threadsOfKind('family').filter(function(t){return t.id===_want;})[0];
      if(_row){ HOME_TAB='family'; openFamilyThread(_row.id, _row.parent1Name, _row.parent2Name); return; }
    }
    if(!silent || _changed) render();
    _prefetchThreads();   // [1.418] case 1 — the ids are known now, and only now
  });
}
// Kept as names so nothing that called them has to know they are now one call.
function loadFamilyThreads(silent){ loadThreads(silent); }
function loadStaffThreads(silent){ loadThreads(silent); }

// What a roster row actually shows. If none of it moved, neither does the
// screen — see the note in loadFamilyThreads().
function _famSig(list){
  return (list||[]).map(function(t){
    return [t.familyId,t.lastMessageAt,t.lastMessageText,t.unread,t.waitingSince,
            t.closed,t.hasMessages].join('~');
  }).join('|');
}




// Resolves the row, then opens it — so no name is ever interpolated into an
// inline handler. Two entry points, two lists: the roster and the picker.
function openFamilyRow(familyId, focusReview){
  var t=FAMILY_THREADS.list.filter(function(x){return x.familyId===familyId;})[0];
  if(!t) return;
  openFamilyThread(t.familyId, t.parent1Name, t.parent2Name, focusReview);
}
// Defaults to whatever the conversation was last about — a thread tends to
// stay on one child, and asking again every time would be friction with no new
// information.
function _threadStudentId(t){
  if(t.studentId!==undefined) return t.studentId;
  var last='';
  (t.messages||[]).forEach(function(m){ if(m.studentId) last=m.studentId; });
  if(!last && (t.students||[]).length===1) last=t.students[0].studentId;
  t.studentId=last;
  return last;
}

// ── [1.263] — opening a conversation is one fast read ───────────────────
//
// AC: "the teacher page takes a long time to load the message when I click in
// the message list. Can this be faster?" — measured server-side before any of
// this was written; the numbers and the reasoning are in Code.js above
// doGetConversation().
//
// Two things changed here, and they are the same change in all three portals:
//
//   1. getConversation is now a pure read, so what the client waits for is one
//      round trip. Filing the read receipts is a SECOND request, fired once
//      the messages are on screen and never waited for — _markThreadRead()
//      below. Nobody stares at a spinner while their own receipts are written.
//
//   2. The pane no longer blanks. Reopening a thread draws the messages this
//      client already loaded, immediately, and the fetch fills in behind it.
//      The spinner is only for a thread that has genuinely never been opened,
//      which is the only case where there is nothing true to draw.
var THREAD_CACHE = {};   // conversation key -> the messages last loaded for it
function _threadCacheKey(d){
  return d.conversationType==='staff_staff'
    ? 'ss_'+[String(d.teacherId||''), String(d.staffId2||'')].sort().join('_')
    : (d.conversationType==='family_teacher' ? 'ft_'+d.familyId+'_'+d.teacherId
                                             : 'ta_'+d.teacherId);
}
// [1.291] — what is worth redrawing from cache, which is never an empty list.
function _cachedMessages(d){
  var m=THREAD_CACHE[_threadCacheKey(d)];
  return (m && m.length) ? m : null;
}

// ── [1.418] case 1 — the conversation is already there when it is opened ──
//
// AC, over and over, and it is the most-repeated complaint of the day:
// *"Clicking on conversations takes sometimes up to 10 seconds to load, very
// frustrating for users."*
//
// The shell draws at once; what a teacher waits on is the message area, which
// pays [1.263]'s ~2s round trip in full on a first open — more when the script
// is busy. Making the request faster is not available. **Making it already
// done is.**
//
// [1.398] did exactly this for the family portal at @735 and it works. It was
// deliberately NOT extended here, and the reason still stands: a teacher's
// roster is forty rows, not three, and reading all of it would be the overlap
// [1.293] exists to prevent.
//
// **So this is bounded, and every bound has a reason:**
//   - THE FEW MOST RECENT ONLY. The thread a teacher opens is almost always
//     one of the newest; four covers it, forty would be a burst.
//   - ONCE per sign-in, never on the poll. A second pass is a poll wearing a
//     different name, and the 5s tick already keeps an OPEN thread current.
//   - ONE REQUEST AT A TIME, chained. [1.293] again: parallel requests against
//     one Apps Script project overlap and land out of order.
//   - NEVER while a thread is open, a send is in flight, or the roster is
//     loading — it must never compete with something a teacher is waiting for.
//   - SILENT on failure. The thread then opens the way it does today.
//   - NEVER caches an empty answer — [1.291]'s rule, which is what stops a
//     conversation being drawn as "loaded, and empty" for the rest of the day.
var PREFETCH_MAX=4;
var _prefetchDone=false, _prefetchBusy=false;
function _prefetchThreads(){
  if(_prefetchDone||_prefetchBusy) return;
  if(FAMILY_VIEW==='thread'||STAFF_VIEW==='thread') return;
  if(THREADS._inFlight) return;
  var rows=(THREADS.list||[]).filter(function(t){
    return t && t.hasMessages && t.lastMessageAt;
  }).sort(function(a,b){ return (Number(b.lastMessageAt)||0)-(Number(a.lastMessageAt)||0); });
  var queue=[];
  for(var i=0;i<rows.length && queue.length<PREFETCH_MAX;i++){
    var r=rows[i];
    var d=(r.kind==='family')
      ? {conversationType:'family_teacher', familyId:r.id, teacherId:TEACHER_ID, teacherToken:TOKEN}
      : (r.kind==='admin'
          ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
          : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:r.id, teacherToken:TOKEN});
    if(!_cachedMessages(d)) queue.push(d);
  }
  if(!queue.length){ _prefetchDone=true; return; }
  _prefetchBusy=true;
  (function next(){
    if(!queue.length){ _prefetchBusy=false; _prefetchDone=true; return; }
    // A teacher who has opened something is now waiting on it. Stand down.
    if(FAMILY_VIEW==='thread'||STAFF_VIEW==='thread'){ _prefetchBusy=false; return; }
    var d=queue.shift();
    api({action:'getConversation', data:d}, function(e,r){
      if(!e && r && r.ok && (r.messages||[]).length){
        THREAD_CACHE[_threadCacheKey(d)]=r.messages;
      }
      // No render(): nothing on screen changed, and this must never be a
      // reason the page moves under someone reading it.
      next();
    });
  })();
}
// Fire and forget. A failure costs an unread badge that clears the next time
// the thread is opened, so there is nothing here worth interrupting anyone
// for — and nothing worth making them wait for either.
function _markThreadRead(reqData){
  api({action:'markConversationRead', data:reqData}, function(){});
}

function openFamilyThread(familyId, p1, p2, focusReview){
  // [1.276] — an edit belongs to the thread it was started in. Leaving one
  // with the composer holding somebody else's words is how the wrong message
  // gets overwritten. [1.277] — and a file picked for one family must not
  // follow the teacher into another's thread.
  AMEND={messageId:'', kind:'', stash:''};
  SCHED={mode:'', messageId:'', at:''};   // [1.371] — a picker or a confirm belongs to the thread it was opened in
  _attClear();
  _focusReview=!!focusReview;   // [1.235]
  var _row=(FAMILY_THREADS.list||[]).filter(function(x){return x.familyId===familyId;})[0]||{};
  var _req={conversationType:'family_teacher', familyId:familyId, teacherId:TEACHER_ID, teacherToken:TOKEN};
// ── [1.291] — an EMPTY answer is not an answer ─────────────────────────
//
// [1.263] cached the messages a thread had already loaded so reopening it
// redraws instantly instead of blanking. It cached an EMPTY list the same way
// — and an empty array is truthy, so a thread opened once while it had no
// messages was thereafter drawn as "loaded, and empty", with no spinner,
// until a fetch corrected it.
//
// That is a plausible half of what AC reported as "New messages sent from
// family are not opening in the teacher portal", and it is Claude's own, from
// the same day. **Caching nothing is not caching an answer** — an empty
// conversation has to keep showing that it is still loading, because the only
// honest thing to say about it is that we do not know yet.
  var _had=_cachedMessages(_req);
  // [1.336] — the draft comes back with the conversation. This line is the
  // whole fix for the data loss: it used to read draft:''.
  ACTIVE_THREAD = {familyId:familyId, parent1Name:p1, parent2Name:p2, messages:_had||[],
                   draft:_draftGet('family', familyId), sending:false,
                   loading:!_had, refreshing:!!_had, notifyP1:true, notifyP2:true,
                   students:_row.students||[]};
  _openPane('family');   // [1.336] — one pane, one open thing
  _shouldScrollMsgList=true;
  render();
  api({action:'getConversation', data:_req}, function(e,r){
    if(!ACTIVE_THREAD || ACTIVE_THREAD.familyId!==familyId) return; // navigated away before this resolved
    ACTIVE_THREAD.loading=false; ACTIVE_THREAD.refreshing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not load conversation.','e'); render(); return; }
    ACTIVE_THREAD.messages=r.messages||[];
    // [1.371] — the sender's own scheduled messages for this thread, in their
    // own array. Never merged into messages: their sentAt is when they were
    // WRITTEN, and adopting it would move the poll's watermark backwards.
    ACTIVE_THREAD.scheduled=r.scheduled||[];
    THREAD_CACHE[_threadCacheKey(_req)]=ACTIVE_THREAD.messages;
    _applyPendingReviews(ACTIVE_THREAD);   // [1.231]
    _shouldScrollMsgList=true; render();
    _markThreadRead(_req);   // [1.263] — after the thread is drawn, never before
  });
}

// Manual "Refresh" — same fetch as opening the thread, without waiting for
// the next poll tick. Uses getConversation() (marks read too), a deliberate
// user action rather than a background poll.
function refreshFamilyThread(){
  var t=ACTIVE_THREAD;
  if(!t||t.refreshing) return;
  t.refreshing=true; render();
  var _req={conversationType:'family_teacher', familyId:t.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN};
  api({action:'getConversation', data:_req}, function(e,r){
    if(!ACTIVE_THREAD||ACTIVE_THREAD.familyId!==t.familyId) return;
    ACTIVE_THREAD.refreshing=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not refresh.','e'); render(); return; }
    ACTIVE_THREAD.messages=r.messages||[];
    // [1.371] — the sender's own scheduled messages for this thread, in their
    // own array. Never merged into messages: their sentAt is when they were
    // WRITTEN, and adopting it would move the poll's watermark backwards.
    ACTIVE_THREAD.scheduled=r.scheduled||[];
    THREAD_CACHE[_threadCacheKey(_req)]=ACTIVE_THREAD.messages;
    _applyPendingReviews(ACTIVE_THREAD);   // [1.231]
    _shouldScrollMsgList=true; render();
    _markThreadRead(_req);   // [1.263]
  });
}

// [1.249] — the child's lesson details, in the THREAD HEADER and nowhere else.
//
// AC was offered three ways of fitting the student name onto the ROW and took
// none of them. He split the question instead, which is the better answer:
//
//   "message cards in this order: Parent Name, no child name or overdue, etc
//    on next line, just go to message. When teacher opens message, he sees
//    children's info 'Abcess Tombstone - 30 min piano - Mondays 3pm' as a
//    subheader under parent name, not on the message bubble itself. If there
//    are two children both with that same teacher, list both child's info. If
//    the teacher only teaches one of the children, only list that child."
//
// And twice, on where it must NOT appear: "Don't have the child info on the
// message. It's in the header only. The teacher or parent can infer from the
// message" — and "the thread header".
//
// The list is already scoped to this teacher's own students by the server
// (_teacherStudentLines_ filters on the teacher's name), so "only list that
// child" needs nothing here.
// ── [1.409] — one line per child, with everything on it ──────────────────
//
// AC, 8 September 2026: "Remove the 'lesson phases and details' from the
// teacher portal. This is not really doing anything. Just list everything."
//
// **This supersedes [1.320]**, which AC approved on 4 September: a short line
// with the rest a click away. Having used it, he wants the click gone. His
// call, and the reasoning holds — a disclosure hiding one line of facts a
// teacher wants anyway is a control that costs a press and saves nothing.
//
// "Everything" is the UNION of the two old lines, not either one of them. The
// collapsed form carried the room and the expanded form did not, so keeping
// only the expanded line would have quietly dropped a fact from the screen
// while claiming to list everything.
//
// The room is a staff fact and stays a staff fact — standing rule 6, never
// shown to a family — which is why this is safe here and would not be in
// EnrollmentFamily.html.
function _kidLine(st){
  var day=String(st.day||'').trim();
  var when=[day?day+'s':'', String(st.time||'').trim()].filter(Boolean).join(' ');
  var what=[st.duration?st.duration+' min':'', String(st.instrument||'').trim().toLowerCase()]
             .filter(Boolean).join(' ');
  return [what, when, String(st.room||'').trim()].filter(Boolean).join(' \u00b7 ');
}
function rThreadKids(students){
  var list=(students||[]).filter(function(st){ return st && st.studentName; });
  if(!list.length) return '';
  return '<div class="thread-kids">'+list.map(function(st){
    var rest=_kidLine(st);
    return '<div class="thread-kid"><b>'+esc(String(st.studentName).split(' ')[0])+'</b>'+
           (rest?' \u00b7 '+esc(rest):'')+'</div>';
  }).join('')+'</div>';
}

function rFamilyThread(){

  h+='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">'+

  }
  // AC, 3 September: Send and "Ask admin about this" sit together on the left
  // — both send something — and Close conversation sits alone hard right,

  // front of you, which is why AC asked for a confirm step, and a button

  // It belongs to the CONVERSATION — one deadline, however many messages are
