<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keylab Teacher Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ABABAB;--bg2:#B8B8B8;--bg3:#C8C8C8;--bg4:#D4D4D4;--bg5:#DEDEDE;
  --border:#999;--border2:#888;--border3:#666;
  --text:#0A0A0A;--text2:#181818;--text3:#2E2E2E;--text4:#525252;--text5:#757575;
  --green:#1A6B3A;--gbg:#D4EDE0;--gt:#0B3D20;
  --amber:#7A5000;--abg:#FAEABB;--at:#4A2E00;
  --red:#962020;--rbg:#FAD4D4;--rt:#560A0A;
  --blue:#1C4A82;--bbg:#D0E2F8;--bt:#0C2A52;
  --acc:#1E3A6E;--r:5px;--rl:8px
}
body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding:2rem 1.25rem 4rem}
.login-w{margin:4rem auto 0;text-align:center}
.login-brand{font-family:"Inter",sans-serif;font-size:15px;letter-spacing:.1em;color:var(--acc);margin-bottom:.3rem;font-weight:500}
.login-sub{font-size:12px;color:var(--text4);margin-bottom:1.75rem}
h1{font-size:20px;font-weight:400;margin-bottom:.4rem;color:var(--text)}
h2{font-size:10px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem;font-family:"Inter",sans-serif}
p{color:var(--text3);margin-bottom:.75rem;line-height:1.65;font-size:13px}
a{color:var(--bt);text-decoration:none}
a:hover{text-decoration:underline}
.card{background:rgba(255,255,255,.45);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem;text-align:left}
.msg{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:1rem;border:1px solid;line-height:1.5}
.ms{background:var(--gbg);color:var(--gt);border-color:var(--green)}
.me{background:var(--rbg);color:var(--rt);border-color:var(--red)}
input{background:rgba(255,255,255,.45);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:9px 10px;font-family:"Inter",sans-serif;font-size:14px;width:100%;outline:none;margin-top:4px;-webkit-appearance:none}
input:focus{border-color:var(--acc);background:rgba(255,255,255,.65)}
label{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;display:block;font-family:"Inter",sans-serif}
.field{margin-bottom:1rem}
.req{color:var(--rt);margin-left:2px}
.btn{padding:10px 16px;border-radius:var(--r);font-size:13px;cursor:pointer;border:1px solid transparent;font-family:"Inter",sans-serif;transition:background .1s,opacity .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;line-height:1;letter-spacing:.01em;width:100%}
.btn-p{background:#1a4fc4;color:#fff;border-color:#1a4fc4}.btn-p:hover{background:#1440a8;border-color:#1440a8}
.btn-s{background:rgba(0,0,0,.12);color:var(--text2);border-color:var(--border2)}.btn-s:hover{background:rgba(0,0,0,.2);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.spin{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.remember-row{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;margin-bottom:.8rem}
.remember-row input{width:14px;height:14px;-webkit-appearance:checkbox;appearance:auto;margin:0;flex:0 0 auto}
.linkline{font-size:13px;color:var(--text3);text-align:center;margin-top:.5rem}
.tabbar{display:flex;gap:6px;margin-bottom:1rem;padding:5px;background:rgba(255,255,255,.35);border:1px solid var(--border);border-radius:10px}
.tab{flex:1;text-align:center;padding:9px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text4);background:transparent;cursor:pointer;border-radius:7px;font-family:"Inter",sans-serif;font-weight:600;border:1px solid transparent;transition:all .15s}
.tab.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.thread-hd{font-size:10px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem;font-family:"Inter",sans-serif}
.empty-state{text-align:center;color:var(--text4);padding:2rem 1rem;font-size:13px}
/* Status banner (BACKLOG 1.125, AC's shapes: red Away/Busy, green Available).
   Full width and unmissable on purpose — the 28 Aug worry was that a teacher
   with no return date would leave away switched on forever, and a banner they
   cannot miss is the mitigation that costs no extra fields. */
.status-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:var(--r);padding:8px 12px;margin-bottom:.75rem;font-size:12px;font-weight:700}
.status-banner.away{background:#FDECEC;border:1px solid #DC2626;color:#B91C1C}
.status-banner.avail{background:#ECFDF3;border:1px solid #16A34A;color:#15803D}
.status-banner a{font-size:11px;font-weight:600}
.away-note{background:#FDECEC;border:1px solid #DC2626;color:#B91C1C;border-radius:var(--r);
  padding:8px 10px;font-size:12px;margin-bottom:.6rem;white-space:pre-wrap}
.handoff-tag{background:var(--bg3);color:var(--text3);font-size:10px;font-weight:600;
  padding:1px 7px;border-radius:10px;margin-left:6px}
.fwd-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 12px;margin-top:.6rem;font-size:12px}
.msg-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;max-height:50vh;overflow-y:auto}
.bubble-row{display:flex}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:80%;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:var(--rl);padding:.6rem .8rem}
.bubble.mine{background:#1a4fc4;border-color:#1a4fc4;color:#fff}
.bubble-sender{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-family:"Inter",sans-serif;margin-bottom:.2rem}
.bubble-text{font-size:13px;line-height:1.5;color:inherit}
.bubble.mine .bubble-text{color:#fff}
.bubble-time{font-size:10px;color:var(--text5);margin-top:.3rem}
.bubble.mine .bubble-time{color:rgba(255,255,255,.7)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{background:rgba(255,255,255,.45);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:9px 10px;font-family:"Inter",sans-serif;font-size:14px;width:100%;outline:none;resize:none;min-height:44px;max-height:120px}
.composer textarea:focus{border-color:var(--acc);background:rgba(255,255,255,.65)}
.composer .btn{width:auto;flex:0 0 auto}
/* Formatting composer (BACKLOG 1.33). The contenteditable box deliberately
   reuses the textarea's exact look so the toolbar is the only visible change. */
.composer-wrap{display:flex;flex-direction:column;gap:6px}
.cmp-tb{display:flex;flex-wrap:wrap;gap:4px}
.cmp-tb-btn{background:rgba(255,255,255,.45);border:1px solid var(--border2);color:var(--text3);border-radius:6px;min-width:32px;height:30px;padding:0 8px;font-size:12px;line-height:1;cursor:pointer;font-family:"Inter",sans-serif}
.cmp-tb-btn:hover{background:rgba(255,255,255,.75);color:var(--text)}
.cmp-tb-btn:active{background:var(--acc);color:#fff;border-color:var(--acc)}
.cmp-rich{background:rgba(255,255,255,.45);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:9px 10px;font-family:"Inter",sans-serif;font-size:14px;line-height:1.5;width:100%;outline:none;min-height:44px;max-height:160px;overflow-y:auto;text-align:left}
.cmp-rich:focus{border-color:var(--acc);background:rgba(255,255,255,.65)}
.cmp-rich:empty:before{content:attr(data-ph);color:var(--text5)}
.cmp-rich ul,.cmp-rich ol{margin:.25rem 0;padding-left:1.3rem}
.cmp-rich blockquote{margin:.25rem 0;padding-left:.75rem;border-left:2px solid var(--border2)}
.cmp-rich a{color:var(--bt);text-decoration:underline;word-break:break-word}
/* Toolbar state (28 Aug). :active only flashed while the mouse was down, which
   told a teacher nothing about whether bold was currently ON. .on is driven by
   _composerState() from the real selection. */
.cmp-tb-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cmp-tb-btn:focus-visible{outline:2px solid #1a4fc4;outline-offset:1px}
.cmp-div{width:1px;height:18px;background:var(--border2);opacity:.7;margin:0 2px;flex:0 0 auto}
/* Link row — replaces window.prompt(). Hidden until the Link button opens it. */
.cmp-linkrow{display:none;gap:5px;align-items:center;flex-wrap:wrap}
.cmp-linkrow.open{display:flex}
.cmp-linkrow input{flex:1;min-width:130px;margin-top:0;padding:7px 9px;font-size:13px}
.cmp-linkrow input.bad{border-color:var(--red)}
.cmp-mini{background:rgba(0,0,0,.12);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r);padding:7px 11px;font-size:12px;font-weight:600;font-family:"Inter",sans-serif;cursor:pointer;flex:0 0 auto}
.cmp-mini:hover{background:rgba(0,0,0,.2);color:var(--text)}
.cmp-guide{flex:0 0 100%;font-size:11px;color:var(--text4);line-height:1.5}
.bubble-text ul,.bubble-text ol{margin:.3rem 0;padding-left:1.25rem}
.bubble-text li{margin:.15rem 0}
.bubble-text blockquote{margin:.3rem 0;padding-left:.7rem;border-left:2px solid rgba(0,0,0,.15)}
.bubble.mine .bubble-text blockquote{border-left-color:rgba(255,255,255,.4)}
.bubble-text a{color:var(--acc);text-decoration:underline;word-break:break-word}
.bubble.mine .bubble-text a{color:#fff}
.thread-list{display:flex;flex-direction:column;gap:6px}
.thread-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.45);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem;cursor:pointer;transition:background .12s}
.thread-row:hover{background:rgba(255,255,255,.65)}
.thread-row-main{min-width:0}
.thread-row-name{font-size:13px;font-weight:600;color:var(--text)}
.thread-row-preview{font-size:12px;color:var(--text4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-badge{background:#1a4fc4;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;flex:0 0 auto;cursor:pointer}
/* BACKLOG 1.128. Text colour is chosen per swatch for contrast rather than for
   consistency: white on that amber is unreadable, and darkening the amber to
   fix it would undo the saturation AC asked for. */
.msg-circle{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:600;line-height:1;cursor:pointer;
  font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,.22);box-shadow:0 0 0 1.5px rgba(255,255,255,.3)}
.msg-circle.p-new{background:#1747C0;color:#fff}
.msg-circle.p-2h{background:#E5A700;color:#3A2900}
.msg-circle.p-4h{background:#F97316;color:#3D1A00}  /* AC, 1 Sept: pulled well clear of the 8h red */
.msg-circle.p-8h{background:#C42121;color:#fff}
.msg-overdue{background:#B22222;color:#fff;border:1px solid #8B1A1A;border-radius:10px;padding:3px 8px;
  font-size:10px;font-weight:600;letter-spacing:.06em;white-space:nowrap;flex:0 0 auto;cursor:pointer}
.read-toggle{flex:0 0 auto;font-size:14px;color:var(--text5);text-decoration:none;padding:0 4px}
.read-toggle:hover{color:var(--acc);text-decoration:none}
.recipient-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:.6rem;font-size:12px;color:var(--text3)}
.recipient-row label{display:flex;align-items:center;gap:5px;cursor:pointer;text-transform:none;letter-spacing:0;font-family:"Inter",sans-serif}
.recipient-row input{width:14px;height:14px;-webkit-appearance:checkbox;appearance:auto;margin:0}

/* ══════════════════════════════════════════════════════════════════════════
   DESKTOP (AC, 28 Aug). The portal was built mobile-first and capped at 420px
   on EVERY screen, so a teacher writing a practice assignment on a laptop
   composed in a phone column with the rest of the display empty.

   AC's brief was that admin's Comms panel is the right size. The thing that
   makes that panel good to write in is not its pixel width -- it is a fixed
   grid filling the viewport with the editor set to flex:1, so the body grows
   into whatever height is available (EnrollmentAdmin.html, rComms()). That is
   what is reproduced here: roster and conversation side by side, both filling
   the window, composer growing down the page.

   Breakpoint at 900px, chosen so an iPad in PORTRAIT (768px) keeps the phone
   layout. At 768 a 260px roster would leave the composer narrower than the
   phone column it replaced, which is worse than not splitting at all. iPads
   in landscape (1024) and every laptop clear 900 comfortably.

   Below 900px nothing changes: .panes collapses to a plain block and .only-sm
   / .only-lg restore the exact one-view-at-a-time behaviour that shipped.
   ══════════════════════════════════════════════════════════════════════════ */
.only-lg{display:none}
@media (min-width:900px){
  .wrap{max-width:1120px;padding:2rem 2rem 2.5rem}
  .only-lg{display:block}
  .only-sm{display:none}

  /* Two panes, filling the window. The height subtracts the brand row, the
     tab bar and the page padding above them. */
  .panes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1rem;
         height:calc(100vh - 11.5rem);min-height:430px}
  .pane{background:rgba(255,255,255,.28);border:1px solid var(--border);
        border-radius:var(--rl);padding:1rem;display:flex;flex-direction:column;
        min-height:0;overflow:hidden}

  /* Each pane scrolls internally rather than the page scrolling as a whole. */
  .pane .thread-list{flex:1;overflow-y:auto;min-height:0;margin-right:-4px;padding-right:4px}
  .pane .msg-list{flex:1;max-height:none;min-height:0;margin-bottom:.75rem}

  /* The point of the exercise: the composer grows instead of scrolling inside
     160px. Capped at 40vh so a long message can never push Send off-screen. */
  .pane .cmp-rich{max-height:40vh;min-height:96px}

  /* The thread pane's header stays put while the messages scroll under it. */
  .pane .thread-hd{flex:0 0 auto}
  .pane-empty{flex:1;display:flex;align-items:center;justify-content:center;
              color:var(--text4);font-size:13px;text-align:center;padding:1rem}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
// ============================================================
// STATE
// ============================================================
// PAGE values: boot | login | needsSetup | forgotpw | setpw | home
var PAGE = 'boot';
var TOKEN = '', TEACHER_ID = '', TEACHER_NAME = '';
var HOME_TAB = 'family'; // 'family' | 'staff' | 'settings'
// The teacher's own status and settings (BACKLOG 1.125, 1.132). Loaded once
// at sign-in, because the banner is on every screen.
var TSET = {loading:false, saving:false, loaded:false,
            awayEnabled:false, awayMessage:'', afterHoursMessage:'',
            notifyOpen:9, notifyClose:17, notifyDerived:false,
            draftAway:'', draftAfter:''};
var MSG = {m:'', t:''};
var busy = false;
var RESET_TOKEN = '';
var _pollTimer = null;
var _pendingOpenFamilyId = '';   // set by boot() from ?openFamilyId=, consumed once by loadFamilyThreads()
var _shouldScrollMsgList = false; // see render() — scroll-to-newest, set only when messages actually change

// Staff Messages state. STAFF_VIEW: 'list' (the whole team, always shown
// directly — 1.19, 18 Aug) | 'thread' (one open conversation — admin or
// another staff member).
var STAFF_VIEW = 'list';
var STAFF_THREADS = {loading:false, list:[]};
var STAFF_PICKER = {loading:false, query:'', all:[]};
var ACTIVE_STAFF_THREAD = null; // {contactType:'admin'|'staff', otherId, otherName, messages, draft, sending, loading}

// Family Messages state. FAMILY_VIEW: 'list' (existing conversations) |
// 'picker' (start a new one — any family, confirmed 18 Aug §7 item 4) |
// 'thread' (one open conversation).
var FAMILY_VIEW = 'list';

// BACKLOG 1.136. Delivered on the roster payload rather than a config call --
// this portal has no getPublicConfig, and the roster is fetched on load and
// again every 5 seconds, so flipping the lock in admin reaches teachers within
// seconds without a reload.
var MSG_LOCK = { locked:false, msg:'' };
// Sheets turns a stored "TRUE" into a real boolean, so a config flag can arrive
// as either. The other two portals both carry an isTruthy() for this; this one
// had no config flags until now and so had none.
function _tIsTruthy(v){ return v===true||v==='TRUE'||v==='true'; }
var FAMILY_THREADS = {loading:false, list:[]};
var FAMILY_PICKER = {loading:false, query:'', all:[]};
var ACTIVE_THREAD = null; // {familyId, parent1Name, parent2Name, messages, draft, sending, loading, notifyP1, notifyP2}

// Login form state — single-screen email+password (not the family portal's
// two-step flow) — confirmed with AC, see SPEC_MESSAGING_V1.md §4.
var LF = {email:'', password:'', remember:true};

// forgot password / reset password
var FP = {email:'', done:false, success:false, error:'', busy:false};
// set/reset password (reached via emailed ?resetToken= link)
var SPW = {checking:false, invalid:false, resent:false, resending:false, email:'', pw1:'', pw2:'', busy:false, success:false, error:''};

// ============================================================
// API
// ============================================================
var GAS_URL = 'https://script.google.com/a/macros/keylab.nyc/s/AKfycbzY4K1XCbYZlj4fXksfwEZ3Kxbeolr9abRuifT-_TY4hgfPZP9gbL1dSCn1_zeFRsvl3g/exec';
function api(payload, cb){
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  })
  .then(function(res){ return res.json(); })
  .then(function(r){ cb(null, r); })
  .catch(function(e){ cb(e); });
}
// ============================================================
// HELPERS
// ============================================================
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showMsg(m, t){
  MSG={m:m, t:t||'s'}; render();
  setTimeout(function(){ MSG={m:'',t:''}; render(); }, 7000);
}

// Formats an epoch-ms timestamp as "Tue, 8/18/26 5:30 PM" — see BACKLOG.md
// 1.18. Falls back to the raw value for anything that doesn't parse (e.g.
// a message sent before this fix, still holding the old date-only string).
function fmtMsgTime(ms){
  var n=Number(ms);
  if(!n) return String(ms||'');
  var d=new Date(n);
  if(isNaN(d.getTime())) return String(ms||'');
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var h=d.getHours(), mins=d.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var h12=h%12; if(h12===0) h12=12;
  var mm=mins<10?'0'+mins:String(mins);
  return days[d.getDay()]+', '+(d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(-2)+' '+h12+':'+mm+' '+ampm;
}

function _ktNewClientMsgId(){
  return 'cmsg-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
}
function _maxSentAt(msgs){
  var max=0;
  (msgs||[]).forEach(function(m){ var n=Number(m.sentAt)||0; if(n>max) max=n; });
  return max;
}

// "Remember me" persistent session — small localStorage wrapper, safe to
// call even where storage is unavailable/blocked. Mirrors the family
// portal's _klSaveSession()/_klReadSession()/_klClearSession() pattern.
function _ktSaveSession(token, teacherId, teacherName){
  try{ localStorage.setItem('kl_teacher_session', JSON.stringify({token:token, teacherId:teacherId, teacherName:teacherName||''})); }catch(e){}
}
function _ktReadSession(){
  try{
    var raw=localStorage.getItem('kl_teacher_session');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function _ktClearSession(){
  try{ localStorage.removeItem('kl_teacher_session'); }catch(e){}
}

// ============================================================
// RENDER ROOT
// ============================================================
function render(){
  var el=document.getElementById('app');
  if(!el) return;
  var h='';
  if(MSG.m) h+='<div class="msg m'+esc(MSG.t)+'">'+esc(MSG.m)+'</div>';
  if(PAGE==='boot')          h+=rBoot();
  else if(PAGE==='login')    h+=rLogin();
  else if(PAGE==='forgotpw') h+=rForgotPassword();
  else if(PAGE==='setpw')    h+=rSetPassword();
  else                       h+=rHome();
  // render() replaces #app wholesale, so a message arriving mid-poll would
  // otherwise yank the teacher's cursor out of a half-typed message — the
  // teacher-side twin of the family bug fixed in 1.32. Caret goes to the end
  // rather than its exact offset: a composer is written at the end, and exact
  // offset restoration across a full innerHTML rebuild isn't reliable.
  var _focusedComposer='';
  var _ae=document.activeElement;
  if(_ae && _ae.classList && _ae.classList.contains('cmp-rich')) _focusedComposer=_ae.id;
  // The link row's two inputs need the same protection as the composer itself:
  // they are plain inputs, so caret position CAN be restored exactly, unlike
  // the contenteditable below.
  var _focusedLink='', _focusedLinkPos=0;
  // The settings textareas (1.125/1.132) are plain fields on a screen that
  // the 5-second poll re-renders underneath, so they need exactly the same
  // protection the link inputs already have — a teacher writing an away
  // message must not lose it mid-sentence.
  if(_ae && _ae.id && (/-link(url|text)$/.test(_ae.id) || _ae.id==='tset-away' || _ae.id==='tset-after' || _ae.id==='fwd-note')){
    _focusedLink=_ae.id;
    try{ _focusedLinkPos=_ae.selectionStart; }catch(e){}
  }
  el.innerHTML=h;
  if(_focusedLink){
    var _li=document.getElementById(_focusedLink);
    if(_li){
      _li.focus();
      try{ _li.setSelectionRange(_focusedLinkPos,_focusedLinkPos); }catch(e){}
    }
  }
  if(_focusedComposer){
    var _ce=document.getElementById(_focusedComposer);
    if(_ce){
      _ce.focus();
      try{
        var _r=document.createRange(); _r.selectNodeContents(_ce); _r.collapse(false);
        var _s=window.getSelection(); _s.removeAllRanges(); _s.addRange(_r);
      }catch(e){}
    }
  }
  // Scroll to the newest message, not the oldest (1.27, 18 Aug) — only at
  // the specific call sites where messages actually changed, not on every
  // render (typing in the composer re-renders too), so it doesn't fight
  // someone scrolled up reading history.
  if(_shouldScrollMsgList){
    _shouldScrollMsgList=false;
    var ml=el.querySelector('.msg-list');
    if(ml) ml.scrollTop=ml.scrollHeight;
  }
}

function doLogin(){
  var email=(document.getElementById('te')||{}).value||LF.email;
  var password=(document.getElementById('tp')||{}).value||LF.password;
  LF.email=(email||'').trim().toLowerCase();
  LF.password=password||'';
  if(!LF.email||LF.email.indexOf('@')===-1){ showMsg('Please enter a valid email address.','e'); return; }
  if(!LF.password){ showMsg('Please enter your password.','e'); return; }
  busy=true; render();
  api({action:'teacherLogin', data:{teacherEmail:LF.email, teacherPassword:LF.password}}, function(e,r){
    busy=false;
    if(e||!r||!r.ok){
      if(r&&r.needsSetup){
        // Account exists but has never had a password — reuse the same
        // begin-reset flow "Forgot your password?" uses, since both land on
        // the same set-new-password screen via email (mirrors the family
        // portal's doBeginResetFromLogin()).
        doBeginResetFromLogin();
        return;
      }
      showMsg((r&&r.error)||'Login failed','e');
      render(); return;
    }
    TOKEN=r.token; TEACHER_ID=r.teacherId; TEACHER_NAME=r.teacherName||'';
    if(LF.remember) _ktSaveSession(r.token, r.teacherId, r.teacherName);
    PAGE='home'; render();
    loadFamilyThreads();
    _startMessagePolling();
    loadTeacherSettings();
  });
}

function doBeginResetFromLogin(){

    render();

}

  TSET.saving=true; render();

  api({action:'teacherSaveSettings', data:d}, function(e,r){
    TSET.saving=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not save.','e'); render(); return; }

    TSET.awayEnabled=!!st.awayEnabled;

    render();

// Small clickable read/unread control on a roster row (18 Aug) — teachers
// wanted a Gmail-style manual toggle, not just automatic read-on-open.
// stopPropagation so clicking it doesn't also open the thread underneath.
// listKind ('family'|'staff') tells markThreadRead() which list to
// silently refresh afterward, so the toggle's effect is visible right away.
// ── The ageing circle (BACKLOG 1.128) ──────────────────────────────────
// Staff-facing only, by AC's instruction on 1 Sept: families never see a
// countdown. It rides teacher-token endpoints and appears here and in admin's
// Awaiting Reply, nowhere else.
//
// Why not simply elapsed hours. AC first chose a straight clock, then reversed
// it the same day: "messages sent after friday 5pm shouldn't expect teacher
// responses until Monday morning." Counting every hour turned every Monday
// morning red, and a list where everything is red carries no information. So
// OVERDUE means 24 hours the studio was OPEN.
//
// Saturday is excluded deliberately even though it is a teaching day — a
// Saturday teacher is teaching, not doing message admin (AC, 28 Aug). The
// window is studio-wide rather than per teacher: the promise is Keylab's, so it
// has to be explicable to a parent and fair between staff.
//
// The clock runs from when the message ARRIVED, never from when it was opened
// (AC, 1 Sept), which is why marking a thread unread does not reset it.
var RESP_OPEN_HOUR=9, RESP_CLOSE_HOUR=17;   // 9am–5pm, Mon–Fri
function _respHoursBetween(fromMs, toMs){
  var from=Number(fromMs)||0, to=Number(toMs)||0;
  if(!from || to<=from) return 0;
  var open=0;
  var d=new Date(from);
  // Hour by hour, capped: anything older than a month is far past OVERDUE
  // already, so the loop stops rather than being made clever.
  for(var i=0;i<24*31 && d.getTime()<to;i++){
    var day=d.getDay(), hr=d.getHours();
    var next=new Date(d.getTime()); next.setMinutes(0,0,0); next.setHours(hr+1);
    if(day>=1 && day<=5 && hr>=RESP_OPEN_HOUR && hr<RESP_CLOSE_HOUR){
      open+=(Math.min(to,next.getTime())-d.getTime())/3600000;
    }
    d=next;
  }
  return open;
}

// null when there is nothing to show, so the caller falls back to the plain
// mark-unread control rather than drawing an empty circle.
function _agingMark(waitingSince){
  if(!waitingSince) return null;
  var h=_respHoursBetween(waitingSince, Date.now());
  if(h>=24) return {cls:'p-od', overdue:true, label:'Overdue'};
  var n=Math.round(h);
  if(h>=8) return {cls:'p-8h', t:n+'h', label:'Waiting '+n+'h'};
  if(h>=4) return {cls:'p-4h', t:n+'h', label:'Waiting '+n+'h'};
  if(h>=2) return {cls:'p-2h', t:n+'h', label:'Waiting '+n+'h'};
  return null;
}

// One control, both states (AC, 1 Sept): blue with the unread count clicks to
// mark read; an ageing circle clicks to mark unread and returns to blue. The
// clock keeps running underneath either way, because the family is waiting
// regardless of what the teacher has ticked.
function rReadToggle(unread, conversationType, familyId, teacherId, staffId2, listKind, waitingSince){
  var fn='markThreadRead('+(unread?'true':'false')+',\''+conversationType+'\',\''+esc(familyId)+'\',\''+esc(teacherId)+'\',\''+esc(staffId2)+'\',\''+listKind+'\')';
  var click=' onclick="event.stopPropagation();'+fn+'"';
  if(unread) return '<div class="msg-circle p-new"'+click+' title="Mark read" aria-label="'+unread+' unread">'+unread+'</div>';
  var m=_agingMark(waitingSince);
  if(m && m.overdue) return '<div class="msg-overdue"'+click+' title="Mark unread" aria-label="Overdue">OVERDUE</div>';
  if(m) return '<div class="msg-circle '+m.cls+'"'+click+' title="Mark unread" aria-label="'+esc(m.label)+'">'+m.t+'</div>';
  return '<a href="#" class="read-toggle" onclick="event.preventDefault();event.stopPropagation();'+fn+'" title="Mark unread">○</a>';
}

function markThreadRead(read, conversationType, familyId, teacherId, staffId2, listKind){
  var reqData={conversationType:conversationType, teacherToken:TOKEN, read:read};
  if(familyId) reqData.familyId=familyId;
  if(teacherId) reqData.teacherId=teacherId;
  if(staffId2) reqData.staffId2=staffId2;
  api({action:'setConversationReadState', data:reqData}, function(e,r){
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not update.','e'); return; }
    if(listKind==='family') loadFamilyThreads(true); else loadStaffThreads(true);
  });
}

function loadFamilyThreads(silent){
  if(!silent){ FAMILY_THREADS.loading=true; render(); }
  api({action:'getTeacherFamilyThreads', data:{teacherToken:TOKEN}}, function(e,r){
    FAMILY_THREADS.loading=false;
    if(e||!r||!r.ok){ if(!silent) showMsg((r&&r.error)||'Could not load conversations.','e'); render(); return; }
    FAMILY_THREADS.list=r.threads||[];
    MSG_LOCK.locked = _tIsTruthy(r.messagingLocked);
    MSG_LOCK.msg = r.messagingLockedMsg||'';
    // The deep link from a notification email, spent the moment the roster
    // arrives — and only once, so a later refresh doesn't drag the teacher
    // back out of whatever they moved on to.
    if(_pendingOpenFamilyId){
      var _want=_pendingOpenFamilyId;
      _pendingOpenFamilyId='';
      var _row=FAMILY_THREADS.list.filter(function(t){return t.familyId===_want;})[0];
      if(_row){ HOME_TAB='family'; openFamilyThread(_row.familyId, _row.parent1Name, _row.parent2Name); return; }
    }
    render();
  });
}

  }
  var q=String(query||'').trim().toLowerCase();
  var results=FAMILY_PICKER.all.filter(function(f){
    if(!q) return true;
    var hay=[f.parent1Name,f.parent2Name].concat(f.studentNames||[]).join(' ').toLowerCase();

  });
  if(!results.length) return '<div class="empty-state">No families found.</div>';

    var names=[f.parent1Name,f.parent2Name].filter(Boolean).join(' & ')||'Family';

// Sends the family's latest message to the office with the teacher's own note,
// and tells the family it has happened (AC's copy, server-side).
function forwardToAdmin(){
  var t=ACTIVE_THREAD;
  if(!t||t.forwarding) return;
  var note=((document.getElementById('fwd-note')||{}).value||t.forwardNote||'').trim();
  if(!note){ showMsg('Add a note saying what you need from admin.','e'); return; }
  t.forwardNote=note;
  t.forwarding=true; render();
  api({action:'forwardToAdmin', data:{teacherToken:TOKEN, familyId:t.familyId, note:note}}, function(e,r){
    t.forwarding=false;
    if(e||!r||!r.ok){ showMsg((r&&r.error)||'Could not send.','e'); render(); return; }
    t.forwardOpen=false; t.forwardNote='';
    if(r.message) t.messages=t.messages.concat([r.message]);
    _shouldScrollMsgList=true;
    showMsg('Sent to admin.','s');
    render();
    loadFamilyThreads(true);
  });
}

function sendFamilyMessage(){
  var t=ACTIVE_THREAD;
  var _el=document.getElementById('family-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  var text=_composerPlain(html);
  if(!text) return;
  var notifyParents=[];
  if(!t.parent1Name || !t.parent2Name){
    // Only one parent on file — nothing to choose, notify whichever exists.
    notifyParents=undefined;
  } else {
    if(t.notifyP1) notifyParents.push('parent1');
    if(t.notifyP2) notifyParents.push('parent2');
  }
  // BACKLOG 1.124 #2. This used to cost the teacher TWO sequential Apps Script
  // round trips before their own words left the box: a sendMessage, then a full
  // refreshFamilyThread() to fetch back the message just sent. The family
  // portal has done it properly since 1.46 and this is that pattern ported --
  // append locally, post in the background, reconcile in place.
  var clientMsgId=_ktNewClientMsgId();
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(), _pending:true
  };
  t.messages=t.messages.concat([pending]);
  t.draft='';
  // Stops the 5s poll delivering this same message back before the server has
  // confirmed it, which would show it twice.
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  render();

  api({action:'sendMessage', data:{conversationType:'family_teacher', familyId:t.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN, messageText:text, messageHtml:html, notifyParents:notifyParents, clientMsgId:clientMsgId}}, function(e,r){
    if(!ACTIVE_THREAD || ACTIVE_THREAD.familyId!==t.familyId) return; // navigated away mid-flight
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      // Put it back where the teacher can see and retry it, rather than losing
      // words they watched "send".
      t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=html;
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    // Reconciled in place from the server's own row, and deliberately NO
    // render() on success: the message is already on screen exactly as it will
    // stay, and re-rendering it is the flicker this exists to remove.
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
    }
  });
}

// Shows the whole team directly (1.19, 18 Aug) — no "+ New Conversation"
// picker for staff, unlike Family Messages. With ~7 people total, hiding
// the roster behind a button was pure friction; a small team should look
// like a Slack workspace list, always visible. Admin is always pinned
// first regardless of activity; everyone else is merged from the staff
// directory (so people with no conversation yet still show up) plus
// existing thread previews where they exist, then sorted by most recent
// activity (no-activity entries last, alphabetical among themselves).
function rStaffRoster(){
  if(STAFF_PICKER.loading || STAFF_THREADS.loading){
    return '<div style="text-align:center;padding:2rem;color:var(--text3)"><span class="spin" style="font-size:20px">↻</span></div>';
  }
  // Admin now comes from the same live thread data as everyone else
  // (doGetTeacherStaffThreads covers teacher_admin too as of 18 Aug) —
  // still pinned first regardless of activity, but with a real preview and
  // unread badge instead of being a static row.
  var threadsById={};
  STAFF_THREADS.list.forEach(function(t){ threadsById[t.otherTeacherId]=t; });
  var admin=threadsById['admin']||{otherTeacherId:'admin', otherTeacherName:'Admin', lastMessageAt:0, lastMessageText:'', unread:0};
  var rows=STAFF_PICKER.all.map(function(s){
    var t=threadsById[s.teacherId];
    return {teacherId:s.teacherId, teacherName:s.teacherName, lastMessageAt:t?t.lastMessageAt:0, lastMessageText:t?t.lastMessageText:'', unread:t?t.unread:0, waitingSince:t?t.waitingSince:0};
  }).sort(function(a,b){
    if(a.lastMessageAt && b.lastMessageAt) return Number(b.lastMessageAt)-Number(a.lastMessageAt);
    if(a.lastMessageAt) return -1;
    if(b.lastMessageAt) return 1;
    return a.teacherName.localeCompare(b.teacherName);
  });
  var h='<div class="thread-list">';
  h+='<div class="thread-row" onclick="openStaffThread(\'admin\',\'admin\',\'Admin\')">'+
    '<div class="thread-row-main">'+
    '<div class="thread-row-name">Admin</div>'+
    (admin.lastMessageText?'<div class="thread-row-preview">'+esc(admin.lastMessageText.slice(0,60))+'</div>':'')+
    '</div>'+
    rReadToggle(admin.unread, 'teacher_admin', '', TEACHER_ID, '', 'staff', admin.waitingSince)+
    '</div>';
  h+=rows.map(function(s){
    return '<div class="thread-row" onclick="openStaffThread(\'staff\',\''+esc(s.teacherId)+'\',\''+esc(s.teacherName)+'\')">'+
      '<div class="thread-row-main">'+
      '<div class="thread-row-name">'+esc(s.teacherName)+'</div>'+
      (s.lastMessageText?'<div class="thread-row-preview">'+esc(s.lastMessageText.slice(0,60))+'</div>':'')+
      '</div>'+
      rReadToggle(s.unread, 'staff_staff', '', TEACHER_ID, s.teacherId, 'staff', s.waitingSince)+
      '</div>';
  }).join('');
  h+='</div>';
  return h;
}

// ============================================================
// FORMATTING COMPOSER (BACKLOG 1.33)
// ============================================================
// Button-driven only — no typed syntax, no keyboard shortcuts to learn
// (settled with AC: teachers won't know them). Same execCommand approach
// already proven in admin's Comms toolbar, minus its colour/font/image extras.
//
// IMPORTANT: nothing in this section is a security control. _composerClean()
// below is a tidiness pass, because contenteditable emits browser-specific
// soup (div line wrappers, span style attributes, &nbsp;) and pasted content
// drags in whatever the source page had. The real boundary is _sanitizeMessageHtml_()
// in Code.js, which re-checks everything server-side and assumes this file
// could be bypassed entirely — because it can: anything can POST to sendMessage.

// Tags kept, normalized to a single spelling each so the server sees a small,
// predictable vocabulary. Everything else is unwrapped, keeping its text.
var CMP_KEEP={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote'};

// Elements whose CONTENT has to go as well, not just their tag. Everything
// else is unwrapped (tag dropped, words kept), which is right for a pasted
// span but wrong for a script element — unwrapping that would drop the tag
// and leave 'alert(1)' sitting in the message as visible text.
var CMP_DROP={SCRIPT:1,STYLE:1,NOSCRIPT:1,TEMPLATE:1,IFRAME:1,OBJECT:1,EMBED:1,HEAD:1,TITLE:1};

// Reads bold/italic/underline out of an inline style attribute. Pasted content
// carries formatting this way rather than as tags — Docs and Word both put
// bold on a <span style="font-weight:700"> — so without this, pasting loses
// every bit of emphasis. Returns null when there is no style attribute at all.
function _styleFlags(n){
  var st=(n.getAttribute&&n.getAttribute('style'))||'';
  if(!st) return null;
  st=st.toLowerCase();
  var f={};
  var fw=/font-weight\s*:\s*([a-z0-9]+)/.exec(st);
  if(fw){
    f.boldSet=true;
    f.bold=(fw[1]==='bold'||fw[1]==='bolder'||parseInt(fw[1],10)>=600);
  }
  if(/font-style\s*:\s*italic/.test(st)) f.italic=true;
  if(/text-decoration[^;]*underline/.test(st)) f.underline=true;
  return f;
}

function _composerClean(node){
  var out='';
  for(var i=0;i<node.childNodes.length;i++){
    var n=node.childNodes[i];
    if(n.nodeType===3){ out+=esc(n.nodeValue); continue; }
    if(n.nodeType!==1) continue;
    var tag=n.nodeName;
    if(CMP_DROP[tag]) continue;
    if(tag==='BR'){ out+='<br>'; continue; }
    var inner=_composerClean(n);
    if(tag==='A'){
      var href=n.getAttribute('href')||'';
      // Mirrors the server's rule so the toolbar can't silently produce a link
      // the server will then drop. The server still re-checks it.
      if(/^(https?:\/\/|mailto:)/i.test(href) && !/[\s"'<>\\]/.test(href)) out+='<a href="'+esc(href)+'">'+inner+'</a>';
      else out+=inner;
      continue;
    }
    var flags=_styleFlags(n);
    var keep=CMP_KEEP[tag];
    // An explicit font-weight:normal cancels a bold tag. Google Docs wraps its
    // ENTIRE clipboard payload in <b style="font-weight:normal">, so honouring
    // the tag over the style would make every message pasted from Docs bold.
    if(keep==='b' && flags && flags.boldSet && !flags.bold) keep=null;
    if(keep){ if(inner) out+='<'+keep+'>'+inner+'</'+keep+'>'; continue; }
    // Formatting carried as an inline style instead of a tag gets promoted to
    // the real tag, so pasted bold/italic survives.
    if(inner && flags){
      if(flags.underline) inner='<u>'+inner+'</u>';
      if(flags.italic) inner='<i>'+inner+'</i>';
      if(flags.bold) inner='<b>'+inner+'</b>';
    }
    // DIV/P are how contenteditable wraps each new line — become line breaks.
    if(tag==='DIV'||tag==='P'){ out+=(out&&!/<br>$/.test(out)?'<br>':'')+inner; continue; }
    out+=inner; // SPAN, FONT, and anything pasted in: unwrap, keep the words
  }
  return out;
}

// Only used to decide "is this message empty" before sending. The real
// plain-text copy stored on the record is derived server-side from the
// sanitized HTML, never from here — see the note on doSendMessage().
function _composerPlain(html){
  return String(html||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ')
    .replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
}

function _composerInput(el){
  // Browsers leave a stray line-break wrapper behind when the box is emptied,
  // which defeats the :empty placeholder rule. Clear it only when there is
  // genuinely nothing left — the list check keeps an empty bullet the teacher
  // just created from being wiped out from under them.
  if(!el.textContent.trim() && !el.querySelector('ul,ol,a')) el.innerHTML='';
  return _composerClean(el);
}

function _composerSync(id){
  var el=document.getElementById(id); if(!el) return;
  var v=_composerClean(el);
  if(id==='family-composer' && ACTIVE_THREAD) ACTIVE_THREAD.draft=v;
  if(id==='staff-composer' && ACTIVE_STAFF_THREAD) ACTIVE_STAFF_THREAD.draft=v;
}

function _composerCmd(id,cmd){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  // styleWithCSS(false) makes the browser emit <b> rather than
  // <span style="font-weight:bold">, which the allowlist would otherwise drop.
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand(cmd,false,null);
  _composerSync(id);
  _composerState(id);
}

// Paste keeps its formatting (AC's call, 19 Aug) — a teacher pasting a
// bulleted practice list out of Docs keeps the bullets. What survives is
// whatever _composerClean() allows, so pasted content lands in exactly the
// same shape as content typed with the toolbar.
//
// The clipboard HTML is parsed with DOMParser, never by assigning innerHTML:
// a DOMParser document is inert, so a pasted image with an onerror handler or
// a pasted script element can't run while we walk it. The server sanitizer
// still re-checks the result regardless.
function _composerPaste(ev){
  var cd=ev.clipboardData||window.clipboardData;
  if(!cd) return;
  var html='';
  try{ html=cd.getData('text/html')||''; }catch(e){}
  // No HTML flavour on the clipboard (plain-text copy, most mobile keyboards):
  // let the browser's own plain-text paste happen untouched.
  if(!html) return;
  ev.preventDefault();
  var clean='';
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    clean=_composerClean(doc.body);
  }catch(e){
    clean=esc(cd.getData('text/plain')||'');
  }
  if(clean) document.execCommand('insertHTML',false,clean);
}

// Quote toggles rather than only applying, so a teacher can get back out of a
// blockquote with the same button they used to enter one. formatBlock('div')
// is the standard way to undo it.
function _composerQuote(id){
  var el=document.getElementById(id); if(!el) return;
  el.focus();
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  // Angle-bracket form: Chrome and Safari accept either, Firefox only this one.
  // Built from a variable rather than written as a bracketed literal, so the
  // tag-balance check in scripts/check.js doesn't read it as a real open tag.
  var _blk=_composerInQuote(id)?'div':'blockquote';
  document.execCommand('formatBlock',false,'<'+_blk+'>');
  _composerSync(id);
  _composerState(id);
}
// Is the caret inside <sel> and still within this composer? Used for the two
// states document.queryCommandState() cannot answer honestly.
function _composerSelIn(id,selector){
  var el=document.getElementById(id); if(!el) return false;
  var s=window.getSelection();
  if(!s || !s.anchorNode) return false;
  var n=s.anchorNode;
  var e=(n.nodeType===1)?n:n.parentElement;
  return !!(e && el.contains(e) && e.closest && e.closest(selector));
}
function _composerInQuote(id){ return _composerSelIn(id,'blockquote'); }

// ── Link row ───────────────────────────────────────────────────────────────
// The selection is saved on open because clicking into the URL input collapses
// it; without this, inserting the link would drop it wherever the caret
// happened to land rather than over the words the teacher had highlighted.
var _cmpLinkSel={};

// Open state and half-typed values live HERE, not in the DOM, because render()
// replaces #app wholesale every poll tick (5s). Left in the DOM, a teacher
// typing a URL would watch it vanish a few seconds later -- the same failure
// as 1.32 in the family portal and 1.28 here, one control further in.
// rComposerLinkRow() renders from this object, so a re-render redraws the row
// exactly as it was.
var _cmpLink={};
function _cmpLinkState(id){
  if(!_cmpLink[id]) _cmpLink[id]={open:false,url:'',text:'',bad:false};
  return _cmpLink[id];
}

function _composerLinkOpen(id){
  var row=document.getElementById(id+'-linkrow'); if(!row) return;
  var sel=window.getSelection();
  var el=document.getElementById(id);
  _cmpLinkSel[id]=(sel && sel.rangeCount && el && el.contains(sel.anchorNode))
    ? sel.getRangeAt(0).cloneRange() : null;
  var st=_cmpLinkState(id);
  st.open=true; st.url=''; st.bad=false;
  // Pre-fill the link text with whatever is selected, so highlighting a phrase
  // and pressing Link does the obvious thing.
  st.text=(sel && !sel.isCollapsed && el && el.contains(sel.anchorNode)) ? String(sel).trim() : '';
  var t=document.getElementById(id+'-linktext');
  var u=document.getElementById(id+'-linkurl');
  if(t) t.value=st.text;
  if(u){ u.value=''; u.classList.remove('bad'); u.placeholder=CMP_COPY.linkUrlPlaceholder; }
  row.classList.add('open');
  if(u) u.focus();
}

function _composerLinkClose(id){
  var row=document.getElementById(id+'-linkrow'); if(row) row.classList.remove('open');
  var st=_cmpLinkState(id);
  st.open=false; st.url=''; st.text=''; st.bad=false;
  _cmpLinkSel[id]=null;
  var el=document.getElementById(id); if(el) el.focus();
}

function _composerLinkKey(ev,id){
  if(ev.key==='Enter'){ ev.preventDefault(); _composerLinkInsert(id); }
  if(ev.key==='Escape'){ ev.preventDefault(); _composerLinkClose(id); }
}

// AC, 28 Aug: site.com, www.site.com, https://www.site.com and https://site.com
// must all work. So https:// is PREPENDED when absent rather than demanded.
// Being lenient here is safe -- this file is not the security boundary.
// _sanitizeMessageHtml_() in Code.js re-checks every href server-side and
// assumes this file was bypassed, because it can be. Strictness here buys
// nothing and costs teachers working links.
function _composerNormalizeUrl(raw){
  var u=String(raw||'').trim();
  if(!u) return '';
  if(/[\s"'<>\\]/.test(u)) return '';          // spaces or quotes: not an address
  if(/^mailto:/i.test(u)) return u;
  if(!/^https?:\/\//i.test(u)){
    // Any other scheme (javascript:, data:, file:) is refused outright rather
    // than having https:// glued in front of it.
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    u='https://'+u;
  }
  // Must have a dot somewhere in the host, or "https://notes" would pass.
  var host=u.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0];
  if(host.indexOf('.')===-1) return '';
  return u;
}

function _composerLinkInsert(id){
  var el=document.getElementById(id); if(!el) return;
  var uIn=document.getElementById(id+'-linkurl');
  var tIn=document.getElementById(id+'-linktext');
  var url=_composerNormalizeUrl(uIn?uIn.value:'');
  if(!url){
    // Corrected in place instead of thrown as a page-level toast -- the error
    // belongs next to the field that caused it.
    var stBad=_cmpLinkState(id); stBad.bad=true; stBad.url='';
    if(uIn){ uIn.classList.add('bad'); uIn.value=''; uIn.placeholder=CMP_COPY.linkRejected; uIn.focus(); }
    return;
  }
  var label=(tIn && tIn.value.trim()) || url.replace(/^https?:\/\//i,'');
  el.focus();
  var saved=_cmpLinkSel[id];
  if(saved){
    try{
      var sel=window.getSelection();
      sel.removeAllRanges(); sel.addRange(saved);
    }catch(e){}
  }
  try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
  document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(label)+'</a>&nbsp;');
  _composerLinkClose(id);
  _composerSync(id);
}

// ── Toolbar active state ───────────────────────────────────────────────────
// Nothing reflected back before this, so a teacher had to type a letter to
// find out whether bold was on. queryCommandState covers the inline and list
// commands; blockquote has no state to query, so it is resolved from the DOM.
var _CMP_STATE_CMDS=['bold','italic','underline','insertUnorderedList','insertOrderedList'];

function _composerState(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  _CMP_STATE_CMDS.forEach(function(c){
    var b=wrap.querySelector('[data-cmd="'+c+'"]'); if(!b) return;
    var on=false;
    try{ on=document.queryCommandState(c); }catch(e){}
    // queryCommandState('underline') is TRUE for ANY selection inside a link,
    // because a link RENDERS underlined -- verified in the browser, not
    // guessed. Left alone, the Underline button lights up on its own the
    // moment a teacher clicks into a link they just added, claiming
    // formatting they never applied. Inside a link, ask the DOM instead.
    //
    // Resolved from the selection's anchor, which covers every selection a
    // person can actually make -- a click, a drag, or Ctrl+A all anchor on a
    // text node. It does NOT cover a programmatic selectNodeContents() of the
    // whole box, where the anchor is the composer div itself and there is no
    // link ancestor to find; nothing in the UI produces that.
    if(c==='underline' && on && _composerSelIn(id,'a')) on=_composerSelIn(id,'u');
    b.classList.toggle('on',!!on);
  });
  var q=wrap.querySelector('[data-quote]');
  if(q) q.classList.toggle('on',_composerInQuote(id));
}

function _composerStateClear(id){
  var el=document.getElementById(id); if(!el) return;
  var wrap=el.closest?el.closest('.composer-wrap'):null; if(!wrap) return;
  var btns=wrap.querySelectorAll('.cmp-tb-btn.on');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
}

// Button labels reuse the wording already live in admin's Comms toolbar so the
// two tools read the same. The link strings were rewritten 28 Aug on AC's
// steer: the old prompt demanded a full https:// address, which is not how
// anyone types one.
//
// linkSharing is AC's substance, drafted here and still awaiting his pass:
// teachers set a file to "anyone with the link", or keep it private and ask
// admin for the parent's email. (AC, 28 Aug -- a central Keylab hub for
// digital materials is the eventual answer; until then this is the
// instruction.) It is the on-screen guidance SPEC_MESSAGING_V1 has asked for
// since 19 Aug, where it is called the most likely real-world failure.
var CMP_COPY={
  placeholder:'Type your message here...',
  linkUrlPlaceholder:'Add link here',
  linkTextPlaceholder:'Link text (optional)',
  linkAdd:'Add link',
  linkCancel:'Cancel',
  linkRejected:'That doesn’t look like a web address. Try something like keylab.nyc/lessons.',
  linkSharing:'Set sharing to “Anyone with the link” before you send, or ask admin for the parent’s email to share it privately.',
  bold:'Bold', italic:'Italic', underline:'Underline',
  bullet:'Bullet list', number:'Numbered list', quote:'Quote',
  indent:'Indent', outdent:'Outdent', link:'Link', clear:'Clear formatting'
};

function _tbBtn(id,cmd,label,title){
  // onmousedown/preventDefault keeps the text selection alive when the button
  // takes the click — without it, execCommand has nothing to act on.
  // data-cmd is what _composerState() reads to light the button up.
  return '<button type="button" class="cmp-tb-btn" data-cmd="'+cmd+'" title="'+esc(title)+'" onmousedown="event.preventDefault()"'+
    ' onclick="_composerCmd(\''+id+'\',\''+cmd+'\')">'+label+'</button>';
}

// The toolbar now carries everything _sanitizeMessageHtml_() accepts and
// nothing it doesn't (AC, 28 Aug: "as much formatting control and function as
// possible"). Italic, underline, quote and clear-formatting were added then.
// The first three were already reachable by PASTING -- _composerClean()
// promotes pasted <i>/<u> and styled spans -- so a teacher could receive that
// formatting into a message but had no button to produce it.
//
// Adding a control the server would strip is the mistake to avoid here, so
// this list and MSG_ALLOWED_TAGS in Code.js have to stay in step. That is why
// admin's colour, font-size, alignment, image and divider buttons are absent
// and must stay absent: every one of them is dropped server-side.
//
// Grouped with dividers -- emphasis, structure, nesting, link, reset -- so the
// row reads as five decisions rather than ten buttons.
function rComposerToolbar(id){
  return '<div class="cmp-tb">'+
    _tbBtn(id,'bold','<b>B</b>',CMP_COPY.bold)+
    _tbBtn(id,'italic','<i>I</i>',CMP_COPY.italic)+
    _tbBtn(id,'underline','<u>U</u>',CMP_COPY.underline)+
    '<span class="cmp-div"></span>'+
    _tbBtn(id,'insertUnorderedList','• List',CMP_COPY.bullet)+
    _tbBtn(id,'insertOrderedList','1. List',CMP_COPY.number)+
    '<button type="button" class="cmp-tb-btn" data-quote="1" title="'+esc(CMP_COPY.quote)+'" onmousedown="event.preventDefault()"'+
      ' onclick="_composerQuote(\''+id+'\')">❝</button>'+
    '<span class="cmp-div"></span>'+
    _tbBtn(id,'indent','⇥',CMP_COPY.indent)+
    _tbBtn(id,'outdent','⇤',CMP_COPY.outdent)+
    '<span class="cmp-div"></span>'+
    '<button type="button" class="cmp-tb-btn" title="'+esc(CMP_COPY.link)+'" onmousedown="event.preventDefault()"'+
      ' onclick="_composerLinkOpen(\''+id+'\')">'+esc(CMP_COPY.link)+'</button>'+
    _tbBtn(id,'removeFormat','✕',CMP_COPY.clear)+
  '</div>';
}

// Replaces window.prompt() (BACKLOG 1.34, and AC again on 28 Aug). The prompt
// could not be styled or corrected and dropped the teacher out of their
// message; worse, it refused anything without an https:// prefix. Hidden until
// the Link button is pressed so the composer stays quiet in normal use.
function rComposerLinkRow(id){
  var st=_cmpLinkState(id);
  return '<div class="cmp-linkrow'+(st.open?' open':'')+'" id="'+id+'-linkrow">'+
    '<input id="'+id+'-linkurl" class="'+(st.bad?'bad':'')+'" value="'+esc(st.url)+'"'+
      ' placeholder="'+esc(st.bad?CMP_COPY.linkRejected:CMP_COPY.linkUrlPlaceholder)+'"'+
      ' aria-label="'+esc(CMP_COPY.linkUrlPlaceholder)+'"'+
      ' oninput="_cmpLinkState(\''+id+'\').url=this.value"'+
      ' onkeydown="_composerLinkKey(event,\''+id+'\')">'+
    '<input id="'+id+'-linktext" value="'+esc(st.text)+'" placeholder="'+esc(CMP_COPY.linkTextPlaceholder)+'" aria-label="'+esc(CMP_COPY.linkTextPlaceholder)+'"'+
      ' oninput="_cmpLinkState(\''+id+'\').text=this.value"'+
      ' onkeydown="_composerLinkKey(event,\''+id+'\')">'+
    '<button type="button" class="cmp-mini" onmousedown="event.preventDefault()" onclick="_composerLinkInsert(\''+id+'\')">'+esc(CMP_COPY.linkAdd)+'</button>'+
    '<button type="button" class="cmp-mini" onmousedown="event.preventDefault()" onclick="_composerLinkClose(\''+id+'\')" aria-label="'+esc(CMP_COPY.linkCancel)+'">×</button>'+
    '<div class="cmp-guide">'+esc(CMP_COPY.linkSharing)+'</div>'+
  '</div>';
}

function rComposer(id,draft,onInput,sendBtn){
  return '<div class="composer-wrap">'+
    rComposerToolbar(id)+
    rComposerLinkRow(id)+
    '<div class="composer">'+
      '<div id="'+id+'" class="cmp-rich" contenteditable="true" role="textbox" aria-multiline="true"'+
        ' aria-label="Message" data-ph="'+esc(CMP_COPY.placeholder)+'"'+
        ' oninput="'+onInput+';_composerState(\''+id+'\')"'+
        ' onkeyup="_composerState(\''+id+'\')" onmouseup="_composerState(\''+id+'\')"'+
        ' onblur="_composerStateClear(\''+id+'\')"'+
        ' onpaste="_composerPaste(event)">'+(draft||'')+'</div>'+
      sendBtn+
    '</div></div>';
}

function rMessageBubble(m){
  var mine = m.senderId===TEACHER_ID;
  // messageHtml is set only when the sender used the formatting toolbar, and
  // has already been through _sanitizeMessageHtml_() server-side. Plain
  // messages (and everything sent before 1.33) keep the escaped path.
  var body = m.messageHtml
    ? m.messageHtml
    : esc(m.messageText||'').replace(/\n/g,'<br>');
  return '<div class="bubble-row'+(mine?' mine':'')+'">'+
    '<div class="bubble'+(mine?' mine':'')+'">'+
    (!mine?'<div class="bubble-sender">'+esc(m.senderName||'')+'</div>':'')+
    '<div class="bubble-text">'+body+'</div>'+
    '<div class="bubble-time">'+esc(fmtMsgTime(m.sentAt))+'</div>'+
    '</div></div>';
}

function sendStaffMessage(){
  var t=ACTIVE_STAFF_THREAD;
  var _el=document.getElementById('staff-composer');
  var html=_el?_composerClean(_el):(t.draft||'');
  var text=_composerPlain(html);
  if(!text) return;
  var reqData = t.contactType==='admin'
    ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN, messageText:text, messageHtml:html}
    : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:t.otherId, teacherToken:TOKEN, messageText:text, messageHtml:html};
  // BACKLOG 1.158 — the sender's own per-message email override, read here
  // and cleared below so the next message starts unchecked again.
  if(t.emailToo) reqData.notifyByEmail=true;
  // Same optimistic path as sendFamilyMessage() above (BACKLOG 1.124 #2).
  var clientMsgId=_ktNewClientMsgId();
  reqData.clientMsgId=clientMsgId;
  var pending={
    messageId:'', senderId:TEACHER_ID, senderName:TEACHER_NAME||'',
    messageText:text, messageHtml:html, sentAt:Date.now(), _pending:true
  };
  t.messages=t.messages.concat([pending]);
  t.draft='';
  t.emailToo=false;
  t._sendInFlight=true;
  _shouldScrollMsgList=true;
  render();

  api({action:'sendMessage', data:reqData}, function(e,r){
    if(!ACTIVE_STAFF_THREAD || ACTIVE_STAFF_THREAD.otherId!==t.otherId) return;
    t._sendInFlight=false;
    if(e||!r||!r.ok){
      t.messages=t.messages.filter(function(m){ return m!==pending; });
      t.draft=html;
      showMsg((r&&r.error)||'Could not send message.','e');
      render();
      return;
    }
    pending._pending=false;
    if(r.message){
      pending.messageId=r.message.messageId||'';
      pending.sentAt=r.message.sentAt||pending.sentAt;
      pending.senderName=r.message.senderName||pending.senderName;
    }
  });
}

// Polls every 5s for new activity: the active thread's list (family or
// staff, whichever tab is open) plus whichever conversation is currently
// expanded, via the lock-free doGetMessagesSince() so this never trips the
// shared save-lock or marks anything read on its own (see the matching
// comment in Code.js). Paused while the tab isn't visible.
function _startMessagePolling(){
  if(_pollTimer) return;
  _pollTimer=setInterval(function(){
    if(document.hidden || !TOKEN) return;
    if(HOME_TAB==='family'){
      // BACKLOG 1.124 #1. This was gated on FAMILY_VIEW==='list', which was
      // right while a thread REPLACED the roster and wrong the moment @650 put
      // both panes on screen: unread badges and previews froze for as long as a
      // conversation stayed open. Polled in both views now — the fetch is the
      // same one, and it is what also delivers the messaging lock flag.
      loadFamilyThreads(true);
      if(FAMILY_VIEW==='thread' && ACTIVE_THREAD && !ACTIVE_THREAD.loading && !ACTIVE_THREAD._sendInFlight){
        var ft=ACTIVE_THREAD;
        api({action:'getMessagesSince', data:{conversationType:'family_teacher', familyId:ft.familyId, teacherId:TEACHER_ID, teacherToken:TOKEN, sinceSentAt:String(_maxSentAt(ft.messages)||0)}}, function(e,r){
          if(!ACTIVE_THREAD||ACTIVE_THREAD.familyId!==ft.familyId) return;
          if(e||!r||!r.ok||!r.messages||!r.messages.length) return;
          // Second guard, independent of _sendInFlight: drop anything already
          // held by id. Duplicated messages are the failure this path has to
          // avoid, and one filter covers every route to it.
          var _have={};
          ACTIVE_THREAD.messages.forEach(function(m){ if(m.messageId) _have[m.messageId]=true; });
          var _fresh=r.messages.filter(function(m){ return !m.messageId || !_have[m.messageId]; });
          if(!_fresh.length) return;
          ACTIVE_THREAD.messages=ACTIVE_THREAD.messages.concat(_fresh);
          _shouldScrollMsgList=true; render();
        });
      }
    } else {
      if(STAFF_VIEW==='list'){ loadStaffThreads(true); }
      if(STAFF_VIEW==='thread' && ACTIVE_STAFF_THREAD && !ACTIVE_STAFF_THREAD.loading && !ACTIVE_STAFF_THREAD._sendInFlight){
        var st=ACTIVE_STAFF_THREAD;
        var reqData=st.contactType==='admin'
          ? {conversationType:'teacher_admin', teacherId:TEACHER_ID, teacherToken:TOKEN}
          : {conversationType:'staff_staff', teacherId:TEACHER_ID, staffId2:st.otherId, teacherToken:TOKEN};
        reqData.sinceSentAt=String(_maxSentAt(st.messages)||0);
        api({action:'getMessagesSince', data:reqData}, function(e,r){
          if(!ACTIVE_STAFF_THREAD||ACTIVE_STAFF_THREAD.otherId!==st.otherId) return;
          if(e||!r||!r.ok||!r.messages||!r.messages.length) return;
          // Second guard, independent of _sendInFlight: drop anything already
          // held by id. Duplicated messages are the failure this path has to
          // avoid, and one filter covers every route to it.
          var _have={};
          ACTIVE_STAFF_THREAD.messages.forEach(function(m){ if(m.messageId) _have[m.messageId]=true; });
          var _fresh=r.messages.filter(function(m){ return !m.messageId || !_have[m.messageId]; });
          if(!_fresh.length) return;
          ACTIVE_STAFF_THREAD.messages=ACTIVE_STAFF_THREAD.messages.concat(_fresh);
          _shouldScrollMsgList=true; render();
        });
      }
    }
  }, 5000);
}

function doSignOut(){
  _ktClearSession();
  if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; }
  TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
  LF={email:'', password:'', remember:true};
  HOME_TAB='family';
  STAFF_VIEW='list';
  STAFF_THREADS={loading:false, list:[]};
  STAFF_PICKER={loading:false, query:'', all:[]};
  ACTIVE_STAFF_THREAD=null;
  FAMILY_VIEW='list';
  FAMILY_THREADS={loading:false, list:[]};
  FAMILY_PICKER={loading:false, query:'', all:[]};
  ACTIVE_THREAD=null;
  PAGE='login'; render();
}

// ============================================================
// INIT
// ============================================================
function boot(){
  var resetTokenFromUrl = '';
  var loginTokenFromUrl = '';
  try {
    var params = new URLSearchParams(window.location.search);
    resetTokenFromUrl = params.get('resetToken') || '';
    loginTokenFromUrl = params.get('token') || '';
    // BACKLOG 1.124 #3 — the notification email now names the conversation
    // it is about, so a teacher lands on the message rather than the roster.
    // Consumed once, by loadFamilyThreads(), which is the first point the
    // family's name is known.
    _pendingOpenFamilyId = params.get('openFamilyId') || '';
  } catch(e) { /* URLSearchParams unsupported — treat as no token */ }

  if(loginTokenFromUrl){
    // Magic link from a do-not-reply notification email — a fully valid
    // teacher session token already, minted server-side the same way a
    // normal login does (_mintTeacherMagicLink in Code.js). Mirrors the
    // family portal's identical ?token= handling in boot().
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal */ }
    TOKEN = loginTokenFromUrl;
    _ktSaveSession(TOKEN, '', '');
    // Falls through to the remembered-session block below, which re-reads
    // what was just saved and validates it via teacherCheckSession — same
    // reasoning as the family portal: an invalid/expired token drops back
    // to login with a clear message instead of a populated-looking shell.
  }

  if(resetTokenFromUrl){
    // Strip the token out of the address bar immediately — single-use,
    // short-lived credential, never something to bookmark. Mirrors the
    // family portal's identical boot()-time handling.
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* non-fatal */ }

    RESET_TOKEN = resetTokenFromUrl;
    PAGE = 'setpw';
    SPW.checking = true;
    render();
    api({action:'teacherValidateResetToken', data:{resetToken:resetTokenFromUrl}}, function(e2,r2){
      SPW.checking = false;
      if(e2||!r2||!r2.ok){
        SPW.invalid = true;
        SPW.email = (r2&&r2.email)||'';
      } else {
        SPW.email = r2.email||'';
      }
      render();
    });
    return;
  }

  var saved = _ktReadSession();
  if(saved && saved.token){
    TOKEN = saved.token;
    api({action:'teacherCheckSession', data:{teacherToken:saved.token}}, function(e,r){
      if(!e&&r&&r.ok){
        TEACHER_ID = r.teacherId;
        TEACHER_NAME = r.teacherName||'';
        _ktSaveSession(TOKEN, TEACHER_ID, TEACHER_NAME);
        PAGE = 'home';
        render();
        loadFamilyThreads();
        _startMessagePolling();
        loadTeacherSettings();
      } else {
        _ktClearSession();
        TOKEN=''; TEACHER_ID=''; TEACHER_NAME='';
        PAGE = 'login';
        render();
      }
    });
    return;
  }

  PAGE = 'login';
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  boot();
});
</script>
